      - "(a) datasheet: Knowles PDF not fetchable headless (URL returns HTML); relied on the B5 reading of sheet 9: bottom view pin 1 top-right, port bottom. A bottom view seen from below; a land pattern is drawn from above the PCB, so it is its left-right mirror = pin 1 top-left, port bottom. Ours: pin 1 (-0.8375,-1.304), 5 (+0.8375,-1.304), 2 (-0.8375,-0.482), 4 (+0.8375,-0.482), port hole at y=+0.75 (KiCad y down) = exactly that."
      - "(b) KiCad 10 official Sensor_Audio:Knowles_LGA-5_3.5x2.65mm (/usr/share/kicad/footprints): pads 1..5 at identical coordinates to ours (only port hole 0.77 vs 0.75 differs). Ours was copied from it (descr says so)."
      - "(c) pin map: official KiCad symbol SPH0641LU4H-1 = 1 DATA, 2 SEL, 3 GND, 4 CLOCK, 5 VDD; gen.py wires by pin name (VDD/CLOCK/DATA/GND/SEL), symbol and footprint share pad numbers, so nets follow the datasheet."
      - "M board: U2 is on F.Cu / Top (routed2.kicad_pcb, cpl_M.csv 'Top', rot 0), not flipped, so no flip/double-mirror question arises. EasyEDA C2879853 footprint is the same arrangement (pad3 differs 0.9 mm in y only)."
