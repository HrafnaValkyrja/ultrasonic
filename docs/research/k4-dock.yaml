# K4 dock connector search. Date 2026-10-08. Author: worker. Context: ECR-0019 (4 contacts VBUS GND D+ D-), O12/O31 (pre-built magnetic, no connector board), O33.
# Targets: belly <= ~5.0 wide (cavity 6.4-2x0.6 = 5.2) x <= 2.5 deep; or rear end face 6.4 (y) x 14.8 (z).
verdict: >
  NO off-the-shelf stocked 4-pin magnetic connector that I could verify fits either face. Every JLC/LCSC part is a 21-22 mm racetrack
  with a >=5.7 mm body and 6.9-7.7 mm flange. The only candidate that fits on paper (14.5 x 4.7, 2.2 mm pitch, JLC C9900155216) has
  0 stock and no datasheet. Dimensions are read off the vendor drawings (250 dpi crop, +-0.1 mm).
