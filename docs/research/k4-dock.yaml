  - {lcsc: C6276862, mpn: YZ103915020T-04025-02, role: receptacle 4P 2.54 pitch, stock: 155, price: 1.77, body_LxW: "22.3 x 7.7 outer (5.7 body)", H: "2.02 (1.5 flange)", I: "3 A static", fit: NO, ds: "Xinyangze 2021-09-02"}
  - {lcsc: C5126846, mpn: YZT0675-20048-04025-01, role: receptacle 4P, stock: 0, price: 1.97, fit: "NO, same 21.2 x 6.86 body"}
