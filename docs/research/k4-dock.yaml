electrical_notes:
  charge_0p5A: "All Xinyangze types pass (1 A head, 3-5 A receptacle). Use 2 mA..1 A, so head 1 A is the limit; fine for 0.5 A."
  usb_fs: "12 Mbit/s over 2 unshielded gold pogos + short pod wires: OK; spec contact R <= 50 mohm. Not measured. Keep D+/D- adjacent, 2.5 mm pitch gives ~no controlled impedance; accept."
  pull_force: "Not in any datasheet. Pogo force 30 gf/pin (YZP0048) is the only number. Measure on sample."
  alignment: "Magnet polarity keys (Adafruit: reversed halves repel). YZ family: S/N marks on racetrack ends (drawing), keyed by magnet polarity, so a flipped mate is rejected."
options:
  A: {name: "Custom 4P short body from Xinyangze/Promax (<= 14 x 4.6 x 2.3, 2.0 pitch)", pros: "fits belly or rear face; same maker as our head", cons: "not off the shelf (NRE+MOQ unknown, contradicts O12 spirit), lead time 15-20 d per Promax", status: unverified}
  B: {name: "JLC C9900155216 14.5 x 4.7 x P2.2 4P straight male (+ female/head)", pros: "only stocked-class listing that fits; 4.7 < 5.2", cons: "0 stock, no datasheet, no height/rating, mating head unknown", next: "request a sample/datasheet; do not design in until dims known"}
  C: {name: "C5126844 (YZ92015035T 4P, 5 A) with flange trimmed to <= 5.2 wide", pros: "buyable now, mates C5126845 head, body ~4.86 wide fits cavity 5.2 (0.17 each side)", cons: "hand-filing PA9T racetrack flange (owner builds by hand OK), only 5 in stock, inner body width is my drawing read +-0.1, thin 0.17 slack, height 2.8 > 2.5 belly depth unless flange is removed and body sits 1.8 deep", status: needs a caliper on a sample}
recommendation: >
  C as the fallback to buy now (3-5 samples of C5126844 + head C5126845, ~US$25), plus ask Promax/Xinyangze for a datasheet on B/A in parallel.
  Do not freeze the dock geometry until one sample is calipered (matches DK-02/DK-03). Owner decides (spec 0 rules); O21 means no order yet.
cad_fix:
  files: [hw/mech/dims_k4.py]
  change: "cell tape 0.25 -> 0.10 (thin transfer tape instead of VHB 0.25); cell-to-lid clearance 0.05 -> 0.20 mm (assert >= 0.2 added); T stays 6.4, H/L unchanged"
  check: "hw/mech/out/k4s/checks.json cell.lid_clear = 0.2 (shell_k4.py run 2026-10-08); mass change negligible"
  caveat: "0.10 tape needs a ~0.06 mm acrylic transfer film (3M 467MP class), not VHB; cell swap peels with heat. Alternative if owner dislikes: floor wall 0.6 -> 0.45, or T 6.55."

# ---------------------------------------------------------------------------------------------------------------------------------------------
option_A_design:   # 2026-10-08, worker (Opus). Owner default for queue A-K4-DOCK. Code: hw/mech/dims_k4.py (dock block), shell_k4.py (dock_add/dock_cut), sim/checks/dock_pull.py. [T] = inferred, not read from a datasheet.
  head: >
    Xinyangze YZP0048-20048-04025-03 (LCSC C5126845, 4P pogo cable head, stock 46 on 2026-10-08, US$2.72). Verified (LCSC listing of sibling -02, C5200680, fetched 2026-10-08): pitch 2.5 mm, 1 A/pin, 12 V,
    contact R 50 mohm, 10 000 cycles, 4.8 mm length, 3.1 mm "operating height", -20..70 C. From this file's earlier drawing read: 21.2 x 6.86 racetrack, 30 gf/pin. NOT published anywhere I could reach: pogo stroke,
    tip diameter, magnet size/pitch/polarity. Promax (promaxpogopin.com 2026-10-08) confirms polarity/stroke/force are per-SKU custom items, no numbers. -> HEAD_MAG_PITCH 13.2 mm [T], stroke >= 0.9 mm [T], tip ~0.9-1.0 mm [T].
  CALIPER_FIRST: "Before the shell is frozen measure on a C5126845 sample: magnet centre pitch p, pogo stroke and tip dia, polarity of each magnet (compass or a second magnet). Front magnet is fixed at X0+2.3; REAR magnet x = front + p (pocket moves freely under the cell); pad centre = front + p/2 (if p > 13.2 the pad row moves rearward 0.5 per 1 mm: tab end hits the cell at p ~ 13.9 -> then DOCK_SHIFT grows)."
  layout:    # pod frame, mm; X0 16.85 (pod front), belly = z -9.7 face, y 4.3..10.7, flat belly y 5.3..9.7 (1.0 round)
    head_axis: "long axis along pod x, centre line y = 6.8 (DOCK_YC); head 6.86 wide overhangs the 6.4 T by 0.23/side only if centred on 7.5; at 6.8 it overhangs the temple side (y<4.3) by 0.2 and the lid side not at all. Never docked while worn (O32), so harmless."
    pod_change: "DOCK_SHIFT 1.5: pod grows 1.5 mm at the FRONT (L 49.15 -> 50.65, T/H unchanged); stack moves to x 17.7..28.7; wire gap 0.8 -> 2.3. The cell cannot move back (strut-relief fill clips it past x 62.0, checked: 0.33 mm3 clash at 63.5). Length is owner's lowest priority (O27); the alternative is no stock head."
    pads:    {x: [22.0, 24.5, 27.0, 29.5], y: 6.8, z_bottom_of_M_edge: -9.0, recess_from_outer_belly: 0.7, pitch: 2.5}
    windows: {count: 4, size_x_y: [1.3, 1.2], webs_between: 1.2, through: "belly wall 0.6 (z -9.7..-9.1)"}
    magnets: {x: [19.15, 32.35], y: 6.8, disc: "2.5 x 1.0 N52", pocket: "D2.6 from the cavity side, 0.2 outer skin, boss D2.9 top z -8.45", front_pocket_edge: "17.85 = 1.0 behind the pod front, exactly where the belly round starts"}
    M_tab: {x: [21.05, 30.45], y_mid: 6.8, thickness: 0.8, bottom_z: -9.0, past_stack_rear: 1.75, to_cell: 0.55, to_bosses: 0.4}
  M_requirement: >
    M must sit with its MID-PLANE at y = 6.8 (y 6.4..7.2) because the pads are its 0.8 edge. That puts M's parts on its floor face (5.1..6.4, 1.3 high) and leaves its lid face flat, since P's hanging parts reach y 7.52 (0.3 above M). The placeholder stack_body (5.1..7.52) does not model this; ECR-0020 / V9 must carry it. Open: does the 'M mic port on belly face' wording in ECR-0020 L16 assume another M position? (mic is in the lid duct in shell_k4)
  pad_footprint_M:   # footprint spec for M (KiCad, board edge = belly side of the board, board outline has the tab above)
    type: "castellated half-holes (edge-plated), 4x"
    drill_dia: 0.9      # JLC castellated min 0.6; cut in half by the outline; JLC: hole-edge to hole-edge >= 0.6 (here 1.6), board >= 10x10 (M is ~11 x 12: marginal, panel rails ok) [JLC capabilities / castellated blog, fetched 2026-10-08]
    pitch: 2.5          # head pogo pitch (verified 2.5)
    annular: "0.15 ring on the top and bottom copper faces of the tab each side of the half-hole (pad 1.2 x 0.6 land) so the plated barrel is anchored; mask opening = pad"
    net_order_x_increasing: ["J3 DOCK_VBUS", "J11 USB_DM", "J10 USB_DP", "J4 GND"]   # USB-standard order VBUS D- D+ GND [T: cable head wire order unknown, DK-02; closes at the sample]
    gaps: "VBUS-GND 7.5 pitch away; adjacent barrel gap 1.6 (>= 0.8 MZD-10 holds); D+/D- 1.6"
    esd: "D5 (TPD1E10B06, 1.0 x 0.6) on J3 within 1.5 mm, U6 on J10/J11 within 2 mm, on the tab's lid face, grounded via J4's barrel (ECR-0020 L16: D4/D5/U6 are on M already, so no new part). Tab ground return must be short; keep D5 closer to its pad than to the buck."
    finish: "ENIG 2u-5u inch Au over Ni (JLC standard 'ENIG', mandatory/recommended for castellated). Hard gold (30 u-inch) is only offered as gold fingers on board faces, not on a castellated edge, so it is not an option here [JLC blog, 2026-10-08]. Wear: 4 pogos at 30 gf, a few hundred docks (charge nightly) over years; ENIG Au 2-5 u-in is thin: expect Ni show-through eventually -> pogo tip is the harder surface; measure contact R after 200 dock cycles on the bench, DK item."
    alt_pad: "face lands on M's belly edge are not possible: the pogo moves along z, the pads must face -z, and a 4-layer 0.8 board edge is the only such face. A gold-flash edge plated rectangle (non-castellated) is a quote-only JLC option, unverified."
  options:   # (spec 0: 2-3 with a recommendation)
    A1: {name: "castellated half-holes on the M tab, 4 windows, 2 bossed magnet pockets (this design)", pros: "no extra part, pads are the PCB, JLC does it, ESD already on M", cons: "+1.5 mm pod length, M mid-plane pinned to y 6.8, pogo tip meets a concave half-hole, 0.7 pad recess, magnet pitch is a guess"}
    A2: {name: "a bought 4-pad flex/FR-4 'dock chip' (own tiny PCB 8 x 2.4, ENIG or hard gold, flat face pads) glued in a belly window, 4 wires to M", pros: "flat gold land (hard gold possible), pogo lands anywhere, pad flush with belly, M position free, no pod growth", cons: "4 wires + sealing at the wire exit, ~0.2 g, +1 part; ECR-0019 'no connector board' spirit"}
    A3: {name: "stock C5126844 trimmed (option C above)", cons: "2.8 height vs 0.6 wall, flange filing"}
  recommendation: "A1 if the sample calipers to p <= 13.9 and stroke >= 0.9; else A2 (fall back, same magnets, flat pads). Owner decides."
  forces:    # sim/checks/dock_pull.py, Coulomb surface-charge model, identical coaxial discs, Br 1.45 T N52, gap = 0.2 skin + 0.1-0.3 head shell [T]; real pull ~0.7-0.9 of this
    spring_push_off: "4 x 30 gf = 1.18 N at full stroke (listing; stroke [T])"
    pull_per_pair_N: {"D2x0.5@0.3": 0.39, "D3x0.5@0.3": 0.70, "D3x1.0@0.3": 1.51, "D3x1.0@0.5": 1.13, "D2.5x1.0@0.4": "~1.1 (interp.)"}
    chosen: "D2.5 x 1.0 N52 x2: ~2.2 N total at 0.4 gap, ~0.9 N with 0.5 mm lateral miss -> net +1.0 N seat force after the springs (about 85% margin over the spring); the D2 x 0.5 and D3 x 0.5 versions that fit the 0.6 wall alone are NEGATIVE/zero net -> bosses are needed."
    caveat: "head magnets are fixed by the vendor; if they are weaker than 2.5 x 1.0 the net seat force drops linearly. Sample test: hang a 100 g mass from the seated head by a cable, then lift off with a spring scale (N). Required: seat >= 0.5 N net."
  magnet_stock: "N52 D2.5 x 1.0 discs are a common AliExpress/eBay/supermagnete-class size (e.g. D2.5x1 N52 pack); LCSC magnet listings not checked here -> sourcing step before order (O21: nothing ordered). Epoxy-bonded, Ni-Cu-Ni coated; coat check for sweat (NiCuNi corrodes -> pocket is sealed by the 0.2 skin and epoxy)."
  polarity_keying:
    rule: "The head's two magnets face the belly with OPPOSITE poles (N at the front end, S at the rear, say). Install the pod magnets with the opposite pairing (S front pocket, N rear pocket, as seen from outside). Right way round: both pairs attract. Head rotated 180 deg (VBUS pad onto GND pad): front head magnet (S) meets front pod magnet (S) -> both pairs repel, head does not seat, pogos stay out of reach/contact. Marker: dot the pod's N side on the outer belly after the build, and the head's cable-side is marked at the sample test."
    mixed_failure: "head flipped about its long axis (face down is the only face, cannot happen)"
    fallback_if_not_alternating: "if the head has the same pole on both magnets, the pod can't repel a 180 turn by polarity; then key by net order: VBUS at pad 1 and GND at pad 4 means a 180 turn puts VBUS on GND (D4 blocks, D5 bidirectional on VBUS clamp) and swaps D+/D- (harmless) -> no damage, no function; same as sub-dock-usb 'rec' at DK-02."
    CHECK: "compass test on the sample sets the pocket assembly: insert pod magnets with a marked jig so the polarity is set by the jig, not by hand."
  sealing:   # sweat
    paths: "4 windows 1.3 x 1.2 in the 0.6 wall + the 0.1 gap between the M tab and the cavity floor; magnets are enclosed by the 0.2 outer skin."
    method: "after the M/P stack is hung and the tab is in place: flow low-viscosity UV acrylic (or 2-part silicone) into the 0.1 gap from the cavity side and make a continuous inner fillet around every window web; leave the castellations open (pad faces must stay metal). Windows themselves stay open to the pogo: 1.2 mm deep cups (0.7 recess) wet by sweat drain out on their own and are cleaned with a swab. The FR-4 tab edge is sealed by ENIG on the castellated barrel + solder mask elsewhere; conformal-coat or UV-seal the exposed glass-fibre edge between pads. IPX4 target (O12b) validated only by a sprinkle test at bring-up; not proven."
    risk: "sweat conducting between adjacent barrels (VBUS-D- gap 1.6 mm, ~5 V): leakage and corrosion on the VBUS barrel; U6/D5 do not help with DC leakage. Mitigation: the dock is off (not powered) unless a head is seated: firmware sees VBUS via D4/PA1 only; with no VBUS no field. VBUS is the head's, so barrels are at 0 V undocked except through sweat from the cell? cell - is GND only. OK."
  fits_checked:   # shell_k4.py run 2026-10-08, hw/mech/out/k4s/checks.json
    envelope: "T 6.4, H 14.8, L 50.65 (was 49.15)"
    resin: "min wall 0.6 still holds (cavity+0.6 outside body 0 mm3); belly windows leave 1.2-wide webs; tub, lid, puck: 1 solid each, valid"
    dock_clearances_mm: {front_pocket_edge_from_pod_end: 1.0, tab_to_front_boss: 0.4, tab_to_rear_boss: 0.4, tab_to_cell: 0.55, boss_top_to_cell: 0.15, boss_top_to_M_edge: 0.15, boss_to_arm_wires: 0}
    clashes_remaining: "tub/cell 0.14 mm3 (cell top corner in the 0.5 cavity round at y 5.0-5.1, z 4.3-4.4: from the earlier tape 0.25->0.10 change, not this work) and tub/arm_wires 0.11 mm3 (placeholder wire in the strut-relief fill at x 62.0-62.4): both are placeholder-level and not touched by the dock"
  open_items:
    - "M mid-plane y 6.8 and M parts on the floor face only -> ECR-0020 / V9 must add it (not yet in the docs/system set; plm impact + doc update still to do: sub-dock-usb DK-xx, reg-pod-body, reg-board, physical)."
    - "HEAD_MAG_PITCH, stroke, tip, polarity [T] -> sample (O21 holds the order); numbers above recompute from dims_k4.HEAD_MAG_PITCH."
    - "magnet 0.15 mm clearance above the boss to the cell and the M edge is the tightest gap; the cell swell allowance (0.2 to the lid) is on the other side."
