# V2 verification: Renata Li-polymer cells. AI-facing. Read 2026-10-07 by Claude (Sonnet 5.5 subagent).
# Primary source = Renata datasheets (renata.com reachable 2026-10-07; PDFs saved ~/Desktop/ultrasonic-scratch/datasheets/<part>.pdf, outside repo).
# Fetch path: https://www.renata.com/en/products/lithium-polymer-batteries/<part>/ -> "Datasheet" link downloads/?product=<part>&fileid=...
# Confidence: H = read directly from the Renata PDF; M = derived by arithmetic from PDF figures; L = inference.
meta:
  task: "synthesis.md section 3 item V2"
  read_date: 2026-10-07
  source_class: primary (Renata SA, Itingen CH)
  glossary:
    ICP: "Renata Li-Ion Polymer pouch cell/pack part-number prefix; digits = T(0.1mm) W L (mm), e.g. 331319 = 3.3 x 13 x 19 nominal"
    PCM: "protection circuit module (over-charge/over-discharge/over-current/short-circuit board); Renata calls it 'Safety Circuit'"
    C: "discharge/charge current numerically equal to nominal capacity in mAh (1C of 50 mAh = 50 mA)"
  caveats:
    - "Datasheets do NOT enumerate which PCM protections exist (no OVP/UVP/OCP/SCP thresholds). Only 'Safety Circuit: Yes/No'. Ask Renata for the PCM spec if K3 depends on cut-off thresholds. conf H (absence)"
    - "Pulse current is only given as 'max discharge current 2.0 C for non continuous discharge'; no pulse duration/duty/temperature stated. conf H (absence)"
    - "Datasheet drawings are 'illustration only; contact sales for detailed drawing' (331319PM, 281029HPG, 390831PR); tab/wire/PCM protrusion is not dimensioned in the text. Whether the max L x W x T includes PCM/wire is NOT stated. conf H (absence)"
    - "Envelope for 331319PM, 281029HPG, 390831PR is stated 'after 500 cycles' (i.e. includes end-of-life swelling). For 401230UPR and 501233PA-02 the envelope has no 'after 500 cycles' qualifier: unknown whether swelling is included; budget extra. conf H"
    - "Datasheet revisions are 11/2022 (three small cells) and 08/2019 (401230UPR, 501233PA-02). Older/maybe superseded; check current rev with Renata."
    - "Capacity here differs from synthesis shorthand: ICP390831PR is 85 mAh typ (80 min), ICP401230UPR is 130 mAh typ (125 min). Synthesis lists 50/68 mAh cells for K3; those are 331319PM and 281029HPG."
common_to_all_five:
  discharge_cutoff_V: {v: 3.0, conf: H}
  charge_method: {v: "CC/CV", conf: H}
  charge_temp_C: {v: "0 to 45", conf: H}
  discharge_temp_C: {v: "-20 to 60", conf: H}
  storage_temp_C: {v: "-20 to 45 (0 to 30 recommended if >3 months)", conf: H}
  cycle_life: {v: ">80% of MINIMUM capacity after 500 cycles (0.5C charge, 0.5C discharge, room temp)", conf: H}
  capacity_test: "0.2C to 3.0 V at 20 C"
  contact: "wire AWG 30 (all five)"
  continuous_discharge_max: "1.0 C"
  pulse_discharge_max: "2.0 C 'non continuous' (no duration stated)"
  max_charge: "1.0 C CC; normal 0.5 C"
cells:
