derived_for_K3_decision:
  peak_current_vs_pulse_rating:
    note: "Pulse limits are only 2C 'non continuous'. Bridge-peak survival (spec/synthesis K3 vs K2) depends on pulse duration, which Renata does not state; ask Renata or measure sag. conf H (gap)"
    table_mA: {ICP331319PM: 100, ICP281029HPG: 136, ICP390831PR: 170, ICP401230UPR: 260, ICP501233PA-02: 350}
  internal_resistance_sag_at_pulse_mV:
    note: "I x R_max(30% SOC), cell+PCM, M; upper bound since R is a max"
    ICP331319PM_at_100mA: 73
    ICP281029HPG_at_136mA: 78
    ICP390831PR_at_170mA: 90
    ICP401230UPR_at_260mA: 88
    ICP501233PA-02_at_350mA: 168
  thickness_ranking_max_mm: {ICP281029HPG: 3.3, ICP331319PM: 3.7, ICP390831PR: 4.3, ICP401230UPR: 4.5, ICP501233PA-02: 5.3}
  energy_Wh_typ: {ICP331319PM: 0.185, ICP281029HPG: 0.258, ICP390831PR: 0.315, ICP401230UPR: 0.481, ICP501233PA-02: 0.648, note: "typ capacity x nominal V; M"}
