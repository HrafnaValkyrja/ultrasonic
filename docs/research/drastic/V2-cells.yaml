    src: {file: ~/Desktop/ultrasonic-scratch/datasheets/icp331319pm.pdf, url: "https://www.renata.com/en/products/lithium-polymer-batteries/icp331319pm/", rev: "ICP331319PM V01 11/2022", read: 2026-10-07}
    nominal_V: 3.7
    capacity_mAh: {typ: 50, min: 45, conf: H}
    envelope_max_mm: {T: 3.7, W: 12.8, L: 21.0, note: "after 500 cycles; PCM/wire inclusion not stated", conf: H}
    pcm: {present: true, protections_listed: none, conf: H}
    cv_V: 4.2
    charge_mA: {normal: 25, max: 50, conf: H}
    discharge_mA: {continuous: 50, pulse_nonCont: 100, pulse_duration: unstated, conf: H}
    impedance: "< 730 mOhm at 30% SOC"
    weight_g: 2.0
    swelling_allowance: "implicit: envelope is end-of-life (500 cycles). Nominal-to-max: 3.3 -> 3.7 mm = +0.4 mm (M, nominal T inferred from part number)"
  ICP281029HPG:
