    3MHz_range2: {mA: 0.15, uA_per_MHz: 50, conf: M, note: "low frequencies are dominated by fixed overhead"}
    hse_bypass_24MHz: {mA: 0.43, uA_per_MHz: 17.9, conf: M}
    hse_bypass_1MHz: {mA: 0.12, conf: H}
  smps_typ_1p8V_coremark_mA: {range1_96MHz: 2.50, 48MHz: 1.0, 24MHz: 0.56, conf: H, src: "Table 32"}
  ldo_typ_coremark_mA_3V: # Table 34 (VDD-independent), the ONLY option on UFQFPN32
    range2_48MHz: {mA: 2.05, uA_per_MHz: 42.7, conf: H}
    range1_96MHz: {mA: 4.55, uA_per_MHz: 47.4, conf: H}
    range2_24MHz: {mA: 1.15, uA_per_MHz: 47.9, conf: H}
