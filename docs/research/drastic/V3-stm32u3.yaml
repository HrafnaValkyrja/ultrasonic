    low_freq_hse_1MHz: {mA: 0.305, conf: H, src: "Table 31, 25 C, VDD condition per Table 27 unspecified"}
  stop2_uA_typ_25C:
    smps_3V_8KB_SRAM2: {uA: 4.0, conf: H, src: "Table 52"}
    smps_3V_all_SRAM: {uA: 4.8, conf: H}
    smps_3p3V_8KB: {uA: 3.8, conf: H}
    ldo_3V_8KB_SRAM2: {uA: 13, conf: H, src: "Table 49 - what UFQFPN32 gets"}
    ldo_3V_all_SRAM: {uA: 15.5, conf: H}
    ldo_85C_8KB: {uA: 130, conf: H}
    smps_85C_3V_8KB: {uA: 40, conf: H}
  stop3_uA_headline: {with_8KB: 1.6, full_SRAM: 2.2, conf: H, src: "p1"}
  consequence_QFN32: "On QFN32 (LDO) the CPU costs ~3x more per MHz and Stop 2 is ~3x higher than the SMPS headline; D11 (switching regulators allowed only as MCU core SMPS) can be met only on an SMPS package. For a duty-cycled design measure both; at low MHz fixed overhead dominates. conf M"
  adf_clock:
    fCCKO_master_SPI_max_MHz: {v: 25, conf: H, src: "Table 107 ADF characteristics"}
    fCCKI_slave_SPI_max_MHz: {v: 25, conf: H}
    fCCKO_LF_master_max_MHz: {v: 5, conf: H}
    PDM_specific_max_clock: "NOT stated separately in the datasheet; 4.0 MHz hypothesis in synthesis is unconfirmed. Kernel-clock-limited: t_high/low >= 2 x adf_proc_ck. conf H (absence). Needs RM0487."
