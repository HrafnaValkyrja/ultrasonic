  A: {L: 17, pod_L: 51.1, T: 2.9, layers: 6, jlc: "yes, 1 board", rework: "poor, dense", noise: "baseline", risk: "known placements; 6L routing unproven (V5 open item)"}
  A_wlcsp: {L: 15, pod_L: 49.1, T: 2.9, layers: 6, jlc: "yes, via-in-pad cost/capability unchecked", rework: "worst (no BGA rework/probe)", noise: "baseline", risk: "synthetic ballout (V5)"}
  B_bm28: {L: 14.5, pod_L: 48.6, T: "3.9-4.3", layers: "4+4", jlc: "yes, 2 boards, cheap", rework: "best serviceability, fragile 0.35 mm B2B", noise: "same-or-slightly-worse", risk: "stack margin 0.2-0.6 mm; no placement run yet"}
  C: {L: 14, pod_L: 47.5, T: 3.7, layers: "rigid-flex", jlc: "NO", rework: "none", noise: "same as B", risk: "not buildable at JLC"}
recommendation:
  pick: "A (one 6L two-face board, QFN48, 17 mm, pod L 51.1) is the baseline. B (BM28 stack, ~14.5 mm, pod 48.6) is the length option if the owner wants -2.5 mm (5 %). Reject C. Do NOT take A-WLCSP: B gets within 0.5 mm of it without via-in-pad."
  why_blunt: "the 10 mm mic-to-switcher rule and the 7 mm QFN48 floor the board at ~14 mm in every option; two boards buy 2.5 mm for +1 board, 2 fragile connectors and a thickness margin of 0.2-0.6 mm. Length gain is real but small relative to the 51 mm pod; A has zero new mechanical interfaces. Owner decides (spec 0 rule)."
  owner_decision_needed: "is -2.5 mm pod length worth a 0.35 mm B2B and a split board? If yes, B with BM28."
