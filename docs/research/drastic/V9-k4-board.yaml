B_plus_noise:   # 2026-10-08 Claude (Opus 5.5 subagent). Sim: sim/noise/vertical_bplus.py (run_l2 reused unchanged, geometry hooks patched). Board: draft_r2 routed. H measured-by-model, all geometry/leak numbers [E] assumptions.
  rerun_2026_10_08_partition_v2:   # Claude (Opus 5.5 subagent), after the d2a70d9 review flaw (VLXSMPS/VDD11 crossed the B2B)
    partition: "ECR-0020 rev 2: P (upper) = U1 + SMPS (L1, C7, C8/C9) + charger + LDO + bridge + dock + button = ALL aggressors F01/F02; M (lower) = mic U2 + C13 only. B2B = BM28 10-pin: MIC_VDD, MIC_CLK, MIC_DATA + 7 GND. No switching node, no bridge or SMPS current crosses."
    result: "sim/noise/vertical_bplus.py re-run unchanged (fenced 3G), all 7 cases bit-identical to the table below: the model already puts OUT_A/OUT_B/VLXSMPS at the worst alignment over MIC_VDD, so moving U1 and L1 together onto P changes no aggressor position. Magnetic F02 nominal 62.7/42.7/12.7 dB (nom/pes/worst PSRR), pessimistic leak 54.8/34.8/4.8 dB (below the 10 dB sign-off), planes-ignored bound -7.3 dB worst PSRR. Verdict unchanged: PASS nominal, MARGINAL pessimistic-corner."
    new_victim_not_in_model: "MIC_VDD (PA5 -> mic) and MIC_CLK/DATA now run on P from U1 to the BM28, i.e. IN-PLANE with L1 on the same board, then up the connector. The in-plane baseline (today's routed board, MIC_VDD trace ~2.4 mm from the VLX trace) is 68.6/48.6/18.6 dB, so the in-plane run is fine only if the P layout keeps the routing as good as draft_r2; the vertical hop through the connector is the 62.7/42.7/12.7 case. Layout rule for P: route PA5/PB3/PB4 away from VLXSMPS/L1, on the side of U1 facing the connector, GND-guarded; check with the same sim on the routed P board."
    contact_risk_retired: "The 0.3 A [T] BM28 contact no longer carries SMPS ripple (VLXSMPS/VDD11 gone from the connector). Largest contact current is the ~1 mA mic supply. Conduction path A6 (A01 SMPS-input 15.3 dB) is now entirely on P, so the connector cannot worsen it; the open conduction item shrinks to the mic ground return through 7 GND contacts."
  question: "Option B+ (power board with L1/Q1/Q2 2-3 mm directly above the mic region, both boards' GND planes between): does mic/ADC noise stay in budget vs today's in-plane 12.87 mm port-to-L1 case?"
  verdict: "PASS on nominal assumptions, MARGINAL only under the pessimistic-leakage x worst-PSRR corner. Field-coupled mic-supply spur (F02 SMPS, the worst field line): margin vs tone limit (floor-10 dB) 42.7 dB at pessimistic PSRR (today in-plane 48.6, delta -5.9 dB); 12.7 dB at worst-case PSRR roll-off (today 18.6; sign-off needs >= 10). Pessimistic leakage: 34.8 / 4.8 dB (below the 10 dB sign-off). Planes ignored (bound): 22.7 / -7.3 dB, so the planes are doing the work and must be real. Bridge (F01) and PDM-line pickup stay >= 83 dB (digital 100 mV limit). Verdict margin: +6 dB worse than today, +12.7 dB absolute (worst PSRR), nominal."
  method:
    reuse: "sim/noise couple.py run_l2: same victims (MIC_VDD tone chain with alias+PSRR+mic floor, MIC_DATA, MIC_CLK), same aggressor waves (aggressors.yaml F01 bridge OUT_A/OUT_B, F02 SMPS VLXSMPS 3 MHz triangle 108 mA pp, 3 V edges 3 ns), same limits (tone limit floor-10 dB = -112.3 dBFS; digital 100 mV). Baseline = unmodified run on routed.kicad_pcb (sim/noise/out_r2/budget.json)."
    change: "aggressor nets translated in-plane to sit directly over the MIC_VDD net centroid (worst alignment) and lifted to height h above the lower board's B.Cu; victim traces keep their real routed geometry. Mutual L from 3-D filament distance (free); mutual C from free-space filaments."
  assumptions:
    A1_stack: "lower board B.Cu (mic face) = 0; lower F.Cu 0.8; gap 0.6 (BM28); upper board bottom 1.4; upper top 2.2. L1 winding centre ~0.5 above its board face -> 2.7. Switch-node/bridge traces on upper top: h = 2.2. Mic on the lower board outer (B) face (mic 1.08 mm does not fit the 0.6 gap) [T: mic face and port path not decided]."
    A2_plane_shield_H: "each GND plane screens B as a thin sheet: T_i = 1/sqrt(1+(f/fc_i)^2), fc_i = Rs/(pi mu0 d_i), Rs = 1.13 mohm/sq (model value, ~15 um Cu), d_i = source-to-plane distance. Plane 1 = upper board GND directly under the source (d1 0.15 for traces, 0.65 for L1 winding), plane 2 = lower board In1 GND (d2 = h - 0.45). fc: 1.9 MHz / 0.18 MHz (traces), 0.44 / 0.14 MHz (L1). Two planes combined as a PRODUCT (independent sheets). Lower In2 +3V0 plane is NOT counted (bonus). Same interpolation as the in-plane model, an engineering estimate not a field solve (+-10 dB model error stated in couple.py)."
    A3_leak_floor: "T_total = max(T1*T2, floor). floor = edge/aperture leakage (BM28 slot, via antipads, 12 mm wide planes): nominal 0.10 (-20 dB), pessimistic 0.25 (-12 dB), optimistic 0.03. ASSUMPTION; nothing measured. At 3 MHz and above the product is < 0.03, so the floor, not the plane physics, sets the result."
    A4_electric: "E field leaks only through apertures: Cm = leak x Cm_free, leak nominal 0.03 (the in-plane model's own Cm_image/Cm_free ratio), pessimistic 0.10, optimistic 0.01."
    A5_aggressor_current: "aggressor current taken uniform along the whole real VLXSMPS / OUT_A / OUT_B net with no return path in the model = upper bound on the loop (couple.py docstring). Real L1 DFE201610E is a metal-composite semi-shielded part; this is conservative."
    A6_not_modelled: "conduction through the BM28 (VSYS/GND contact R + pin L), vias, the L1 network itself. The worst conduction line today is A01_SMPS_IN at 28 MHz alias, 15.3 dB at worst PSRR (budget.json LN-M01): it is a conduction problem the connector can make WORSE and this run does not cover it."
  results_dB_margin:   # margin to tone limit, MIC_VDD chain F02 SMPS tone; nom / pes PSRR / worst PSRR (rolloff); digital lines = sum-of-harmonics margin vs 100 mV
    in_plane_today_12p87:   {H_magnetic: "68.6 / 48.6 / 18.6", E_electric: "101.5 / 81.5 / 51.5", PDM_data_H_E: "77.0 / 92.7", PDM_clk_H_E: "76.7 / 104.5", bridge_to_PDM: ">= 103"}
    Bplus_traces_h2.2:      {H_magnetic: "62.0 / 42.0 / 12.0", E_electric: "98.0 / 78.0 / 48.0", PDM_data_H_E: "73.7 / 78.7", PDM_clk_H_E: "76.9 / 89.4", bridge_to_PDM: ">= 93"}
    Bplus_L1_h2.7_nominal:  {H_magnetic: "62.7 / 42.7 / 12.7", E_electric: "98.8 / 78.8 / 48.8", PDM_data_H_E: "74.6 / 79.3", PDM_clk_H_E: "77.2 / 89.7", bridge_to_PDM: ">= 94"}
    Bplus_L1_h2.7_pessimistic_leak: {H_magnetic: "54.8 / 34.8 / 4.8", E_electric: "88.3 / 68.3 / 38.3", PDM_data_H_E: "66.6 / 68.8", PDM_clk_H_E: "69.2 / 79.2", bridge_to_PDM: ">= 83"}
    Bplus_L1_h2.7_optimistic_leak: {H_magnetic: "73.2 / 53.2 / 23.2", E_electric: "108.3 / 88.3 / 58.3"}
    Bplus_planes_ignored_bound: {H_magnetic: "42.7 / 22.7 / -7.3", E_electric: "68.3 / 48.3 / 18.3", PDM_data_H_E: "54.6 / 48.8", PDM_clk_H_E: "57.2 / 59.2", bridge_to_PDM: ">= 63"}
  magnetic_vs_electric:
    magnetic: "dominates everywhere. M_free(F02 -> MIC_VDD) -0.54 nH at h 2.7 (today in-plane -0.34 nH, because the MIC_VDD trace already runs ~2.4 mm from the VLX trace, not 12.87 mm: the 10 mm rule protects the PORT, not the VDD routing). SMPS H field at 3 MHz harmonics sits above the plane corner fc, so the sheet attenuation is real (T 0.16 -> 0.007 for two planes) but is floored by leakage (A3). Magnetic needs the planes continuous under L1 and over the mic region, with the BM28 slot offset away from the L1 shadow."
    electric: "78.8 dB at pessimistic PSRR (today 81.5): not a concern; any continuous plane kills dV/dt coupling; margin set by the aperture leak assumption A4. The 3 ns / 3 V switch-node edge puts its energy at 30-100 MHz where the plane image limit applies."
  vs_in_plane: "-5.9 dB in magnetic margin on the dominant line (aggressor 2.35 mm from the VDD trace today vs 2.7 mm vertical but with the shielding floor at -20 dB instead of in-plane T=0.12 at 8 MHz). The 10 mm rule is therefore not a noise-physics requirement for B+ on this model; it can be relaxed in the vertical case ONLY if both GND planes are continuous across the mic + L1 footprint (DRC/review item)."
  caveats:
    - "Margin to PSRR sign-off is thin in the pessimistic corner (4.8 dB < 10). Retire with a bring-up measurement (LN-V*) on a real stack; do not claim better than the model error (+-10 dB)."
    - "Conduction through BM28 not modelled (A6): the worst existing line (A01 conduction 15.3 dB) can only move down with extra series L/R in GND/VSYS. Needs >= 4 GND pins and a local 22 uF at the lower board (already in the B options)."
    - "Acoustic coupling of SMPS mechanical (inductor/MLCC piezo) noise into the mic port 2-3 mm away is NOT electrical and NOT in this model; MLCC and L1 audible-band buzz at load steps is a real B+ risk [T]. Mitigate: no MLCC on the switch/VSYS loop above the port, or soft-mount; decide by a tap test."
    - "Mic is 1.08 mm, gap 0.6: the mic must be on the lower board's OUTER face; then the port opening is on the outer side and the planes shield the mic die from the upper board. If the mic sat inside the gap the shielding would drop out."
  recommendation: "B+ is acceptable on noise if (a) continuous GND on upper In1 and lower In1 under/over L1 and the mic, (b) >= 4 GND pins on BM28 near L1, (c) mic on the outer lower face, (d) acoustic tap test of L1/C buzz before freezing. Then board L ~11 mm is not noise-blocked. Owner decides (spec 0)."
  src: ["sim/noise/vertical_bplus.py (run 2026-10-08, fenced 3G)", "sim/noise/couple.py, aggressors.yaml, params.yaml, out_r2/budget.json (baseline)", "docs/system/reg-board.md l.115, l.144 (12.87 mm, MP-01 rule)"]
  integration_map_crosscheck: "research-only, no ECR; plm impact not run. If B+ adopted: reg-board (retire/relax MP-01 10 mm for the vertical case, new outline), sub-power (VSYS+GND across BM28), rail-budget, sub-audio-in (mic outer face), physical (stack 3.9-4.3)."
