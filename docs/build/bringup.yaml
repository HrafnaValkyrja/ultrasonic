# BRING-UP PLAN (ECR-0010), agent twin of docs/build/bringup.md (generated from THIS file by docs/build/make_bringup.py).
# Design: hw/current.yaml phase2 (MZ-2, board sha db9136df, 2026-10-07). Owner builds by hand (memory: owner-builds-by-hand).
# Rule: safety first; never skip a gate; every step = what, tools, expected (model value + tolerance + source), pass, on_fail.
# Sources: sub-debug-test.md bring-up proposal + Bench; docs/sim/firmware-emulation.yaml FWSIM-R20/R27/R50/R58/R60-R65,
# cannot_validate CV-1..CV-10, rev1_telemetry; docs/brief/backlog.yaml hardware entries (ids in `closes`); physical.md assembly
# order; mech notes (heel.md, shell_r2.md, sealing-and-service.md). [A] = assumed tolerance, refine on board 1.
schema: 1
date: 2026-10-07
k4_added: 2026-10-08   # stage K below covers the K4 boards (hw/pod/k4/); stages A-I still describe the r2 single board until superseded at K4 freeze (O21). Values from hw/pod/k4/pod_k4_{M,P}.net + gen.py BM28_PINS, BOM tolerances (bom_jlc_*.csv), datasheets as cited. [A] = assumed.
ecr: ECR-0010
tools:
  have: ["soldering iron + flux + fine tips (O13)", "oscilloscope (O13)", "multimeter with diode mode [A: assumed, 'etc.']", "current-limited bench supply [A: assumed]", "LCR meter (spec L575)", "Nordic PPK2 power profiler (spec L575)", "loupe / microscope [A]", "calipers", "kitchen scale (1 g)", "pin vise + drills 0.8/0.85/1.0", "PC with USB"]
  buy_at_freeze_O21: ["pin-gauge set 0.50-1.00 mm x 0.01 (RPB-16)", "20G hypodermic tube (gauge-pin sleeve)", "USB-UART 3.3 V adapter for TP7 printf", "dock cable: 5-pin YZP0048 head + USB-C plug with CC wired (DK-09)", "thermocouple for the charge log (PWR-I4) [A: if the multimeter has none]", "SWD probe only if DFU-first fails (DBG-1 option C)"]
  software: ["dfu-util (FOSS) [TBD: confirm U575 DFU support]", "fw/tools/pod_test.py (FWSIM-R63)", "python3 sim/fw/fmac_model.py --bench (FMAC expected words)"]
gates:
  G0: "stage A done before any board is powered (parts and prints known good)"
  G1: "no power until B2 (all short/continuity checks) passes"
  G2: "no 5 V dock power until C1 (current-limited cell-side power) passes"
  G3: "no lid bond (physical.md step 8) until D4 (boot stub + DFU re-flash over USB) passes: SWD is gone after the bond (DBG-16)"
  G4: "no exciter until E7 (|Z| on a resistor) and E8 (fault break) pass"
  G6: "K4 (two stacked boards P/M, ECR-0020/0021): no BM28 mate until K1 and K2 pass (each board alone, no shorts); no power through the mated stack until K4 passes (reversal table)"
  G7: "K4: no cell on the charger until K8 dock-pad/head check passes; first charge only fire-safe (K9)"
  G5: "no wear on the head until H2 (Off current) and the supervised first charge (E6) pass (ECR-0009)"
stages:
  - id: A
    name: "Before the board: prints, parts, coupons (no electricity)"
    steps:
      - {id: A1, tag: "tolerance coupon", what: "print the tolerance coupon + tub, lid, 5-puck kit; wash, cure; measure holes 0.8/0.85/1.0/1.2/1.6 and slots 0.3/0.4/0.5; dry-fit the pad cap + pad board + exciter, shim tight fits", tools: [calipers, pin vise], expect: "printed holes close ~0.05-0.1 [A]; after reaming the D1.0 bore: 1.00-1.02", pass: "bore admits a 1.00 pin, not a 1.03", on_fail: "adjust print compensation, reprint", closes: [PAD-4, RB-TOL], src: "tolerances.md Phase-2 section; dims_r2.duct_offsets"}
      - {id: A2, tag: "ream heel neck", what: "ream the heel exit D0.8 neck from the cavity side (straight along -y); fish a wire through the D1.0 channel", tools: ["pin vise 0.8"], expect: "outer wall 0.60 stays intact; 4 x 0.21 litz + fish pass", pass: "no breakthrough, fish passes both bends", on_fail: "reprint; if the neck cracks again: widen wall in heel.py (CH_EXIT)", closes: [ARM-1R], src: "notes/heel.md build order; heel.py checks"}
      - {id: A3, tag: "cell dry fit", what: "dry-fit the real Renata ICP501233PA-02 in the printed tub; note where its leads/PCM exit", tools: [calipers], expect: "cell 35 x 12 x <=5.3 sits on the 0.3 VHB gap; exit hole 0.20 behind the cell end, rim-corner 0.36", pass: "cell flat, heel exit not covered", on_fail: "record lead exit; adjust J5/J4 route or CELL constants; re-run dock_route.py + heel.py", closes: [ARM-1R, PWR-I10], src: "reg-arm issue 1; physical issue 10"}
      - {id: A4, tag: "dock sample", what: "dock target sample: caliper the body + tab, identify contact order and magnet keying", tools: [calipers, multimeter], expect: "21.2 x 6.86 x 2.8 body, 5.03 tab (LCSC drawing)", pass: "fits the belly window; order recorded in gen.py + sub-dock-usb", on_fail: "update dims_r2.DOCK and shell_r2", closes: [DK-02, DK-03], src: "sub-dock-usb DK-02/03"}
      - {id: A5, tag: "exciter R/L", what: "exciter E1: LCR meter R and L at 1 kHz (3+ samples, two listings)", tools: [LCR meter], expect: "8 or 12 ohm; L 0.3-1.3 mH (model placeholders)", pass: "R and L recorded; L < ~1 mH keeps 200 kHz PWM", on_fail: "L >= 1 mH: PWM-rate fallback 100 kHz (sub-output issue 2); 12 ohm clears ECR-0005", closes: [ECR-0007], src: "sub-output issues 2, 3"}
      - {id: A6, tag: "gauge pin kit", what: "gauge pin kit: measure the 20G tube OD/ID and the pin gauges", tools: [calipers, "pin-gauge set"], expect: "tube OD 0.88-0.92, ID 0.59-0.62 [A ISO 9626]", pass: "computed worst duct stack <= 0.175 (with the pin chosen to the actual board hole: ~0.12)", on_fail: "micro-turned stepped pin (RPB-16 option B)", closes: [RPB-16], src: "reg-pod-body issue 16"}
      - {id: A7, tag: "VHB press coupon", what: "VHB coupon: a bare FR-4 coupon on VHB to a printed lid piece; 1.6 N press (163 g on the kitchen scale) on a dummy SW1 spot; optional 600k-press rig", tools: ["kitchen scale"], expect: "board deflection 1.4-20 um at 2 N (not visible); VHB 12-52 kPa vs 85 kPa design factor", pass: "no peel, no visible movement", on_fail: "back the switch (B back-stop) or a stiffer bond area", closes: [RPB-17], src: "sim/checks/sw1_press_fem.py; sub-ui issue 2"}
      - {id: A8, tag: "NiTi coupons", what: "NiTi coupons: wire 0.75/0.80/0.85 bend test at skin temperature, 100 on/off cycles; flare root under a loupe", tools: [loupe, "kitchen scale"], expect: "plateau ~200 MPa [A]; force >= 0.5 N at jaw opening", pass: "pick the wire; no root crack after 100 cycles", on_fail: "STRUT_START 3 -> 4 mm (ARM-5) or the 0.85 wire (ARM-2 B)", closes: [ARM-3, ARM-4, ARM-5], src: "reg-arm issues 3-5"}
      - {id: A9, tag: "dummy wear", what: "body + wear: E9/E10/E12 measures on her glasses; weighted dummy pair 2 h with 11.2-13.2 g per side", tools: ["printed dummies", "kitchen scale"], expect: "comfortable for 2 h; temple give E12", pass: "owner says yes", on_fail: "mass trims (PHYS-8D options B/C); set change ARM-2", closes: [ECR-0006, ARM-2, ARM-9, Q-A-PHYSICAL-FIRSTWINS], src: "physical issue 8; reg-arm 2, 9"}
      - {id: A10, tag: "FMAC read-back", what: "FMAC rounding read-back on any STM32U5 board (Nucleo-U575 if at hand, else at E10): FIR P=1, CLIPEN=1, 8 inputs", tools: ["U5 board", PC], expect: "TEST A1 under floor: 0,0,0,0,-1,-1,-1,-1; TEST A2: 0,0,1,1,-1,-1,-1,-2 (`python3 sim/fw/fmac_model.py --bench`)", pass: "matches floor (the firmware model)", on_fail: "change A1/A2 in fw/core/fmac_model.c + Python twin, re-run fwsim L0/L2/D17", closes: [FMAC-RM-UNKNOWNS], src: "backlog FMAC-RM-UNKNOWNS"}
  - id: B
    name: "Bare assembled board, unpowered"
    steps:
      - {id: B1, tag: "loupe inspection", what: "visual under the loupe: U3 balls, U1 QFN, Q1/Q2 (Nexperia land pattern), SW1, D5/D6, 0201 tombstones, R23 present, LED cathode mark on the pad board; mic hole clean", tools: [loupe, "pin gauges 0.60/0.70"], expect: "mic hole D0.65 press-fit: 0.60 enters, 0.70 does not", pass: "no bridge, no tombstone, hole in tolerance", on_fail: "photograph, rework with flux + iron or use board 2", closes: [OUT-4, PAD-8], src: "sub-debug-test step 0; SAI-15D"}
      - {id: B2, tag: "short checks, 6 meter pairs", what: "short checks, ohms then diode mode both polarities: TP4-TP5 (+3V0-GND), TP6-TP5 (VSYS-GND), J5-J4 (VBAT-GND), J3-J4 (DOCK_VBUS-GND) and the 6 neighbour pairs J3-J4, J4-J5, J1-J2, J2-J8, J12-J9, J10-J11 (test-access-map.svg)", tools: [multimeter], expect: "no pair < 5 ohm; J12-J9 ~15 kohm at 25 C (R18 5k1 + RT1 10k NTC, both to GND); others > 1 kohm in ohm mode, diode drops 0.3-0.8 V where a pin or body diode sits", pass: "no short, board 1 readings recorded as the reference for boards 2-3", on_fail: "J4-J5 = cell short; J3-J4 = dock supply short; J12-J9 = CC on TS; J2-J8 = 200 kHz into PB7; J1-J2 = exciter shorted: find the bridge under the loupe, wick", closes: [RB-4], src: "sub-debug-test step 1; reg-board issue 4"}
  - id: C
    name: "First power, current-limited, cell side"
    steps:
      - {id: C1, tag: "3.7 V @ 50 mA on J5/J4, +3V0", what: "bench supply 3.70 V, current limit 50 mA, on J5(+)/J4(-) (cell pads); blank MCU", tools: ["bench supply", multimeter], expect: "TP6 VSYS ~3.7 V; TP4 +3V0 2.955-3.045 V (SBVS338H); supply current: record (blank U575 in reset/ROM, few mA [A])", pass: "+3V0 in range, current < 15 mA [A], nothing warm", on_fail: "limit hit: lift R20 (LDO_OUT vs load), feed 3.0 V into TP4 at 30 mA to split; U3 battery POR needs VBAT > 3.46 V max", closes: [], src: "sub-debug-test step 2; sub-power +3V0"}
  - id: D
    name: "Programming: DFU first, SWD backup, boot stub"
    steps:
      - {id: D1, tag: "ROM DFU first flash (R1 tack)", what: "first flash: tack R1.1 PH3 (2.58, 3.85) to +3V0 C1.1 (6.92, 0.83) (both B), 5 V at 100 mA limit on J3/J4, USB D+/D- on J10/J11, power-cycle, dfu-util flash the board-alive image, remove the tack", tools: [iron, "USB cable", PC, dfu-util], expect: "ROM DFU enumerates (ST DFU 0483:df11) WITHOUT PA9 VBUS sense (DK-17D option B test)", pass: "image runs after the tack is removed", on_fail: "no enumeration: DK-17 is real: SWD on TP1/TP2/TP3/TP5 (probe purchase decision, DBG-1 C), then R24 at the next placement round (DK-17D option C)", closes: [DK-17, DBG-1], src: "sub-debug-test step 3; decisions-log DK-17D = B then C"}
      - {id: D2, tag: "HELLO + option bytes", what: "ST-HELLO + option-byte dump over USB CDC", tools: [pod_test.py], expect: "build id = git sha of the image; RDP 0; nSWBOOT0/nBOOT0 defaults", pass: "matches the build", on_fail: "re-flash; record option bytes (CV-8)", closes: [], src: "FWSIM rev1_telemetry; CV-8; HWC-12"}
      - {id: D3, tag: "SWD once", what: "SWD attach once while F is reachable (only if a probe exists)", tools: ["SWD probe (optional)"], expect: "IDCODE read", pass: "attach + halt", on_fail: "note it; DFU stays the path", closes: [], src: "sub-debug-test step 3"}
      - {id: D4, tag: "boot stub DFU, 2.95 V", what: "boot stub: jump to ROM DFU over USB and re-flash; repeat with 2.95 V on TP4 (R20 lifted); keep a DFU session > 160 s with the charger watchdog armed; with a cell fitted note charging pauses in DFU", tools: [PC, "bench supply"], expect: "enumeration + full DFU at 2.95 V (DS13737 Table 150 fn 1: functional to 2.7 V); charger watchdog does not reset U3 mid-session (stub writes WATCHDOG_SEL 11); charging pauses (PA2 drives TS high)", pass: "all three", on_fail: "USB at 2.95 V fails: higher-V LDO option (DK-06 B); watchdog fires: fix the stub order", closes: [PWR-I7, DBG-8], src: "sub-debug-test step 6; DK-06; PWR-I3"}
      - {id: D5, tag: "PB4 back-feed", what: "PB4 back-feed in reset and DFU: meter C13.1 (MIC_VDD) and TP10 (MIC_DATA)", tools: [multimeter, PPK2], expect: "record; ~60 uA class back-feed path (ECR-0013 F5)", pass: "recorded; Off-mode rule documented", on_fail: "firmware parks PB3/PB4; accept in reset/DFU only", closes: [SAI-11], src: "sub-audio-in issue 11"}
  - id: E
    name: "Peripherals with the firmware's self-tests (bare board, F still reachable)"
    steps:
      - {id: E1, tag: "clocks + mic-clock duty", what: "ST-CLK: LSE start, MSI-PLL lock, PLL1, HSI48+CRS, ADF kernel; scope MIC_CLK at R2.2 (B) and the SMPS node near L1", tools: [oscilloscope, pod_test.py], expect: "all ready, DWT-timestamped; MIC_CLK duty 48-52 % (spec R13/D13); SMPS ~3 MHz free-running (PROC-9)", pass: "duty in range, clocks locked", on_fail: "duty out: MDF fallback via TP8/TP9/TP10 (sub-audio-in issue 5)", closes: [SAI-5], src: "CV-4, CV-10; sub-debug-test step 4"}
      - {id: E2, tag: "rails + pins", what: "ST-RAILS + ST-PINS: VDDA from VREFINT, VBAT (ADC4) vs multimeter, VBUS, TS, die temp, I_SENSE idle offset", tools: [multimeter, pod_test.py], expect: "VDDA 2.955-3.045 V; VBAT within 1 % of the meter [A]; I_SENSE idle = R23 offset 3.0 mV +-0.3 mV (3.0 V x 1k / 1.001M) plus the Kelvin term", pass: "all plausibility rules pass (FWSIM-R58 ST-PINS)", on_fail: "R23 offset off: check R23 value / I_SENSE copper", closes: [], src: "FWSIM-R58; R23 1M (OUT-1B)"}
      - {id: E3, tag: "LED, button, printf", what: "UI: LED on a pad board (or any LED) on J7/J8; press SW1; printf on TP7 via the USB-UART", tools: ["USB-UART 3.3 V", multimeter], expect: "LED current (VSYS - VF)/2.2k: 0.45-0.50 mA at 3.7 V; +1.36 mA while pressed; PA0 high; TP7 text", pass: "LED from PB7, button edges logged", on_fail: "LED dark = reversed (PAD-8)", closes: [UI-7], src: "sub-debug-test step 5; sub-ui key numbers"}
      - {id: E4, tag: "USB stream", what: "ST-USB: CDC enumerates, 16-bit mic-rate stream for 60 s", tools: [PC, pod_test.py], expect: "0 gaps over 60 s; 3.2 Mbit/s (33 % of USB FS bulk)", pass: "0 gaps", on_fail: "drop to 8-bit or shorter frames; check D+/D- pads", closes: [], src: "FWSIM-R60; CV-5"}
      - {id: E5, tag: "I2C 400 kHz", what: "I2C2: read U3 at 0x6A at 100 and 400 kHz; scope SCL rise time", tools: [oscilloscope], expect: "ACK; rise time with R15/R16 10k + ~10-20 pF bus [A]: 85-170 ns (< 300 ns for 400 kHz); exercises the In2 SCL run", pass: "ACK at 400 kHz and rise < 300 ns", on_fail: "run 100 kHz (TIMINGR table, FWSIM-R27); check the In2 bridge", closes: [], src: "FWSIM-R27; sub-debug-test step 7"}
      - {id: E6, tag: "charger + first charge", what: "ST-CHG with the real cell: register dump at first power-up vs OTP defaults, write the register plan, read back; first charge SUPERVISED with a thermocouple on the cell", tools: [thermocouple, multimeter, pod_test.py], expect: "defaults ICHG 10 mA, VBATREG 4.20 V, ILIM 500 mA, TS_HOT 60 C (then the plan: TS_HOT 45 C...); ILIM 100 mA until enumeration; U3 ~0.3 W at start of CC; RT1 reads hot (1.8 mm from U3)", pass: "read-back = plan; cell <= 45 C; charge ends at VBATREG", on_fail: "stop charge; reg plan or placement (RT1 lever, PWR-I4)", closes: [PWR-I4, PWR-I12, PWR-I10], src: "FWSIM-R20, R62; CV-7; ECR-0009 item 3"}
      - {id: E7, tag: "bridge on resistor", what: "bridge on an 8-12 ohm RESISTOR on J1/J2 (no exciter): low level tones, ST-ZSWEEP at -12 dBFS; scope OUT_A/OUT_B edges for dead time", tools: [oscilloscope, "8-12 ohm resistor", pod_test.py], expect: "|Z| = R + 1.22 (Rds) + 0.1 (R21) within 2 % at -12 dBFS (selftest_lockin.py); dead time per knob 12.5-25 ns, no shoot-through spikes on the supply", pass: "|Z| within 2 %; no shoot-through", on_fail: "lift R21 to isolate the bridge; dead-time knob up", closes: [OUT-7], src: "sub-debug-test step 9; sim/checks/selftest_lockin.py"}
      - {id: E8, tag: "fault break", what: "fault break (FWSIM-R65): with the resistor load, step the load to ~2 ohm through a current-limited supply rail or command an over-range test tone; confirm the MDF out-of-limit break fires and its polarity/threshold; record the MDF kernel clock", tools: [oscilloscope, pod_test.py], expect: "TIM1 MOE cleared within 2 PWM periods [A], outputs to the safe state, BIF latched, event logged", pass: "break fires on both polarities of i*(2d-1); not on normal signals", on_fail: "fix BKOLD/threshold knobs; never ship without it (OUT-6 decided)", closes: [], src: "FWSIM-R65; sub-processing issue 6"}
      - {id: E9, tag: "PWM noise A/B", what: "ST-PWMAB: PWM-noise A/B at 200/400/800 kHz vs stopped, mic streaming", tools: [pod_test.py], expect: "20-85 kHz band power difference per rate", pass: "lowest rate under the mic floor chosen", on_fail: "keep 400/800 kHz; MP-01 mitigations", closes: [OUT-8], src: "FWSIM-R61; MP-01"}
      - {id: E10, tag: "cycle counts", what: "ST-CYC micro-benchmarks + DWT per-hop stats; FMAC read-back if A10 had no Nucleo", tools: [pod_test.py], expect: "cycles within the E1/E2 model bands (FWSIM-R47)", pass: "headroom >= the budget at the chosen clock", on_fail: "re-plan clock or algorithm (E2-ALGO)", closes: [FMAC-RM-UNKNOWNS], src: "FWSIM-R50; CV-2"}
  - id: F
    name: "Bond board to lid (gate G3), then the mic through the real duct"
    steps:
      - {id: F0, tag: "bond (gauge pin)", what: "physical.md steps 6-8: solder wires, VHB die-cut, gauge pin through bore into the board hole, bond", tools: ["pin gauge + 20G tube", "foam pad", "kitchen scale (~30 N press [A])"], expect: "duct offset <= 0.14 (pin chosen to the hole)", pass: "pin slides out freely after the press", on_fail: "peel before cure", closes: [], src: "physical.md steps 6-8; DBG-16"}
      - {id: F1, tag: "mic self-noise", what: "mic self-noise capture over USB: bridge on/off, SMPS vs LDO (REGSEL)", tools: [pod_test.py], expect: "LN-M01 margin 26.5 dB modelled (worst 15.5 dB)", pass: "no line above the floor in 20-96 kHz", on_fail: "series R + C on MIC_VDD (sub-audio-in issue 7)", closes: [SAI-7], src: "sim/noise smoke 2026-10-07"}
      - {id: F2, tag: "duct sweep 61 kHz", what: "duct sweep: 40 kHz HC-SR04 + a swept ultrasonic source at a fixed distance, pod vs bare-board reference", tools: ["ultrasonic source", pod_test.py], expect: "mean 20-96 kHz +5.9 dB re flush (MC p05 +1.2); resonance ~61 kHz, +18.4 dB (~+14 dB with the floor mesh)", pass: "resonance found; EQ notch constant set (O18 knob)", on_fail: "mesh position / duct (sub-audio-in 3, 13)", closes: [SAI-13], src: "acoustics MC60 2026-10-07 round 8"}
      - {id: F3, tag: "RSFLT 800 kHz", what: "RSFLT response at 800 kHz: swept tone D1 vs D2 decimation", tools: ["ultrasonic source"], expect: "record", pass: "decimation choice made", on_fail: "-", closes: [SAI-6], src: "sub-audio-in issue 6"}
      - {id: F4, tag: "whine check", what: "E11 whine: listen for SMPS / L1 whine, docked and undocked, RIGHT pod (dock magnets 5.5 mm from L1)", tools: [ears], expect: "nothing audible", pass: "silent", on_fail: "LDO mode during listening (REGSEL)", closes: [DK-11], src: "sub-dock-usb DK-11"}
  - id: G
    name: "Exciter and listening (gate G4)"
    steps:
      - {id: G1, tag: "exciter |Z|, sing", what: "exciter on J1/J2 via the arm; |Z| sweep low amplitude; listen for C14 'sing'", tools: [pod_test.py, ears], expect: "|Z| close to A5's LCR values; no audible sing", pass: "both", on_fail: "C14 swap (OUT-5); PWM rate", closes: [OUT-5, PAD-11], src: "sub-output issues 2, 5"}
      - {id: G2, tag: "E2 listening", what: "E2 listening: translated nature files through the exciter at the tragus; pick the algorithm variant", tools: [ears], expect: "spec B passes bat-call recall 0.83 in sim; slim B 0.65; A 0.39", pass: "owner picks", on_fail: "-", closes: [E2-ALGO, ECR-0007], src: "backlog E2-ALGO"}
  - id: H
    name: "Close the pod, then current and feel"
    steps:
      - {id: H1, tag: "puck fit, close", what: "puck selective fit (physical.md step 9), skin, close with tape (test build)", tools: [calipers], expect: "puck top -> skin 0.005-0.135", pass: "one click per press, none at rest", on_fail: "next shorter / longer puck", closes: [], src: "physical.md step 9"}
      - {id: H2, tag: "Off current", what: "Off current: Stop 2, PPK2 in series with the cell", tools: [PPK2], expect: "15.5-22.7 uA (off_D12) + R23 3.0 uA = 18.5-25.7 uA [derived]", pass: "<= ~26 uA", on_fail: "+1.36 mA = SW1 pre-pressed: refit the puck; else PB3/PB4 back-feed", closes: [PWR-I15], src: "sub-power off_D12; CV-1"}
      - {id: H3, tag: "dock, LED, pad force", what: "dock charge, LED, pad force T5 (kitchen scale under the pad)", tools: ["kitchen scale"], expect: "pad force >= 0.5 N worn (preload model)", pass: "all", on_fail: "set change (ARM-2)", closes: [], src: "physical.md step 14"}
  - id: I
    name: "Environment and wear (gate G5)"
    steps:
      - {id: I1, tag: "spray IPX4/5", what: "spray coupon IPX4 5 min, open along the rebate, inspect indicator tape; then IPX5; 3 open/rebond cycles", tools: ["spray nozzle", "indicator tape"], expect: "no water inside; mesh holds (Laplace ~2.7 kPa at 42 um)", pass: "dry inside", on_fail: "corner beads (RPB-13), mesh treatment, dock potting", closes: [], src: "docs/research/sealing-and-service.md"}
      - {id: I2, tag: "2 h wear", what: "2 h wear with the real pod pair, then a day", tools: [], expect: "comfortable; no rub", pass: "owner says yes", on_fail: "mass / force changes", closes: [ECR-0006], src: "ECR-0006; PHYS-8D"}
  - id: K
    name: "K4 two-board stack (P + M, ECR-0020/0021): each board alone, BM28 mate, dock, first charge (gates G6, G7)"
    steps:
      - {id: K1, tag: "M alone, unpowered", what: "board M bare (before any mate, cell, or head): meter on 0.1 ohm-resolution range, pads J3 VBUS / J4 GND / J5 BAT+ / J9 NTC / J7 LED+ / TP6 VSYS / TP4 +3V0 and BM28 J20 pins", tools: [multimeter, loupe], expect: "J4(GND) to J5(BAT+): R8+R9 = 2 Mohm 1% (reads 1.6-2.0 Mohm with U3 BAT leakage, never <1 Mohm); J9(NTC) to GND: RT1 10 kohm 1% = 9.9-10.1 k at 25 C (Murata NCP03XH103F05RL); J3(+) to J4 diode mode: PMEG3005EL D4 forward into R12+R13 = 200 kohm, 0.2-0.35 V, reverse OL; J7 to TP6: R14 2.2 kohm 1% (2.18-2.22 k); BM28 pin25 (BTN) to GND: R10 2.2 kohm 1%, pin15 (+3V0) to pin7 (SCL) and pin9 (SDA): R15/R16 10 kohm 1%; pin27 (VBUS_SENSE) to GND: R13 100 kohm 1%; pin5 (VBAT_SENSE) to GND: R9 1 Mohm 1% (parallel R8 path = open); R20 0R: LDO_OUT to TP4 under 0.5 ohm; +3V0 to GND >100 kohm (C21/C17/C18 charge, the reading climbs: not a short); no VBUS/VSYS/+3V0 to GND under 1 kohm", pass: "all within tolerance, no short", on_fail: "hot-air or reflow touch-up of the named 0201; U3 DSBGA-8 0.4 mm bridge suspected if VSYS/VBUS < 1 kohm to GND: microscope, do not power", closes: [K4-BRINGUP], src: "hw/pod/k4/pod_k4_M.net; bom_jlc_M.csv; sub-power.md"}
      - {id: K2, tag: "P alone, unpowered", what: "board P bare: U1 supply pins, BM28 J21 pins, TP1-TP3, TP7-TP9, J1/J2", tools: [multimeter, loupe], expect: "+3V0 (J21 pin15) to GND: no resistive short (>50 kohm; decoupling charges, the reading climbs); BOOT0 (U1 PH3) to GND: R1 10 kohm 1%; each TIM1 gate net to GND or +3V0 (R3-R6): 100 kohm 1% each; R21 0.1 ohm sense: 0.1 ohm +-1% (2-wire reads 0.2-0.4 ohm incl. leads: use the 4-wire/LCR) ; R23 1 Mohm; C14 22u/C4/C7 10u: LCR 1 kHz within +-20% of nominal minus DC-bias (unbiased); L1 2u2: 2.2 uH +-20% at 1 MHz (Murata DFE201610E-2R2M), DCR <= ~0.1 ohm [A]; Q1/Q2 diode mode: body diode 0.5-0.8 V one way, OL the other; J1-J2 across the exciter pads: open (no exciter yet)", pass: "no short; passives within tolerance; U1 pin 1 orientation matches pin1_expected.png", on_fail: "U1 QFN-48 bridging: inspect/reflow; wrong-rotation part (pin1 check B5 in .pcba-workflow/k4-release/gate.yaml)", closes: [K4-BRINGUP], src: "hw/pod/k4/pod_k4_P.net; bom_jlc_P.csv; gate.yaml B5"}
      - {id: K3, tag: "M alone, powered 3.0 V", what: "M alone: inject 3.00 V (current limit 20 mA) at TP4 (+3V0) / GND, and again 4.0 V at J5 (BAT+, cell stand-in, limit 20 mA, no cell)", tools: ["bench supply", multimeter, PPK2], expect: "at 3.0 V into TP4: current < 5 uA once caps settle (no load on M except pull-ups to idle MCU-less inputs, R10 not driven, mic VDD unpowered: PA5 on P); at 4.0 V on J5: U3 BAT FET path: VSYS (TP6) = about 4.0 V minus 55 mohm x load; U4 LDO_OUT (R20 side) = 3.00 V +-1% (TPS7A2030PDQNR fixed 3.0 V, SBVS338H) with +3V0 0.00-0.01 V drop across R20; supply current 6.5 uA LDO Iq + 3.2 uA U3 ship/battery-only Iq [datasheet typ] -> 8-20 uA total", pass: "LDO 2.97-3.03 V; idle current < 30 uA", on_fail: "LDO off: check U4 EN to VSYS and C17/C18 orientation-free; current > 100 uA: U6/D5 reverse leakage or flux residue (clean, bake)", closes: [K4-BRINGUP, PWR-I14], src: "sub-power.md U4_noise_iq, U3_fet_iq; TPS7A2030 SBVS338H"}
      - {id: K4, tag: "BM28 mate, continuity, reversal", what: "mate P onto M normal (J21 into J20) with no power, then separately a DRY reversed attempt on the bare connectors only if the housings allow it (no board stress, 10-cycle budget: this uses 1 of 10 per connector)", tools: [multimeter, loupe], expect: "normal mate: every signal pin continuity P-pin to M-pin <1 ohm per contact (Hirose 5 A power tabs 31-34 30 mohm [T catalog]); BM28 pins 31-34 and 15 and 30 all one +3V0 net; the 15 GND pins common; mate ordering from gen.py BM28_PINS (signals on odd pads 1-13 and 19-29, GND on neighbours). Reversed-mate table (pad n against pad n+-15, derived from gen.py): 13 pairs signal-GND, 1 pair +3V0-+3V0 (15<->30, plus the four tabs 31-34 pairwise), 1 pair GND-GND (2<->17): +3V0 to GND measured on the reversed stack must NOT read below 100 kohm and no two different non-GND nets may touch; but 13 signals shorted to GND is expected: so a reversed stack must stay UNPOWERED. After a normal mate: +3V0 (TP4) to GND still >100 kohm, VSYS to GND still >50 kohm", pass: "no non-GND/non-GND short in either orientation, all 30+4 contacts continuous when mated normally", on_fail: "open signal: reseat once (cycle budget 10); persistent: reflow J20/J21 pads under the housing (hot air 260 C max, Hirose BM28 sheet) or swap P/M", closes: [K4-BRINGUP, K4-BM28-REV], src: "hw/pod/k4/gen.py BM28_PINS comment (K4-BM28-REV 2026-10-08)"}
      - {id: K5, tag: "mated stack powered, current-limited", what: "mated P+M, no cell: bench 3.0 V on TP4 (+3V0) via PPK2 source mode, limit 20 mA, no firmware; then SWD-flash the boot stub (as D2-D4)", tools: [PPK2, "ST-LINK/SWD [A]", multimeter], expect: "U1 unflashed Stop/Run: draw < 1 mA, rising to ~5-15 mA only in Run at 160 MHz (spec off_D12 Off 15.5-22.7 uA is only for the flashed Stop 2 state: H2); VCAP/VDD11 rail from the internal SMPS reads 1.1 V +-5% at the C8 side (STM32U575 RM0456 SMPS) after the stub starts it; HSE-less LSE 32.768 kHz at Y1 (scope on OSC_OUT, 7 pF load: C11/C12 8.2 pF C0G, CL = 8.2/2+~3 = 7.1 pF)", pass: "boot stub runs, SWD ID read, 1.1 V rail ok, no part above 40 C by finger", on_fail: "current > 30 mA: power off, thermal camera/finger-check U1 and U4 for the hot part; 0 mA: BOOT0 wiring (R1 to PH3), SWD pins", closes: [K4-BRINGUP, D2], src: "sub-processing.md; docs/build/bringup.yaml D2-D4"}
      - {id: K6, tag: "mic filter R30 check", what: "mated stack alive: mic U2 powered via PA5 (MIC_VDD, pin1) with R30 33 ohm in series to U2 VDD (C13 100n at the mic), 4 MHz PDM clock (PB3) on", tools: [oscilloscope, multimeter], expect: "DC across R30: I_mic x 33 ohm = 1.35 mA x 33 = 45 mV (+-15%: 38-52 mV) with the clock running; at the mic VDD pad ripple at the 4 MHz clock < 5 mV pk-pk (R30+C13 corner 1/(2 pi 33 ohm 70 nF derated) = 69 kHz, 4 MHz about 35 dB down: gen.py R30 comment); MIC_VDD pin to U2 VDD resistance power-off 31.4-34.7 ohm (33 ohm 5%, 0402WGF330JTCE); hum/ultrasound in the PDM record: noise floor within 3 dB of the same record with R30 shorted by tweezers (only if the 3 dB budget is violated, K4 noise fix ECR-0020 rev 5)", pass: "45 mV +-15% drop, ripple < 5 mV pp, no 4 MHz tone in the FFT", on_fail: "drop > 60 mV: mic fault or short at C13; ripple high: C13 missing/cracked (0201 flex crack): replace; keep the R30 0402 (hand-solderable) as the tuning knob", closes: [K4-BRINGUP], src: "gen.py R30 L231; ECR-0020 rev 5; SPH0641LU4H-1 datasheet"}
      - {id: K7, tag: "L1 acoustic buzz listening", what: "P+M powered at 3.0 V (PPK2) running the boot stub through its modes: Run, Sleep, Stop 2, SMPS on/off; listen at 50 mm with an ear and with the board's own mic (record 10 s each, 4 MHz PDM, 20 Hz-100 kHz FFT)", tools: [ears, "stethoscope tube [A]", "mic record via fw/tools/pod_test.py"], expect: "no tone 20 Hz-20 kHz above the quiet-room floor: L1 (Murata DFE201610E 2.2 uH) switches at about 3 MHz with burst skipping; a burst-mode envelope below 20 kHz is the audible risk: expect none at Run load, possible faint tone only at Stop-2 SMPS-off-to-on handoffs; ceramic piezo (C8/C9 2u2 10 V X5R 0402/0201) 'sing' shows up as a tone at the load-step rate; FFT peaks in 20-100 kHz must be < 6 dB above the quiet-room record taken with P unpowered", pass: "inaudible at 50 mm; FFT no tone > 6 dB over floor", on_fail: "tone found: log its frequency; options (owner decides): switch SMPS to forced-PWM in Sleep, swap C8 to a 0603 or stack C8 with a 1u, raise load via firmware dummy; 3 options with recommendation to owner", closes: [K4-BRINGUP, OUT-5], src: "spec D11 (self-noise no louder than ambient); sub-output.md; RM0456 SMPS"}
      - {id: K8, tag: "dock pads + magnetic head", what: "no cell yet: fit head C5126845 (Xinyangze YZP0048-20048-04025-03, 4P, Extended stock 46 on 2026-10-08) against the four ENIG pads J3 VBUS / J4 GND / J10 D+ / J11 D- on M, N52 D2.5x1.0 magnets in the pod (ECR-0021); first caliper the head sample (K4-MAG-HEAD: magnet pitch guess 13.2 mm [T], polarity, stroke, tip dia)", tools: ["kitchen scale 1 g", multimeter, calipers, "second magnet or compass"], expect: "magnet attach force at full seat: idealised pull about 2.2 N vs 1.18 N spring -> net hold +1.0 N (sim/checks/dock_pull.py [T]); keying: reversed head is rejected or repelled; contact resistance per pad (head pin to pod pad, 2-wire) < 0.5 ohm [A] (head spec 50 mohm class + ENIG); pad-to-pad isolation > 10 Mohm (500 V megger not needed); VBUS pad to GND with head cable open: still R12+R13 = 200 kohm as K1; with 5 V from a current-limited supply (limit 50 mA) through the head: VBUS at U3 IN pin = 5.0 V minus PMEG3005EL drop (0.295 V at 100 mA, ~0.2 V at 10 mA) = about 4.75-4.85 V; C15 (4u7 25 V) no ripple; D5 TPD1E10B06 leakage < 1 uA; VBUS_SENSE (BM28 pin27) = VBUS/2 = 2.4 V (R12/R13 100k/100k) before the diode drop correction", pass: "all 4 contacts hold under shake, reverse rejected, 5 V arrives at U3 IN", on_fail: "pad lift or no contact: shim, check pad plating; polarity wrong: flip magnet in its pocket (epoxy not yet set); D+/D- swapped: re-order head wires, never at the pod", closes: [K4-BRINGUP, DK-02, K4-MAG-HEAD], src: "docs/research/k4-dock.yaml; ECR-0021; sub-dock-usb.md"}
      - {id: K9, tag: "first charge (fire-safe, logged)", what: "first charge of the real 130 mAh cell (ICP401230UPR): cell sits in a metal/ceramic dish or LiPo bag, outdoors-ready on a non-flammable surface, extinguisher (sand/Class D or CO2) within reach, supervised; 5 V bench supply limit 100 mA; thermocouple (K-type [A]) taped to the cell, a second on U3; log VBAT, VSYS, VBUS, I_in and temperature every 30 s for the first 1 h (PPK2 + meter + sheet); no firmware: U3 default ICHG 10 mA = 0.08 C, VBATREG 4.20 V, safety timer 6 h (SLUSE99C)", tools: [PPK2, "bench supply 100 mA limit", "thermocouple + logger [A]", "fireproof bag/dish", timer], expect: "start: cell 3.0-4.1 V (record, never charge a cell < 2.5 V); VSYS = 4.5 V (BQ25180 default SYS regulation with VBUS present); I_in = ICHG 10 mA + SYS load (LDO 6.5 uA + MCU stub up to ~10 mA) = 15-30 mA at 5 V; VBAT rises monotonic, CC at 10 mA until 4.20 V +-0.05 V then CV taper; cell temperature rise <= +3 K above ambient at 10 mA (expect ~0 K), U3 <= +10 K; charge LED on J7/J8 via R14 2.2 k from VSYS: 4.5 V - Vf(2.0 V) / 2.2 k = about 1 mA (visible); 6 h timer ends the charge at about 60 mAh (below full: expected, not a fault)", pass: "no abnormal heat, VBAT monotonic, VSYS 4.5 V +-0.1 V, cell < 30 C absolute, ends clean", on_fail: "ABORT at: cell > 40 C absolute, any swelling, smell, VBAT > 4.25 V, I_in > 60 mA: unplug the head FIRST, cell into the dish, 24 h watch, bin as hazardous; do not retry without a root cause and an ECR", closes: [K4-BRINGUP, PWR-I4], src: "sub-power.md U3_defaults, charge_current; SLUSE99C §8.5.1; owner safety review A-SAFETY-REVIEW"}
      - {id: K10, tag: "SW1 + glue post (final build only)", what: "after K1-K9 pass and the stack is in its tub: SW1 click check on the live board, then the gap-filling epoxy post per docs/build/k4-assembly.md step 'Do (gap-filling post, ECR-0023 add.2)'", tools: ["multimeter or scope on BTN", "10 uL syringe", "30-min low-shrink epoxy", clamp], expect: "SW1 (KMT022NGJLHS): BTN (BM28 pin25) open >1 Mohm unpressed; pressed: BTN pulled to +3V0 through SW1 with R10 2.2 kohm to GND, so BTN = 3.0 V (the 2.2 kohm only draws 1.4 mA while pressed, >= 1 mA contact wetting); one click at 1.2-2.0 N, none at rest (sw1_press_fem: 1.4-20 um board deflection, VHB 12-52 kPa vs 85 kPa limit); then 10 uL epoxy dab on the tub post (post printed 0.59 short of U1: air gap 0.05-1.125 mm): close within 15 min, clamp 1 h flat, no press on SW1 for 24 h; afterwards epoxy skirt only at the post, nothing on the BM28, SW1 still clicks once per press and BTN still toggles", pass: "click + BTN levels as listed, post bonded, no epoxy on connectors", on_fail: "SW1 no click: puck length too long (selective fit, step H1); epoxy on SW1/BM28: warm to 60-80 C and lift, do not scrape; dry-close builds get no dab", closes: [K4-BRINGUP, K4-SW1-PRESS], src: "docs/build/k4-assembly.md; ECR-0023 add.2; sw1_press_fem.py"}
