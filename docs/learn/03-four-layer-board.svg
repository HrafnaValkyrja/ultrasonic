<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Cross-section of the 0.8 mm four-layer pod board, drawn to proportion except for copper thickness: parts on both outer layers, a solid ground plane on layer 2, power and a few signals on layer 3. A top-layer trace is a microstrip 0.1 mm above the ground plane, so its return current flows directly beneath it. An escape via takes a chip pad down to layer 3 through a clearance hole in the ground plane; a through via joins all layers; the mic's sound port is a hole through the whole board." font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7a55"/></marker>
    <pattern id="fr4" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ece5cd"/><path d="M0,8 L8,0" stroke="#ddd4b4" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="780" rx="14" fill="#fbfaf7"/>
  <text x="36" y="40" font-size="20" font-weight="700" fill="#1f2328">A 4-layer board: four copper sheets in 0.8 mm of fibreglass</text>
  <text x="36" y="64" font-size="13.5" fill="#57606a">Cross-section of the pod board. Dielectrics to scale (500 px ≈ 0.8 mm); copper drawn thicker than real (35 µm outer, ~18 µm inner). Thicknesses are JLC-typical.</text>

  <!-- dielectrics -->
  <rect x="120" y="200" width="780" height="60" fill="url(#fr4)"/>
  <rect x="120" y="266" width="780" height="286" fill="url(#fr4)"/>
  <rect x="120" y="558" width="780" height="60" fill="url(#fr4)"/>
  <!-- copper layers (drawn as segments) -->
  <g fill="#c8883a">
    <!-- L1 -->
    <rect x="140" y="190" width="40" height="10"/><rect x="300" y="190" width="30" height="10"/><rect x="360" y="190" width="30" height="10"/><rect x="480" y="190" width="30" height="10"/>
    <rect x="600" y="190" width="40" height="10"/><rect x="690" y="190" width="30" height="10"/><rect x="778" y="190" width="10" height="10"/>
    <!-- L2 ground plane with antipad around escape via and mic port -->
    <rect x="120" y="260" width="84" height="6"/><rect x="236" y="260" width="68" height="6"/><rect x="326" y="260" width="574" height="6"/>
    <!-- L3 power plane + an isolated signal segment -->
    <rect x="120" y="552" width="84" height="6"/><rect x="236" y="552" width="68" height="6"/><rect x="310" y="552" width="100" height="6" fill="#a86a28"/><rect x="420" y="552" width="480" height="6"/>
    <!-- L4 -->
    <rect x="150" y="618" width="50" height="10"/><rect x="240" y="618" width="50" height="10"/><rect x="600" y="618" width="40" height="10"/><rect x="700" y="618" width="80" height="10"/>
  </g>

  <!-- parts -->
  <rect x="290" y="160" width="230" height="30" rx="3" fill="#2f2f33"/>
  <text x="405" y="180" font-size="12.5" fill="#ffffff" text-anchor="middle">MCU (QFN-48), pads underneath</text>
  <rect x="686" y="172" width="38" height="18" rx="2" fill="#b98b54"/><text x="705" y="164" font-size="11" text-anchor="middle" fill="#1f2328">0402 cap</text>
  <rect x="150" y="628" width="140" height="26" rx="3" fill="#2f2f33"/>
  <text x="220" y="646" font-size="12" fill="#ffffff" text-anchor="middle">mic (bottom side)</text>

  <!-- mic port hole -->
  <rect x="205" y="190" width="30" height="438" fill="#fbfaf7"/>
  <path d="M220,112 L220,624" stroke="#1baf7a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="40" y="118" font-size="11.5" fill="#1a7a55" font-weight="700">sound in from the pod wall:</text>
  <text x="40" y="133" font-size="11.5" fill="#1a7a55">0.8 mm port hole through</text>
  <text x="40" y="148" font-size="11.5" fill="#1a7a55">the board, to the mic</text>

  <!-- escape via: MCU pad (L1 x300-330) down to L3 segment -->
  <rect x="310" y="190" width="10" height="368" fill="#c8883a"/><rect x="313" y="190" width="4" height="368" fill="#fbfaf7"/>
  <text x="330" y="330" font-size="12" fill="#1f2328" font-weight="700">escape via</text>
  <text x="330" y="347" font-size="11.5" fill="#1f2328">an MCU pad dives to L3,</text>
  <text x="330" y="362" font-size="11.5" fill="#1f2328">passing through a clearance</text>
  <text x="330" y="377" font-size="11.5" fill="#1f2328">hole ("antipad") in the GND plane</text>

  <!-- through via -->
  <rect x="615" y="190" width="10" height="438" fill="#c8883a"/><rect x="618" y="190" width="4" height="438" fill="#fbfaf7"/>
  <text x="635" y="440" font-size="12" fill="#1f2328" font-weight="700">through via</text>
  <text x="635" y="457" font-size="11.5" fill="#1f2328">0.15 mm plated hole; connects</text>
  <text x="635" y="472" font-size="11.5" fill="#1f2328">only the layers whose copper</text>
  <text x="635" y="487" font-size="11.5" fill="#1f2328">touches it (here L1 → L4)</text>

  <!-- microstrip -->
  <line x1="740" y1="176" x2="828" y2="176" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#b)"/>
  <text x="836" y="180" font-size="11.5" fill="#2a78d6">signal on a 0.1 mm trace</text>
  <line x1="828" y1="280" x2="740" y2="280" stroke="#e34948" stroke-width="2.4" marker-end="url(#r)"/>
  <text x="700" y="300" font-size="11.5" fill="#e34948">return current flows in L2 directly under the trace:</text>
  <text x="700" y="315" font-size="11.5" fill="#e34948">a microstrip, loop area ≈ trace length × 0.1 mm</text>

  <!-- layer labels -->
  <g font-size="13" fill="#1f2328">
    <text x="915" y="200" font-weight="700">L1 top</text><text x="985" y="200">parts, short signals</text>
    <text x="915" y="236" fill="#57606a">prepreg ≈ 0.1 mm</text>
    <text x="915" y="268" font-weight="700">L2</text><text x="945" y="268" font-weight="700" fill="#1a7a55">solid GROUND plane</text>
    <text x="915" y="415" fill="#57606a">core ≈ 0.5 mm</text>
    <text x="915" y="560" font-weight="700">L3</text><text x="945" y="560">+3V0 plane + a few signals</text>
    <text x="915" y="594" fill="#57606a">prepreg ≈ 0.1 mm</text>
    <text x="915" y="628" font-weight="700">L4 bottom</text><text x="1005" y="628">parts</text>
  </g>

  <!-- why box -->
  <rect x="36" y="672" width="1128" height="96" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
  <text x="54" y="696" font-size="14" font-weight="700" fill="#1f2328">Why four layers here, not two</text>
  <text x="54" y="718" font-size="12.5" fill="#1f2328"><tspan font-weight="700">Escape:</tspan> 48 pads at 0.5 mm pitch with ~2 mm between the chip and the board edge. Many pads can only leave by diving through a via to a layer with room.</text>
  <text x="54" y="738" font-size="12.5" fill="#1f2328"><tspan font-weight="700">Return paths:</tspan> with a plane 0.1 mm under every trace, the 200 kHz bridge current and 3 MHz SMPS ripple close their loops locally instead of across the mic.</text>
  <text x="54" y="758" font-size="12.5" fill="#1f2328"><tspan font-weight="700">Supply:</tspan> the GND/+3V0 plane pair is a low-inductance distribution network, and ~20 pF of near-ideal decoupling for free (0.5 mm core over 20 × 11.5 mm).</text>
</svg>
