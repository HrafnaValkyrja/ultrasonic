# Design items and the relations between them (tools/plm.py). Hand-kept: when a new interface appears,
# add a relation here in the same commit. Watches: see tools/plm.py docstring.
# Items = the big-picture docs (docs/system/*), each owning the source content it summarises.
# 2026-10-07: watches follow the CURRENT design (hw/current.yaml = Phase 2, ECR-0018): placement hw/pod/draft_r2/placement.yaml
# (yaml: watches), routed board hw/pod/draft_r2/out/routed.kicad_pcb, shell constants hw/mech/dims_r2.py + solids hw/mech/shell_r2.py,
# BOM hw/pod/bom_jlc_mz2.csv; net:/ref:/block: come from the SKiDL build with the MZ-2 package set. Rev G/F files are reference only.

items:
  SPEC:
    kind: requirement
    title: Spec (source of truth)
    doc: docs/spec.md
    owns: [file:docs/spec.md]
  WHOLE:
    kind: whole
    title: The product on one page
    doc: docs/system/00-whole.md
    owns: ['grep:docs/spec.md::\b[DO][0-9]+\b']
  INTEGRATION:
    kind: integration
    title: Integration map (generated)
    doc: docs/system/integration-map.md
    owns: [file:hw/pod/gen.py, file:hw/pod/system_map.py, file:hw/current.yaml]
  PHYSICAL:
    kind: physical
    title: Physical integration, stack-up, assembly
    doc: docs/system/physical.md
    owns: [file:hw/mech/frame.py, "sym:hw/mech/dims_r2.py::X0", "sym:hw/mech/dims_r2.py::Y_IN", "sym:hw/mech/dims_r2.py::Z1", "sym:hw/mech/dims_r2.py::CAV", "sym:hw/mech/dims_r2.py::CELL", "sym:hw/mech/dims_r2.py::PCB",
           "sym:hw/mech/dims_r2.py::B_GAP", "sym:hw/mech/dims_r2.py::VHB_T", file:docs/build/tolerances.md]
  SUB-POWER:
    kind: subsystem
    title: Cell, charger, power path, LDO, sensing
    doc: docs/system/sub-power.md
    owns: [block:CHARGER, block:LDO, block:VBAT_SENSE, block:CELL_PADS]
  SUB-AUDIO-IN:
    kind: subsystem
    title: Ultrasonic mic, port, PDM capture
    doc: docs/system/sub-audio-in.md
    owns: [block:MIC, "sym:hw/mech/dims_r2.py::MIC", "sym:hw/mech/dims_r2.py::DUCT_D"]
  SUB-PROCESSING:
    kind: subsystem
    title: MCU, core SMPS, clocks, firmware
    doc: docs/system/sub-processing.md
    owns: [block:MCU, block:CORE_SMPS, block:CLOCK, "glob:sim/dsp/*.py"]
  SUB-OUTPUT:
    kind: subsystem
    title: H-bridge, exciter, self-test sense
    doc: docs/system/sub-output.md
    owns: [block:BRIDGE, block:SELFTEST]
  SUB-DOCK-USB:
    kind: subsystem
    title: Magnetic dock, USB, ESD, DFU
    doc: docs/system/sub-dock-usb.md
    owns: [block:DOCK_USB, "sym:hw/mech/dims_r2.py::DOCK"]
  SUB-UI:
    kind: subsystem
    title: Button and power LED
    doc: docs/system/sub-ui.md
    owns: [block:UI, "sym:hw/mech/dims_r2.py::SW", "sym:hw/mech/dims_r2.py::POCKET", "sym:hw/mech/shell_r2.py::puck", file:hw/padboard/gen.py]
  SUB-DEBUG-TEST:
    kind: subsystem
    title: SWD, test pads, test hooks, self-test
    doc: docs/system/sub-debug-test.md
    owns: [block:DEBUG, ref:R20, block:SELFTEST]
  REG-POD-BODY:
    kind: region
    title: Housing, retention, dock bay, sealing
    doc: docs/system/reg-pod-body.md
    owns: [file:hw/mech/shell_r2.py, file:hw/mech/dims_r2.py, file:hw/mech/blade.py, file:hw/mech/styles.py]
  REG-BOARD:
    kind: region
    title: The PCB (outline, faces, floorplan, routing)
    doc: docs/system/reg-board.md
    owns: [file:hw/pod/draft_r2/placement.yaml, file:hw/pod/draft_r2/out/routed.kicad_pcb, "sym:hw/pod/place.py::rules", "glob:hw/lib/pod.pretty/*.kicad_mod"]
  REG-ARM:
    kind: region
    title: NiTi arm, heel, strut, wire path
    doc: docs/system/reg-arm.md
    owns: [file:hw/mech/heel.py, file:hw/mech/frame.py, file:sim/checks/niti_arm_real.py]
  REG-PAD:
    kind: region
    title: Transducer cup, contact face, pad board
    doc: docs/system/reg-pad.md
    owns: [file:hw/mech/pad.py, file:hw/padboard/gen.py, file:hw/padboard/mech.py]
  COST:
    kind: cost
    title: BOM and order cost
    doc: docs/build/bom.md
    owns: [file:docs/build/bom.py, file:hw/pod/bom_jlc_mz2.csv]

relations:
  # ---------------------------------------------------------------- electrical interfaces (from the schematic)
  - id: R-PWR-OUT-RAIL
    a: SUB-POWER
    b: SUB-OUTPUT
    what: "+3V0 feeds the bridge P sources; ~0.32-0.33 A peaks (interfaces.py rails 326 mA, 2026-10-02) vs U4 300 mA (ECR-0005), buffered by C14; Phase 2: U4.1->Q1.4/Q2.4 40.4/39.5 mohm through the In2 +3V0 plane (sim/noise/out_r2/budget.json dc_rail_paths_mohm, 2026-10-07)"
    watch: [net:+3V0, ref:U4, ref:C14, ref:Q1, ref:Q2]
  - id: R-PWR-PROC
    a: SUB-POWER
    b: SUB-PROCESSING
    what: "MCU supply (+3V0), VBAT/TS sensing on PA4/PA2, charger I2C PB13/PB14 (R15/R16 10k) and IRQ CHG_INT on PA15 using the MCU internal pull-up (no R17; PB5 strapped to GND against the UCPD dead-battery pull-down, ECR-0013 S1)"
    watch: [net:+3V0, net:VBAT_SENSE, net:TS, net:I2C_SCL, net:I2C_SDA, net:CHG_INT]
  - id: R-PWR-DOCK
    a: SUB-POWER
    b: SUB-DOCK-USB
    what: "dock DOCK_VBUS (J3, D5 TPD1E10B06 ESD at the contact) through D4 into VBUS = charger input (C15 4.7 uF 25 V, R12/R13 dock sense)"
    watch: [net:VBUS, net:DOCK_VBUS, ref:D4, ref:U3]
  - id: R-PWR-UI
    a: SUB-POWER
    b: SUB-UI
    what: VSYS feeds the LED through R14
    watch: [net:VSYS, ref:R14]
  - id: R-PWR-DEBUG
    a: SUB-POWER
    b: SUB-DEBUG-TEST
    what: R20 LDO link, TP4 3V0, TP6 VSYS
    watch: [net:LDO_OUT, ref:R20, ref:TP4, ref:TP6]
  - id: R-AUDIO-PROC
    a: SUB-AUDIO-IN
    b: SUB-PROCESSING
    what: mic supply from PA5, PDM clock PB3 (via R2) and data PB4 (ADF1)
    watch: [net:MIC_VDD, net:MIC_DATA, net:MIC_CLK, ref:R2, ref:U2]
  - id: R-PROC-OUT
    a: SUB-PROCESSING
    b: SUB-OUTPUT
    what: "TIM1 complementary PWM: leg A CH1/CH1N PA8/PA7, leg B CH3/CH3N PA10/PB15 (AF1, ECR-0003); bridge current sense I_SENSE on PA6 (ADC1_IN11)"
    watch: [net:GA_P, net:GA_N, net:GB_P, net:GB_N, net:I_SENSE]
  - id: R-PROC-DOCK
    a: SUB-PROCESSING
    b: SUB-DOCK-USB
    what: "USB FS PA11/PA12, VBUS sense PA1 (CC not sensed since Rev F; Rd R18 + J12 stay until ECR-0019 (O31) moves Rd to the head; ILIM by enumeration)"
    watch: [net:USB_DP, net:USB_DM, net:VBUS_SENSE, net:CC, ref:R18]
  - id: R-PROC-UI
    a: SUB-PROCESSING
    b: SUB-UI
    what: button on PA0 (WKUP1), LED sink on PB7
    watch: [net:BTN, net:LED_K]
  - id: R-PROC-DEBUG
    a: SUB-PROCESSING
    b: SUB-DEBUG-TEST
    what: "SWD PA13/PA14, NRST, BOOT0 (R1 pad = DFU tack point), printf on PB6 (TP7), MDF mic-fallback dots TP8 PB8 / TP9 PB1 / TP10 MIC_DATA; ROM loader USART1_RX pin PA10 is now GB_P, held high by R5 + the loader pull-up (R11 gone); PA9 TX is NC"
    watch: [net:SWDIO, net:SWCLK, net:NRST, ref:R1, net:DBG_TX, net:MDF_CCK, net:MDF_SDI]
  - id: R-OUT-DEBUG
    a: SUB-OUTPUT
    b: SUB-DEBUG-TEST
    what: self-test shunt R21 and filter R22/C22 (exciter |Z| over USB)
    watch: [net:BRIDGE_RTN, block:SELFTEST]
  # ---------------------------------------------------------------- electrical <-> physical
  - id: R-SMPS-BOARD
    a: SUB-PROCESSING
    b: REG-BOARD
    what: "MCU SMPS loop on U1's face, tight: VLXSMPS -> L1 (2.2 uH, DCR < 200 mohm, ISAT > 0.5 A) -> VDD11 C8/C9 (2x2.2 uF >= 10 V); C7 10 uF at VDDSMPS (DS13737 Rev 10 p.153; MZG-05/06); >= 10 mm from the mic (MZG-04). Phase 2: all on B, L1 at board (15.65, 7.0), mic at (2.65, 6.0)"
    watch: ["yaml:hw/pod/draft_r2/placement.yaml::L1", "yaml:hw/pod/draft_r2/placement.yaml::C7", "yaml:hw/pod/draft_r2/placement.yaml::C8", "yaml:hw/pod/draft_r2/placement.yaml::C9", net:VLXSMPS, net:VDD11, ref:L1]
  - id: R-CLOCK-BOARD
    a: SUB-PROCESSING
    b: REG-BOARD
    what: "LSE crystal Y1 + C11/C12 beside PC14/PC15 on U1's face, short symmetric traces, no vias, guarded (A3 clock doc)"
    watch: ["yaml:hw/pod/draft_r2/placement.yaml::Y1", "yaml:hw/pod/draft_r2/placement.yaml::C11", "yaml:hw/pod/draft_r2/placement.yaml::C12", net:LSE_IN, net:LSE_OUT, ref:Y1]
  - id: R-UI-BOARD
    a: SUB-UI
    b: REG-BOARD
    what: "SW1 on F on the board centre line under the lid plunger (O16-5/7); board stiffness under the press; one-face Phase-2 layout keeps SW1 alone on F"
    watch: ["yaml:hw/pod/draft_r2/placement.yaml::SW1", ref:SW1, net:BTN]
  - id: R-AUDIO-BOARD
    a: SUB-AUDIO-IN
    b: REG-BOARD
    what: "mic U2 on B at board (2.65, 6.0) rot 90, its 0.65 mm port NPTH at (1.90, 6.0) through the board (Port0.65 footprint, 2026-10-07) (ECR-0011; Phase 2 routed board)"
    watch: ["yaml:hw/pod/draft_r2/placement.yaml::U2", ref:U2]
  - id: R-AUDIO-BODY
    a: SUB-AUDIO-IN
    b: REG-POD-BODY
    what: "Phase 2 sealed duct (O24 option B): reamed D1.0 lid bore + D1.0 VHB hole across the 0.30 F gap onto the board's D0.65 port NPTH (board 1.90 = pod 32.45; dims_r2 MIC is read from the routed board, gauge pin locates at bonding: worst 0.14 <= 0.175 mm (D0.65 press-fit 0.60-0.70, 2026-10-07)); interfaces.py mic-port offset 0.000 mm; acoustics phase2_r2 (docs/sim/acoustics.yaml)"
    watch: ["sym:hw/mech/dims_r2.py::MIC", "sym:hw/mech/dims_r2.py::PCB", "sym:hw/mech/dims_r2.py::DUCT_D", "sym:hw/mech/dims_r2.py::board_mic", "sym:hw/mech/dims_r2.py::duct_offsets", "yaml:hw/pod/draft_r2/placement.yaml::U2", "sym:hw/mech/shell_r2.py::lid_base", "grep:hw/pod/gen.py::Knowles_LGA-5", "file:hw/lib/lcsc/lcsc.pretty/Knowles_LGA-5_3.5x2.65mm_Port0.6.kicad_mod"]
  - id: R-UI-BODY
    a: SUB-UI
    b: REG-POD-BODY
    what: "switch SW1 on F in a 4.3 x 3.1 lid pocket under a printed puck + silicone skin (pod x 49.05 = board x 18.5); puck length selective fit (5 lengths, 0.05 apart); KMT0 travel 0.15 mm stack"
    watch: ["sym:hw/mech/dims_r2.py::SW", "sym:hw/mech/dims_r2.py::POCKET", "sym:hw/mech/dims_r2.py::PUCK_L", "sym:hw/mech/dims_r2.py::switch_stack", "sym:hw/mech/shell_r2.py::puck", "yaml:hw/pod/draft_r2/placement.yaml::SW1", ref:SW1]
  - id: R-DOCK-BODY
    a: SUB-DOCK-USB
    b: REG-POD-BODY
    what: "magnetic target in the belly bay + window (the whole belly is tub in Phase 2), wired to J3/J4/J10/J11/J12; the USB-C fallback is dropped (O31, ECR-0019); K4 (ECR-0021, proposed): own 4 castellated ENIG pads on M + 4 belly windows + 2 N52 magnets replace the target (pod L +1.5 mm)"
    watch: ["sym:hw/mech/dims_r2.py::DOCK", "sym:hw/mech/dims_r2.py::BAY", "sym:hw/mech/shell_r2.py::tub"]
  - id: R-DOCK-BOARD
    a: SUB-DOCK-USB
    b: REG-BOARD
    what: "Phase 2: dock wire pads J3/J4 (shared GND with cell -)/J10/J11/J12 in the two rear columns on B (board x 25-29, PAD_ZONE), J4 GND between J3 DOCK_VBUS and J5 VBAT (ASM-09); D5/D6 ESD at J3/J12, U6 and D4 on B at the rear"
    watch: ["yaml:hw/pod/draft_r2/placement.yaml::J3", "yaml:hw/pod/draft_r2/placement.yaml::J4", "yaml:hw/pod/draft_r2/placement.yaml::J5", "yaml:hw/pod/draft_r2/placement.yaml::J10", "yaml:hw/pod/draft_r2/placement.yaml::J11", "yaml:hw/pod/draft_r2/placement.yaml::J12", "yaml:hw/pod/draft_r2/placement.yaml::D5", "yaml:hw/pod/draft_r2/placement.yaml::D6", "yaml:hw/pod/draft_r2/placement.yaml::U6", "yaml:hw/pod/draft_r2/placement.yaml::D4"]
  - id: R-PWR-BOARD
    a: SUB-POWER
    b: REG-BOARD
    what: charger cluster around U3 (0.4 mm-pitch balls; C15/C16/C21 placement), LDO cluster
    watch: ["yaml:hw/pod/draft_r2/placement.yaml::U3", "yaml:hw/pod/draft_r2/placement.yaml::C15", "yaml:hw/pod/draft_r2/placement.yaml::C16", "yaml:hw/pod/draft_r2/placement.yaml::C21", "yaml:hw/pod/draft_r2/placement.yaml::U4", ref:U3]
  - id: R-PWR-BODY
    a: SUB-POWER
    b: REG-POD-BODY
    what: "cell envelope (35 x 12 x 5.3) on 0.25 VHB in the tub; 1.4 mm B gap to the hanging board (Phase 2: no foam strips)"
    watch: ["sym:hw/mech/dims_r2.py::CELL", "sym:hw/mech/dims_r2.py::B_GAP", "sym:hw/mech/shell_r2.py::placeholders"]
  - id: R-OUT-BOARD
    a: SUB-OUTPUT
    b: REG-BOARD
    what: "bridge legs Q1/Q2 (B, Nexperia Fig. 32 SOT1216 footprint, ECR-0004) and shunt R21 0402 ERJ2BSFR10X (B, 19.45, 6.45); I_SENSE Kelvin route to R21: LN-M03 1.29 % <= 2 % after the two-via fix (hw/pod/kelvin_r21.py, f6291e6)"
    watch: ["yaml:hw/pod/draft_r2/placement.yaml::Q1", "yaml:hw/pod/draft_r2/placement.yaml::Q2", "yaml:hw/pod/draft_r2/placement.yaml::R21", ref:Q1, ref:R21, file:hw/pod/draft_r2/out/routed.kicad_pcb]
  - id: R-DEBUG-BOARD
    a: SUB-DEBUG-TEST
    b: REG-BOARD
    what: "Phase 2: TP1-TP6 bare pads on F (TP1/2/4/5 row y 11.3, order GND/SWCLK/+3V0/SWDIO since 2026-10-07, TP3 (9.3, 2.9), TP6 (24.0, 10.9)) in per-pad 1.8 mm VHB cut-outs (interfaces.py clamp-bands: 91 % VHB bonded, PASS; 2026-10-07); TP7-TP10 dots on B by the mic; R1 PH3 pad = DFU tack point"
    watch: ["yaml:hw/pod/draft_r2/placement.yaml::TP1", "yaml:hw/pod/draft_r2/placement.yaml::TP2", "yaml:hw/pod/draft_r2/placement.yaml::TP3", "yaml:hw/pod/draft_r2/placement.yaml::TP4", "yaml:hw/pod/draft_r2/placement.yaml::TP5", "yaml:hw/pod/draft_r2/placement.yaml::TP6", "yaml:hw/pod/draft_r2/placement.yaml::TP7", "yaml:hw/pod/draft_r2/placement.yaml::TP8", "yaml:hw/pod/draft_r2/placement.yaml::TP9", "yaml:hw/pod/draft_r2/placement.yaml::TP10", "yaml:hw/pod/draft_r2/placement.yaml::R1", "glob:hw/lib/pod.pretty/TestPoint*.kicad_mod", "glob:hw/lib/pod.pretty/TestDot*.kicad_mod"]
  - id: R-PROC-BOARD
    a: SUB-PROCESSING
    b: REG-BOARD
    what: "Phase 2: MCU U1 on B at board (10.05, 5.4), SMPS loop (L1, C7, C8/C9), crystal Y1 at the front (3.9, 1.7), LSE pre-routed on B with no vias; GND to In1, +3V0 plane on In2"
    watch: ["yaml:hw/pod/draft_r2/placement.yaml::U1", "yaml:hw/pod/draft_r2/placement.yaml::L1", "yaml:hw/pod/draft_r2/placement.yaml::C7", "yaml:hw/pod/draft_r2/placement.yaml::Y1"]
  # ---------------------------------------------------------------- off-board wiring
  - id: R-OUT-ARM
    a: SUB-OUTPUT
    b: REG-ARM
    what: OUT_A/OUT_B litz wires (J1/J2) up the arm; the 4-wire bundle sets the heel channel and strut bores
    watch: [net:OUT_A, net:OUT_B, "sym:hw/mech/heel.py::CH_D", "sym:hw/mech/heel.py::CH_CBORE_D", "sym:hw/mech/heel.py::CH_EXIT"]
  - id: R-UI-ARM
    a: SUB-UI
    b: REG-ARM
    what: LED_A/LED_K wires (J7/J8) are 2 of the 4 arm wires
    watch: [net:LED_A, net:LED_K, "sym:hw/mech/heel.py::CH_D"]
  - id: R-OUT-PAD
    a: SUB-OUTPUT
    b: REG-PAD
    what: exciter (RC-BC02, 8 or 12 ohm) in the cup; wire landing at the pad
    watch: [net:OUT_A, net:OUT_B, file:hw/mech/pad.py]
  - id: R-UI-PAD
    a: SUB-UI
    b: REG-PAD
    what: LED on the pad board under the cap (O8)
    watch: [net:LED_A, net:LED_K, file:hw/padboard/gen.py, file:hw/padboard/mech.py]
  # ---------------------------------------------------------------- physical interfaces
  - id: R-BOARD-BODY
    a: REG-BOARD
    b: REG-POD-BODY
    what: "Phase 2: board 30 x 12 x 0.8 at pod x 30.55-60.55 hangs from the lid on full-face VHB (no clamp ribs, no foam); height bands B 1.4 / F 0.30 (SW1 pocket 0.90); F test pads in per-pad VHB cut-outs (91 % bonded); coarse x-stop 0.25 (interfaces.py outline, clamp-bands, heights)"
    watch: ["sym:hw/mech/dims_r2.py::PCB", "sym:hw/mech/dims_r2.py::B_GAP", "sym:hw/mech/dims_r2.py::VHB_T", "sym:hw/mech/dims_r2.py::X_STOP_GAP", "sym:hw/mech/dims_r2.py::POCKET", "sym:hw/mech/shell_r2.py::lid_base", "sym:hw/mech/shell_r2.py::vhb", "yaml:hw/pod/draft_r2/placement.yaml::TP1", "yaml:hw/pod/draft_r2/placement.yaml::TP2", "yaml:hw/pod/draft_r2/placement.yaml::TP3", "yaml:hw/pod/draft_r2/placement.yaml::TP4", "yaml:hw/pod/draft_r2/placement.yaml::TP5", "yaml:hw/pod/draft_r2/placement.yaml::TP6"]
  - id: R-BOARD-ARM
    a: REG-BOARD
    b: REG-ARM
    what: "Phase 2: arm wires reach the rear wire pads J1/J2/J7/J8 (B, board x 27-29) through the stowage gap behind the board (pod x 60.55-66.7, above the cell; MZG-10) from the heel exit"
    watch: ["sym:hw/mech/dims_r2.py::PCB", "sym:hw/mech/dims_r2.py::CELL", "sym:hw/mech/dims_r2.py::PAD_ZONE", "sym:hw/mech/heel.py::CH_EXIT", "yaml:hw/pod/draft_r2/placement.yaml::J1", "yaml:hw/pod/draft_r2/placement.yaml::J2", "yaml:hw/pod/draft_r2/placement.yaml::J7", "yaml:hw/pod/draft_r2/placement.yaml::J8"]
  - id: R-BODY-ARM
    a: REG-POD-BODY
    b: REG-ARM
    what: heel built into the tub; strut clearance to the tub (strut relief); NiTi socket mouth E
    watch: ["sym:hw/mech/shell_r2.py::tub", "sym:hw/mech/frame.py::E", "sym:hw/mech/heel.py::heel_add", "sym:hw/mech/heel.py::heel_cut"]
  - id: R-ARM-PAD
    a: REG-ARM
    b: REG-PAD
    what: NiTi pad socket, strut-to-pad slot, conductor bore and counterbore, pad pose (frame)
    watch: ["sym:hw/mech/frame.py::PAD_CONTACT", "sym:hw/mech/frame.py::pad_pose", "sym:hw/mech/frame.py::PAD_SOCKET_DEPTH", file:hw/mech/pad.py]
  - id: R-PHYS-FRAME
    a: PHYSICAL
    b: REG-POD-BODY
    what: "frame.py pod names (X0..Z1, CAV, CELL, PCB, MIC_PORT, BUTTON) and pod.py POD_L/W/H/ZC derive from the current design's shell dims (frame.pod_facts(), ECR-0001 implemented 2026-10-07); interfaces.py frame PASS 10/10. blade.rail/adapter default to pod.POD_ZC (-2.45 in Phase 2); shell_r1 pins its as-built -2.0 (RAIL_ZC); shell.py keeps the pre-rev-1 pod frozen (PRE_R1)"
    watch: ["sym:hw/mech/frame.py::pod_facts", "sym:hw/mech/frame.py::POD_NAMES", "sym:hw/mech/pod.py::POD_ZC", "sym:hw/mech/dims_r2.py::PCB", "sym:hw/mech/dims_r2.py::CELL"]
  # ---------------------------------------------------------------- requirements and cost
  - id: R-SPEC-POWER
    a: SPEC
    b: SUB-POWER
    what: D11 switching-regulator rule, power budget and runtime, O12 fast charge, O16 cell/charger
    watch: ["grep:docs/spec.md::D11", "grep:docs/spec.md::\\bO1[26]\\b"]
  - id: R-SPEC-UI
    a: SPEC
    b: SUB-UI
    what: O8 LED in the pad housing (solid), O16 IP68 switch
    watch: ["grep:docs/spec.md::\\bO8\\b", "grep:docs/spec.md::IP68"]
  - id: R-SPEC-BODY
    a: SPEC
    b: REG-POD-BODY
    what: O10 two-stage build (taped / bonded, cut-openable), O12 sealing, O16 no screws, O17 spine top
    watch: ["grep:docs/spec.md::\\bO1[0267]\\b"]
  - id: R-COST-BOARD
    a: COST
    b: REG-BOARD
    what: "BOM lines (JLC Standard PCBA feeder fee ~$1.53 each, Basic or Extended), placements, hidden-joint packages (X-ray) and assembly sides drive the JLC order cost; Extended types only add parts price"
    watch: [file:hw/pod/bom_jlc_mz2.csv, file:hw/pod/draft_r2/placement.yaml]
