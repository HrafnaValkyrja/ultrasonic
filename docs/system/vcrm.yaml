# Requirement -> verification matrix (VCRM): how each requirement will be proven met, and how far along that is.
# Read and checked by tools/checks/vcrm.py; explained in docs/system/vcrm.md. Hand-kept: change a row in the same commit
# that changes the evidence behind it. docs/spec.md wins: section 1 is owner-locked and quoted verbatim below.
#
# Row fields
#   id            S1.1-goal | S1.2-C<n> | S1.3-T<n> for section 1; a spec item id (D17, O12) or <item>-<aspect> (O12-sealing)
#   kind          mvp (section 1, locked) | decision (spec D-item) | owner (spec O-item)
#   source        where the requirement lives (docs/spec.md anchor)
#   spec_block    decision / owner rows: the spec block this row summarises (D11, O12). The checker hashes that block
#   spec_hash     first 10 hex of the block hash when the row was last reviewed; a changed block turns the row WARN
#                 ("requirement text changed, re-review"). Print current values: python3 tools/checks/vcrm.py --hashes
#   text          section 1: the spec text VERBATIM (never edit; the checker compares it with the spec). Others: a short summary
#   method        Test | Analysis | Inspection | Demonstration (every method the row uses)
#   stage         the stages that carry verification. C = in a computer before hardware (simulation, analysis, scripts,
#                 firmware on a host, inspection of CAD/schematic, owner listening on headphones). D = on rev 1 hardware:
#                 bench, wear, field. A stage not listed here has no verification defined yet.
#   c_role        required when stage lists C: decides (a computer-side check can settle the requirement) | surrogate (models, analyses
#                 and inspections of the enabling conditions; the requirement itself is judged on rev 1: perception, comfort,
#                 sealing, noise, current). Surrogate rows are the ones rev 1 must reveal (O18)
#   status        not-started | partial | done (the whole row; must agree with status_by_stage)
#                   not-started  nothing exists that could show pass or fail
#                   partial      something real exists (a model, a check, an inspection, a result) but it does not cover the
#                                whole requirement, or it is blocked, stale or not yet on the final design/hardware
#                   done         verification complete, passing, with evidence
#   status_by_stage  {C: ..., D: ...}; required when stage lists both
#   owner_items   plm items (docs/system/plm/items.yaml) that carry the requirement
#   functions     F-rows of docs/system/integration-map.md that implement it (optional)
#   artefacts     what verifies it, and EXISTS today: file paths or globs; E1..E12 (spec 12.E procedures); S1..S4 (spec 10
#                 stages); C1..C9 (spec 12.C tasks); interfaces:<id> (a check in tools/checks/interfaces.py);
#                 bom_check:<id> (a check in tools/checks/bom_check.py); ERC (SKiDL ERC inside hw/pod/gen.py);
#                 DRC (a KiCad board for kicad-cli pcb drc). An E/S/C item is a defined procedure, not a result:
#                 status says whether it was done.
#   planned       what is missing and would verify it (free text; not validated)
#   evidence      what shows the stated status: an exact tracked file path (no directory, no pattern, never CLAUDE.md, the spec or
#                 this matrix) or a commit hash. Every evidence file is pinned in evidence_pins below: a changed file is a WARN
#   ecrs          open ECRs that block or change this row (docs/system/plm/ecr/); each is validated and cited as WARN
#   related       other VCRM rows that share evidence with this one (validated)
#   covers        spec items this row also verifies (O7, O7b) or sub-requirements (O16(3)); a row id already covers its own item
#   c_none_reason required when stage lacks C: why nothing can be checked in a computer
#   next          one line: the next action that moves this row (shown in the generated tables of vcrm.md)
#   known_fail    set ONLY when the design today is known not to meet the requirement (not merely unverified): shows as WARN
#   known_fail_ref  required with known_fail: the ECR or doc that tracks the failure; 'none; <where it is written down>' when no ECR does
#   gap           what is missing to verify it, in plain words, with the numbers. Never write what a cited check currently says
#                 (PASS, WARN, counts): the checker runs the scripts and reports it live
#
# Top-level keys (besides version, updated and requirements)
#   section1_lock    {commit, sha256}: spec section 1 must equal its text at that commit (git, not this file, is the baseline).
#                    python3 tools/checks/vcrm.py --lock prints the record. section1_unlock: "<owner, date, why>" downgrades a
#                    difference to a WARN while the owner's change is being committed; remove it once section1_lock is updated
#   evidence_pins    hash of each evidence file as last reviewed (managed by --update-pins; marked block below)
#   stage_c_baseline rows whose stage C was started (partial or done) when last reviewed; a row leaving the list is a WARN
#                    (python3 tools/checks/vcrm.py --baseline prints the current list)
#   not_verifiable   spec D/O items with no row, each with the reason (a waiver is a recorded decision, not an omission)
#   ecrs_no_row      open ECRs no row cites, each with the reason
#   acknowledged     WARN keys (see --json "keys") the owner has accepted; only --strict reads it
