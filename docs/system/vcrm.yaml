requirements:
  # =========================================================================================== section 1 (locked)
  - id: S1.1-goal
    kind: mvp
    source: "docs/spec.md §1.1"
    text: |-
      A wearable that lets the owner hear ultrasound (roughly 20–96 kHz) in real time, in stereo, by shifting it down into a comfortable audible band and delivering it by bone conduction. It mounts on her everyday prescription glasses and must feel like an extension of her body, not a gadget.
    method: [Analysis, Test, Demonstration]
    stage: [C, D]
    c_role: surrogate
    status: partial
    status_by_stage: {C: partial, D: not-started}
    owner_items: [SUB-AUDIO-IN, SUB-PROCESSING, SUB-OUTPUT, REG-PAD]
    functions: [F1, F2, F3]
    artefacts: [sim/dsp/pipeline.py, sim/dsp/run_phase1.py, sim/data/sph0641_ultrasonic_response.json, docs/research/A3-u575-plan.md, "interfaces:mic-port", "interfaces:pins", E3, S1, S4]
    planned: ["CPU budget re-costed for the U575 (C2 is an L452 estimate)", "end-to-end latency measurement against the 20 ms target (spec 5.3)"]
    evidence: [sim/dsp/run_phase1.py, sim/checks/dsp_phase1_summary.json]
    related: [S1.3-T1, S1.3-T2, S1.3-T3, S1.3-T5]
    known_fail: "The locked text says roughly 20-96 kHz; the design delivers about 20-85 kHz (the mic is characterised to 80 kHz, the ADF filter passes to about 89 kHz; spec D14 band-edge note). Spec section 1 stays as written; accepting the gap or buying the top octave back is the owner's call."
    known_fail_ref: "none; the owner decides 85 versus 96 kHz (spec D14 band-edge note). The locked text stays as written"
    next: "Re-cost the CPU budget for the U575; owner decides the 85 kHz versus 96 kHz top end"
    gap: >-
      C: the Phase-1 chain model covers 20-85 kHz on a synthetic corpus and on real 192 kS/s recordings (Port Meadow); the
      CPU budget for real time is still an L452-era estimate (sub-processing issue 5), so real time on the U575 is unproven.
      "In stereo" and "feel like an extension of her body" are only verified through T3 and T5. D: S4 is the exit test
      (T1, T2, T3, T6 on two full units); the mic's response through the as-built port is unmeasured (E3).
      interfaces:mic-port reads the port hole against the lid port live (ECR-0011 moved the hole onto the lid port).

  - id: S1.2-C1
    kind: mvp
    source: "docs/spec.md §1.2 item 1"
    text: |-
      **Full-time glasses wearer.** The device clips onto her main glasses via removable 3D-printed clasps.
    method: [Inspection, Demonstration]
    stage: [C, D]
    c_role: surrogate
    status: partial
    status_by_stage: {C: partial, D: not-started}
    owner_items: [REG-POD-BODY, PHYSICAL]
    artefacts: [hw/mech/frame.py, hw/mech/pod.py, hw/mech/blade.py, E9, E12, "interfaces:frame"]
    planned: ["fit and removal test of the printed adapter on her own glasses (printed dummy pair, ECR-0006)"]
    evidence: [hw/mech/frame.py, hw/mech/pod.py]
    ecrs: [ECR-0001, ECR-0006]
    next: "Print the adapter and try it on her glasses (ECR-0006 dummy pair); measure her temple section"
    gap: >-
      C: a separate printed frame adapter exists (dovetail rail, snap tab, parametric in the temple section), but the
      temple section (2.5 x 5.0 mm in frame.py) is a generic value, not measured on her frames (E9 is photo-based and partly
      done); the ~5 N grip on the temple edges that the pad's 1 N reaction needs (spec 8, v0.13 note) is unverified, and E12
      (temple stiffness) is not done. frame.py still carries pre-rev-1 pod constants (ECR-0001). D: fit, grip and removal on
      her glasses.

  - id: S1.2-C2
    kind: mvp
    source: "docs/spec.md §1.2 item 2"
    text: |-
      **Nothing Ear (open) headphones are worn constantly and reserved for phone audio.** The device must not use them as output, must not interfere with their fit, and must not bump the driver pod (over the ear opening, between helix root and tragus; shifts slightly during wear). The counterweight bulb sits behind the ear.
    method: [Inspection, Analysis, Demonstration]
    stage: [C, D]
    c_role: surrogate
    status: partial
    status_by_stage: {C: partial, D: not-started}
    owner_items: [REG-ARM, REG-PAD, PHYSICAL]
    artefacts: [docs/research/ear-open-fit.md, hw/mech/frame.py, hw/mech/pad.py, hw/mech/heel.py, E2, E9]
    planned: ["clearance check of the rev-1 arm, strut and pad against an Ear (open) keep-out solid in CAD (STEP boolean, nominal and +3 mm shift)"]
    evidence: [docs/research/ear-open-fit.md]
    ecrs: [ECR-0006]
    related: [S1.3-T4]
    next: "Add an Ear (open) keep-out solid and check arm, strut and pad against it; take the ruler shot (E9)"
    gap: >-
      C: "does not use them as output" holds by inspection (the pod has no radio and F3 drives only the exciter).
      Clearance (at least 5 mm, 8 mm on the vertical run, still clear after a 3 mm shift; spec 8) rests on photo
      measurements good to +-20% until the ruler shot (E9) and was last checked before the strut grew rearward and the
      pad collar grew to 7.4 mm across flats (reg-arm issue 10); no solid-model check against an Ear (open) exists.
      D: wear with the Ear (open) in, over a full session (E2, T4).

  - id: S1.2-C3
    kind: mvp
    source: "docs/spec.md §1.2 item 3"
    text: |-
      **Unusually good high-frequency hearing** (hears some charger and LED-driver whine). So: any self-noise must be no louder than the ambient background, and PWM noise is kept well above her hearing. *(Owner change 2026-09-30: the blanket "no switching regulators" rule was removed.)*
    method: [Analysis, Test]
    stage: [C, D]
    c_role: surrogate
    status: partial
    status_by_stage: {C: partial, D: not-started}
    owner_items: [SUB-OUTPUT, SUB-PROCESSING, SUB-POWER, SUB-AUDIO-IN]
    functions: [F2, F3]
    artefacts: [sim/checks/pwm_noise.py, sim/checks/ntf_compare.py, sim/checks/pwm_ultrasonic_leak.py, sim/checks/bridge_spice.py, sim/checks/deadtime_switching.py, E3, E7, E11, S2]
    planned: ["model of the noise coupling path (rail, ground, exciter vibration) into the mic (a layout-noise model is in progress in sim/noise by another agent, uncommitted on 2026-10-02)", "a number for the ambient background it is compared with"]
    evidence: [sim/checks/ntf_compare.py, sim/checks/pwm_ultrasonic_leak.py]
    related: [S1.3-T6, D11-selfnoise]
    next: "Model the PWM and SMPS coupling path into the mic; fix a number for 'ambient'"
    gap: >-
      C: the PWM quantisation noise is modelled (about -90 dB re full scale in 8-20 kHz after the coil, 3rd-order shaper);
      the same noise sits at -35 dB re FS on the bridge voltage across the mic's 20-85 kHz band (MP-01), so the device can
      hear itself if any of it couples back, and nobody has modelled that coupling. The core SMPS has no noise model. "Ambient
      background" has no number. D: E7 (idle silence, 8-16 kHz by ear) and E11 (SMPS whine in a quiet room) need rev 1 on
      battery.

  - id: S1.2-C4
    kind: mvp
    source: "docs/spec.md §1.2 item 4"
    text: |-
      **Comfort and size are the top priority.** Bulky or uncomfortable means unworn means failed. Bulk goes at the front of the frame near the hinges, never near the neck or behind the ears.
    method: [Analysis, Inspection, Demonstration]
    stage: [C, D]
    c_role: surrogate
    status: partial
    status_by_stage: {C: partial, D: not-started}
    owner_items: [PHYSICAL, REG-POD-BODY, REG-BOARD, SUB-POWER]
    artefacts: [sim/checks/balance.py, hw/mech/shell_r1.py, hw/mech/frame.py, E10, E12, "interfaces:frame"]
    planned: ["numeric size and mass targets (none exist; O20 defines none)", "whole-pod mass and centre of mass from the rev-1 CAD with one density plus parts"]
    evidence: [sim/checks/balance.py, hw/mech/shell_r1.py]
    ecrs: [ECR-0001, ECR-0006]
    related: [D18-balance, O20-finalsize, S1.3-T5]
    next: "Set numeric size and mass targets; owner confirms the D18 reading (O4)"
    gap: >-
      C: nothing sits behind the ear or toward the neck in the CAD (pod x 29.5-67.5 mm behind the hinge), but "near the
      hinges" versus a 38 mm pod running to the Ear (open) hook rests on the D18 reading that the owner has not yet confirmed
      (O4 is open). The vision no-go line (nothing forward of about 18 mm behind the pupil plane) is an estimate until E10.
      No size or mass limit is written down, so size cannot pass or fail. D: wear the weighted dummy pair (ECR-0006), then rev 1.

  - id: S1.3-T1
    kind: mvp
    source: "docs/spec.md §1.3"
    text: |-
      **T1 House walk:** she hears ultrasonic sources (electronics, etc.) around the house. In Transient-only mode the house is tolerable, not overwhelming.
    method: [Analysis, Demonstration]
    stage: [C, D]
    c_role: surrogate
    status: partial
    status_by_stage: {C: partial, D: not-started}
    owner_items: [SUB-PROCESSING, SUB-AUDIO-IN]
    functions: [F1, F2]
    artefacts: [sim/dsp/run_phase1.py, sim/dsp/corpus.py, sim/dsp/pipeline.py, sim/checks/idle_detector.py, C1, C4, S1, S4]
    planned: ["end-to-end chain scenario T1 (sim/e2e, in progress by another agent, uncommitted on 2026-10-02)", "owner listening verdict on the rendered WAVs (sim/out/dsp/*.wav)", "her own home recordings through the chain (S1)"]
    evidence: [sim/dsp/run_phase1.py, sim/checks/dsp_phase1_summary.json]
    related: [D12-modes]
    next: "Owner listens to the Phase-1 WAVs; record her home (S1); tune the gate (C4)"
    gap: >-
      C: on the synthetic corpus (HC-SR04, keys, charger and LED whines) transient mode keeps the events and drops the
      whines (whines-only window -90.1 dBFS against -41.4 in full mode), but the corpus was written by the same author as
      the gate, the corpus (C1) and gate tuning with self-noise (C4) are both OPEN, and "tolerable, not overwhelming" is her
      judgement, not yet asked. D: the house walk itself, after S4 (rev 1 on battery).

  - id: S1.3-T2
    kind: mvp
    source: "docs/spec.md §1.3"
    text: |-
      **T2 Nature sit:** outside at dusk, bats and other ultrasonic wildlife come through as comfortable, non-shrill sound.
    method: [Analysis, Demonstration]
    stage: [C, D]
    c_role: surrogate
    status: partial
    status_by_stage: {C: partial, D: not-started}
    owner_items: [SUB-PROCESSING, SUB-AUDIO-IN, SUB-OUTPUT]
    functions: [F1, F2, F3]
    artefacts: [sim/dsp/nature_demo.py, sim/checks/idle_detector.py, sim/dsp/pipeline.py, C6, E2, S4]
    planned: ["owner listening verdict on sim/out/nature/2_translated_only.wav and 3_combined.wav (R19)"]
    evidence: [sim/dsp/nature_demo.py, sim/checks/idle_detector.py]
    ecrs: [ECR-0007]
    next: "Owner judges the nature WAVs; play them through the exciter at the tragus (E2, ECR-0007)"
    gap: >-
      C: real Port Meadow recordings (Zenodo 22079773, CC-BY-4.0) run through algorithm B render to WAVs, and the idle
      detector caught 95.5% of 10,024 annotated bat calls within 10 ms (spec v0.14). The WAVs have not been judged "comfortable,
      non-shrill" by the owner, and playing them through the real exciter at the tragus (E2, ECR-0007) is the first test of the
      bone-conduction path. Level calibration of the clips is assumed. D: dusk sit in the yard, rev 1 on battery.

  - id: S1.3-T3
    kind: mvp
    source: "docs/spec.md §1.3"
    text: |-
      **T3 Localization:** eyes closed, she can point left/right toward an ultrasonic source (e.g. a 40 kHz rangefinder emitter) better than chance.
    method: [Test]
    stage: [C, D]
    c_role: surrogate
    status: not-started
    status_by_stage: {C: not-started, D: not-started}
    owner_items: [SUB-AUDIO-IN, SUB-PROCESSING, SUB-OUTPUT, REG-PAD]
    functions: [F1, F3]
    artefacts: [E2, E8, S4]
    planned: ["stage-C scenario T3 in sim/e2e/chain.py (level difference through two independent chains, tragus crosstalk, random relative phase): in progress by another agent, uncommitted on 2026-10-02; cite it here when it lands", "pass rule for 'better than chance' (the spec states none): e.g. a binomial test over a fixed number of blind trials, proposed to the owner"]
    related: [S1.1-goal]
    next: "Land the stage-C level-difference scenario and agree the blind-trial pass rule with the owner"
    gap: >-
      Nothing verifies this yet. Stage C is defined but not started: the end-to-end chain (sim/e2e) is being built with a T3
      scenario, uncommitted on 2026-10-02. It depends on free-running phase between the unlinked units (D2; E8 and S4 A/B
      measure it), on mic and coupling match between sides (R7, +-1 dB mic) and on the tragus isolation figure (25-40 dB),
      all literature or unmeasured. "Better than chance" has no trial count or statistic. A rev-1 discovery (O18) until a
      model exists.
  - id: S1.3-T4
    kind: mvp
    source: "docs/spec.md §1.3"
    text: |-
      **T4 Coexistence:** Ear Opens worn and playing phone audio the whole time; no fit interference; both streams distinguishable.
    method: [Inspection, Demonstration]
    stage: [C, D]
    c_role: surrogate
    status: partial
    status_by_stage: {C: partial, D: not-started}
    owner_items: [REG-ARM, REG-PAD, PHYSICAL]
    artefacts: [docs/research/ear-open-fit.md, hw/mech/pad.py, hw/mech/heel.py, E2, E9]
    planned: ["the Ear (open) keep-out solid check (see S1.2-C2)"]
    evidence: [docs/research/ear-open-fit.md]
    ecrs: [ECR-0006, ECR-0007]
    related: [S1.2-C2]
    next: "Re-run the Ear (open) clearance on the rev-1 arm; run E2 with the Ear (open) playing"
    gap: >-
      C: same clearance analysis as S1.2-C2, stale since the strut and collar grew. "Both streams distinguishable"
      (the device plays 1.5-4 kHz by bone conduction at the tragus while phone audio plays in the Ear (open)) has no model
