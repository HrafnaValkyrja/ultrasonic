# MCU pin contract: the peripheral signal each functional net on U1 needs. This is the CONSUMER's side of the interface
# (what the circuit and the firmware rely on); the other side is the pin the schematic actually uses.
# tools/checks/interfaces.py [pins] compares the two against ST's own data:
#   tools/data/stm32_open_pin_data/STM32U575CIUxQ.xml                      pins, positions, signals per pin (UFQFPN48, SMPS pinout)
#   tools/data/stm32_open_pin_data/GPIO-STM32U5x_gpio_v1_0_Modes.xml      alternate-function numbers per pin and signal
# FAIL if a net sits on a pin that cannot provide its signal, or on a different alternate function than the one stated here.
# The contract names SIGNALS, not pins: moving a net to another pin that provides the same signal stays PASS (the pin map in
# integration-map.md Section 4 is generated from the schematic). Changing a signal (a different timer channel, another ADC)
# is a design change: edit it here in the same commit, or list it under `alternates` while an ECR proposes it.
#
# Entry fields
#   id         function name (the net name where the net has one)
#   net        net name in the SKiDL schematic (hw/pod/gen.py), as in integration-map.md Section 3
#   via        for a net with no name of its own: {ref: R2, from_net: MIC_CLK} = the net on R2's OTHER terminal. The U1 pin is there
#   signal     required signal. An ST signal name (TIM1_CH1), or one of
#                GPIO        the pin is a plain GPIO; `modes` (Output, EXTI) must be in its IOModes
#                NRST        the reset pin (ST pin type Reset)
#                BOOT0       the BOOT0 pin (PH3)
#                re:<regex>  any ST signal on the pin that fully matches the regex (ADC nets: re:ADC[14]_IN\d+)
#   af         alternate-function number the firmware will use (ST GPIO_AF<n>_...); omitted for analog / additional functions
#   alternates [{signal, af, ecr}] accepted while an open ECR proposes it: WARN citing the ECR, never PASS
#   complement_of  the entry this one pairs with: same timer and channel, N output (complementary PWM with dead time)
#   absent_ecr if the net or its via part is GONE from the schematic (the ECR removes it) and this ECR is open: WARN citing it
#              instead of FAIL. A part that is still there but wired differently (R11 on GND instead of +3V0) stays a FAIL
#   role       why the pin has this job (function F-row in integration-map.md Section 1)
# `hazards` are facts about what a pin does BESIDES its job (reset-state pulls, dead-battery pull-downs, boot-ROM drive), tied to
# the ECR that tracks the fix. A net on a hazard pin is a WARN citing the ECR (FAIL once the ECR is closed or rejected while the
# hazard is still there). Fields: port (the physical pin, so the hazard follows the pin, not the net), note, source, ecr, and
#   cleared_by  {pin, net}: a schematic fix that removes the hazard (then the check says so instead of warning)
#   mitigation  firmware: no schematic fix exists; the WARN stays while the ECR is open and clears when it is closed or verified
# A contract that shrinks is a FAIL, not a warning: every I/O net on U1 needs a row (or a listing under `unconstrained`, with a
# reason), every power pin of the package needs a rail under `power_pins`, `signals` and `power_pins` may not be empty, and
# `hazards` may not be empty while the ECR named in `hazards_tracked_by` is open. Deleting a row therefore cannot pass a commit.
# Verified against the open data on 2026-10-02 (pin-data commit and licence: tools/data/stm32_open_pin_data/SOURCE.md).
version: 1
updated: 2026-10-02

# nets on U1 deliberately without a contract row, each with its reason: `unconstrained: {NET_NAME: "why no signal is needed"}`
unconstrained: {}
# the ECR that tracks the pin hazards below; while it is open the hazards list cannot be empty
hazards_tracked_by: ECR-0013

mcu:
  ref: U1
  part: STM32U575CIU6Q (ST Cortex-M33 MCU; the Q suffix = internal-SMPS pinout)
  package: UFQFPN48
  mcu_xml: tools/data/stm32_open_pin_data/STM32U575CIUxQ.xml
  gpio_xml: tools/data/stm32_open_pin_data/GPIO-STM32U5x_gpio_v1_0_Modes.xml
  # pin 49 is the exposed die pad (not a numbered pin in ST's XML): ST asks for it to be soldered to PCB ground
  exposed_pad: {pin: 49, net: GND, source: "ST DS13737 Rev 8, section 6.1 Table 154 note 3 (read 2026-10-02)"}

# ST power-pin name -> the net it must sit on (the rails of integration-map.md Section 5)
power_pins:
  VBAT: "+3V0"
  VDDA: "+3V0"
  VDDSMPS: "+3V0"
  VDD: "+3V0"
  VSS: GND
  VSSA: GND
  VSSSMPS: GND
  VDD11: VDD11
  VLXSMPS: VLXSMPS

signals:
  # ---- F3 drive the exciter: TIM1 complementary PWM, one leg per channel pair (dead time between P and N gate)
  - {id: GA_P, net: GA_P, signal: TIM1_CH1, af: 1, role: "bridge leg A, P-FET gate (F3)"}
  - {id: GA_N, net: GA_N, signal: TIM1_CH1N, af: 1, complement_of: GA_P, role: "bridge leg A, N-FET gate (F3)"}
  - id: GB_P
    net: GB_P
    signal: TIM1_CH3
    af: 1
    role: "bridge leg B, P-FET gate (F3); on PA10 since Rev F (ECR-0003); R5 keeps it high for the ROM loader's USART1_RX"
  - id: GB_N
    net: GB_N
    signal: TIM1_CH3N
    af: 1
    complement_of: GB_P
    role: "bridge leg B, N-FET gate (F3); on PB15 since Rev F (ECR-0003): the UCPD dead-battery pull-down holds it off until UCPD_DBDIS"
  # ---- F4 self-test, F8 battery level, F9 dock detect, F6 temperature, F10 CC: ADC inputs
  - {id: I_SENSE, net: I_SENSE, signal: "re:ADC[14]_IN\\d+", role: "bridge supply current through R21 (F4)"}
  - {id: VBAT_SENSE, net: VBAT_SENSE, signal: "re:ADC4_IN\\d+", role: "VBAT/2 (F8): must be ADC4, the converter that runs in Stop 2"}
  - {id: VBUS_SENSE, net: VBUS_SENSE, signal: "re:ADC[14]_IN\\d+", role: "dock detect (F9)"}
  - {id: TS, net: TS, signal: "re:ADC[14]_IN\\d+", role: "NTC voltage, 20 C charge rule (F6); stays an analog input"}
  # ---- F1 hear: PDM clock out and data in on the ADF1 filter, supply switched by a GPIO
  - {id: MIC_CLK, via: {ref: R2, from_net: MIC_CLK}, signal: ADF1_CCK0, af: 3, role: "PDM clock to the mic through R2 33R (F1)"}
  - {id: MIC_DATA, net: MIC_DATA, signal: ADF1_SDI0, af: 3, role: "PDM data from the mic (F1)"}
  - {id: MIC_VDD, net: MIC_VDD, signal: GPIO, modes: [Output], role: "GPIO-switched mic supply, off in Off mode (F1, D12)"}
  # ---- F13 charger link
  - {id: I2C_SCL, net: I2C_SCL, signal: I2C2_SCL, af: 4, role: "charger I2C clock (F13)"}
  - {id: I2C_SDA, net: I2C_SDA, signal: I2C2_SDA, af: 4, role: "charger I2C data (F13)"}
  - {id: CHG_INT, net: CHG_INT, signal: GPIO, modes: [EXTI], role: "charger interrupt (F13): a GPIO with EXTI"}
  # ---- F10 USB data
  - {id: USB_DM, net: USB_DM, signal: USB_OTG_FS_DM, af: 10, role: "USB full-speed D- (F10)"}
  - {id: USB_DP, net: USB_DP, signal: USB_OTG_FS_DP, af: 10, role: "USB full-speed D+ (F10)"}
  # ---- F14 debug and boot
  - {id: SWDIO, net: SWDIO, signal: DEBUG_JTMS-SWDIO, af: 0, role: "SWD data (F14)"}
  - {id: SWCLK, net: SWCLK, signal: DEBUG_JTCK-SWCLK, af: 0, role: "SWD clock (F14)"}
  - {id: NRST, net: NRST, signal: NRST, role: "reset (F14)"}
  - {id: BOOT0, via: {ref: R1, from_net: GND}, signal: BOOT0, role: "BOOT0 held low by R1 10k (F14)"}
  # Rev F: BOOT_RX (R11 on PA10) and CC_SENSE (R19 on PA3) removed with their parts: the ROM loader pulls PA10 up itself
  # (AN2606 Rev 69 Table 199); charge-current policy comes from enumeration, not CC (simplification study PER-02, PWR-03)
  - {id: DBG_TX, net: DBG_TX, signal: USART1_TX, af: 7, role: "printf telemetry on TP7 (F14, O18; PER-12): SWO is lost to the mic clock on PB3"}
  - {id: MDF_CCK, net: MDF_CCK, signal: MDF1_CCK0, af: 5, role: "mic-clock fallback dot TP8 (F1, O18; sub-audio-in issue 5): hand-wire to R2's mic-side pad if the ADF clock duty fails"}
  - {id: MDF_SDI, net: MDF_SDI, signal: MDF1_SDI0, af: 6, role: "mic-data fallback dot TP9, wired to TP10 (MIC_DATA) in the fallback (F1, O18)"}
  # ---- F2 / F11 / F12
  - {id: LSE_IN, net: LSE_IN, signal: RCC_OSC32_IN, role: "32.768 kHz crystal (F2)"}
  - {id: LSE_OUT, net: LSE_OUT, signal: RCC_OSC32_OUT, role: "32.768 kHz crystal (F2)"}
  - {id: BTN, net: BTN, signal: PWR_WKUP1, role: "button wake from Off/Stop (F11)"}
  - {id: LED_K, net: LED_K, signal: TIM4_CH2, af: 2, role: "LED cathode, open-drain, duty set from VBAT (F12); gen.py: PB7 TIM4_CH2"}

# What the pins do besides their job. Sources are ST's datasheet and reference manual (text read 2026-10-02) and the audit
# docs/system/audit-datasheet-claims.md; ECR-0013 tracks every one.
hazards:
  - port: PA15
    ecr: ECR-0013
    note: "UCPD dead battery: after reset a 5.1k pull-down (UCPD1_CC1) sits on this pin while PB5 (UCPD1_DBCC1) is not tied low; against the pull-up it holds the charger interrupt low (Rev F: internal pull-up, so it would read solidly stuck low) until firmware sets PWR_UCPDR.UCPD_DBDIS"
    source: "ST DS13737 Rev 8 pin definitions table note 4; RM0456 Rev 7 p.459 (quoted in the audit, finding i)"
    cleared_by: {pin: PB5, net: GND}
  - port: PB15
    ecr: ECR-0013
    note: "UCPD dead battery: after reset a 5.1k pull-down (UCPD1_CC2) is activated by high level on PB14 (UCPD1_DBCC2 = I2C_SDA, idles high); a bridge N gate here is held OFF until PWR_UCPDR.UCPD_DBDIS is set"
    source: "ST DS13737 Rev 8 pin definitions table note 4; ECR-0013 S2"
    mitigation: firmware
  - port: PB4
    ecr: ECR-0013
    note: "after reset PB4 is NJTRST with an internal pull-up (30-50k to VDD): ~60 uA back-feeds the mic through MIC_DATA while its PA5-gated supply is off (reset, ROM DFU, Off); firmware must set PB4 analog / no pull before Off"
    source: "ST DS13737 Rev 8 pin definitions table note 5; RM0456 Rev 7 section 13.3.1 (audit claim 5)"
    mitigation: firmware
  - port: PA2
    ecr: ECR-0013
    note: "ROM bootloader (USART2) drives this pin push-pull with pull-up during DFU: TS reads high ('cold'), charging pauses for the whole DFU session"
    source: "ST AN2606 Rev 69 Table 199 p.466 (audit claim 2)"
    mitigation: firmware

# K4 two-board split (ECR-0020 rev 2, proposed 2026-10-08). The signal contract above is UNCHANGED (same U1 pins, same nets); this block
# says which nets cross the Hirose BM28 10-pin B2B between M (mic only) and P (everything else incl. U1 and the SMPS). Generated by
# hw/pod/k4/gen.py (BM28_PINS); gen.py asserts the crossing set == this list. interfaces.py ignores this key.
k4_split:
  ecr: ECR-0020
  connector: {M: "J20 BM28B0.6-30DS/2-0.35V(51) C424571 receptacle", P: "J21 BM28B0.6-30DP/2-0.35V(51) C424570 plug", pitch_mm: 0.35, mated_h_mm: "0.6 [T]", rating_a_per_contact: "0.3 signal [T, secondary source]; +3V0 on 3 contacts (bridge peaks 315 mA sit on C14 on P)", jlc_checked: "2026-10-08T02:09Z"}
  pins: {1: MIC_VDD, 2: GND, 3: MIC_CLK, 4: GND, 5: VBAT_SENSE, 6: GND, 7: I2C_SCL, 8: GND, 9: I2C_SDA, 10: GND, 11: USB_DM, 12: GND, 13: USB_DP, 14: GND, 15: +3V0, 16: GND, 17: GND, 18: GND, 19: LED_K, 20: GND, 21: MIC_DATA, 22: GND, 23: CHG_INT, 24: GND, 25: BTN, 26: GND, 27: VBUS_SENSE, 28: GND, 29: TS, 30: +3V0, 31: +3V0, 32: +3V0, 33: +3V0, 34: +3V0}
  counts: {signal_power: 19, gnd: 11}   # rev 5 2026-10-08 (9ec84ae): reversal-safe checkerboard, signals on odd pads only, +3V0 on 15/30 + 4 power tabs; mate stays pin n to pin n; routed M and P at L 15.5: 0 unconnected / 0 DRC
  rule: "no switching node (VLXSMPS, VDD11, OUT_A/B) crosses the B2B; SMPS loop (U1, L1, C7, C8/C9) on one board (P)"
  on_M: "U2 mic + C13, U3 charger + C15/C16/C21, U4 LDO + C17/C18/R20, D4/D5/U6, dock pads J3/J4/J10/J11 (+2 magnets), SW1/R10, R8/R9/R12/R13/C19, RT1/J9, R14/J7/J8, J5, TP6, TP4/TP5/TP10, R15/R16 (I2C pull-ups), J20 (28 parts; rev 4 unload 2026-10-08)"
  on_P: "U1 + C1-C12, Y1, L1, R1/R2, Q1/Q2 + R3-R6, R21-R23/C22/C14, J1/J2, TP1-TP3/TP7-TP9, J21 (26 parts)"
  risks: ["BM28 numbering pin n <-> pin n and datasheet ratings [T]", "PA5/PB3/PB4 routing on P must stay away from L1/VLXSMPS (in-plane victim, V9 B_plus_noise.rerun_2026_10_08_partition_v2)"]
