<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740"><rect width="900" height="740" fill="#000"/><text x="30" y="48" fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold">Bench day 1</text><text x="30" y="95" fill="#7fb4ff" font-family="sans-serif" font-size="19" font-weight="bold">DO FIRST: 2-minute decisions (~15 min)</text><rect x="40" y="123" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="141" fill="#eee" font-family="sans-serif" font-size="18">Pen test x3, average mm from hinge (card)  5 min</text><rect x="40" y="157" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="175" fill="#eee" font-family="sans-serif" font-size="18">Calipers on temple arm at 50 mm  3 min</text><rect x="40" y="191" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="209" fill="#eee" font-family="sans-serif" font-size="18">Ear photo with a ruler, mouth open  5 min</text><rect x="40" y="225" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="243" fill="#eee" font-family="sans-serif" font-size="18">Arm stiffness: hang 100 g, see how far it bends  5 min</text><text x="30" y="285" fill="#7fb4ff" font-family="sans-serif" font-size="19" font-weight="bold">ON YOU: needs working rig (skip if not built)</text><rect x="40" y="313" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="331" fill="#eee" font-family="sans-serif" font-size="18">Masked threshold vs 70 dBA street  30 min</text><rect x="40" y="347" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="365" fill="#eee" font-family="sans-serif" font-size="18">Car noise log 30 s at 80 km/h  15 min</text><rect x="40" y="381" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="399" fill="#eee" font-family="sans-serif" font-size="18">Driver resonance under the pad (sweep)  20 min</text><rect x="40" y="415" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="433" fill="#eee" font-family="sans-serif" font-size="18">Pad pressure vs loudness, up to 1.5 N  20 min</text><rect x="40" y="449" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="467" fill="#eee" font-family="sans-serif" font-size="18">Pad/resonance tuning  30 min</text><text x="30" y="509" fill="#7fb4ff" font-family="sans-serif" font-size="19" font-weight="bold">ELECTRONICS + PRINTS (parts: after the freeze order if missing)</text><rect x="40" y="537" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="555" fill="#eee" font-family="sans-serif" font-size="18">Battery drain in silence  15 min</text><rect x="40" y="571" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="589" fill="#eee" font-family="sans-serif" font-size="18">Power-regulator noise check  20 min</text><rect x="40" y="605" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="623" fill="#eee" font-family="sans-serif" font-size="18">Board-connector signal test  30 min (after freeze order)</text><rect x="40" y="639" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="657" fill="#eee" font-family="sans-serif" font-size="18">First charge, watched, with a temperature probe  45 min</text><rect x="40" y="673" width="22" height="22" fill="none" stroke="#ddd" stroke-width="2"/><text x="78" y="691" fill="#eee" font-family="sans-serif" font-size="18">Test prints: clip fit, 0.6 mm wall, glue post  40 min</text><text x="30" y="728" fill="#888" font-family="sans-serif" font-size="14">Write down: numbers, not impressions. Details: docs/bench/bench-day-1.md</text></svg>