hardware:   # parts / bench / built board (O21: nothing ordered before freeze)
  - {id: FMAC-RM-UNKNOWNS, src: "docs/research/drastic/V5-fmac-cordic.yaml rm_facts.unclear; fw/core/fmac_model.c A1/A2 (2026-10-07)", t: "RM0456 Rev 7 does not say how the FMAC's 16x16 product enters the 26-bit q4.22 accumulator (A1) or how bits are dropped at the q1.15 output (A2); the firmware model assumes floor for both. Read-back on a real U575 (Nucleo-U575 or rev 1), FIR with P=1 tap, CLIPEN=1, 8 inputs x = 0x0001, 0x007F, 0x0080, 0x00FF, 0xFFFF, 0xFF81, 0xFF80, 0xFF01: TEST A1 (output exact: R=7, b0=0x0001): expected under floor 0,0,0,0,-1,-1,-1,-1 (truncation toward zero gives 0 for all); TEST A2 (product exact: R=0, b0=0x0100): expected under floor 0,0,1,1,-1,-1,-1,-2 (truncation gives 0,0,1,1,0,0,-1,-1). `python3 sim/fw/fmac_model.py --bench` prints these expected words; a mismatch -> change A1/A2 in fw/core/fmac_model.c and the Python twin, re-run fwsim (L0, L2, D17)", blk: "hardware (any STM32U5 board; O21)"}
  - {id: E2-ALGO, src: "docs/sim/firmware-emulation.yaml FWSIM-R13 status; sim/fw/l2.py (2026-10-07)", t: "E2 listening test must choose the algorithm variant with these sim facts in hand: slim B (16 bands, 1.28 ms frames; fits ~44 MHz only as V4's tuned kernels) misses T2 bat-call recall 0.65 vs >= 0.80 - in the Python reference too, so it is the algorithm, not the port; algorithm A (heterodyne 38 kHz) misses EVERY FM bat call (recall 0) in Python and firmware with the old 575-tap decimator, and recalls 0.39 (still < 0.80) in both since the 16+40-tap cascade (lead decision 2026-10-07); spec B passes (0.83) but costs 94-119 MHz static in today's firmware (V4 floor 59-69)", opts: "A spec B at P80/P160 clock (rec until E2) / B slim B if her ears accept fewer bands and the recall loss / C A only as a tone-finder fallback", blk: "hardware (E2 listening, owner ears)"}
