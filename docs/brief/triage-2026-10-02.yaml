  problem: The NOW pass changes 12.B B1 (spec:664) to PMCXB290UE and 'fixes' D6 spec:187 'B1 prefers DMC2400UV'. But Q20 decides to adopt DMC2400UV-7 (OUT-06) in Rev F, so the text gets rewritten twice
    and contradicts the decided direction in the meantime. Q40's own rule is 'nothing is rewritten twice'. Also, retargeting the RM0394 citation at spec:253 to RM0456 is wrong. spec:252-255 describe the
    L452's DFSDM, and the U575 has ADF/MDF, not DFSDM, so the swap would attribute L452 facts to the U5 manual.
  fix: Move the B1 and D6 FET text into the post-pick pass. Mark the L452 DFSDM bullets (spec:253-255) as superseded by the v0.13 U575 bullets instead of re-citing them. For spec:182 (TIM1 outputs float
    at reset), re-verify the claim in RM0456 before changing the citation.
- id: Q07
  problem: 'Q07''s ''BOOT0 solder-blob/tack pad beside TP4'' conflicts with both sibling studies. Periphery PER-11 (periphery.md section 2.8) says no new pad is needed: R1''s PH3 pad is already on F and
    is the DFU-first tack point. Assembly ASM-02 (assembly.md:184, :202-203, :242) moves TP1-TP6, including TP4, off the board onto the snap-off frame, and also keeps R1''s PH3 pad as the tack point. A
    new in-pod pad spends O20 area that both studies show isn''t needed. Q07''s residual-risk line (''VDDUSB 3.0 V marginal, AN2606 asks 3.3 V'') also contradicts 00-whole.md risk 9: DS13737 Table 150 allows
    USB down to 2.7 V, and AN2606''s 3.3 V is boilerplate.'
  fix: 'Decide this in the package integration. Baseline: R1''s PH3 pad stays exposed on F as the first-flash tack point (PER-11). If ASM-02 is adopted, also bring BOOT0 out to the frame header. Add no
    new in-pod pad unless the layout session shows R1''s pad can''t be reached. Correct the VDDUSB residual-risk line. Keep the instrument-inventory ask for the freeze package.'
