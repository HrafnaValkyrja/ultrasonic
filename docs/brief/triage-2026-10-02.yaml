missed_by_extractor:
- SWD backup after snap-off (owner sub-call at the package pick). ASM-02 (docs/research/simplify/assembly.md:184, :202-203) moves TP1-TP6 off the pod board, so after snap-off the pod has no SWD pads. That
  changes how O18's 'SWD pads as backup' (spec:644) is met, and O18 requires such a removal to be stated. It is not among the sub-calls Q13-Q21. Its value also depends on whether she owns an ST-Link (Q07).
- 'Charging while worn (owner-only data, safety weight). Will she ever dock or charge a pod while it is on her head, e.g. at the PC for DFU, self-test or telemetry? She wears glasses full time, and ECR-0009
  item 1 (ECR-0009.md:10-11) assumes ''docked = not worn, never charge while worn''. If yes: U3''s ~0.3 W sits 0.2 mm above the pouch, which is on the head side of the stack (00-whole risk 13), so it becomes
  a skin-temperature issue, and firmware must cap ICHG or set CHG_DIS during data sessions. Ask at the package pick, before Rev F places U3, not only in the later Q22 read.'
- 'Numeric thresholds for the locked section 1.3 tests (owner-later, with E2/Q25). docs/sim/e2e-chain.yaml:166-190 marks several as ''assumed, owner to confirm'': T2.comfort_sl_p99_db <= 60 dB SL (currently
  83.6, ''would fail''), T1.event_sl_p90_db >= 10, T1.whine_suppression_db >= 20. Only T3 (Q30), T6/ambient (Q29) and the D17 ceiling (Q25) were extracted. O22 criterion 4 grades the stage-C sims against
  these numbers, so they must either be hers or be explicitly provisional.'
- 'Assembled-board count (money, freeze package). ASM-02''s diagnosability relies on keeping ''4 assembled: 2 to wear, 2 for diagnosis'' (assembly.md:203). That conflicts with O13''s lever ''assemble 2-3
  of 5 boards'' (spec:639) and with ECR-0010 item 3.'
- 'Safety-packet gap. The Q22 packet list leaves out 00-whole.md risk 1: J3 DOCK_VBUS sits 0.6 mm from J5 VBAT, so one solder bridge puts the cell on an exposed contact that can touch skin (sweat electrolysis).
  The fix is Claude''s (assembly.md:18 item (e): split the J pads by hazard class), but it belongs in her safety read.'
rejected_decisions:
- id: Q23
  problem: 'Q23 sets WATCHDOG_SEL=11 (disabled), reversing sub-power.md:143''s recommendation of 01. It weighs only option 01''s downsides and drops its stated main benefit: ''valuable in a bonded pod with
    no reset button'' (sub-power.md:143). With 11, recovery from a hang, or from an Off state that never wakes, rests on two legs. (1) The IWDG, which FWSIM-R55 (firmware-emulation.yaml:168) freezes in
    Stop 2. (2) WATCHDOG_15S_ENABLE, which may be switched off by WATCHDOG_SEL=11 (''completely disabled'', SLUSE99C Table 8-4). The datasheet-only bq25180.py model (U-FW4, :439) can''t settle that; only
    rev-1 bring-up step 7 can. So a wake-source bug in Off could leave a sealed pod unrecoverable without cutting it open. Off draw is 16-24 uA, so reaching BUVLO takes about a year.'
  fix: Keep owner_input n4 open as a firmware decision. Adopt 11 only if (a) the datasheet or TI confirms the 15 s HW reset still works with SEL=11, or (b) the IWDG runs in Stop with RTC kicks. Otherwise
    keep 01 with an RTC keep-alive and the boot-stub disarm (FWSIM-R21). In the Q22 safety packet, state this as a trade with a recommendation, not as a decided line.
