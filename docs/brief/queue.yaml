  - {id: A-PORT-SEAL, tier: A, one_line: "Mic air path lid->board. As built (open 1.5 mm gap): -15.4 dB, fails R14. Recommended: sealed straight duct ID 1.0 (+5.4 dB) WITH two preconditions: (1) a board x-stop / duct-locating feature in the shell (today's free board slide allows 2.22 mm offset vs 0.2 mm allowed), (2) either a firmware EQ notch ~-19 dB at ~84.7 kHz (duct mode, flash-loadable knob) or the S1 duct stack from the simplification study (passes 20-85 kHz). Ring gasket ID 2.1 = fallback (-4.5 dB, also needs the x-stop). Layout-agnostic: lid + gasket + shell feature", rec: "B sealed duct + x-stop; S1 stack if it fits, else the EQ notch", if_ignored: "rev 1 hears ~15 dB less with a hole near 26 kHz", src: [docs/sim/acoustics.yaml options (integrator 2026-10-02 23:45), docs/sim/index.yaml owner_needs], added: 2026-10-02, status: closed, OWNER accepted 2026-10-02 (spec O24-O26)}
