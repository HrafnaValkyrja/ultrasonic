<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1500" height="720" fill="#fbfaf7"/><text x="30.0" y="38.0" fill="#1f2328" font-size="22" text-anchor="start" font-weight="bold">Mic duct (Phase 2): hex mesh seat → bore D1.0 → VHB hole → board hole → mic</text><text x="30.0" y="62.0" fill="#57606a" font-size="13" text-anchor="start" font-weight="normal">section through the duct axis, to scale (120 px/mm), generated from hw/mech/dims_r2.py by docs/diagrams/make_duct_section.py</text><text x="30.0" y="84.0" fill="#57606a" font-size="13" text-anchor="start" font-weight="normal">axis offset: nominal 0.0, worst with the gauge pin 0.155 ≤ 0.2 (walls only 0.86); keep-out: no F copper / via within r 1.6 (R-ACO-P6)</text><text x="30.0" y="700.0" fill="#57606a" font-size="13" text-anchor="start" font-weight="normal">Acoustics: sealed duct +5.6 dB mean 20-96 kHz, duct peak +14.3 dB at ~56 kHz with the floor mesh (mesh_pick.py); firmware EQ notch from a bench sweep (sub-audio-in 13).</text><rect x="350.0" y="520.0" width="420.0" height="129.6" fill="#f3f1ea" stroke="#1f2328" stroke-width="1.5"/><text x="560.0" y="597.0" fill="#1f2328" font-size="13" text-anchor="middle" font-weight="normal">SPH0641 mic (B face, 1.08 max), port up</text><rect x="176.0" y="424.0" width="348.0" height="96.0" fill="#e8f3ec" stroke="#1a7a55" stroke-width="1.5"/><rect x="596.0" y="424.0" width="348.0" height="96.0" fill="#e8f3ec" stroke="#1a7a55" stroke-width="1.5"/><text x="184.0" y="477.0" fill="#1a7a55" font-size="13" text-anchor="start" font-weight="normal">board 0.8</text><rect x="176.0" y="388.0" width="324.0" height="30.0" fill="#fff4ea" stroke="#b8520a" stroke-width="1.5"/><rect x="620.0" y="388.0" width="324.0" height="30.0" fill="#fff4ea" stroke="#b8520a" stroke-width="1.5"/><text x="638.0" y="405.0" fill="#b8520a" font-size="12" text-anchor="start" font-weight="normal">VHB annulus seals on the F face</text><rect x="176.0