<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Flowchart of one pod, Rev F. Power: magnetic dock contacts, then a spark and wrong-way guard, then the battery charger (which charges the 175 mAh cell under the board), then a quiet 3.0 V regulator that feeds everything. Sound: the ultrasonic microphone feeds the microcontroller, which shifts ultrasound down into hearing range and drives the speaker driver, whose four wires run up the glasses arm to the bone-conduction speaker and status light in the ear pad. Control and data: USB data from the dock, battery level, the button and the test points reach the microcontroller; it drives the status light. Stars mark Rev F changes." font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8520a"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1200" height="900" rx="14" fill="#fbfaf7"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f2328">One pod, Rev F: how it works (flowchart)</text>
  <text x="30" y="66" font-size="13.5" fill="#57606a">Power comes in from the dock (orange); sound goes microphone → brain → speaker (blue). Blue boxes are on the board, green boxes are wired on by hand.</text>

  <!-- ===== flows (drawn first, boxes on top) ===== -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270,195 H324" stroke="#b8520a" marker-end="url(#ao)"/>
    <path d="M570,195 H624" stroke="#b8520a" marker-end="url(#ao)"/>
    <path d="M870,195 H924" stroke="#b8520a" marker-end="url(#ao)"/>
    <path d="M750,270 V300" stroke="#b8520a"/>
    <path d="M1050,270 V432 H150" stroke="#b8520a"/>
    <path d="M150,432 V449" stroke="#b8520a" marker-end="url(#ao)"/>
    <path d="M600,432 V449" stroke="#b8520a" marker-end="url(#ao)"/>
    <path d="M1050,432 V449" stroke="#b8520a" marker-end="url(#ao)"/>
    <path d="M270,560 H324" stroke="#2a78d6" marker-end="url(#ab)"/>
    <path d="M870,560 H924" stroke="#2a78d6" marker-end="url(#ab)"/>
    <path d="M1050,665 V694" stroke="#2a78d6" marker-end="url(#ab)"/>
  </g>
  <g fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="6 4">
    <path d="M450,270 V449" marker-end="url(#ag)"/>
    <path d="M750,410 V449" marker-end="url(#ag)"/>
    <path d="M270,755 H300 V620 H324" marker-end="url(#ag)"/>
    <path d="M450,700 V671" marker-end="url(#ag)"/>
    <path d="M850,665 V785 H924" marker-end="url(#ag)"/>
  </g>
  <g font-size="12" fill="#57606a">
    <text x="760" y="290">charges / powers</text>
    <text x="168" y="425" fill="#b8520a" font-weight="700">clean 3.0 V to everything</text>
    <text x="298" y="552" text-anchor="middle" fill="#2a78d6">sound</text>
    <text x="898" y="552" text-anchor="middle" fill="#2a78d6">sound</text>
    <text x="1064" y="686" fill="#2a78d6">4 wires up the arm</text>
    <text x="458" y="352">USB data</text>
    <text x="758" y="446">level</text>
    <text x="306" y="692">press</text>
    <text x="458" y="692">debug</text>
    <text x="864" y="778">light</text>
  </g>

  <!-- ===== row 1: power in ===== -->
  <g font-size="13" fill="#1f2328">
    <rect x="30" y="120" width="240" height="150" rx="9" fill="#e8f3ec" stroke="#1a7a55" stroke-width="2"/>
    <text x="44" y="146" font-size="15" font-weight="700">Magnetic dock</text>
    <text x="44" y="170">5 contacts: power, ground,</text>
    <text x="44" y="190">2 USB data, 1 "I am a USB</text>
    <text x="44" y="210">device" line</text>
    <text x="44" y="254" font-size="12" fill="#57606a">wire pads J3 J4★ J10 J11 J12</text>

    <rect x="330" y="120" width="240" height="150" rx="9" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="344" y="146" font-size="15" font-weight="700">Spark + wrong-way guard ★</text>
    <text x="344" y="170">Soaks up static zaps right at</text>
    <text x="344" y="190">the exposed contact; blocks</text>
    <text x="344" y="210">power if docked backwards;</text>
    <text x="344" y="230">guards the USB data lines</text>
    <text x="344" y="254" font-size="12" fill="#57606a">D5★ TPD1E10B06 · D4 · U6</text>

    <rect x="630" y="120" width="240" height="150" rx="9" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="644" y="146" font-size="15" font-weight="700">Battery charger ★</text>
    <text x="644" y="170">Fills the battery safely; no</text>
    <text x="644" y="190">charging when too hot or cold.</text>
    <text x="644" y="210">Docked: runs the pod straight</text>
    <text x="644" y="230">from the dock</text>
    <text x="644" y="254" font-size="12" fill="#57606a">U3 BQ25180 · RT1 temp sensor</text>

    <rect x="930" y="120" width="240" height="150" rx="9" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="944" y="146" font-size="15" font-weight="700">Quiet power regulator</text>
    <text x="944" y="170">Battery (3.0–4.2 V) in, steady</text>
    <text x="944" y="190">clean 3.0 V out. No switching</text>
    <text x="944" y="210">noise near the microphone</text>
    <text x="944" y="254" font-size="12" fill="#57606a">U4 TPS7A2030</text>

    <!-- row 2 -->
    <rect x="630" y="300" width="240" height="110" rx="9" fill="#e8f3ec" stroke="#1a7a55" stroke-width="2"/>
    <text x="644" y="326" font-size="15" font-weight="700">Battery</text>
    <text x="644" y="350">175 mAh lithium cell with its</text>
    <text x="644" y="370">own safety chip; aim 8–12 h</text>
    <text x="644" y="394" font-size="12" fill="#57606a">Renata ICP501233PA-02, under board</text>

    <!-- row 3: sound -->
    <rect x="30" y="455" width="240" height="210" rx="9" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="44" y="481" font-size="15" font-weight="700">Ultrasonic microphone</text>
    <text x="44" y="505">Hears ~20–85 kHz through a</text>
    <text x="44" y="525">0.6 mm pinhole in the board</text>
    <text x="44" y="545">and a mesh-covered lid hole.</text>
    <text x="44" y="565">Switched off when the pod</text>
    <text x="44" y="585">is off</text>
    <text x="44" y="649" font-size="12" fill="#57606a">U2 Knowles SPH0641LU4H-1</text>

    <rect x="330" y="455" width="540" height="210" rx="11" fill="#e8f0fb" stroke="#2a78d6" stroke-width="3"/>
    <text x="348" y="485" font-size="18" font-weight="700">The brain (microcontroller) ★</text>
    <text x="348" y="513" font-size="14">Shifts ultrasound down into your hearing range:</text>
    <text x="348" y="535" font-size="14">about 20–85 kHz in, 1.5–4 kHz out, separately in each ear.</text>
    <text x="348" y="563" font-size="14">Also runs the button, the status light, the battery gauge</text>
    <text x="348" y="585" font-size="14">and the speaker self-test; takes updates over the dock's USB.</text>
    <text x="348" y="645" font-size="12" fill="#57606a">U1 STM32U575 + its own efficient core supply (L1) + timekeeping crystal (Y1)</text>

    <rect x="930" y="455" width="240" height="210" rx="9" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="944" y="481" font-size="14.5" font-weight="700">Speaker driver + self-check ★</text>
    <text x="944" y="505">4 tiny switches flip the</text>
    <text x="944" y="525">speaker's voltage 200,000</text>
    <text x="944" y="545">times a second; the speaker</text>
    <text x="944" y="565">only follows the slow sound.</text>
    <text x="944" y="589">A tiny resistor measures the</text>
    <text x="944" y="609">current: the pod tests itself</text>
    <text x="944" y="649" font-size="12" fill="#57606a">Q1 Q2★ · R21 0.1 Ω sense</text>

    <!-- row 4 -->
    <rect x="30" y="700" width="240" height="110" rx="9" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="44" y="726" font-size="15" font-weight="700">Button</text>
    <text x="44" y="750">Press to wake or switch off;</text>
    <text x="44" y="770">sealed (IP68) under silicone</text>
    <text x="44" y="794" font-size="12" fill="#57606a">SW1 C&amp;K KMT022</text>

    <rect x="330" y="700" width="240" height="110" rx="9" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="344" y="726" font-size="15" font-weight="700">Test points ★</text>
    <text x="344" y="750">Gold dots for a programmer or</text>
    <text x="344" y="770">a probe, if anything needs fixing</text>
    <text x="344" y="794" font-size="12" fill="#57606a">TP1–TP6 · new dots TP7–TP10</text>

    <rect x="930" y="700" width="240" height="110" rx="9" fill="#e8f3ec" stroke="#1a7a55" stroke-width="2"/>
    <text x="944" y="726" font-size="15" font-weight="700">Ear pad</text>
    <text x="944" y="750">Bone-conduction speaker on</text>
    <text x="944" y="770">the tragus + status light</text>
    <text x="944" y="794" font-size="12" fill="#57606a">RC-BC02 exciter + LED</text>

    <!-- legend -->
    <g font-size="12.5" fill="#1f2328">
      <line x1="636" y1="716" x2="676" y2="716" stroke="#b8520a" stroke-width="3"/><text x="686" y="720">power</text>
      <line x1="636" y1="738" x2="676" y2="738" stroke="#2a78d6" stroke-width="3"/><text x="686" y="742">sound</text>
      <line x1="636" y1="760" x2="676" y2="760" stroke="#57606a" stroke-width="2" stroke-dasharray="6 4"/><text x="686" y="764">control / data</text>
      <rect x="640" y="774" width="32" height="14" rx="3" fill="#e8f3ec" stroke="#1a7a55" stroke-width="1.5"/><text x="686" y="786">wired on by hand</text>
      <text x="650" y="808" font-size="14">★</text><text x="686" y="807">changed in Rev F</text>
    </g>
  </g>
  <text x="30" y="852" font-size="13" fill="#57606a">Rev F = Phase 1 "logical simplification": 52 parts on a 34 × 13 mm board. Wire-by-wire detail: the schematic pages; where parts sit: the board map.</text>
  <text x="30" y="874" font-size="13" fill="#57606a">Not shown: the brain also sets the charger up over a 2-wire link, and its own clock and core-supply parts sit right beside it.</text>
</svg>
