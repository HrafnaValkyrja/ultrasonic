<text x="617.8000000000001" y="554.0" font-size="9.5" fill="#2a78d6" text-anchor="middle">D1.0</text>
<text x="521.5" y="618.8000000000001" font-size="10.5" fill="#2a78d6" text-anchor="middle">acoustic coupons (bare FR4)</text>
<text x="211.0" y="618.8000000000001" font-size="10.5" fill="#2a78d6" text-anchor="middle">free: the 70 x 70 minimum leaves this area anyway</text>
<rect x="710.0" y="86" width="440" height="119" rx="6" fill="#ffffff" stroke="#b8520a" stroke-width="1.2"/>
<text x="722.0" y="106" font-size="13" fill="#b8520a" text-anchor="start" font-weight="700">Why a panel at all</text>
<text x="722.0" y="126" font-size="11.5" fill="#1f2328" text-anchor="start">Standard PCBA (needed for the 0.4 mm DSBGA and 0.35 mm DFN):</text>
<text x="722.0" y="143" font-size="11.5" fill="#1f2328" text-anchor="start">single boards must be 70 x 70 mm or larger; panels 70-250 mm.</text>
<text x="722.0" y="160" font-size="11.5" fill="#1f2328" text-anchor="start">A 34 x 13 board therefore always ships in a panel, with rails.</text>
<text x="722.0" y="177" font-size="11.5" fill="#1f2328" text-anchor="start">Economic PCBA (10 x 10 min) is out: one side only, IC pitch &gt;= 0.4,</text>
<text x="722.0" y="194" font-size="11.5" fill="#1f2328" text-anchor="start">BGA pitch &gt;= 0.5, 0.8 mm only in the 2-layer HASL rows.</text>
<rect x="710.0" y="219" width="440" height="119" rx="6" fill="#ffffff" stroke="#1a7a55" stroke-width="1.2"/>
<text x="722.0" y="239" font-size="13" fill="#1a7a55" text-anchor="start" font-weight="700">What the O9 snap-off frame becomes</text>
<text x="722.0" y="259" font-size="11.5" fill="#1f2328" text-anchor="start">The rails and side islands ARE the frame: no extra FR4, no cost.</text>
<text x="722.0" y="276" font-size="11.5" fill="#1f2328" text-anchor="start">Pogo pads TP1-6 and spare-pin pads sit on the frame, not the board;</text>
<text x="722.0" y="293" font-size="11.5" fill="#1f2328" text-anchor="start">a printed jig locates on the 2 mm tooling holes. The optional USB-C</text>
<text x="722.0" y="310" font-size="11.5" fill="#1f2328" text-anchor="start">island is a dock simulator: USB, DFU and charging before any cable.</text>
<text x="722.0" y="327" font-size="11.5" fill="#1f2328" text-anchor="start">After snap-off the board keeps only mask-covered trace stubs.</text>
<rect x="710.0" y="352" width="440" height="136" rx="6" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.2"/>
<text x="722.0" y="372" font-size="13" fill="#4a3aa7" text-anchor="start" font-weight="700">Rules and surcharges from JLC (pages of 2026-09-09)</text>
<text x="722.0" y="392" font-size="11.5" fill="#1f2328" text-anchor="start">Mouse bites: board spacing 1.6-2 mm, tab &gt;= 4-5 mm, bites 0.5-0.8 mm.</text>
<text x="722.0" y="409" font-size="11.5" fill="#1f2328" text-anchor="start">V-cut: extra charge when a side is under 15 mm (ours is 13), and</text>
<text x="722.0" y="426" font-size="11.5" fill="#1f2328" text-anchor="start">+-0.4 mm tolerance: not used. Routed edge +-0.2 (high precision +-0.1).</text>
<text x="722.0" y="443" font-size="11.5" fill="#1f2328" text-anchor="start">Second design in the panel: +$8.21 SMT panel fee, plus a PCB fee.</text>
<text x="722.0" y="460" font-size="11.5" fill="#1f2328" text-anchor="start">Tabs go on the short edges where possible; a nub inside the 0.6 mm</text>
<text x="722.0" y="477" font-size="11.5" fill="#1f2328" text-anchor="start">clamp band is sanded flush (pocket needs 13.0 +0 / -0.05).</text>
<rect x="710.0" y="502" width="440" height="119" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/>
<text x="722.0" y="522" font-size="13" fill="#2a78d6" text-anchor="start" font-weight="700">One order (4 boards assembled)</text>
<text x="722.0" y="542" font-size="11.5" fill="#1f2328" text-anchor="start">PCB: 5 panels (the form counts panels) = 10 pod boards, 5 fit coupons,</text>
<text x="722.0" y="559" font-size="11.5" fill="#1f2328" text-anchor="start">15 acoustic coupons. Assembly: 2 panels = 4 pods (2 to wear, 2 spares;</text>
<text x="722.0" y="576" font-size="11.5" fill="#1f2328" text-anchor="start">JLC holds 8 MCUs). Fixed JLC assembly fees about $124-142</text>
<text x="722.0" y="593" font-size="11.5" fill="#1f2328" text-anchor="start">(sim/checks/assembly_fees.py). PCB fab and shipping are not quotable</text>
<text x="722.0" y="610" font-size="11.5" fill="#1f2328" text-anchor="start">from a static page: read them off the live quote form.</text>
<text x="40" y="828" font-size="10.5" fill="#57606a" text-anchor="start">Sources: jlcpcb.com/capabilities/pcb-assembly-capabilities and /pcb-capabilities; help/article/pcb-assembly-price, .../specifications-for-adding-process-edges-and-positioning-holes,</text>
<text x="40" y="842" font-size="10.5" fill="#57606a" text-anchor="start">.../in-what-cases-will-there-be-charged-extra; cart.jlcpcb.com/quote (form text). Read 2026-10-02.</text>
