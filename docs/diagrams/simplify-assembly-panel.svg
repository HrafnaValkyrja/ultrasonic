<text x="40" y="32" font-size="20" fill="#1f2328" text-anchor="start" font-weight="700">One JLC Standard-PCBA panel, 70 x 70 mm: two pod boards, the test frame, free coupons</text>
<text x="40" y="52" font-size="12.5" fill="#57606a" text-anchor="start">To scale. JLC Standard PCBA needs a panel of at least 70 x 70 mm with 5 mm edge rails, 2 mm tooling holes and 1 mm fiducials</text>
<text x="40" y="69" font-size="12.5" fill="#57606a" text-anchor="start">(capabilities page and process-edge guide, read 2026-10-02). Rails and frame are discarded; the pod board itself stays 34 x 13 or smaller.</text>
