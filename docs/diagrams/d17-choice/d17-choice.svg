<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1400" height="980" fill="#000000"/>
<text x="40" y="52" font-size="32" fill="#e8e8e5" text-anchor="start" font-weight="bold">Which loudness do we ship?</text>
<text x="40" y="84" font-size="18" fill="#a4a9b0" text-anchor="start">Can she hear every bat call, in each place she might walk? Pick a column.</text>
<rect x="256" y="128" width="268" height="680" rx="14" fill="#141518" stroke="#2c2e34" stroke-width="1.5"/>
