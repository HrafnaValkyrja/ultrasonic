<text x="40" y="956" font-size="12" fill="#a4a9b0" text-anchor="start">Sources: 2969b65, 31fba64 (hearing); 3414ce5, b944df6 (loud-mode battery); cea34fe (real-use battery). Dense = calls 81% of the time, dusk = 18%; loud music = nonstop; A+X+L battery scaled +2%. Call level 75 dB assumed.</text>
