<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1970" role="img" aria-label="Safety explainer: dock, charger and cell with five failure cases, protections and yes/no decisions" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="900" height="1970" fill="#fbfaf7"/><text x="30" y="52" font-size="34" fill="#1f2328" text-anchor="start" font-weight="bold">Is the pod safe to charge and wear?</text><text x="30" y="86" font-size="22" fill="#57606a" text-anchor="start">5 things that can go wrong, what stops each, what you decide</text><rect x="30" y="120" width="200" height="110" rx="14" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2.5"/><text x="130" y="160" font-size="26" fill="#2a78d6" text-anchor="middle" font-weight="bold">Dock</text><text x="130" y="192" font-size="20" fill="#1f2328" text-anchor="middle">5 V, own pads</text><text x="130" y="216" font-size="18" fill="#57606a" text-anchor="middle">on the pod belly</text><rect x="350" y="120" width="200" height="110" rx="14" fill="#fff4ea" stroke="#b8520a" stroke-width="2.5"/><text x="450" y="160" font-size="26" fill="#b8520a" text-anchor="middle" font-weight="bold">Charger</text><text x="450" y="192" font-size="20" fill="#1f2328" text-anchor="middle">TI BQ25180</text><text x="450" y="216" font-size="18" fill="#57606a" text-anchor="middle">chip on the pod</text><rect x="670" y="120" width="200" height="110" rx="14" fill="#e8f3ec" stroke="#1a7a55" stroke-width="2.5"/><text x="770" y="160" font-size="26" fill="#1a7a55" text-anchor="middle" font-weight="bold">Cell</text><text x="770" y="192" font-size="20" fill="#1f2328" text-anchor="middle">130 mAh pouch</text><text x="770" y="216" font-size="18" fill="#57606a" text-anchor="middle">own guard board</text><path d="M236,175 L342,175" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/><path d="M556,175 L662,175" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/><rect x="350" y="270" width="200" height="70" rx="14" fill="#fff4ea" stroke="#e34948" stroke-width="2.5"/><text x="450" y="302" font-size="21" fill="#e34948" text-anchor="middle" font-weight="bold">Exciter output</text><text x="450" y="328" font-size="19" fill="#1f2328" text-anchor="middle">OFF while docked</text><path d="M450,230 L450,270" stroke="#e34948" stroke-width="4" stroke-dasharray="8 6"/><text x="470" y="257" font-size="18" fill="#e34948" text-anchor="start">interlock</text><rect x="30" y="370" width="840" height="290" rx="14" fill="#ffffff" stroke="#e34948" stroke-width="2.5"/><circle cx="80" cy="418" r="26" fill="#e34948"/><text x="80" y="427" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="125" y="427" font-size="28" fill="#1f2328" text-anchor="start" font-weight="bold">Too much current into the cell</text><text x="55" y="468" font-size="21" fill="#1f2328" text-anchor="start">Cell max is 130 mA. Docs still say 170 mA</text><text x="55" y="498" font-size="21" fill="#1f2328" text-anchor="start">(that was for the old 175 mAh cell).</text><text x="55" y="528" font-size="21" fill="#1f2328" text-anchor="start">Stops it: charge stops at 4.2 V; 6 h timer;</text><text x="55" y="558" font-size="21" fill="#1f2328" text-anchor="start">cell guard board. Chip starts at 10 mA.</text><rect x="50" y="584" width="800" height="56" rx="10" fill="#f3f1ea" stroke="#e34948" stroke-width="2.5"/><text x="66" y="612" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Cap charging at about 65 mA?</text><text x="850" y="427" font-size="20" fill="#e34948" text-anchor="end" font-weight="bold">rec: yes   Y / N</text><rect x="30" y="682" width="840" height="290" rx="14" fill="#ffffff" stroke="#b8520a" stroke-width="2.5"/><circle cx="80" cy="730" r="26" fill="#b8520a"/><text x="80" y="739" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="125" y="739" font-size="28" fill="#1f2328" text-anchor="start" font-weight="bold">Cell too hot or too cold</text><text x="55" y="780" font-size="21" fill="#1f2328" text-anchor="start">Cell may only charge at 0 to 45 C.</text><text x="55" y="810" font-size="21" fill="#1f2328" text-anchor="start">Stops it: thermistor next to the charger</text><text x="55" y="840" font-size="21" fill="#1f2328" text-anchor="start">pauses charging. Catch: chip default trips</text><text x="55" y="870" font-size="21" fill="#1f2328" text-anchor="start">at 60 C, so firmware must set 45 C.</text><rect x="50" y="896" width="800" height="56" rx="10" fill="#f3f1ea" stroke="#b8520a" stroke-width="2.5"/><text x="66" y="924" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">First charge on the bench, fire-safe, temp logged?</text><text x="850" y="739" font-size="20" fill="#b8520a" text-anchor="end" font-weight="bold">rec: yes   Y / N</text><rect x="30" y="994" width="840" height="290" rx="14" fill="#ffffff" stroke="#b8520a" stroke-width="2.5"/><circle cx="80" cy="1042" r="26" fill="#b8520a"/><text x="80" y="1051" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="125" y="1051" font-size="28" fill="#1f2328" text-anchor="start" font-weight="bold">Charger chip overheats</text><text x="55" y="1092" font-size="21" fill="#1f2328" text-anchor="start">Plan was 0.3 W at 170 mA. Less at 65 mA.</text><text x="55" y="1122" font-size="21" fill="#1f2328" text-anchor="start">Stops it: chip slows itself at 100 C and</text><text x="55" y="1152" font-size="21" fill="#1f2328" text-anchor="start">shuts off at 150 C. Sits near the cell,</text><text x="55" y="1182" font-size="21" fill="#1f2328" text-anchor="start">so we measure it.</text><rect x="50" y="1208" width="800" height="56" rx="10" fill="#f3f1ea" stroke="#b8520a" stroke-width="2.5"/><text x="66" y="1236" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Accept: measure cell and chip heat on the first charge?</text><text x="850" y="1051" font-size="20" fill="#b8520a" text-anchor="end" font-weight="bold">rec: yes   Y / N</text><rect x="30" y="1306" width="840" height="290" rx="14" fill="#ffffff" stroke="#4a3aa7" stroke-width="2.5"/><circle cx="80" cy="1354" r="26" fill="#4a3aa7"/><text x="80" y="1363" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="125" y="1363" font-size="28" fill="#1f2328" text-anchor="start" font-weight="bold">Bad dock power or a short</text><text x="55" y="1404" font-size="21" fill="#1f2328" text-anchor="start">Dock over 5.5 to 5.9 V, a short on the</text><text x="55" y="1434" font-size="21" fill="#1f2328" text-anchor="start">pod's power, or a cell overdraw.</text><text x="55" y="1464" font-size="21" fill="#1f2328" text-anchor="start">Stops it: chip cuts input, retries,</text><text x="55" y="1494" font-size="21" fill="#1f2328" text-anchor="start">then stays off until re-docked.</text><rect x="50" y="1520" width="800" height="56" rx="10" fill="#f3f1ea" stroke="#4a3aa7" stroke-width="2.5"/><text x="66" y="1548" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Ask Renata what the cell guard board cuts off at?</text><text x="850" y="1363" font-size="20" fill="#4a3aa7" text-anchor="end" font-weight="bold">rec: yes   Y / N</text><rect x="30" y="1618" width="840" height="290" rx="14" fill="#ffffff" stroke="#1a7a55" stroke-width="2.5"/><circle cx="80" cy="1666" r="26" fill="#1a7a55"/><text x="80" y="1675" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="125" y="1675" font-size="28" fill="#1f2328" text-anchor="start" font-weight="bold">Sound plays while docked</text><text x="55" y="1716" font-size="21" fill="#1f2328" text-anchor="start">Docked = not worn (you said no, O32).</text><text x="55" y="1746" font-size="21" fill="#1f2328" text-anchor="start">Stops it: no output when dock power is seen.</text><text x="55" y="1776" font-size="21" fill="#1f2328" text-anchor="start">Conflict: the self-test needs sound while</text><text x="55" y="1806" font-size="21" fill="#1f2328" text-anchor="start">docked. Fix: quiet test only, self-test mode.</text><rect x="50" y="1832" width="800" height="56" rx="10" fill="#f3f1ea" stroke="#1a7a55" stroke-width="2.5"/><text x="66" y="1860" font-size="20" fill="#1f2328" text-anchor="start" font-weight="bold">Allow quiet self-test sound (-12 dBFS) while docked?</text><text x="850" y="1675" font-size="20" fill="#1a7a55" text-anchor="end" font-weight="bold">rec: yes   Y / N</text><text x="30" y="1940" font-size="19" fill="#57606a" text-anchor="start">Nothing is ordered or charged until you answer. Defaults stay as listed.</text></svg>