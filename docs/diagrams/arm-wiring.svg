<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Where the transducer wires go. Two fine flexible wires leave the board through a service loop, exit the pod through a grommet in the arm's anchor, run inside the arm's silicone sleeve beside the NiTi spring, and are soldered to the transducer inside the pad housing. Three cross-section options are compared; option A, two litz wires beside the NiTi in the sleeve, is recommended." font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs>
  <rect width="1000" height="600" rx="14" fill="#fbfaf7"/>
  <text x="40" y="40" font-size="18" font-weight="700" fill="#1f2328">Where the transducer wires go</text>
  <text x="40" y="62" font-size="13" fill="#57606a">Two wires carry the bridge output (OUT+ / OUT−, ~0.3 A peaks) from the board to the transducer in the pad.</text>

  <!-- pod outline -->
  <rect x="60" y="90" width="430" height="170" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="75" y="112" font-size="13" font-weight="700" fill="#1f2328">pod (side view, face to the left)</text>
  <rect x="90" y="130" width="220" height="80" rx="4" fill="#e8f0fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="200" y="175" font-size="12" fill="#2a78d6" text-anchor="middle">board: bridge → 2 solder pads</text>
  <!-- service loop -->
  <path d="M310,190 C360,190 380,150 400,170 C420,190 380,225 420,232 L440,245" fill="none" stroke="#e34948" stroke-width="3"/>
  <path d="M310,196 C360,196 385,158 405,176 C425,196 386,230 426,236 L446,249" fill="none" stroke="#2a78d6" stroke-width="3"/>
  <text x="505" y="130" font-size="12" fill="#1f2328">① service loop inside the pod:</text>
  <text x="505" y="145" font-size="12" fill="#57606a">slack, so the arm's flex never</text>
  <text x="505" y="160" font-size="12" fill="#57606a">pulls on the solder joints</text>
  <!-- anchor + grommet -->
  <rect x="425" y="240" width="40" height="26" rx="4" fill="#ddd4b4" stroke="#1f2328" stroke-width="1.5"/>
  <text x="505" y="250" font-size="12" fill="#1f2328">② anchor boss + silicone grommet:</text>
  <text x="505" y="265" font-size="12" fill="#57606a">NiTi clamped here; wires pass through a sealed hole</text>
  <text x="505" y="280" font-size="12" fill="#57606a">and the curved root support keeps them from kinking</text>
  <!-- arm -->
  <line x1="445" y1="266" x2="560" y2="400" stroke="#2f2f33" stroke-width="16" stroke-linecap="round"/>
  <line x1="445" y1="266" x2="560" y2="400" stroke="#8a8676" stroke-width="4"/>
  <line x1="450" y1="266" x2="565" y2="400" stroke="#e34948" stroke-width="1.6"/>
  <line x1="440" y1="268" x2="555" y2="402" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="585" y="330" font-size="12" fill="#1f2328">③ inside the arm's silicone sleeve (Ø1.8 mm),</text>
  <text x="585" y="345" font-size="12" fill="#57606a">beside the Ø0.75 NiTi spring; 20 mm, 30° sweep</text>
  <!-- pad -->
  <rect x="530" y="395" width="70" height="95" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="2" transform="rotate(-30 565 442)"/>
  <rect x="545" y="415" width="40" height="55" rx="3" fill="#f3f1ea" stroke="#8a8676" stroke-width="1.2" transform="rotate(-30 565 442)"/>
  <text x="620" y="445" font-size="12" fill="#1f2328">④ pad housing: wires soldered to the transducer's</text>
  <text x="620" y="460" font-size="12" fill="#57606a">tabs, NiTi end crimped or glued into a pocket; potted</text>

  <!-- cross sections -->
  <text x="40" y="520" font-size="14" font-weight="700" fill="#1f2328">Arm cross-section options</text>
  <g>
    <circle cx="110" cy="560" r="26" fill="#2f2f33" stroke="#1a7a55" stroke-width="3"/>
    <circle cx="104" cy="560" r="11" fill="#8a8676"/>
    <circle cx="124" cy="552" r="5" fill="#e34948"/>
    <circle cx="124" cy="568" r="5" fill="#2a78d6"/>
    <text x="150" y="548" font-size="13" font-weight="700" fill="#1a7a55">A: NiTi + 2 litz wires in the sleeve (recommended)</text>
    <text x="150" y="565" font-size="12" fill="#57606a">how hearing-aid receiver cables work; plain soldering;</text>
    <text x="150" y="580" font-size="12" fill="#57606a">the spring carries no current</text>
  </g>
  <g>
    <circle cx="520" cy="560" r="22" fill="#2f2f33" stroke="#8a8676" stroke-width="2"/>
    <circle cx="514" cy="560" r="11" fill="#b8520a"/>
    <circle cx="532" cy="560" r="5" fill="#2a78d6"/>
    <text x="555" y="548" font-size="13" font-weight="700" fill="#1f2328">B: NiTi is one conductor</text>
    <text x="555" y="565" font-size="12" fill="#57606a">one wire fewer, but NiTi won't</text>
    <text x="555" y="580" font-size="12" fill="#57606a">solder: crimped at both ends</text>
  </g>
  <g>
    <circle cx="810" cy="560" r="24" fill="#2f2f33" stroke="#8a8676" stroke-width="2"/>
    <circle cx="820" cy="560" r="9" fill="#b8520a"/>
    <circle cx="800" cy="560" r="9" fill="#b8520a"/>
    <text x="842" y="548" font-size="13" font-weight="700" fill="#1f2328">C: twin NiTi conductors</text>
    <text x="842" y="565" font-size="12" fill="#57606a">pad can't twist; 4 crimps,</text>
    <text x="842" y="580" font-size="12" fill="#57606a">two wires to heat-set alike</text>
  </g>
</svg>
