<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="The bench rig: a laptop connects by USB to a Nucleo dev board carrying the same processor as the final design. The dev board clocks a mic breakout board that hears ultrasound from test sources, and drives a small bridge test board that powers the transducer, which is held at the tragus on a test arm clipped to the glasses. Each part is labelled with the question it answers." font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8520a"/></marker>
  </defs>
  <rect width="1000" height="600" rx="14" fill="#fbfaf7"/>
  <text x="40" y="40" font-size="18" font-weight="700" fill="#1f2328">The bench rig: the real circuit, spread out on the desk</text>
  <text x="40" y="64" font-size="13" fill="#57606a">Same chip, same mic, same transducer as the final design, but on big boards joined by wires, so every signal can be measured and changed.</text>

  <!-- laptop -->
  <rect x="40" y="250" width="150" height="95" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/>
  <text x="115" y="285" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">Laptop</text>
  <text x="115" y="305" font-size="12" text-anchor="middle" fill="#1f2328">loads firmware,</text>
  <text x="115" y="321" font-size="12" text-anchor="middle" fill="#1f2328">records, plots</text>
  <line x1="190" y1="297" x2="318" y2="297" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="254" y="288" font-size="11.5" text-anchor="middle" fill="#1f2328">USB</text>

  <!-- nucleo -->
  <rect x="320" y="215" width="220" height="165" rx="8" fill="#e8f3ec" stroke="#1baf7a" stroke-width="2"/>
  <text x="430" y="245" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">Dev board ×2</text>
  <text x="430" y="264" font-size="12" text-anchor="middle" fill="#1f2328">NUCLEO-U575ZI-Q, ~$24</text>
  <text x="430" y="290" font-size="12" text-anchor="middle" fill="#1f2328">our exact processor +</text>
  <text x="430" y="306" font-size="12" text-anchor="middle" fill="#1f2328">its switching regulator,</text>
  <text x="430" y="322" font-size="12" text-anchor="middle" fill="#1f2328">built-in programmer</text>
  <text x="430" y="352" font-size="11.5" text-anchor="middle" fill="#1a7a55" font-weight="700">runs the real firmware</text>
  <text x="430" y="368" font-size="11.5" text-anchor="middle" fill="#1a7a55">(one per ear later, for stereo)</text>

  <!-- mic breakout -->
  <rect x="640" y="100" width="210" height="95" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/>
  <text x="745" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">Mic board ×2</text>
  <text x="745" y="147" font-size="12" text-anchor="middle" fill="#1f2328">SPH0641 ultrasonic mic</text>
  <text x="745" y="163" font-size="12" text-anchor="middle" fill="#1f2328">on a breakout, $12.50</text>
  <text x="745" y="182" font-size="11" text-anchor="middle" fill="#57606a">+ port-hole test coupons (JLC)</text>
  <line x1="540" y1="250" x2="640" y2="160" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="548" y="215" font-size="11.5" fill="#1f2328">clock / data</text>

  <!-- sources -->
  <rect x="880" y="100" width="95" height="95" rx="8" fill="#fff4ea" stroke="#b8520a" stroke-width="1.6"/>
  <text x="927" y="126" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b8520a">Test sounds</text>
  <text x="927" y="146" font-size="11" text-anchor="middle" fill="#b8520a">40 kHz sensor</text>
  <text x="927" y="162" font-size="11" text-anchor="middle" fill="#b8520a">(HC-SR04, $2)</text>
  <text x="927" y="178" font-size="11" text-anchor="middle" fill="#b8520a">keys · bats</text>
  <line x1="880" y1="147" x2="853" y2="147" stroke="#b8520a" stroke-width="1.8" marker-end="url(#o)"/>

  <!-- bridge test board -->
  <rect x="640" y="265" width="210" height="95" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/>
  <text x="745" y="293" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">Bridge test board</text>
  <text x="745" y="312" font-size="12" text-anchor="middle" fill="#1f2328">the 4 output transistors,</text>
  <text x="745" y="328" font-size="12" text-anchor="middle" fill="#1f2328">made by JLC, ~$3 each</text>
  <text x="745" y="347" font-size="11" text-anchor="middle" fill="#57606a">I design it</text>
  <line x1="540" y1="310" x2="638" y2="310" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="590" y="302" font-size="11.5" text-anchor="middle" fill="#1f2328">4 gate wires</text>

  <!-- transducer on glasses -->
  <rect x="640" y="420" width="210" height="110" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/>
  <text x="745" y="448" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">Transducer on you</text>
  <text x="745" y="467" font-size="12" text-anchor="middle" fill="#1f2328">RC-BC02 ×3 (+ Dayton ref.)</text>
  <text x="745" y="483" font-size="12" text-anchor="middle" fill="#1f2328">on a test NiTi arm</text>
  <text x="745" y="499" font-size="12" text-anchor="middle" fill="#1f2328">taped to your glasses</text>
  <line x1="745" y1="360" x2="745" y2="418" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="755" y="394" font-size="11.5" fill="#1f2328">2 thin wires</text>

  <!-- battery -->
  <rect x="320" y="440" width="220" height="70" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/>
  <text x="430" y="467" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">Small LiPo ×2</text>
  <text x="430" y="487" font-size="12" text-anchor="middle" fill="#1f2328">100 mAh, $5.95: real current</text>
  <line x1="430" y1="440" x2="430" y2="382" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- why box -->
  <rect x="40" y="410" width="250" height="170" rx="10" fill="#fff4ea" stroke="#b8520a" stroke-width="1.6"/>
  <text x="55" y="434" font-size="13" font-weight="700" fill="#b8520a">Questions only this can answer</text>
  <g font-size="12" fill="#1f2328">
    <text x="55" y="456">• How loud is the transducer on</text>
    <text x="67" y="471">your skin? (nobody publishes it)</text>
    <text x="55" y="491">• Can you hear the regulator</text>
    <text x="67" y="506">whine? (only your ears know)</text>
    <text x="55" y="526">• Does the mic still hear through</text>
    <text x="67" y="541">our tiny port hole?</text>
    <text x="55" y="561">• What do real bats sound like?</text>
  </g>
</svg>
