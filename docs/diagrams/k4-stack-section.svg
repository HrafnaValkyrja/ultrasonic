<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" font-family="DejaVu Sans, sans-serif">
<rect width="1280" height="700" fill="#fbfaf7"/>
<text x="24" y="36" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="start">K4 stack, side section: lid at the top, tub floor at the bottom</text>
<text x="24" y="58" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">dims_k4.py, 2026-10-08 (ECR-0020..0023). Thickness x 60; mm in the labels. Boards are 15.5 mm long, mated by one BM28 pair.</text>
<rect x="120" y="90" width="580" height="60.0" rx="2" fill="#fff4ea" stroke="#1f2328" stroke-width="1.5"/>
<text x="716" y="125.0" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Lid 1.0 (flat underside = seam, y 9.7)</text>
<rect x="120" y="150.0" width="580" height="57.0" rx="2" fill="#fff4ea" stroke="#b8520a" stroke-width="1.5"/>
<text x="716" y="183.5" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Lid ledge 0.70 + VHB 0.25 = 0.95</text>
<text x="716" y="200.5" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">ledge band 0.5 wide, 0.2 in from the board edge; clear of M lid-face parts</text>
<rect x="120" y="207.0" width="580" height="48.0" rx="2" fill="#e8f3ec" stroke="#1a7a55" stroke-width="1.5"/>
<text x="716" y="236.0" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Board M 0.8 (lid face = F)</text>
<text x="716" y="253.0" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">SW1 button, wire pads J4 J5 J7 J8; B face: mic U2, U3, U4</text>
<rect x="120" y="255.0" width="580" height="36.0" rx="2" fill="#e8f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="716" y="278.0" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">BM28 mated gap 0.6</text>
<text x="716" y="295.0" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">M parts hang in here (mic U2 port through the lid duct)</text>
<rect x="120" y="291.0" width="580" height="48.0" rx="2" fill="#e8f3ec" stroke="#1a7a55" stroke-width="1.5"/>
<text x="716" y="320.0" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Board P 0.8 (file F.Cu = inner face)</text>
<text x="716" y="337.0" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">inner: Q1 Q2 (0.37 high); outer: U1 chip, L1 coil</text>
<rect x="120" y="339.0" width="580" height="50" rx="2" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
<text x="716" y="355.0" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Floor clearance 0.65 nominal (0.16 worst case), then the tub floor</text>
<rect x="190" y="253.0" width="70" height="40.0" rx="2" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="225" y="278.0" font-size="12" fill="#2a78d6" font-weight="bold" text-anchor="middle">BM28</text>
<text x="280" y="278.0" font-size="11.5" fill="#2a78d6" font-weight="normal" text-anchor="start">30-pin + 4 power tabs</text>
<rect x="450" y="365.0" width="70" height="24" rx="2" fill="#e8f0fb" stroke="#4a3aa7" stroke-width="2"/>
<rect x="460" y="341.0" width="50" height="14" rx="1" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<text x="485" y="352.0" font-size="11" fill="#1f2328" font-weight="bold" text-anchor="middle">U1</text>
<text x="440" y="363.0" font-size="10.5" fill="#57606a" font-weight="normal" text-anchor="end">gap (not to scale)</text>
<text x="535" y="409.0" font-size="12.5" fill="#4a3aa7" font-weight="bold" text-anchor="start">Glue post, printed short by 0.5875</text>
<text x="535" y="427.0" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">epoxy dab on the Kapton over U1 fills it: lid -> M -> BM28 -> P -> U1 -> post is one rigid column (ECR-0023 add.2)</text>
<text x="535" y="443.0" font-size="11.5" fill="#57606a" font-weight="normal" text-anchor="start">post pad 2.4 x 2.4 on U1 top, at board x 8.2</text>
<circle cx="70" cy="110" r="13" fill="#b8520a" stroke="#b8520a" stroke-width="1.5"/>
<text x="70" y="115" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">A</text>
<text x="70" y="140" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">lid side</text>
<circle cx="70" cy="347.0" r="13" fill="#b8520a" stroke="#b8520a" stroke-width="1.5"/>
<text x="70" y="352.0" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">B</text>
<text x="70" y="377.0" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">belly side</text>
<text x="120" y="560" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Total board stack 3.2 mm; stack 15.5 x 12.0. The lid carries the stack on VHB; P hangs from M through BM28 and rests on nothing.</text>
<text x="120" y="584" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Dock pads and magnets sit under the cell, not in this section: see k4-dock-section.</text>
<text x="120" y="612" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Pinch the pair only at the post: the dab stops lid push (SW1 press) from loading the BM28 contacts.</text>
</svg>