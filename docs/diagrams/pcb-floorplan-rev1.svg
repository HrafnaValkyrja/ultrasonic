<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="Rev 1 PCB floorplan idea, not a design. A 4-layer double-sided board about 28 by 13 mm. Front end: the mic on the inner face with its port, on the board centre line, far from the switching parts. Middle: the MCU on the outer face with its switching-regulator inductor and capacitors tight on the opposite end from the mic. Rear: charger, LDO, ESD and the H-bridge transistors next to a row of wire pads for the arm, cell and dock. A test-pad column runs along the top edge, with the snap-off test frame beyond the board edge. Layer 2 is a solid ground plane." font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" rx="14" fill="#fbfaf7"/>
  <text x="36" y="40" font-size="20" font-weight="700" fill="#1f2328">Rev 1 PCB: floorplan idea (not a layout yet)</text>
  <text x="36" y="62" font-size="13" fill="#57606a">~28 × 13 mm, 4 layers, parts on both faces. Scale ≈ 30 px/mm. Front of the glasses is on the LEFT. We'll lay it out together (spec O14).</text>
  <g font-size="12" fill="#1f2328">
    <text x="36" y="102" font-size="15" font-weight="700">Outer face (toward the lid)</text>
    <rect x="36" y="112" width="840" height="390" rx="10" fill="#e8f3ec" stroke="#1a7a55" stroke-width="2.5"/>
    <!-- zones outer -->
    <rect x="60" y="150" width="160" height="300" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="72" y="176" font-weight="700">QUIET END</text><text x="72" y="196">mic port (seal ring,</text><text x="72" y="214">keep-out r 1.6 mm)</text><text x="72" y="238">on the centre line</text><text x="72" y="256">→ same board fits</text><text x="72" y="274">both pods</text>
    <circle cx="140" cy="330" r="18" fill="none" stroke="#2a78d6" stroke-width="2"/><circle cx="140" cy="330" r="5" fill="#2a78d6"/>
    <rect x="250" y="190" width="230" height="230" rx="6" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="262" y="216" font-weight="700">U1 MCU 7×7</text><text x="262" y="236">decoupling caps tight</text><text x="262" y="254">on every VDD pin</text>
    <rect x="510" y="150" width="140" height="160" rx="6" fill="#fff4ea" stroke="#b8520a" stroke-width="2"/>
    <text x="520" y="176" font-weight="700">SMPS loop</text><text x="520" y="196">L1 + 2×2.2 µF + 10 µF</text><text x="520" y="214">smallest possible loop,</text><text x="520" y="232">FAR from the mic</text>
    <rect x="510" y="330" width="140" height="110" rx="6" fill="#ffffff" stroke="#b8520a" stroke-width="1.5"/>
    <text x="520" y="356" font-weight="700">SW1 IP68 switch</text><text x="520" y="376">under the lid button</text><text x="520" y="394">hole, centre line</text>
    <rect x="680" y="150" width="170" height="290" rx="6" fill="#ffffff" stroke="#8a8676" stroke-width="1.5"/>
    <text x="692" y="176" font-weight="700">WIRE PAD COLUMN</text>
    <g font-size="11"><text x="692" y="200">VBUS · GND</text><text x="692" y="220">BAT− · OUT_A · OUT_B</text><text x="692" y="240">LED− · LED+ · BAT+</text><text x="692" y="260">NTC · D+ · D−</text></g>
    <text x="692" y="290" fill="#57606a">1.0 × 1.6 mm pads,</text><text x="692" y="308" fill="#57606a">ordered so no solder</text><text x="692" y="326" fill="#57606a">bridge shorts the cell</text>
    <text x="692" y="356" fill="#57606a">all hand wiring lands</text><text x="692" y="374" fill="#57606a">on this one edge</text>
    <!-- test pads -->
    <g fill="#ddd4b4" stroke="#8a8676">
      <circle cx="270" cy="130" r="9"/><circle cx="310" cy="130" r="9"/><circle cx="350" cy="130" r="9"/><circle cx="390" cy="130" r="9"/><circle cx="430" cy="130" r="9"/><circle cx="470" cy="130" r="9"/><circle cx="510" cy="130" r="9"/><circle cx="550" cy="130" r="9"/>
    </g>
    <text x="580" y="134" fill="#57606a">test-pad row (rails, SWD, clocks)</text>
    <rect x="36" y="508" width="840" height="34" rx="6" fill="#f3f1ea" stroke="#8a8676" stroke-dasharray="6 4"/>
    <text x="48" y="530" fill="#57606a">snap-off test frame (same panel): SWD header + probe points, broken off after bring-up</text>
    <!-- inner face -->
    <text x="912" y="102" font-size="15" font-weight="700">Inner face (toward the cell)</text>
    <rect x="912" y="112" width="252" height="390" rx="10" fill="#e8f3ec" stroke="#1a7a55" stroke-width="2"/>
    <g font-size="11.5">
      <text x="924" y="140" font-weight="700">front: U2 mic (port up)</text>
      <text x="924" y="170" font-weight="700">middle: Y1 crystal</text><text x="924" y="186">short traces to PC14/15,</text><text x="924" y="202">guard ring, away from SMPS</text>
      <text x="924" y="232" font-weight="700">rear: power + bridge</text>
      <text x="924" y="252">U3 BQ25180 charger</text><text x="924" y="270">U4 LDO · ESD parts</text><text x="924" y="288">Q1/Q2 bridge near OUT pads</text>
      <text x="924" y="318" font-weight="700">rules</text>
      <text x="924" y="338">• bridge + SMPS switching</text><text x="924" y="354">  currents stay at the rear</text>
      <text x="924" y="374">• mic clock/data short,</text><text x="924" y="390">  over unbroken ground</text>
      <text x="924" y="410">• layer 2 = solid ground</text><text x="924" y="426">• 0 Ω links between blocks</text>
      <text x="924" y="446">• ≤ 1.2 mm tall parts</text><text x="924" y="462">  (cell sits 0.2 mm below)</text>
    </g>
  </g>
  <text x="36" y="580" font-size="13" fill="#1f2328">Why this order: the mic must not hear 200 kHz bridge edges or the 3 MHz SMPS (audit MP-01), so noisy parts cluster at the rear,</text>
  <text x="36" y="600" font-size="13" fill="#1f2328">next to where their currents leave the board; the quiet analogue end (mic, crystal) sits at the front over an unbroken ground plane.</text>
  <text x="36" y="626" font-size="12" fill="#57606a">Size is a target for the bigger rev 1 (spec O15); rev 2 shrinks back toward 20 × 11.5 mm.</text>
</svg>
