<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="DejaVu Sans, sans-serif">
<rect width="980" height="520" fill="#fbfaf7"/>
<text x="24" y="36" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="start">First charge: bench setup</text>
<text x="24" y="58" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Supervised, on a hard non-burning surface, with a log. Stop rule is on the right.</text>
<rect x="40" y="100" width="560" height="330" rx="8" fill="#fff4ea" stroke="#e34948" stroke-width="2.5"/>
<text x="60" y="128" font-size="14" fill="#e34948" font-weight="bold" text-anchor="start">Fire-safe LiPo bag, open flap, on a ceramic tile</text>
<rect x="120" y="190" width="280" height="150" rx="6" fill="#e8f3ec" stroke="#1a7a55" stroke-width="2"/>
<text x="260" y="270" font-size="13" fill="#1a7a55" font-weight="bold" text-anchor="middle">Pod (tub + stack,</text>
<text x="260" y="290" font-size="13" fill="#1a7a55" font-weight="bold" text-anchor="middle">lid taped, NOT bonded)</text>
<circle cx="160" cy="360" r="12" fill="#e34948" stroke="#e34948" stroke-width="1.5"/>
<text x="185" y="365" font-size="12" fill="#1f2328" font-weight="normal" text-anchor="start">thermocouple on the cell</text>
<line x1="160" y1="348" x2="190" y2="300" stroke="#e34948" stroke-width="2"/>
<rect x="420" y="220" width="150" height="60" rx="4" fill="#e8f0fb" stroke="#2a78d6" stroke-width="2"/>
<text x="495" y="255" font-size="12.5" fill="#2a78d6" font-weight="bold" text-anchor="middle">dock head + USB</text>
<line x1="420" y1="250" x2="400" y2="250" stroke="#2a78d6" stroke-width="2.5"/>
<polygon points="400.0,250.0 410.1,245.7 410.1,254.3" fill="#2a78d6"/>
<text x="640" y="120" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="start">Stop rules (E6, ECR-0009)</text>
<text x="640" y="160" font-size="15" fill="#e34948" font-weight="bold" text-anchor="start">1.</text>
<text x="662" y="160" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Cell above 45 C: unplug, wait, find why.</text>
<text x="640" y="212" font-size="15" fill="#e34948" font-weight="bold" text-anchor="start">2.</text>
<text x="662" y="212" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Cell swells, hisses, smells sweet: unplug, bag shut, outdoors.</text>
<text x="640" y="264" font-size="15" fill="#e34948" font-weight="bold" text-anchor="start">3.</text>
<text x="662" y="264" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Charge current looks wrong (meter in line): stop.</text>
<text x="640" y="316" font-size="15" fill="#e34948" font-weight="bold" text-anchor="start">4.</text>
<text x="662" y="316" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Never leave it alone. Log every 5 minutes.</text>
<text x="40" y="470" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Log columns: time, cell temp, VBAT (meter), USB current, LED state. Expect charge to end at VBATREG 4.20 V.</text>
</svg>