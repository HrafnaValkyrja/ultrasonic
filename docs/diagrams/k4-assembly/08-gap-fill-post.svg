<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif" font-size="13">
<rect width="640" height="360" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#222">Gap-filling bonded post (ECR-0023 add.2) - section through U1, not to scale</text>
<g fill="#ddd" stroke="#333"><rect x="60" y="60" width="300" height="26"/><rect x="60" y="100" width="300" height="12" fill="#8c8"/></g>
<text x="370" y="78" fill="#222">M board (lid side, up)</text>
<text x="370" y="110" fill="#222">P board, U1 hangs below</text>
<rect x="130" y="112" width="160" height="30" fill="#bbb" stroke="#333"/>
<text x="150" y="132" fill="#222">U1 (QFN48, top = bearing face)</text>
<rect x="165" y="144" width="90" height="12" fill="#e8c040" stroke="#333"/>
