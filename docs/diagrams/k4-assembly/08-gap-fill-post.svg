<text x="450" y="292" fill="#222">tub floor</text>
<text x="20" y="330" fill="#222">1 dab on post top  2 close pod, dab squeezes to the real gap  3 clamp, cure  4 press path: lid-M-BM28-P-U1-dab-post-floor</text>
