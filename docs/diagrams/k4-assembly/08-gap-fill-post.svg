<text x="262" y="184" fill="#222">cured epoxy dab: 0.05 to 1.125 mm, ~10 uL</text>
<rect x="165" y="206" width="90" height="70" fill="#6a8fd8" stroke="#333"/>
<text x="262" y="244" fill="#222">printed post 2.4 x 2.4, set SHORT by 0.5875</text>
