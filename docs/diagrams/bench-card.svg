<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1377" role="img" aria-label="Bench card with three at-the-bench jobs" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><rect width="900" height="1377" fill="#fbfaf7"/><text x="30" y="52" font-size="34" fill="#1f2328" text-anchor="start" font-weight="bold">Bench card: jobs for your hands</text><text x="30" y="86" font-size="22" fill="#57606a" text-anchor="start">No parts to order. Tick the box when done.</text><rect x="30" y="120" width="840" height="385" rx="14" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/><rect x="52" y="150" width="34" height="34" rx="6" fill="none" stroke="#2a78d6" stroke-width="3"/><text x="105" y="178" font-size="28" fill="#1f2328" text-anchor="start" font-weight="bold">Measure you and your glasses</text><text x="105" y="210" font-size="21" fill="#2a78d6" text-anchor="start" font-weight="bold">Time: 20 min, needs a helper</text><text x="52" y="250" font-size="18" fill="#57606a" text-anchor="start" font-weight="bold">BRING</text><text x="52" y="276" font-size="20" fill="#1f2328" text-anchor="start">your glasses, calipers, mm ruler, phone, a pen,</text><text x="52" y="303" font-size="20" fill="#1f2328" text-anchor="start">100 g weight + string (optional)</text><text x="52" y="340" font-size="18" fill="#57606a" text-anchor="start" font-weight="bold">WRITE DOWN</text><text x="52" y="366" font-size="20" fill="#1f2328" text-anchor="start">- Pen-tip vision edge along the arm (3 tries, mm from hinge)</text><text x="52" y="393" font-size="20" fill="#1f2328" text-anchor="start">- Arm thickness x width, 50 mm behind hinge</text><text x="52" y="420" font-size="20" fill="#1f2328" text-anchor="start">- Photos: ruler by the ear, mouth open</text><text x="52" y="447" font-size="20" fill="#1f2328" text-anchor="start">- Optional: sideways give under 100 g</text><rect x="30" y="527" width="840" height="385" rx="14" fill="#ffffff" stroke="#b8520a" stroke-width="2.5"/><rect x="52" y="557" width="34" height="34" rx="6" fill="none" stroke="#b8520a" stroke-width="3"/><text x="105" y="585" font-size="28" fill="#1f2328" text-anchor="start" font-weight="bold">Wear a weight for 2 hours</text><text x="105" y="617" font-size="21" fill="#b8520a" text-anchor="start" font-weight="bold">Time: 2 h, do other things</text><text x="52" y="657" font-size="18" fill="#57606a" text-anchor="start" font-weight="bold">BRING</text><text x="52" y="683" font-size="20" fill="#1f2328" text-anchor="start">coins or washers, weighed (about 10 g each),</text><text x="52" y="710" font-size="20" fill="#1f2328" text-anchor="start">tape, kitchen scale</text><text x="52" y="747" font-size="18" fill="#57606a" text-anchor="start" font-weight="bold">WRITE DOWN</text><text x="52" y="773" font-size="20" fill="#1f2328" text-anchor="start">- Weight per side, spot (mm behind hinge)</text><text x="52" y="800" font-size="20" fill="#1f2328" text-anchor="start">- Could you wear it all day? yes / no</text><text x="52" y="827" font-size="20" fill="#1f2328" text-anchor="start">- Where it rubs or tips the glasses</text><rect x="30" y="934" width="840" height="385" rx="14" fill="#ffffff" stroke="#1a7a55" stroke-width="2.5"/><rect x="52" y="964" width="34" height="34" rx="6" fill="none" stroke="#1a7a55" stroke-width="3"/><text x="105" y="992" font-size="28" fill="#1f2328" text-anchor="start" font-weight="bold">Shokz listening test</text><text x="105" y="1024" font-size="21" fill="#1a7a55" text-anchor="start" font-weight="bold">Time: about 1 h</text><text x="52" y="1064" font-size="18" fill="#57606a" text-anchor="start" font-weight="bold">BRING</text><text x="52" y="1090" font-size="20" fill="#1f2328" text-anchor="start">the broken Shokz, phone with the 3 test sounds</text><text x="52" y="1117" font-size="20" fill="#1f2328" text-anchor="start">(audible, translated, combined), calipers</text><text x="52" y="1144" font-size="20" fill="#1f2328" text-anchor="start">Do not charge it if swollen, dented or warm</text><text x="52" y="1181" font-size="18" fill="#57606a" text-anchor="start" font-weight="bold">WRITE DOWN</text><text x="52" y="1207" font-size="20" fill="#1f2328" text-anchor="start">- Does it still play? yes / no</text><text x="52" y="1234" font-size="20" fill="#1f2328" text-anchor="start">- Heard at the tragus: clear / muffled / buzzy</text><text x="52" y="1261" font-size="20" fill="#1f2328" text-anchor="start">- Best spot and pressure (about 1 N)</text><text x="52" y="1288" font-size="20" fill="#1f2328" text-anchor="start">- Cell and board size in mm, thickness</text><text x="30" y="1349" font-size="19" fill="#57606a" text-anchor="start">Nothing else needs your hands yet: the rest waits on parts.</text></svg>