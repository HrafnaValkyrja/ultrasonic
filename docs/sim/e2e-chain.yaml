# ------------------------------------------------------------------------------------------------ chain
rates:   # hardware clocks: docs/sim/shared-params.yaml#clocks (HCLK 80.009 MHz; PDM 4,000,450 Hz; PCM/PWM 200,022.5 Hz)
  acoustic: {fs: 400000, unit: Pa, shape: "[N]", why: "Nyquist 200 kHz covers the 200 kHz PWM carrier and the 20-96 kHz band; = pipeline.FS_IN"}
  mic_pdm_clock: {hz: 4000450, src: "shared-params clocks.fs_pdm_hz = HCLK/20 (stages.FS_CLK_MIC; was 4,000,400 until 2026-10-02)", sim: "not run per bit in the chain (flat-EIN mic model + analytic ADF); stages.pdm_bitstream_selftest runs a true 1-bit 4.0 MHz stream for the CIC5 gain only"}
  pcm: {fs: 200000, hardware: 200022.5, src: "shared-params clocks; the 112 ppm difference is ignored inside the e2e (all its rates scale together, D14 L249)", unit: "FS-peak, 1.0 = 0 dBFS", shape: "[N/2]"}
  dsp_out: {fs: 12500, unit: "duty, 1.0 = full-scale differential", shape: "[N/32]", src: spec D14 L246}
  pwm: {fs: 200000, unit: "duty after x16 interpolation + shaper, 201 levels", shape: "[N/2]", src: spec D6 L155}
  coil_force: {fs: 200000, unit: "A, N", shape: "[N/2]", note: "per-PWM-period average; the 200 kHz carrier and ripple are not in the stream (ripple handled analytically: I_ripple_pk = Vdd/(4 L f), spec D6 L167)"}
stages:   # order = chain order; status: real|model|stub; process(Sig, Ctx) -> Sig; swap by id
  - {id: acoustic_path, cls: stages.AcousticPort, status: "stub (flat) | model (port_json given)", in: "Pa @400k", out: "Pa @400k", model: "flat, Lorentzian bands (port_bands), or IF-ACOUSTIC-PORT json (magnitude, 511-tap linear-phase FIR; np.interp holds the 1 kHz / 100 kHz edge values outside the provider's 1-100 kHz grid: affects only 100-120 kHz, which the ADF stub attenuates 0..70 dB)", src: "spec D13 L232, R14 L608"}
  - {id: mic, cls: stages.Microphone, status: model, in: "Pa @400k", out: "FS @400k", model: "pipeline.microphone: -26 dBFS/94 dB SPL, datasheet response FIR, flat EIN; knobs mic_sens_db (+-1 dB, D13 L227), mic_noise_scale", src: "datasheet Rev B-1 p.3 (Syntiant, local ../ultrasonic-scratch/sph0641_sq.pdf.txt, read 2026-10-02)"}
  - {id: supply_inject, cls: stages.SupplyInject, status: "stub | model (mic_vdd_json given)", in: "FS @400k (+ V @400k)", out: "FS @400k", model: "volts at mic VDD x PSRR(f), scenarios flat55|pess35|rolloff (shared-params#psrr); sources: ext_ripple_mv white 1-100 kHz; IF-MIC-VDD-NOISE background lines + PSD (mic_vdd_json); loopback = bridge supply current x |h_ibridge_to_micvdd(f)| FIR (json) or scalar h_mic_ohm (stub, renamed from z_rail_ohm)", src: "datasheet p.3; IF-MIC-VDD-NOISE"}
  - {id: adf, cls: stages.AdfDecimator, status: "stub for D1 (RSFLT unpublished), real for D2", in: "FS @400k", out: "FS @200k", model: "D1 = CIC5 droop (exact, -0.777 dB at 85 kHz = A3 -0.78) x RSFLT stub (flat to 88.8 kHz, raised-cosine to -70 dB at 120 kHz); D2 = pipeline.decimate_to_fs; true 1-bit 2nd-order PDM + CIC5 only in selftest (tone gain -0.07 dB vs model)", src: "A3 plan s1.2; RM0456 Fig. 338 (figure only)"}
  - {id: dsp, cls: stages.DspStage, status: real, in: "FS @200k", out: "duty @12.5k", model: "pipeline.algo_b (default) or algo_a; knobs transient_only, volume_db, ceiling_dbfs, noise_cal=matched|nominal; replace by FirmwareDspShaperStage (cosim)", src: "spec s5 L312-L334"}
  - {id: shaper, cls: stages.PwmShaper, status: model, in: "duty @12.5k", out: "duty @200k", model: "x16 interpolation (interp=ideal(Kaiser b9)|linear|zoh), squelch (rms 5 ms < squelch_dbfs for 20 ms -> exact 0, dither off, shaper state reset), 3rd-order error feedback, TPDF dither, 201 levels; exports x_interp_peak (pre-quantiser true peak) and ccr_stream_peak", src: "spec D6 L155,L176-L181", unspecified_in_spec: [interpolator filter, squelch threshold, state reset]}
  - {id: bridge, cls: stages.Bridge, status: model, in: "duty @200k", out: "V @200k", model: "V = Vdd*duty - Vdd*4*td_eff*f_pwm*clip(i/I_ripple_pk,-1,1), td_eff = max(td - 10.5 ns, 0); also outputs supply current", validated: {vs: "ngspice DMC2400UV, -12 dBFS, 0.3 mH, 2 kHz", date: 2026-10-02, fitted_12p5ns: {spice_db: -51.9, model_db: -51.0}, out_of_sample_25ns: {spice_db: -38.4, model_db: -34.8, delta_db: 3.6, status: "OPEN (> 3 dB)"}, limits: "fitted at 12.5 ns; no dead-time term at -40 dBFS (SPICE -61/-48/-44 dB at 12.5/25/37.5 ns); PMCXB290UE unmodelled (pseudo-stage fet_model)"}, src: "spec D6 L166-L175; C3 s5"}
  - {id: exciter, cls: stages.Exciter, status: stub, in: "V @200k", out: "A @200k", model: "series R_tot = r_exc + 1.52 (pair, wire, shunt), L, motional parallel RLC from (bl, m_eff, f0, qm): Rm = Bl^2/c, Lm = Bl^2/k, Cm = m/Bl^2; bilinear at 200 kHz", params: "docs/sim/shared-params.yaml#exciter nominal (= sim/acoustics/bone.py): R 8 ohm, L 0.5 mH, Bl 1.0 N/A, m 0.45 g, f0 350 Hz, Q 3; D17 runs the peak-current corner R 8 ohm, L 0.3 mH (stages.PEAK_CORNER)", changed: "2026-10-02 21:20: was L 0.3 mH, f0 800, m 0.6 g, Rm 2 ohm -> Bl 1.41 (own stub); now one exciter for e2e, acoustics and layout-noise"}
  - {id: mech_bone, cls: stages.MechBone, status: stub, in: "A @200k", out: "N @200k", model: "F = Bl*i*H; H = 1 (flat) or blocked-housing high-pass; no pad/skin/cartilage coupling (IF-BONE-TF replaces it 0.25-16 kHz)", src: "IF-BONE-TF"}
  - {id: proxy, cls: metrics.sensation_level, status: "model, thresholds from shared-params#thresholds", in: "N @200k", out: "SL dB [frames,19 third-octave bands 250-16k], loudness_proxy", model: "8192-pt Hann spectrogram, 20 ms hop; thr convention retfl_minus_tragus (default: ARL-TR-4138 Table 8 RETFL - 20 dB) or front_measured (Surendran 2023); key SL metrics print the other convention in note; loudness = sum 2^((SL-40)/10) over SL>0 (Stevens-style, NOT ISO 532)"}
pseudo_stages:   # stages.PSEUDO_STATUS; listed in metric deps so the metric prints WARN while the assumption stands
  mic_ein: {status: stub, assumption: "mic ultrasonic noise floor = audio-band EIN extrapolated flat (29.7 dB SPL A)", retire: E3}
  fet_model: {status: stub, assumption: "DMC2400UV stand-in; PMCXB290UE SPICE model behind the Nexperia bot wall (sub-output issue 7)", retire: "vendor model or E7 / S2 measurement"}
  psrr: {status: stub, assumption: "mic PSRR above 1 kHz (shared-params#psrr scenarios)", retire: "S2 supply-injection sweep (layout-noise LN-R12)"}

# ------------------------------------------------------------------------------------------------ interfaces
interfaces:   # provider docs: docs/sim/acoustics.yaml, docs/sim/layout-noise.yaml, docs/sim/firmware-emulation.yaml; table: docs/sim/index.yaml interfaces
  IF-ACOUSTIC-PORT:
    provider: "sim/acoustics/run_port.py (docs/sim/acoustics.yaml interfaces)"
    consumer: "stages.AcousticPort.curve_db (param port_json)"
    files: {as_built: sim/acoustics/out/port_response.json, recommended: sim/acoustics/out/port_response_chimney_d1.0.json, fallback: sim/acoustics/out/port_response_gasket_id2.1.json}
    format: "json {f_hz[500 log 1-100 kHz], mag_db, phase_deg, bands, cond, ...}; consumed: f_hz + mag_db (magnitude only)"
    ref: "RATIO p_diaphragm(our path) / p_diaphragm(mic port flush in a baffle): multiply with the datasheet curve (stages.Microphone does, AcousticPort sits before it); NOT free-field-to-diaphragm, which would count the mic's 25 kHz peak twice"
    results_2026-10-02: {as_built: {T1.event_out_dbfs: -39.4, T1.event_sl_p90_db: 59.9, T2.call_recall_20ms: 0.43, T1.background_sl_max_db: -209.5}, chimney_d1.0: {T1.event_out_dbfs: -18.9, T1.event_sl_p90_db: 79.7, T2.call_recall_20ms: 1.00, T1.background_sl_max_db: 28.9, T2.comfort_sl_p99_db: 80.0}, reading: "the open gap loses the bats (recall 0.43) AND hides the self-noise breakthrough (F12); the sealed duct restores both"}
  IF-ACOUSTIC-LEAK:
    provider: "sim/acoustics (air path only; structure path has no provider)"
    consumer: T6 requirement check
    format: "json {f_hz, mag_db_pa_per_n}, ref 'pressure at the mic port per newton of COIL force Bl*i (the force driving the housing)'"
    requirement_from_e2e: {nominal_exciter: "<= 472 Pa/N", loud_corner: "<= 46 Pa/N (Bl 2.0, L 0.3 mH, R 8 ohm: max shaped-noise force 12 uN rms in 20-85 kHz)", basis: "shaped-noise force must stay 6 dB below the mic floor (1.10 mPa rms in 20-85 kHz)", src: "sim/out/e2e/T6.json info + corner run 2026-10-02 21:30"}
    provider_value: "0.27 Pa/N at the lid; x port ratio (chimney +20.2 dB peak at 84.7 kHz) -> <= ~2.7 Pa/N at the diaphragm: ~25 dB margin vs the loud corner"
  IF-MIC-VDD-NOISE:
    provider: "sim/noise/budget.py export_if (docs/sim/layout-noise.yaml interfaces); Rev F board sha e159bccb65b756d9"
    consumer: "stages.SupplyInject (param mic_vdd_json) + chain.run_chain loopback"
    format: "f_hz 1-196 kHz (323); h_ibridge_to_micvdd_ohm {re,im} (THIS is the mic transfer); z_rail_ohm {re,im} (the BRIDGE rail Q1.4-R21.2: not used here); background_lines_1k_100k [{f_hz, v_rms}]; background_noise [{f_hz[], psd_v2_per_hz[]}]"
    use: "background lines (random phase) + PSD -> V(t) at 400 kS/s; loopback: |h(f)| as 511-tap linear-phase FIR on ctx.side['i_sup'] (phase ignored: single path)"
    check_2026-10-02: {cmd: "chain.py --scenario T6 --dur 3 --no-plot --set mic_vdd_json=\"'sim/noise/out/IF-MIC-VDD-NOISE.json'\" loopback=True psrr_mode=\"'rolloff'\"", mic_vdd_noise_mv_rms: 0.1665, provider_mv_rms: 0.1666, squelch_margin_db: 7.34, without_supply_db: 7.80, reading: "Rev F copper costs 0.46 dB of squelch margin under the worst PSRR"}
    requirement_from_e2e: "per line / per band AFTER PSRR in 20-96 kHz (layout-noise LN-M01 form: tone <= -112.3 dBFS per 781 Hz bin, band <= -93.1 dBFS over 20-85 kHz); the old '<= 0.3 / 10 mV rms over 1-100 kHz' is RETIRED (white-ripple derivation, ill-posed for a line spectrum)"
    sweep_supply_2026-10-02: "white ripple at which the idle output rises by >= 1 dB: flat55 10 mV; pess35 1 mV; rolloff 0.3 mV (sweep_supply.json)"
  IF-BONE-TF:
    provider: "sim/acoustics/bone.py (sim/acoustics/out/bone_tf.json), later E2"
    consumer: "stages.MechBone (loader not written: F = 10^(mag_db_n_per_a/20) * i over 0.25-16 kHz)"
    consistency: "exciter parameters now shared (shared-params#exciter): current from stages.Exciter and force from bone.py use the same Bl, L, f0, m; above 16 kHz keep F = Bl*i (the leak requirement is per newton of coil force)"
    need: "absolute level to +-6 dB; sets whether T2 is loud enough and T6 silent (same unknown on both)"
  IF-EXCITER-Z: {provider: "E1 (LCR) + F4 self-test |Z| sweep (firmware FWSIM-R59)", consumer: "docs/sim/shared-params.yaml#exciter (then every sim)", format: "json {r_dc, l_mh, zsweep:{f_hz,|Z|,phase_deg}}"}
  IF-HEAD-SHADOW: {provider: "acoustics sim (not provided: plate = infinite baffle)", consumer: "scn_T3 (level offset applied directly)", format: "json {az_deg, f_hz, ild_db} at 25-60 kHz"}
  IF-OWNER-HEARING: {provider: "E5 (hearing sweep, spec C5) and E11 (quiet-room ambient)", consumer: "metrics.threshold_db owner_offset_db; ambient comparator not implemented", format: "json {f_hz, thr_db_spl_air, thr_db_re_1un_bone_tragus}, ambient third-octave dB SPL"}
  IF-FW-DSP:
    provider: "firmware harness (docs/sim/firmware-emulation.yaml FWSIM-R9/R10)"
    consumer: stages.FirmwareDspShaperStage(hop_fn)
    abi: "in int32[128] ADF1 DR words (24-bit left-aligned DR[31:8], 200.02 kS/s, 0.64 ms/hop); out uint16[128] TIM1 CCR (0..200, one per 5 us period at 200 kHz); V_diff/Vdd = 2*CCR/ARR - 1 = leg A high fraction minus leg B (leg B on TIM1_CH3/CH3N since Rev F: the firmware writes CCR1 and CCR3 = ARR - CCR1, the ABI carries one value)"
    replaces: [dsp, shaper]
    selftest: "fw_abi.roundtrip_lsb 0.15 LSB24, fw_abi.centre_ccr_duty 0 (2026-10-02)"
    missing: "firmware must also export the DSP-out tap and the pre-quantiser true peak for metrics T1/T2/D17 (FWSIM-R10)"

