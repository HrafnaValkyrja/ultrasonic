# SIM-E2E: end-to-end chain simulation, mic -> exciter -> audibility proxy. Audience: other Claude instances.
# Format rules (owner 2026-10-02): current state only; every fact carries src (file:symbol | spec Lnn | URL) + date; pointers not copies;
# invariants are checkable thresholds; one 'why:' per non-obvious item. Dates are ISO. Lnn = line in docs/spec.md as of 2026-10-02
# (file header says v0.14, content is v0.15). Run: see run.cmd. Re-run after ANY change listed in watch. Catalogue: docs/sim/index.yaml.
meta:
  id: SIM-E2E
  date: 2026-10-02
  scope: "ladder step C (owner O18, spec L644): simulation + firmware tested before hardware; catches hardware-only failure classes before the board order"
  layout_agnostic: true   # reads no .kicad_pcb/.kicad_sch/.net; design values enter only through design_binding + docs/sim/shared-params.yaml; geometry only through IF-* files from sibling sims
  code: [sim/e2e/chain.py, sim/e2e/stages.py, sim/e2e/metrics.py]
  shared: docs/sim/shared-params.yaml   # exciter, PSRR scenarios, thresholds (both conventions), clocks, ceiling definition: read at import
  outputs: sim/out/e2e/   # <scenario>.json, <scenario>_spectrogram.png (dark, tools/plotstyle.py, 2.5 s window), summary.json, sweep_<name>.json
  last_run: {date: 2026-10-02T21:25, cmd: "chain.py --scenario all --no-plot", wall_s: 14.0, peak_rss_mb: 672, pass: 5, warn: 28, open: 0, fail: 3, plus_spice: "1 OPEN (validation at 25 ns 3.6 dB > 3; 10.2 s, 537 MB)"}
  honesty: "6 of 10 stages are stub or model with placeholder parameters, plus 3 pseudo-stage assumptions (mic_ein, fet_model, psrr); every audibility number (SL, loudness) is a stub-dependent proxy and prints WARN, never PASS"
  status_words: {PASS: "threshold met, no stub in the way", WARN: "a stub or pseudo-stub decides it (line shows would pass/fail)", OPEN: "fails an ASSUMED threshold (owner confirms the number)", FAIL: "fails a spec or derived threshold with no stub in the way"}
abbr:
  ADF1: STM32U575 Audio Digital Filter (PDM->PCM hardware block, keeps running in Stop 2)
  AD: 2-level PWM modulation, bridge legs complementary (spec D6 L166)
  CCR: TIM1 capture/compare register, duty counts 0..ARR (ARR 200)
  CIC5: 5th-order cascaded integrator-comb (sinc^5) decimator, first stage of ADF1
  RSFLT: ADF1 reshape IIR filter after the CIC (coefficients unpublished, risk R18)
  PDM: pulse-density modulation, 1-bit stream at the mic clock (4.00045 MHz)
  PCM: pulse-code modulated samples (here 200 kS/s)
  DT: dead time between the two FETs of a bridge leg
  EIN: equivalent input noise of the mic (dB SPL)
  PSRR: "power-supply rejection ratio (mic: dB below full scale per volt of supply ripple)"
  FS: digital full scale; this repo's convention dBFS peak-ref = a sine of peak 1.0 is 0 dBFS (pipeline.dbfs)
  ILD: interaural level difference (dB), the stereo cue (spec D2 L107)
  TA: transcranial attenuation, isolation between the two ears' exciters (spec D1 L87-L88)
  SL: sensation level = dB above the owner's threshold; proxy here, see proxy
  RETFL: reference equivalent threshold force level, dB re 1 uN (ISO 389-3, mastoid)
  FWIL: firmware-in-the-loop (firmware replaces the DSP stage)
  stub: "placeholder where an INTERFACE or measurement is missing; model: new model with sourced params; real: existing repo model used as is"
  pseudo-stage: "an assumption with no stage object (mic_ein, fet_model, psrr): metric deps name it so the metric prints WARN"
  pre-roll: "seconds of steady scene before the measured window (6 s >= 2x the DSP floor tracker's 3 s rise)"
  IF-*: interface contract with a sibling sim (section interfaces)
  E/O/R/D-n: owner bench measurement / owner decision / risk / decision in docs/spec.md sections 12/12/11/4
  S1-S4: "bench stages of spec section 10 (superseded in part by O9: rev 1 board is the prototype)"

run:
  cmd: "source tools/env.sh && systemd-run --user --scope --quiet -p MemoryMax=3G -p MemorySwapMax=0 python3 sim/e2e/chain.py [--scenario T1|T2|T3|T6|D17|lat|pwr|selftest|spice|R15|all] [--dur S] [--preroll 6.0] [--seed 1] [--set k=v ...] [--sweep exciter|mic|port|supply] [--no-plot]"
  smoke: "same fence, chain.py --scenario all --no-plot   # 14.0 s, 672 MB (2026-10-02 21:25)"
  fence: {memory_max_gb: 3, why: "parallel-agent rule, CLAUDE.md 2026-10-02; never FreeRouting/place*.py"}
  pythons: {venv: /opt/ultrasonic-tools/venv, python: 3.14.4, numpy: 2.5.3, scipy: 1.18.1, matplotlib: 3.11.2, PyYAML: 6.0.3, scikit-fem: 12.0.2, src: "pip list, 2026-10-02"}
  measured_2026-10-02T21:25:   # wall = whole process incl. imports, one scenario per process, fenced 3 GB; src: /usr/bin/time; audio = pre-roll + measured
    T1:       {audio_s: "6 + 2", wall_s: 2.5, rss_mb: 470, with_plot: {wall_s: 3.5, rss_mb: 643}}
    T2:       {audio_s: "6 + 2", wall_s: 2.4, rss_mb: 471, with_plot: {wall_s: 3.4, rss_mb: 641}}
    T6:       {audio_s: "10 + 5 x 0.6 power-ons", wall_s: 5.6, rss_mb: 505, with_plot: {wall_s: 6.8, rss_mb: 749}}
    R15:      {audio_s: "6 + 4", wall_s: 4.2, rss_mb: 536, with_plot: {wall_s: 5.4, rss_mb: 761}}
    D17:      {audio_s: 1.0, wall_s: 1.0, rss_mb: 189}
    spice:    {wall_s: 10.2, rss_mb: 537, note: "2 ngspice cases x ~5 s x ~450 MB; not in all"}
    all:      {no_plot: {wall_s: 14.0, rss_mb: 672}, with_plot: {wall_s: 19.6, rss_mb: 2161, note: "one process: RSS does not shrink between scenarios; plot per scenario instead"}}
    sweeps:   {exciter: {wall_s: 1.3, rss_mb: 185}, supply: {wall_s: 3.0, rss_mb: 200}}
  scaling: {time: "~0.25 s compute per second of audio (no plot)", memory: "~160 MB base + ~39 MB per second of audio (no plot); plotting is capped at PLOT_SPAN_S 2.5 s", max_single_run_s_at_3gb: "~60 s no-plot (estimate 2.5 GB: H1 runs now, chunking optional)", correction: "the 2026-10-02 01:22 figures (170 MB/s, 12 s limit) included plotting the whole run (skeptic re-measure, confirmed)"}

