# ------------------------------------------------------------------------------------------------ cosim
cosim:
  orchestrator: "chain.run_chain(src_pa, params, seed) -> (taps{id:Sig}, Ctx, status{id:status} incl. pseudo-stages); loopback=True re-runs once with bridge supply current x h(f) injected at the mic (2nd pass, same rng seeds)"
  plugin_interface: "class Stage {id, status, process(Sig, Ctx)->Sig}; Sig{x ndarray [N], fs Hz, unit str, meta}; Ctx{p params, rng, side dict (cross-stage outputs), inject}; replace a stage by returning a different object with the same id from default_chain"
  replace_points:
    firmware_in_the_loop: {replaces: [dsp, shaper], stage: stages.FirmwareDspShaperStage, abi: IF-FW-DSP, harness: "host gcc -shared + ctypes, or an emulator, behind hop_fn", compare_against: "pipeline.algo_b + PwmShaper outputs: duty rms error, band-energy error, true peak, squelch behaviour", status: "ABI + stage + selftest done; harness and tap export not written"}
    acoustics: {replaces: [acoustic_path], via: "IF-ACOUSTIC-PORT json (--set port_json=...)"}
    noise: {replaces: [supply_inject], via: "IF-MIC-VDD-NOISE json (--set mic_vdd_json=... loopback=True)"}
    exciter_measured: {replaces: [exciter, mech_bone], via: "IF-EXCITER-Z -> shared-params#exciter; IF-BONE-TF loader (not written)"}
    bridge_spice: {replaces: [bridge], via: "bridge_spice.run_case (4.6 s per 1.9 ms)", use: "short validation windows only, never the full scenario (1 s = 200k periods)"}
  determinism: "seeded numpy Generator per run; mic seed drawn first, then ripple, then shaper dither; DspStage caches per-unit noise calibration; T6 power-on uses seeds seed+101.."

# ------------------------------------------------------------------------------------------------ findings
findings:   # each: evidence (file, date) -> consequence -> owner doc to update
  - {id: F1, text: "The DSP does not enforce its own ceiling: pipeline.limiter's tanh backstop sits at ceiling+3 dB (sample peak -9.08 dBFS) and the x16 interpolation adds inter-sample peaks (true peak -6.32 dBFS, +5.7 dB over the configured -12); coil peak 131 mA at the peak corner. FAIL is against the configured ceiling (derived invariant), whatever number the owner picks", evidence: "sim/out/e2e/D17.json 2026-10-02 21:25", action: "true-peak limit on the pre-quantiser interpolated stream (shared-params#ceiling); owner supplies the number with E2 V_mcl; update sub-output, ECR-0005", docs: [sub-output, sub-processing]}
  - {id: F2, text: "Zero-input limit cycle: with squelch forcing x=0 but the 3rd-order shaper state NOT reset, 74% of PWM samples in the whines-only window stay non-zero", evidence: "chain.py --scenario T1 --set squelch_reset=False, 2026-10-02 01:xx; stages.PwmShaper", action: "firmware must zero e1..e3 on squelch (FWSIM-R14)", docs: [sub-processing, sub-output]}
  - {id: F3, text: "T6 depends on the mic's ultrasonic noise (E3): squelch margin 7.80 dB at -68 dBFS (10 s run); per-unit matched calibration: +3 dB noise -> 4.7 dB, +6 dB -> 1.6 dB, +10 dB -> -2.4 dB; with calibration on the nominal mic, +3 dB already loses squelch", evidence: "T6 runs 2026-10-02", action: "firmware sets squelch from the measured idle output at boot or production test; E3 before the order", docs: [sub-audio-in, sub-processing]}
  - {id: F4, text: "Power-on burst: the DSP floor tracker initialises on the first frame; the first 0.3 s output depends on the noise realisation: -21..+0.6 dB SL over 6 power-ons (shared exciter, retfl-20 threshold); bridge start pop is NOT the problem (-70.8 dB SL quarter-period-late start)", evidence: "T6.startup_sl_max_db per_power_on, 2026-10-02 21:25", action: "hold the output squelched until the floor tracker has 0.3 s of data", docs: [sub-processing]}
  - {id: F5, text: "x16 interpolator filter is unspecified: a ceiling tone's images into 8-16 kHz are 104 dB down with Kaiser b=9 (negligible) but 24.9 dB down with linear interpolation (+42 dB SL); the interpolator needs >= 67 dB image rejection at this proxy (retfl-20)", evidence: "D17.tone_hf_sl_max_db split, 2026-10-02 21:25", action: "FWSIM-R14 interpolator >= 67 dB (was 55, which did not trace)", docs: [sub-processing]}
  - {id: F6, text: "Mic EQ is the datasheet fixture curve: a port deviation of +-10 dB at 25 kHz or a -12 dB notch at 40 kHz reaches the output 1:1; acoustics also calibrates against that curve (shared hidden assumption, shared-params#mic.response_25khz_peak)", evidence: "sweep port 2026-10-02", action: "EQ table from IF-ACOUSTIC-PORT / coupon measurement (spec C8 L681); flash knob (O18)", docs: [sub-audio-in]}
  - {id: F7, text: "The ceiling erases the level cue: 6 dB ILD at the input becomes 1.9 dB at 90 dB SPL loud side (bias-removed); unit spread alone (mic +-1 dB, R +-10%) biases ILD by 3.1 dB", evidence: "T3 2026-10-02 21:25", action: "owner decides: per-side trim (D3, R7) and whether T3 holds near the ceiling", docs: [sub-processing]}
  - {id: F8, text: "Supply ripple at the mic VDD: the Rev F copper background (0.167 mV rms, mostly the 1.56 kHz hop line) costs 0.46 dB of squelch margin under the worst PSRR; requirement now in LN-M01 form", evidence: "IF-MIC-VDD-NOISE loopback run 2026-10-02", action: "none now; S2 measures PSRR(f)", docs: [sub-audio-in]}
  - {id: F9, text: "pipeline.algo_b stamps output at frame start: causal latency adds 1.28 ms frame + hop/DMA terms; total 3.08 ms vs 20 ms limit", evidence: "lat 2026-10-02", action: "none for the limit; keep the budget in S3 measurements", docs: [sub-processing]}
  - {id: F10, text: "Algorithm A with the default 38 kHz LO outputs nothing on the Port Meadow pipistrelle clip (calls 45-60 kHz)", evidence: "T2 --set algo=A 2026-10-02 01:xx", action: "A is fallback only (D12 L222); its LO needs per-site tuning", docs: [sub-processing]}
  - {id: F11, text: "8-16 kHz audibility of the output (R9): see F13; idle-mode current not covered (power.py's)", evidence: "T2.protect_band_sl_p99_db", action: "-", docs: [sub-output]}
  - {id: F12, text: "Steady-state breakthrough the 2 s windows hid: once the floor tracker settles (~3 s) the transient gate opens on slowly modulated content BELOW the mic floor (the >15 kHz skirt of 60 dB SPL speech-band noise, 3 Hz modulation): background window -69.7 dBFS, 22 % active, +27.4 dB SL (+11.3 front convention); whines alone stay suppressed", evidence: "T1 background window 3-6 s, 2026-10-02 21:25; skeptic probes 2026-10-02", action: "DSP gate rule (pipeline.py, not this sim's file): minimum hold count or per-band margin sized to the chi-square spread of 1-2-bin bands; firmware FWSIM-R14; test with S-T1 and S-R15", docs: [sub-processing]}
  - {id: F13, text: "Bridge dead-time harmonics of a ceiling-level tone land in the protected 8-16 kHz band: +18.4 dB SL (retfl-20; +8.4 front) at 12.5 ns, -6.5 dB SL without the dead-time error; T2 p99 +13.2 dB SL at 8 kHz. 25 ns gives -37.5 dB THD+N (SPICE -38): 2 ticks needs dead-time compensation", evidence: "D17 hf_split, T2.protect_band 2026-10-02 21:25", action: "firmware dead-time compensation knob (S2) or a lower ceiling; owner E2 decides audibility", docs: [sub-output, sub-processing]}
  - {id: F14, text: "R15 self-noise keeps transient mode busy: own speech 75 dB SPL + fricatives 40 + chewing 55 + hair 35 (all ASSUMED) -> output active 67 %, +52 dB SL p90 (+30.5 front); each part alone 19-51 % active", evidence: "S-R15 2026-10-02 21:25", action: "S1 recordings of the owner set the levels; gate rule (F12); possibly a self-voice detector", docs: [sub-processing, sub-audio-in]}
  - {id: F15, text: "IF-ACOUSTIC-PORT changes the verdicts: as built (open gap) T2 recall 0.43 (bats lost), T1 events -39 dBFS; sealed duct recall 1.00 but the F12 breakthrough becomes audible (+28.9 dB SL)", evidence: "port_json runs 2026-10-02 21:30", action: "decide the port (acoustics option B) and the gate rule together", docs: [sub-audio-in]}

