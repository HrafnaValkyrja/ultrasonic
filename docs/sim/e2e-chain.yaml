  r_pair_ohm: {val: 1.22, src: "sub-output Key numbers: Rds(on) N 0.34 + P 0.88 ohm at Vgs 3.0 V"}
  r_shunt_ohm: {val: 0.1, src: "hw/pod/gen.py R21"}
  r_wire_ohm: {val: 0.2, src: "sub-output Interfaces (reg-arm): ~0.1 ohm per conductor, derived"}
  exciter: {val: "docs/sim/shared-params.yaml#exciter (nominal + corners)", src: "spec D7 L191-L192; bone.py anchors"}
  pwm: {val: "200 kHz, ARR 200, 201 levels, AD", src: "spec D6 L155, L166"}
  dead_time_ns: {val: 12.5, src: "spec D6 L170 (1 tick at 80.009 MHz); 25 ns scored too"}
  shaper: {val: "3rd order, DC zero + pair 13 kHz, TPDF", src: "spec D6 L176"}
  mic: {val: "-26 dBFS @94 dB SPL, EIN 29.7 dB SPL flat, response json", src: "datasheet Rev B-1 p.3; sim/data/sph0641_ultrasonic_response.json"}
  adf: {val: "CIC5/5 + RSFLT/4, 200.02 kS/s", src: "A3 plan s1.2 (D1)"}
  clocks: {val: "docs/sim/shared-params.yaml#clocks", src: "A3 plan s2"}
  ceiling_dbfs: {val: -12, src: "shared-params#ceiling (assumed number, defined as pre-quantiser true peak)", status: "assumed (F1)"}
  squelch_dbfs: {val: -68, src: "e2e knob; no spec number", status: "assumed (F3)"}
  tragus_gain_db: {val: 20, src: "bone-conduction.md s3 (Surendran 2023)"}
  thresholds: {val: "shared-params#thresholds (both conventions)", src: "ARL-TR-4138 Table 8; Surendran 2023 Fig 4A"}
watch:   # register as PLM watches (tools/plm.py) so a change re-flags this sim
  - "hw/pod/gen.py blocks BRIDGE, MIC, SELFTEST, LDO"
  - "docs/system/integration-map.md sections 1, 3, 5"
  - "docs/spec.md D6, D7, D13, D14, D17, s5, s6, s7 (R-items R1, R9, R12, R14, R15, R21)"
  - "docs/research/A3-u575-plan.md s1.2, s2"
  - "docs/sim/shared-params.yaml (any key)"
  - "sim/dsp/pipeline.py (algo_b, limiter, microphone)"
  - "sim/acoustics/out/port_response*.json, sim/noise/out/IF-MIC-VDD-NOISE.json (IF files)"
rerun_when: [exciter measured, acoustics or noise sim re-delivers an IF file, firmware host build exists, spec D6/D17 number added, schematic change to bridge/mic/LDO, pipeline.py gate or limiter change, shared-params change]

heavy_runs:   # none executed now (owner rule); each fenced <= 4 GB, one heavy job at a time
  - {id: H1, what: "60 s house-walk and nature scenes (long-form S-T1/S-T2/S-R15)", needs: "nothing: --no-plot memory ~160 MB + 39 MB/s -> ~2.5 GB at 60 s", est: "~15 s wall, ~2.5 GB", fence: "MemoryMax=3G (or 4G heavy)", blocked_on: "owner go-ahead (> 60 s smoke rule is about time, this is ~15 s; listed here for memory)"}
  - {id: H2, what: "full-factorial sweep, 3 R x 3 L x 3 mic x 3 port x 3 PSRR x 2 convention, 8 s runs", est: "486 runs x ~2.5 s = ~20 min serial, <= 0.6 GB", fence: "MemoryMax=3G, one process", blocked_on: "owner decides which sweeps matter after stubs are replaced"}
  - {id: H3, what: "SPICE bridge validation grid: L 0.3/1.26 mH x td 12.5/25/37.5 ns x -12/-40 dBFS (out-of-sample points for the behavioural bridge)", est: "12 cases x 5 s = 60 s, 450 MB each", blocked_on: "none (PMCXB290UE model still unavailable, sub-output issue 7)"}
  - {id: H4, what: "full 4 MHz PDM chain with a representative modulator", est: "8 M samples/2 s ~ 1-2 s python, ~0.5 GB", blocked_on: "modulator NTF unpublished; a stable 4th-order NTF gave only -57 dBFS in-band vs mic noise ~-83 dBFS: needs vendor data or E3"}
  - {id: H5, what: "coupled run with all IF-* files + firmware host build", blocked_on: "firmware host build (port and noise IF files already load)"}

