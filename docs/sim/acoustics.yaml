# ------------------------------------------------------------------------------------------------ model A: mic port
model_a:
  chain: "free field --(plate, blocked pressure)--> hex window (tube r 1.728 x 0.8, flanged radiation) --step mass--> lid bore (tube) --> [open gap: two-port Z11/Z12/Z22 = 3-D parallel-plate modal sum (n=0..63) + finite-channel n=0 correction | sealed duct: tube + step masses] --> board hole (tube) --> standoff ring (shunt 0.05 mm3) --> mic port (tube D0.325 x 0.25) --> front volume (shunt, calibrated)"
  tubes: "full Kirchhoff (Bessel) visco-thermal effective density/compressibility (narrow.tube_eff); shear number s 27-200 for r 0.3-1.0 mm at 20-96 kHz = thin boundary layer; the low-reduced-frequency (Poiseuille, s < ~3) form is INVALID here and not used; plane wave valid to ka 1.84 (r 1.0 mm at 96 kHz: ka 1.76); window r 1.73 exceeds it above ~59 kHz (FEM +-3 dB there)"
  gap_matched: "gap.gap_z: discs on opposite rigid plates, Graf addition for offset; n = 0 carries the slit rho_e; pole panels +-0.1 % (n=0 integral within 1.7e-4 of a 32-pt reference)"
  gap_channel: "gap.rect_n0_dz: n = 0 field of the rigid 35.1 x 11.8 mm channel minus the infinite one (Neumann modal sum, disc-averaged, same smooth window on both, high modes as k^2 moments); validated vs a brute-force modal sum to 3.5e-4, compliance limit at 100 Hz to 1.4e-3, window convergence 4e-6"
  mic_calibration: {what: "V_f, loss tangent eta so the flush reference peaks at 25 kHz / +14.7 dB re 1 kHz", result: {V_f_mm3: 0.761, eta: 0.111}, assumption: "the datasheet 25 kHz peak is the mic's own port/front-volume Helmholtz resonance (spec D13 L232 calls it a fixture resonance: unresolved); MC round-robins 3 reference assumptions (ideal flush, 0.8 mm PCB + D0.5, 1.6 mm PCB + D0.8)"}
  fem_crosscheck: {code: "sim/acoustics/fem_axisym.py", method: "axisymmetric Helmholtz, bilinear quads h 25 um, absorbing outer boundary, same effective fluids", errors_db_lumped_minus_fem_2026-10-02: {chimney_d1.0: {rms_lt60k: 0.33, max_lt60k: 0.71, rms_gt60k: 2.36, max_gt60k: 3.21}, gasket_id2.1: {rms_lt60k: 0.48, max_lt60k: 1.04, rms_gt60k: 2.29, max_gt60k: 2.91}, open_aligned_matched: {rms_lt60k: 0.78, max_lt60k: 1.48, rms_gt60k: 1.80, max_gt60k: 2.36}}, criteria: {rms_lt60k: 1.5, max_lt60k: 2.5, rms_gt60k: 3.0}, verdict: PASS, note: "open_aligned IS the as-built design now (offset 0)"}
  selfcheck_verdict_2026-10-02: {narrow: true, gap: true, channel: true, fem: true, src: sim/acoustics/out/selfcheck.json}
  not_modelled: ["F-side parts in the gap (Y1 at 1.84 mm; 44 % of the face)", "lip under-slot 0.7 mm and board-edge leaks to the cell side", "bore-hole offset INSIDE a sealed duct (lumped tube)", "mesh mass/stiffness, water on the mesh", "lid bore roughness, 3-D hex shape", "baffle gain (flat 0..+6 dB, level_offset_db)"]

results_a:   # src sim/acoustics/out/port_results.json 2026-10-02 21:25; ratio band 20-96 kHz; in-pod R14 ripple rules 20-85 kHz (processed band, run_port.R14_BAND_HZ); in_pod below = [deepest, highest] re median 20-85 kHz
  designs:   # mean ratio dB | MC p05..p95 | in-pod deepest / highest re its median | ratio resonances (f kHz, dB, Q)
    as_built:          {what: "Rev F board + rev-1 lid: open 1.5 mm gap, offset 0", mean: -15.4, mc: [-23.5, -10.9], in_pod: [-5.2, +20.8], in_pod_20_80k: [-4.7, +15.8], peaks: "92.0 +9.6 Q10", dip: "-27.4 @ 26.2"}
