  ceiling: {v_rms_bridge: 0.533, def: "3.0 V x 10^(-12/20) / sqrt 2 (D17 L293-L295 has no number; -12 dBFS assumed)", FL_db_re_1uN: {1500: 88.6, 2000: 87.4, 2500: 86.7, 3000: 86.4, 4000: 86.7}, peak_force_mN: "30-38", SL_front_measured: {1500: 57.5, 2000: 53.7, 2500: 52.2, 3000: 55.5, 4000: 57.2}, SL_norm_minus20: {1500: 72.1, 2000: 76.4, 2500: 77.2, 3000: 76.4, 4000: 71.2}, reading: "loudness is plentiful (>= 45 dB SL at p05 force); T2 comfort and D17 are about the ceiling being too HIGH; R1 'transducer quiet' (L594) is not supported at the pre-tragal site"}
  t6_shaped_noise:   # bone.py shaped_noise_v_psd: matches sim/checks/ntf_compare.py band powers within 0.4 dB (-92.7/-90.2/-70.6 vs -92.7/-90.6/-71.4 dB re FS)
    what: "TPDF-dithered 3rd-order shaper noise (output running, no signal), force inside one ERB vs pure-tone threshold; > 0 dB = audible"
    max_SL_db: {front_measured: {nominal: {1.5-4k: -32.2, 4-12.5k: -25.8}, p95_exciter: {1.5-4k: -27.0, 4-12.5k: -24.0}}, norm_minus20: {nominal: {1.5-4k: -15.8, 4-12.5k: -15.8}, p95_exciter: {1.5-4k: -9.0, 4-12.5k: -12.6, 12.5-16k: -12.2}}}
    reading: "FINDING (output running only): shaped noise is >= 9 dB below threshold in every convention up to 16 kHz (12.5-16 kHz uses thresholds held at the last table value: unverified). Per-ERB is the right comparison (assumed critical-band summation). T6 as a whole is NOT closed here: squelch exactness (D6 L178), the DSP gate and the floor tracker (e2e F3, F4, F12) decide idle silence"
  e1_expectation: {motional_bump_ohm_p05_p50_p95: [0.52, 3.39, 19.84], at_hz: [263, 507, 927], loaded_on_skin_peak_hz: [205, 394, 758], reading: "bump < 1 ohm -> Bl < ~0.5 (quiet); > 10 ohm -> Bl > ~1.7", files: "bone_results.json zin{e1_expectation, free_p05/50/95, clamped_p50, on_skin_p05/50/95}"}

# ------------------------------------------------------------------------------------------------ measurements that collapse the uncertainty (blocked by O21 L647 until parts exist)
measurements:
  E1:   # spec L698; extended
    do: ["DCR (4-wire if possible), 3+ samples from 2 listings", "L and R_s at 1, 2.5, 4, 10 kHz (L_e is frequency dependent)", "|Z|(f) 50 Hz-20 kHz in 3 states (sound card + series R, or the F4 self-test): free on its leads; clamped to >= 100 g; pad on the pre-tragal site at ~1 N", "weigh the exciter; open ONE sample and weigh the moving magnet (m_m)"]
    gives: "R_e, L_e(f) (2nd-largest term, -5.9/+1.6 dB at 3 kHz); f0, Q_m, motional bump -> Bl = sqrt(bump * 2 pi f0 m_m / Q_m) (largest term, +-6 dB); loaded resonance"
    pass_if: "bump 0.5-20 ohm (model 5-95 %); otherwise widen PARAMS and re-run bone.py"
  E2:   # spec L699; as a threshold-in-volts audiogram
    do: ["final pad material, 1 N (kitchen scale), pre-tragal site, Ear (open) in place", "pure tones 1.5/2/2.5/3/4 kHz and 8/10/12.5/16 kHz: V_rms ACROSS THE EXCITER TERMINALS at threshold (up-down 2AFC, 3 runs, re-seat) -> V_thr(f)", "same tones: comfortable-loud and uncomfortable -> V_mcl(f), V_ucl(f) (gives D17 its number)", "repeat at 0.5 and 2 N, mouth open, chewing", "then the translated nature files (sim/out/nature) at the ceiling (R19)"]
    gives: "one number per frequency holding Bl, pad, skin, anatomy AND the threshold convention"
    model_expects_V_thr_terminal_mV: {front_measured_nominal: {1500: 0.62, 2000: 0.98, 2500: 1.18, 3000: 0.83, 4000: 0.70}, norm_minus20_nominal: "~10x lower (0.06-0.12)", full_range: "0.03-4 mV"}
    pass_if: "V_thr <= 3 mV at 1.5-4 kHz (>= 45 dB SL at the 0.533 V ceiling) and shaped-noise voltage per ERB <= V_thr - 10 dB"
  E3_coupons:   # spec L700, L571; rev-1 board + printed lid variants (sub-audio-in issue 4 option b)
    do: ["same mic, same board: lid variants open gap / sealed ID 1.0 / ID 1.4 / ID 2.1 ring, mesh 0 / 24 / 60 rayl at the mouth, vs the bare board (no lid) in the same fixture position", "any stable 20-96 kHz emitter (cancels in the ratio): chirp or 1 kHz steps", "R(f) = |S_variant| / |S_bare| from the USB stream"]
    gives: "the quantity mag_db predicts, directly; a miss means recalibrate the mic internals (calibrate_mic) or the reference"
    pass_if: "R(f) inside mag_db_min..max for >= 90 % of 20-96 kHz points; band mean within +-6 dB"

# ------------------------------------------------------------------------------------------------ requirements
requirements:
  R-ACO-P1: {text: "path band mean 20-96 kHz >= -6 dB re a flush port nominal; MC p05 >= -9 dB", basis: assumed, traces: "R14 L608; R8 L601; T2 L39", status: "as_built FAIL -15.4 (p05 -23.5); chimney_d1.0 PASS +5.4 (p05 -0.2); gasket_id2.1 FAIL -4.5 (p05 -12.7)"}
  R-ACO-P2: {text: "in-pod response over the processed band 20-85 kHz (datasheet held flat above 80 kHz): no notch deeper than -10 dB and no peak above +15 dB re its median; 20-96 kHz reported", basis: assumed, traces: "R14 L608; C8 L683; sim/dsp/pipeline.py algo_b band_hz", status: "as_built FAIL (+20.8 @ 84.7); chimney_d1.0 FAIL (+19.3 @ 84.7); size_s1 PASS (+9.3); gasket_id2.1 PASS (+14.7) (2026-10-02 21:25)"}
  R-ACO-P3: {text: "lid bore exit and board hole joined by a sealed duct with no side volume (< 1 mm3), not an open gap", basis: derived, traces: "s8 L511; O12 L638", verification: "E3 coupon open vs sealed ratio >= 10 dB"}
  R-ACO-P4: {text: "board fab thickness 0.8 mm; NPTH D0.6-0.8 (D1.0 only with a duct ID >= 1.4)", basis: spec, traces: "s8 L509-L510", status: "PASS (Rev F file 0.8, D0.6)"}
  R-ACO-P5: {text: "bore-to-hole offset <= r_duct - r_hole (0.2 mm for ID 1.0 / D0.6) INCLUDING free board slide and print tolerance; bore D1.0 +-0.1 mm", basis: geometric, traces: "s8 L511; ECR-0011; 00-whole risks 8, 12, 20", status: "nominal PASS (Rev F offset 0.00); tolerance stack FAIL (2.22 mm worst, no x stop)", verification: "run_port.py S8-duct-alignment-stack on every run; H-A4"}
  R-ACO-P6: {text: "gasket seat: no via and no F-side track within r 1.6 mm of the port; duct OD <= 3.4 mm (Y1 at 1.84 mm)", basis: derived, traces: "sub-audio-in issue 2", status: "PASS (Rev F: none; nearest via 2.05 mm)"}
  R-ACO-P7: {text: "mesh <= 60 rayl at the window mouth (<= 0.9 dB at 82 kHz) or <= 12 rayl on the bore floor; foam never", basis: derived, traces: "s8 L511; D2 L690"}
  R-ACO-P8: {text: "self-checks pass (selfcheck.json verdict all true)", basis: derived, status: "PASS 2026-10-02"}
  R-ACO-B1: {text: "pad + contact face stiffness K_p 3e5-1e6 N/m (force/V flat +-3 dB over 1.5-4 kHz)", basis: derived, traces: "D1 L100; D9 L203; reg-pad issue 1"}
  R-ACO-B2: {text: "E1 returns R_e, L_e(f), Bl (motional bump + m_m), f0, Q_m; E2 returns V_thr(f), V_mcl(f) at the terminals", basis: derived, traces: "R1 L594; R19 L612; T2 L39; T6 L43"}
  R-ACO-B3: {text: "SL at the D17 ceiling >= 30 dB at 1.5-4 kHz (front threshold + 9 dB SD, p05 force)", basis: assumed, traces: "T2 L39; D17 L293", status: "PASS (36 dB at 2 kHz)"}
  R-ACO-B4: {text: "shaped-noise force per ERB <= threshold - 6 dB, 0.25-16 kHz, p95 exciter, both conventions", basis: derived, traces: "T6 L43; R21 L614; D6 L176-L178", status: "PASS (worst -9.0 dB at 3 kHz, norm-20)"}
  R-ACO-B5: {text: "peak vibration force < 0.5 x static force", basis: derived, traces: "D1 L100", status: "PASS (30-38 mN vs 1 N)"}

findings:
  - {id: FA1, text: "The open 1.5 mm gap costs ~16 dB across 20-96 kHz even with the Rev F alignment fix; R14 fails in 100 % of tolerance draws. A sealed straight D1.0 duct gains ~21 dB (+5.4 dB vs flush) and passes R14 nominally.", action: "reg-pod-body / sub-audio-in issues 1-2: add the duct (gasket or printed boss) to the lid design; the board side is already clear (R-ACO-P6)", docs: [sub-audio-in, reg-pod-body, physical]}
  - {id: FA2, text: "The finite lid-board channel turns the open gap resonant: dips to -42 dB at channel modes (35.1 x 11.8 mm, modes every few kHz). The open gap is not just lossy but unpredictable; parts (44 % of the face) make it worse to predict.", evidence: "as_built_channel", docs: [sub-audio-in]}
  - {id: FA3, text: "Sealed ducts of 2.95-4.0 mm all show a 16-17 kHz Helmholtz resonance (+19..+20 dB re 1 kHz), 35-42 kHz and 77-95 kHz duct resonances: the 'c/4L ~ 27 kHz' estimate is the wrong mechanism for the first one. Shortening the duct (S1/S2) does not move the first resonance; it moves the 2nd/3rd.", action: "EQ (C8 L683) as a flash-loadable table; coupons mandatory", docs: [sub-processing, research/simplify/size.md]}
  - {id: FA4, text: "R8 L601 '[Low]' rests on the 8-15 dB ultrasonic sensitivity bonus; the open gap takes ~16 dB of it back. Keep R8 raised until the duct is sealed and coupon-tested.", docs: [spec]}
  - {id: FB1, text: "Shaped PWM noise DURING OUTPUT is >= 9 dB below threshold per ERB in every convention (E2 confirms). This does NOT close T6: T6 sign-off belongs to the e2e sim (DSP gate / squelch F3, floor-tracker start-up F4, gate opening on sub-noise modulated content F12) with the shared threshold file.", docs: [sub-output, sub-processing]}
  - {id: FA5, text: "The recommended sealed D1.0 duct puts a Q16 resonance at 84.7 kHz, inside the 20-85 kHz band the DSP processes: in-pod peak +19.3 dB re median fails the +15 dB R14 rule (the old 20-80 kHz window hid it). A 24 rayl mouth mesh does not damp it. The S1 stack (simplify/size.md s7) passes every R14 rule over 20-85 kHz. Either a firmware EQ cut (Q ~16, ~-19 dB at ~84.7 kHz, flash knob) or the S1 geometry.", evidence: "port_results.json spec_checks 2026-10-02 21:25", docs: [sub-audio-in, sub-processing]}
  - {id: FA6, text: "Every sealed option needs a board x-stop: free slide x -0.3/+2.1 mm, z +-0.3 mm (shell_r1.py CAV vs PCB) gives a worst bore-to-hole offset of 2.22 mm vs 0.20 mm allowed for ID 1.0 / D0.6 (0.75 mm for the ID 2.1 gasket).", evidence: "S8-duct-alignment-stack, 2026-10-02", docs: [reg-pod-body, sub-audio-in, physical]}
  - {id: FB2, text: "Loudness is plentiful (52-77 dB SL at the -12 dBFS ceiling); D17 needs a number from E2 V_mcl; R1 'quiet' is not supported at the pre-tragal site.", docs: [sub-output, spec]}
  - {id: FB3, text: "Pad stiffness shapes 1.5-4 kHz by up to 15 dB: pick the contact material by K_p >= 3e5 N/m.", docs: [reg-pad]}
  - {id: FB4, text: "e2e proxy threshold (RETFL - 20 dB) sits 20-24 dB below the only front-site measurement; the RETFL table itself is verified (ARL-TR-4138 Table 8). Both conventions now live in docs/sim/shared-params.yaml#thresholds and the e2e reports SL under both.", docs: [sim/e2e]}

uncertainties:
  - {id: UA1, what: "parts / lip slot / edge leaks in the open gap (matched..channel bracket + 1.5 dB)", effect: "open-gap fine structure +-10..20 dB; band mean +-2 dB", retire: "H-A1; irrelevant if option B is taken"}
  - {id: UA2, what: "mic internals (front volume, port length) and whether the 25 kHz datasheet peak is mic or fixture", effect: "16 kHz Helmholtz position, 80-96 kHz mean +-10 dB; CROSS-SIM: the e2e firmware EQ is the inverse datasheet curve, so if spec D13 L232 is right (fixture peak) this calibration AND the e2e EQ are wrong together", retire: "Syntiant SiSonic design data (owner input), E3 coupons"}
  - {id: UA3, what: "mesh part, r_s, wet behaviour", effect: "0.1-4 dB dry; wet unknown", retire: "D2 part + vendor curve"}
  - {id: UA4, what: "offset inside a sealed duct (lumped model blind to it)", retire: "H-A4"}
  - {id: UB1, what: "Bl, moving mass", effect: "+-6 dB", retire: "E1 extended"}
  - {id: UB2, what: "threshold convention + owner anatomy", effect: "20-24 dB on every SL", retire: "E2 V_thr(f)"}
