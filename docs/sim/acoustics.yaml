  options:   # owner decides (CLAUDE.md s0); all layout-agnostic: lid + gasket parts, board only needs a clear seat
    A: {name: "keep the open gap (as built)", numbers: "-15.4 dB mean; R14 0 % of MC draws", cost: none, verdict: "fails R14-level by ~10 dB; throws away the 8-15 dB ultrasonic bonus R8 L601 counts on; open water path to the MCU (O12 L638)"}
    B: {name: "sealed straight duct ID 1.0 (gasket or printed boss, OD <= 3.4 so it clears Y1 and the GND via), hole D0.6-0.8, mesh at the window mouth <= 60 rayl", numbers: "+5.4 dB (p05 -0.2); in-pod ripple 20-85 kHz -5.8/+19.3 dB (84.7 kHz Q16 duct mode); R14 40 % of draws (55 % if judged on 20-80 kHz only)", cost: "one gasket/boss; bore-to-hole alignment <= 0.2 mm (nominal 0.00 on Rev F, but 2.22 mm worst with today's free board slide)", preconditions: ["board x-stop or duct-locating feature (alignment_stack)", "firmware EQ cut ~-19 dB, Q ~16 at ~84.7 kHz as a flash-loadable knob (C8, O18), or the S1 duct stack (passes 20-85 kHz) from the simplification study"], verdict: "RECOMMENDED with both preconditions: still the only family that clears R14-level by ~10 dB and closes the water path; without the x-stop it is not buildable to tolerance"}
    C: {name: "gasket ring ID 2.1 (tolerant of misalignment)", numbers: "-4.5 dB (p05 -12.7); in-pod peak +15.1; R14 35 %", cost: "gasket only", verdict: "fallback only; ~10 dB worse than B and it also needs the x-stop (2.22 mm worst offset vs 0.75 mm allowed)"}

# ------------------------------------------------------------------------------------------------ interface files
interfaces:
  IF-ACOUSTIC-PORT:
    provider: sim/acoustics/run_port.py
    files: {as_built: sim/acoustics/out/port_response.json, recommended: sim/acoustics/out/port_response_chimney_d1.0.json, fallback: sim/acoustics/out/port_response_gasket_id2.1.json}
    format: "json {f_hz[500 log 1-100k], mag_db, phase_deg, mag_db_min/max (+_tight), mag_db_p05/p95, mag_db_abs_re_1khz (informational), mag_db_channel (open gap only), cond{design, gasket, board_mm, port_offset_mm, bore_mm, window_depth_mm, gap_or_chimney_mm, hole_mm, geometry_src}, valid_from_hz, validity, level_offset_db, bands, ref}"
    values_db_at_25_40_60_80_90k: {as_built: [-26.3, -18.6, -14.5, -4.8, +7.8], as_built_min: [-37.9, -40.2, -40.7, -30.9, -24.8], as_built_max: [-6.3, -5.1, +1.0, +5.1, +20.9], chimney_d1.0: [-6.7, +10.5, +2.9, +13.1, +13.1], gasket_id2.1: [-2.3, -8.2, -9.7, -2.1, +14.6]}
    consume: "stages.AcousticPort.curve_db uses f_hz + mag_db; multiply with the DATASHEET curve (stages.Microphone), never with mag_db_abs_re_1khz"
    warnings: ["open gap below 15 kHz: indicative only", "above 60 kHz: +3.5 dB model error and up to 10 dB reference ambiguity: EQ there must be a firmware table (O18) from coupons", "np.interp clamps outside 1-100 kHz"]
  IF-BONE-TF:
    provider: sim/acoustics/bone.py
    file: sim/acoustics/out/bone_tf.json
    format: "json {f_hz[160, 250-16000 log], mag_db_n_per_a (+_p05/_p95/_min/_max), phase_deg, mag_db_n_per_v (per volt of BRIDGE drive, +bands), thr_front_measured_db_re_1uN, thr_front_norm_minus20_db_re_1uN, cond{force_n, per_volt, pad, site, nominal, ranges}}"
    consume: "stages.MechBone: replace F = Bl*i*H by F = 10^(mag_db_n_per_a/20) * i over 0.25-16 kHz (sensation level only); the e2e exciter now takes Bl/m/f0/Q/L from docs/sim/shared-params.yaml#exciter (same nominal as bone.py: Bl 1.0 N/A, L 0.5 mH, f0 350 Hz) so current and force come from one model. Above 16 kHz the e2e keeps F = Bl*i (blocked force on the housing), the quantity IF-ACOUSTIC-LEAK is defined per"
  IF-ACOUSTIC-LEAK:
    status: "PARTIAL: air path bound only"
    air_path: {pa_per_n: 0.27, ref: "free-field pressure at the lid per newton of COIL force (Bl*i, the force driving the housing) - same force definition as the e2e T6 leak requirement", how: "pad housing mass-controlled v = F/(w M_h), M_h 1.74 g; baffled piston S 1.1e-4 m2 on-axis far field at d 45 mm: |p|/F = 2 rho c |sin(k(sqrt(d^2+a^2)-d)/2)| / (w M_h) = 0.27 Pa/N at 20 kHz and 0.26 at 85 kHz", requirement_from_e2e: "<= 93 Pa/N at the mic port (docs/sim/e2e-chain.yaml IF-ACOUSTIC-LEAK)", margin_db: "51 at the lid; ~31 at the diaphragm after the port ratio (chimney_d1.0 peaks +20.2 dB at 84.7 kHz; as built +9.6 at 92 kHz)", basis: derived}
    structure_path: "NOT modelled (NiTi arm -> pod -> board -> MEMS vibration sensitivity unpublished)"
  IF-EXCITER-Z: {role: "consumer; bone.py publishes the priors E1 fits against (results_b.e1_expectation)"}
  IF-HEAD-SHADOW: {status: "not provided: plate treated as infinite baffle (level_offset_db 0..+6)"}
  owner_visuals: "port_path.png (to-scale cross-section today vs recommended, plain labels) and port_response.png are ready for the A-PHASE1-VISUALS board sheet (docs/brief/queue.yaml)"

# ------------------------------------------------------------------------------------------------ model B: bone/cartilage path
model_b:
  network: "coil I -> force Bl*I between moving mass m_m (suspension k_s, c_s from f0, Q_m) and housing M_h; housing -> pad K_p(1+j eta_p) in series with skin Z_L = R_L + jw M_L + K_L/jw -> rigid skull; arm z_arm + k_arm/jw to ground; back-EMF Bl (v_m - v_h); electrical R_e + 1.52 ohm (bridge+wire+shunt) + jw L_e"
  params:   # nominal | range | status | src (code: bone.py PARAMS)
    r_e: [8, "8|12", vendor disputed, "spec D7 L191"]
    l_e: [0.5e-3, "0.3e-3..1.3e-3 H", assumed, "spec D7 L192; Adafruit 1674 1.26 mH"]
    bl: [1.0, "0.5..2.0 N/A", assumed, "anchor Aeropex 102 dB re 1 uN/V < 2 kHz (Surendran 2023 Fig 2B)"]
    m_m: [0.45e-3, "0.25..0.7 g", assumed, "exciter 1.2 g [Low]"]
    f0: [350, "200..800 Hz", assumed, "vendor low edge 290-300 Hz"]
    q_m: [3, "1.5..8", assumed, "-"]
    m_h: [1.74e-3, "1.2..2.2 g", CAD, "reg-pad.md 2.19 g - m_m"]
    k_p: [1.0e6, "1e5..1e7 N/m", assumed, "1 mm silicone/Sugru, E 0.7-3 MPa, 50-150 mm2, shape factor x3-9"]
    eta_p: [0.2, "0.05..0.5", assumed, "-"]
    k_l: [2.5e4, "1.2e4..6e4 N/m", measured, "Surendran 2023 40 um/N frontal at 2 N"]
    m_l: [1.1e-3, "0.6..1.5 g", measured, "Surendran 2023; Flottorp 0.6 g"]
    r_l: [10, "4..25 N s/m", read off figure, "Surendran Fig 2A; Flottorp 20"]
    z_arm: [1.0, "0.3..3 N s/m", "derived [Low]", "NiTi 0.85 mm infinite-beam 0.74 at 3 kHz"]
    k_arm: [250, "100..600 N/m", derived, tragus-arm.md]
  load_check: "Z_L 11.0/10.4/15.5/21.8/28.5 N s/m at 0.5/1/2/3/4 kHz vs pure 1.1 g mass 3.5/6.9/13.8/20.7/27.6: mass-like above 2 kHz within 12 % (Surendran)"
  can_predict: ["F_L(f) shape 0.25-16 kHz for a parameter set", "which parameter dominates and by how much", "pad stiffness / housing mass trade", "E1 |Z| sweep priors", "static force 0.5-2 N moves the level < 0.4 dB", "shaped PWM noise per ERB vs thresholds (T6)"]
  cannot_predict: ["absolute N/V (+-8 dB 5-95 %, +-14 dB min-max) until E1", "pad material stiffness before it is chosen and measured", "the owner's tissue (several dB between people; measured at 2 N, we run 1 N)", "the cartilage-conduction ear-canal radiation itself (only inside the thresholds); Nishimura 2014 PMID 25199744: stray airborne sound can dominate in an open ear at high f", "contact loss (never reached: 31-38 mN peak at the ceiling vs 1 N)", "hair, sweat, tilt"]

results_b:   # src sim/acoustics/out/bone_results.json, bone_tf.json 2026-10-02 20:32, MC n 2000
