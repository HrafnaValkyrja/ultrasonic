# SIM-ACO: acoustic simulation, mic port path (item 4A) and bone/cartilage-conduction path (item 4B). Audience: other Claude instances.
# Rules (owner 2026-10-02): current state only; every fact has src (file:symbol | spec Lnn | URL) + date; pointers not copies; thresholds checkable.
# Lnn = line in docs/spec.md as of 2026-10-02 20:30 (header v0.14, content v0.15 + O21/O22). Numbers in results_* belong to meta.last_run; re-run after anything in watch.
meta:
  id: SIM-ACO
  date: 2026-10-02
  scope: "ladder step C (O18 L644): before the board order predict (A) how lid window / lid bore / lid-board gap / board hole / mic port shape the 20-96 kHz capture (R14 L608, s8 L509-L511, E3 L700) and (B) force + perceived level at the pre-tragal skin per volt, and which unknowns dominate (R1 L594, R19 L612, R21 L614, T2 L39, T6 L43; E1 L698, E2 L699)"
  layout_agnostic: "lid read from hw/mech/shell_r1.py by AST (never executed); board = --board | env ACO_BOARD | newest mtime of hw/pod/draft_r1/{pod_r1_routed,pod_r1_placed,fanout/pod_r1_routed}.kicad_pcb, read-only via pcbnew; fall-backs flagged in port_results.json warnings"
  code: [sim/acoustics/geometry.py, narrow.py, gap.py, port.py, run_port.py, fem_axisym.py, selfcheck.py, bone.py, headline.py, smoke.sh]
  outputs: "sim/acoustics/out/: port_response.json, port_response_chimney_d1.0.json, port_response_gasket_id2.1.json, port_results.json, bone_tf.json, bone_results.json, selfcheck.json; PNG (dark, tools/plotstyle.py): port_path.png (to-scale cross-section, plain labels), port_response.png, port_sweeps.png, bone_force.png, bone_sensitivity.png. git: out/.gitignore keeps the interface json only"
  last_run: {date: 2026-10-02T21:25, cmd: sim/acoustics/smoke.sh, fence: "systemd-run --user --scope -p MemoryMax=3G -p MemorySwapMax=0, timeout 60", wall_s: 23.7, peak_rss_mb: 373, board: "hw/pod/draft_r1/pod_r1_routed.kicad_pcb (Rev F routed, mtime 2026-10-02 20:23)", changed_by_integrator: "R14 ripple window 20-80 -> 20-85 kHz (processed band) + 20-96 info; sealed-duct alignment tolerance stack (S8-duct-alignment-stack); board slide read from shell CAV vs PCB"}
  honesty: "A: lumped transmission line + modal gap model; checked against an axisymmetric FEM (aligned designs, <= 1.5 dB below 60 kHz, <= 3.2 dB above) and an independent modal sum (4e-4). NOT modelled: parts in the gap (44 % of the F face), mesh mass, 3-D offset inside a sealed duct, the mic's internals (2-parameter calibration to the datasheet curve). B: no measured exciter (Bl, moving mass, f0, pad stiffness are ranges); skin load and thresholds are published. Absolute B levels +-8 dB (5-95 %) until E1/E2."
abbr:
  ABCD: "two-port transfer matrix [p_in;U_in] = T [p_out;U_out]; U = volume velocity m^3/s"
  ratio: "p_diaphragm(our path) / p_diaphragm(mic port flush in a baffle), same free-field pressure; 0 dB = no change vs the datasheet condition"
  in-pod: "datasheet curve (sim/data/sph0641_ultrasonic_response.json, 10-80 kHz, re 1 kHz; held at its 80 kHz value above 80 kHz: ASSUMED) + ratio, dB: what the mic delivers in the pod"
  matched / channel: "open-gap limits: matched = infinite plates (walls absorb, smooth); channel = rigid empty rectangle between the lid lip and the clamp ribs (walls reflect, resonant)"
  sealed duct: "gasket / printed boss joining the lid bore exit to the board hole; chimney_d1.0 = ID 1.0 (no side volume); gasket_id2.1 = ID 2.1 ring (4.0 mm3 side volume)"
  FL / SL: "force level dB re 1 uN / sensation level = FL - threshold FL"
  RETFL: "reference equivalent threshold force level, ISO 389-3 = ANSI S3.6 mastoid values"
  front: "Surendran 2023 'frontal' site = in front of the ear-canal opening = our pre-tragal pad site"
  ERB: "equivalent rectangular bandwidth 24.7 (4.37 f/kHz + 1) Hz, Glasberg & Moore, Hear Res 47:103 (1990) (recalled)"
  MC / SRRC: "Monte Carlo over parameter ranges / standardised rank regression coefficient"
run:
  smoke: "sim/acoustics/smoke.sh [board.kicad_pcb]   # fenced; prints headline.py"
  parts: {geometry: "python3 sim/acoustics/geometry.py", selfcheck: "python3 sim/acoustics/selfcheck.py [--fem-n 10]", port: "python3 sim/acoustics/run_port.py [--board b] [--mc 40] [--no-plot]", bone: "python3 sim/acoustics/bone.py", headline: "python3 sim/acoustics/headline.py"}
  e2e_use: "python3 sim/e2e/chain.py ... --set port_json=sim/acoustics/out/port_response.json   # stages.AcousticPort.curve_db reads f_hz + mag_db (load verified 2026-10-02 20:33 for all 3 files)"
  threads: "OMP/OPENBLAS/MKL_NUM_THREADS default 2 inside the code"
  never: [FreeRouting, hw/pod/place.py, hw/pod/place_r1.py, any autorouter, any run without the 3 GB fence]
watch:
  rerun_when: ["hw/mech/shell_r1.py: MIC, Y_SPLIT, Y_OUT, PCB, CAV, lid_base() bore / hex window / lip / clamp ribs", "board: U2 position or NPTH drill, thickness setting, F-side parts near the port, vias/tracks within r 1.6 of the port", "hw/lib/lcsc/lcsc.pretty/Knowles_LGA-5_3.5x2.65mm_Port0.6.kicad_mod", "spec s8 L509-L511, D1 L85, D6 L176-L178, D7 L189-L193, D13 L232, R14 L608", "mesh part (task D2 L690)", "E1 / E2 / E3 results", "pad material (reg-pad open issue 1)", "simplification pick (size.md s7 S1/S2 ducts are scenarios here)"]
  plm_relation_proposal: {id: R-ACOUSTICS, watches: [hw/mech/shell_r1.py, hw/pod/draft_r1/pod_r1_routed.kicad_pcb, hw/lib/lcsc/lcsc.pretty/Knowles_LGA-5_3.5x2.65mm_Port0.6.kicad_mod, sim/acoustics/port.py, sim/acoustics/bone.py], items: [sub-audio-in, reg-pod-body, reg-pad, sub-output], note: "lead adds it; this agent does not edit plm"}

