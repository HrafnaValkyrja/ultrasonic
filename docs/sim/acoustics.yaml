    verdict: "FAIL for every sealed option: a sealed duct is only as good as the board's lateral location. Precondition for B (and C): a board x-stop (or a duct-locating feature that registers the board) holding offset <= 0.2 mm incl. print tolerance; even registering on the -x wall leaves 0.3 mm today (nominal gap), so the stop must be a designed feature"
  quarter_wave_check:   # brief: 'a ~3 mm, ~1 mm tube ahead of the mic may resonate in band (c/4L ~27 kHz)'
    rows: {"4.0 mm sealed (today's stack)": {c_4L: 21.5, model_khz: [16.2, 35.0, 84.4]}, "3.45 mm (S1)": {c_4L: 24.9, model_khz: [17.2, 40.6, 94.6]}, "2.95 mm (S2)": {c_4L: 29.1, model_khz: [16.7, 37.8, 87.1]}, "3.0 mm uniform D1.0": {c_4L: 28.6, model_khz: [17.0, 35.6, 77.3]}}
