# SIM-LN: layout noise coupling simulation (the PCB as a noise path). Audience: other Claude instances.
# Format rules (owner 2026-10-02): current state only; every fact carries src (file:symbol | spec Lnn | URL) + date; pointers not copies;
# invariants are checkable thresholds; one 'why:' per non-obvious item. Dates ISO. Lnn = line in docs/spec.md as of 2026-10-02 (header says v0.14, content v0.15).
# Thresholds below are READ BY sim/noise/budget.py --check-doc (drift = stale doc). Numbers in `results` belong to board sha in results.board_sha256; a different sha = stale.
meta:
  id: SIM-LN
  date: 2026-10-07
  scope: "ladder step C (O18 L644): bound, before the board order, how much of the pod's own noise the copper itself puts into the mic, the ADC and the bridge, in the bands that decide T6 L43 / R9 L602 / R21 L614 / D11 L210"
  layout_agnostic: true   # reads any 4-layer .kicad_pcb with a filled In1 GND zone (In2 +3V0 plane modelled when filled) + the design BOM (values) + the design netlist (stale-board check)
  default: "hw/current.yaml via tools/current.py (2026-10-07): board hw/pod/draft_r2/out/routed.kicad_pcb, netlist hw/pod/pod_mz2.net, bom hw/pod/bom_jlc_mz2.csv (Phase 2, ECR-0018); ULTRASONIC_DESIGN=revg -> Rev F board + hw/pod/pod.net + hw/pod/bom_jlc.csv"
  board_rule: "explicit path | env NOISE_BOARD | hw/current.yaml board (pcbgeom.default_board; no candidate list, no mtime guess); netlist --netlist | hw/current.yaml netlist; params board.bom auto = hw/current.yaml bom; pad->net map != netlist => valid=false, smoke exit 1 (budget.exit_code), --check-doc lists INVALID first. Exit is NOT set by metric FAILs (only invalid run or doc drift)"
  code: [sim/noise/extract.py, sim/noise/budget.py, sim/noise/couple.py, sim/noise/lumped.py, sim/noise/plane.py, sim/noise/pcbgeom.py, sim/noise/alias.py, sim/noise/params.yaml, sim/noise/aggressors.yaml, sim/noise/smoke.sh]
  outputs: "sim/noise/out/ (git-ignored by sim/noise/out/.gitignore): geometry.json, extract_report.txt, mic_vdd_path.sub, gnd_return.sub, l1_full.cir, budget.json, transimpedance.npz (freqs, aggressors, probes, Z[agg,probe,f] complex), noise_budget.png (dark), IF-MIC-VDD-NOISE.json"
  last_run: {date: 2026-10-07, cmd: "sim/noise/smoke.sh (no argument = hw/current.yaml)", board: "hw/pod/draft_r2/out/routed.kicad_pcb (Phase 2, B-DOC-AUDIT-0007 local re-route: LSE no vias, VDDA caps at pin 9, port keep-out, J3/J4 swap; ECR-0018 log)", board_sha256_16: 9e7627860783b952, netlist: "hw/pod/pod_mz2.net, 195/195 pads, 0 mismatches", bom: hw/pod/bom_jlc_mz2.csv, wall_s: 4.3, peak_rss_mb: 287, exit: 0, metrics_equal_to: "sim/noise/out_r2/budget.json (M01 26.5, M02 20.1, M03 1.29, M04 0.1267, M05 8.72; before this re-route da4e8b13: 26.5 / 20.1 / 1.29 / 0.1266 / 8.72)"}
  last_run_note_2026-10-07_backlog: "smoke re-run on sha 36d088d48e70d239 after RB-19 + CHK-DRCWARN: LN-M01 26.5 dB, M02 20.1 dB, M03 1.29 %, M04 0.1267 mV, M05 8.718 uV, M06 0.1074 mV (identical to sha d1e31020 / 9e762786); re-run again on 21bbe68f after the +3V0 via-pair fix: identical"
  last_run_revf: {date: 2026-10-02T21:20, cmd: "sim/noise/smoke.sh", board: "hw/pod/draft_r1/pod_r1_routed.kicad_pcb (Rev F routed, mtime 20:23)", board_sha256_16: e159bccb65b756d9, netlist: "hw/pod/pod.net 20:01, 193/193 pads, 0 mismatches", wall_s: 3.9, peak_rss_mb: 310, fence: "systemd-run --user --scope -p MemoryMax=3G -p MemorySwapMax=0", sweep: {cmd: "budget.py --sweep --no-l2", wall_s: 9.8, peak_rss_mb: 302}, superseded: "results for sha 8712672846e0729d (Rev E fanout board, 30 pad mismatches vs the Rev F pod.net) withdrawn 2026-10-02"}
  selfchecks_2026-10-02: {ngspice45_vs_internal_MNA_max_rel_err: 2.5e-07, L2_vs_closed_form: {grover_free_M: 0.0003, image_line_M: 0.027, image_wire_Cm: 0.080}, alias_pwm_and_mic_clock_fold_to_dc: pass, csv_period_import_vs_analytic_pulse_train_rel_err: 0.000, netlist_vs_board: "193/193 pads, 0 mismatches vs hw/pod/pod.net (Rev F, 2026-10-02 21:20)", stale_board_detected: "fanout board (Rev E): 30 mismatches -> valid=false, exit 1 (2026-10-02)", plane_raster_area_mm2: {raster: 381.6, zone: 381.66}}
  honesty: "The copper is the part of this model we can read from the board; the numbers that decide pass/fail (mic PSRR above 1 kHz, mic ultrasonic noise floor, MCU die and LDO small-signal impedance, SMPS clock tolerance) are unmeasured assumptions (section uncertainties). A pass here means 'the layout is not the limiting term under these assumptions', not 'quiet'."
abbr:
  PSRR: "mic power-supply rejection; the datasheet gives dBV/FS, read here as dBFS of output spur per 1 V rms of supply ripple"
  FS: digital full scale; dBFS here = rms relative to a full-scale sine rms (datasheet convention for sensitivity and SNR)
  PDM: pulse-density modulation, the mic's 1-bit output at the mic clock (4.00045 MHz)
  CIC5: "5th-order cascaded integrator-comb decimator (sinc^5), first stage of ADF1 (STM32U575 audio digital filter), /5"
  RSFLT: "ADF1 reshape filter after the CIC, /4; response unpublished (R18)"
  fs_pdm / fs_out: "4.00045 MHz mic clock / 200.0225 kHz PCM and PWM rate (HCLK 80.009 MHz /20, /400; A3 plan s2)"
  window: "frequency band n*fs_pdm +-(20..96 kHz) that the CIC does not attenuate (it nulls at multiples of 800 kHz that are not multiples of 4 MHz); anything there folds 1:1 into the capture band"
  MNA: modified nodal analysis (the linear AC solver in lumped.py)
  PEEC: partial-element equivalent circuit (own-code L3 option)
  L1/L2/L3: "analysis layers: lumped R+L network + SPICE / filament mutual L and C / field or PEEC solve on a crop"
  Kelvin error: "voltage that a shared copper path adds to a measurement made across a shunt"
  T(f): "plane transmission 1/sqrt(1+(f/f_c)^2): fraction of magnetic flux that leaks through the 15 um In1 sheet"
  IF-*: "interface contract with a sibling sim (docs/sim/e2e-chain.yaml interfaces)"
  E/O/R/D/T-n: "owner measurement / owner decision / risk / decision / success test in docs/spec.md"
run:
  smoke: "sim/noise/smoke.sh [board.kicad_pcb]   # fenced, read-only on the board, ~4 s, ~0.3 GB; no arg = meta.board_rule; exit 1 on stale board / unrouted net / doc drift"
  full: "source tools/env.sh && systemd-run --user --scope --quiet -p MemoryMax=3G -p MemorySwapMax=0 python3 sim/noise/extract.py [board] --selfcheck --budget   # budget.py alone: add --sweep for assumption sensitivity, --no-l2 to skip field coupling"
  pythons: {venv: /opt/ultrasonic-tools/venv, python: 3.14, numpy: 2.5.3, scipy: 1.18.1, matplotlib: 3.11.2, PyYAML: 6.0.3, kicad: 10.0.6 (pcbnew), ngspice: 45.2, src: "pip list + apt-cache policy, 2026-10-02"}
  never: [FreeRouting, hw/pod/place.py, hw/pod/place_r1.py, any autorouter, any run without the 3 GB fence]
watch:   # re-run after any of these change; suggest a plm.py relation (lead adds, not this agent)
  rerun_when: ["hw/pod/*.kicad_pcb (routing, stackup, zone fill, any component move)", "hw/pod/gen.py / pod.net (nets, values)", "hw/pod/bom_jlc.csv (cap/inductor values)", "spec D6/D11/D13/D14 numbers", "firmware: LED PWM f, hop rate, mic clock divider, SMPS range policy", "mic PSRR or noise-floor measurement (E3/S2)"]
  plm_relation_proposal: {id: R-LAYOUT-NOISE, watches: [hw/pod/draft_r1/pod_r1_routed.kicad_pcb, hw/pod/pod.net, hw/pod/bom_jlc.csv, sim/noise/aggressors.yaml, sim/noise/params.yaml], items: [reg-board, sub-audio-in, sub-processing, sub-output]}

# ------------------------------------------------------------------------------------------------ requirements chain
inputs:   # all read-only
  board: {what: ".kicad_pcb read with pcbnew 10.0.6: tracks (layer, width, ends), vias (drill, span, net), pads (ref.num, net, bbox), filled zones, footprint refs", must_have: "4 copper layers, filled In1 GND zone; unrouted nets are detected and flagged INVALID", src: sim/noise/pcbgeom.py:load}
  stackup: {order: "board file (stackup) block, else DEFAULT_STACKUP: F 35 um, prepreg 0.0994 (er 4.05), In1 15.2, core 0.4804 (er 4.6), In2 15.2, prepreg 0.0994, B 35", src: "hw/pod/kicad-draft/pod.kicad_pcb:39-55 (the earlier draft); NOT in the draft_r1 board (board says 1.6 mm, reg-board open issue 2); JLC impedance page is JavaScript-rendered, not verifiable 2026-10-02", status: unverified}
  values: {src: "hw/pod/bom_jlc.csv Comment column by ref (100n, 2u2, 0.1 ...)", model_params: sim/noise/params.yaml}
  netlist: {src: hw/pod/pod.net, use: "pad->net comparison; mismatch = board is stale vs the schematic"}
  aggressors: {src: sim/noise/aggressors.yaml, form: "waveform (pulse_train | sawtooth | triangle | cap_square | band_noise | csv_period {path, f0, nharm, t_col, i_col}: one period of a sim/spice CSV, FFT to harmonics) + injection pads + sync flag + frequency tolerance + status; replace analytic waveforms by sim/spice exports when they exist (IF-AGGRESSOR-I below)"}
outputs:
  per_net: "segments, length per layer, width, vias, pads (geometry.json)"
  spice: "MIC_VDD_PATH (ports U1_15 PA5, C13_1, U2_5), GND_RETURN (49 pad ports), l1_full.cir (flat, node 0 = cell GND pad J4.1 (Rev F shared GND pad; was J6.1)); element = R, L (per segment/via/plane link), caps with ESR/ESL"
  spectra: "victim-node ripple per aggressor line at 693 frequencies (budget.json rows, other)"
  margins: "spur dBFS at the mic output vs the tone/band limits, nominal and pessimistic PSRR; ranked worst first (budget.json rows + l2_rows)"
  features: "per top row: share of the transimpedance by trace segment / via / plane link / component (reciprocity), layout_share_pct (budget.json rows[].features)"
  l2: "M and Cm between aggressor and victim nets with the two bounding models and the top piece pair (budget.json l2_pairs)"
  if_e2e: "IF-MIC-VDD-NOISE.json (format in docs/sim/e2e-chain.yaml): z_rail(f), bridge-current-to-mic-VDD transfer, background lines and PSD"

# ------------------------------------------------------------------------------------------------ threat model
bands:
  capture: {hz: [20000, 85000], scored_alias_band_hz: [20000, 96000], src: "spec L314 s5.1 usable ~20-85 kHz; MVP L29 says 20-96", note: "mic characterised only to 80 kHz (D13 L224)"}
  output: {hz: [1500, 4000], src: "spec D9 L203"}
  protect: {hz: [8000, 16000], src: "spec s6 L344: bone-conduction thresholds there track normal hearing, owner hears high; shaper zeros at 13 kHz (D6 L153)"}
  below_capture: {removed_by: "band-floor high-pass at the D10 frequency (spec L207, s5.1 L314)", consequence: "a spur that lands under 20 kHz after the chain is not translated; one that lands in 20-96 kHz is"}
chain:   # what an interference line at f_in becomes; implemented in sim/noise/alias.py (selftest passes)
  rule_1: "PDM sampling at fs_pdm folds f_in to fold(f, fs_pdm); CIC5 /5 folds again at 800.09 kS/s; RSFLT /4 folds at fs_out; total attenuation = CIC5(f_in) + RSFLT(f2)"
  rule_2: "a line that is an integer multiple of fs_out or fs_pdm lands at exactly 0 Hz and is removed (D14 L241 coherence); verified for harmonics 1-39 of the PWM and 1-9 of the mic clock"
  rule_3: "unprotected windows: n*4.00045 MHz +-(20..96 kHz) pass the CIC at ~0 dB; elsewhere the CIC nulls give -70 .. -140 dB"
  rsflt_assumption: {model: "0 dB to 88.8 kHz, -70 dB from 111.2 kHz, linear in dB between", status: unverified, src: "docs/research/A3-u575-plan.md s1.2; R18 L610 (response unpublished)"}
  smps_coincidence: {fact: "the core SMPS runs 3 MHz typ (DS13737 Rev10 Table 35 p.160, no min/max, 1.5 MHz below VDD 1.9 V); its 4th harmonic 12.000 MHz sits 1.35 kHz from 3*fs_pdm = 12.00135 MHz, so harmonics 4, 8, 12 ... are always inside a window", consequence: "if the SMPS clock is free-running with tolerance t, harmonic 4 beats against the mic clock at 1.35 kHz +-12 MHz*t: a deviation of 0.17..0.8 % (either sign) puts it in 20-96 kHz as a whine that moves with load and temperature", src: "alias.py fs_pdm_scan / window_scan 2026-10-02; lock to HCLK unpublished (sub-processing open issue 9)", status: "coincidence derived; coupling amplitude is small (see results), tolerance unknown"}
  fs_pdm_knob: {src: "alias.py fs_pdm_scan (3.0 MHz SMPS, harmonics k<=24 within 100 kHz of n*fs_pdm)", table: {"/18 4.44494 MHz": none, "/20 4.00045 MHz": "k=4,8,12,16,20,24 at -1350..-8100 Hz", "/22 3.63677 MHz": "k=17 (+85 kHz), 23 (-99 kHz)", "/24 3.33371 MHz": "k=10, 20 at -3375, -6750 Hz", "/26 3.07727 MHz": "k=1 at -77 kHz (fundamental in a window)"}, note: "divider must be even (D14); /18 is the A3 'band-edge' option (247 kS/s per spec L271); changes fs_out and the PWM tie, so a firmware/clock decision, not a layout one"}
aggressors:   # full waveform tables: sim/noise/aggressors.yaml#<id>; every amplitude has a status there
  A01_SMPS_IN: {what: "core SMPS input current pulses, VDDSMPS U1.21 -> VSS U1.22", f: "3.0 MHz +-20 % (assumed tolerance)", sync: false, src: "DS13737 Rev10 Table 35 p.160; ripple 108 mA pp derived L=2.2 uH Vout 1.15 V D=0.38; sub-processing.md key numbers"}
  A02_SMPS_VDD11: {what: "L1 ripple current into C8/C9, VDD11 U1.23 -> U1.24", f: "3.0 MHz", sync: false}
  A03_BRIDGE_CARRIER: {what: "idle AD ripple as bridge supply current, sawtooth +-6.25 mA at 400.045 kHz, Q1.4 (+3V0) -> R21.1", sync: true, src: "spec D6 L153: Vbus/(4 L f) = 12.5 mA pp at 0.3 mH; L unmeasured (E1)"}
  A03b_BRIDGE_EDGES: {what: "FET output-node charging spikes at every PWM edge, 18 mA x 10 ns", f: "n*200.0225 kHz", sync: true, status: "assumption (C_sw 60 pF)"}
  A04_BRIDGE_SHAPED_NOISE: {what: "noise-shaper residue in the coil current, 0.254 mA rms flat over 20-85 kHz", sync: false, src: "spec D6 MP-01 L153: -59 dB re FS current, I_FS 0.32 A; sub-output.md key numbers", why: "the only aggressor whose lines are not coherent with fs_out yet sits inside the capture band: shared rail/ground is its path"}
  A05_CPU_HOP: {what: "MCU supply steps every 0.64 ms hop: comb at k*1562.5 Hz, 2.5 mA x duty 0.68", sync: false, status: "assumption (dI, 1 us edges)", src: "sub-processing.md firmware architecture; power.py; C2 busy 55-81 %", why: "not a PWM-coherent line and its harmonics 13-61 span 20-96 kHz"}
  A06_PDM_CLOCK_RETURN: {what: "mic clock edges charging pin+trace C (8 pF), return through U2.3 -> plane -> U1.24", f: "4.00045 MHz odd harmonics", sync: true}
  A07_USB_FS: {what: "D+/D- edges, docked only (self-test and PWM-noise A/B run docked)", f: "6 MHz toggle +-300 ppm", sync: false, states: [docked]}
  A08_LED_PWM: {what: "PB7 open-drain LED current 0.73 mA; f is a firmware choice, '> 20 kHz' (sub-processing.md); placeholder 25 kHz INSIDE the capture band", sync: false, status: "placeholder"}
  F01_BRIDGE_OUT: {what: "OUT_A/OUT_B coil ripple current and 0-3 V swing (field model, legs complementary, sign +1/-1)", sync: true}
  F02_SMPS_LX: {what: "VLXSMPS switch node: 108 mA pp ripple current and 3 V swing", sync: false}
  F03_PDM_CLOCK: {what: "N$2 + MIC_CLK: 3 V swing and C dV/dt current", sync: true}
  not_modelled: ["charger: BQ25180 is linear (D11 L210), only DC 170 mA IR drops, see dc_rail_paths", "I2C 400 kHz: configuration bursts only, pull-ups ~0.3 mA", "exciter wires up the arm and the shell: not on the board", "ADC charge kicks: not rail-borne at these levels", "MLCC piezo singing (C14 22 uF X5R, spec s6 capacitor rule L344) and L1 magnetostriction (D11): mechanical self-hearing, owner listening E7/E11"]
victims:   # probe pads resolve on any board; sim/noise/aggressors.yaml#victims
  V1_MIC_SUPPLY: {probe: [U2.5, U2.3], mechanism: "mic PSRR sees VDD relative to its own GND pad", limit: LN-M01}
  V2_MIC_GND_VS_MCU: {probe: [U2.3, U1.24], mechanism: "PDM level reference and clock timing; bits are digital (VOL <= 0.45 V, datasheet p.4) so ground shift matters only in the 100 mV class", limit: informational}
  V3_ADC_REF: {probe: [U1.9, U1.8], mechanism: "VDDA is the ADC reference, no VREF+ pin (A3 s3)", limit: LN-M04}
  V4_LDO_OUT: {probe: [U4.1, U4.2], limit: informational}
  V5_BRIDGE_RAIL: {probe: [Q1.4, R21.2], mechanism: "AD output is (2d-1)*VDD: silence is exactly zero for balanced legs, rail ripple appears at (leg asymmetry) * ripple", limit: LN-M05}
  V6_ISENSE_KELVIN: {probe: [R21.2, U1.8], mechanism: "PA6 reads V(R21.1)-V(U1.8) so the copper between R21.2 and U1.8 adds to the 0.1 ohm shunt", limit: LN-M03}
  FV2_MIC_DATA: {net: MIC_DATA, mechanism: "pickup on the PDM data line (z 150 ohm, 10 pF)", limit: LN-M02}
  FV3_MIC_CLK: {net: MIC_CLK, mechanism: "pickup on the clock into the mic (z 33 ohm, 8 pF)", limit: LN-M02}
paths:
  P1_shared_rail: {mech: "aggressor current x impedance of +3V0 (LDO Zout, 0.1 mm tracks, C14/C7 ...) -> MCU die VDD -> PA5 (R_out ~50 ohm) -> MIC_VDD, filtered by PA5 R x C13 (100 nF, ~90 nF after derating): pole ~35 kHz at 50 ohm, ~18 kHz at 100 ohm", controls: "track width/length U4.1 -> U1 VDD pins, C13 placement, PA5 pin R, decoupling placement", layer: L1}
  P2_shared_ground: {mech: "return currents through In1 and the pad stubs/vias between aggressor and victim ground pads", controls: "GND stub length/width at the victim pad (0.1 mm tracks are 4.9 mohm/mm), via count, In1 cuts", layer: "L1 mesh; L3 if In1 is slotted near the mic", regime: "resistive below f_c ~1 MHz, inductive above"}
  P3_magnetic: {mech: "mutual inductance between loop of aggressor trace+return and victim loop", controls: "parallel run length and separation, layer (cross-side screened above ~1 MHz), loop height to In1", layer: L2}
  P4_electric: {mech: "mutual capacitance to a high-impedance victim", controls: "parallel run on the same layer; the plane screens E at every frequency", layer: L2}
  P5_psrr: {mech: "mic converts supply ripple to output spur", status: "datasheet gives one point at 1 kHz; nothing above (S2 closes)"}
  P6_alias: {mech: "folding of lines above fs_out by the decimation chain", layer: "alias.py"}
  P7_bridge_asymmetry: {mech: "rail ripple x (leg mismatch) at the exciter; mismatch from OUT_A vs OUT_B route R and C, P vs N Rds(on) (0.88 vs 0.34 ohm typ, sub-output.md)", layer: "L1 + geometry compare"}
  P8_mechanical: {status: "not in this sim (MLCC piezo, L1 magnetostriction, structure-borne exciter leak: IF-ACOUSTIC-LEAK of the e2e sim)"}

# ------------------------------------------------------------------------------------------------ mic data and thresholds
mic:   # SPH0641LU4H-1, Syntiant datasheet Rev B-1 (2 Dec 2024), local copy ~/Desktop/ultrasonic-scratch/sph0641_sq.pdf (page header carries a template error naming SPC18P8LM4H-1: docs/research/datasheet-provenance.md); no online copy opened (web search budget was exhausted 2026-10-02)
  psrr: {ultrasonic_mode: "55 dBV/FS, 200 mVpp sine @1 kHz (p.3)", standard_mode: "55 dBV/FS (p.3)", low_power_mode: "59 dBV/FS (p.4)", psr_n: "-84 dBFS(A), 100 mVpp square @217 Hz (p.3)", above_1khz: "NOT SPECIFIED", reading: "output spur = -55 dBFS per 1 V rms ripple; cross-check 50 mV rms -> -81 dBFS unweighted, -84 A-weighted: consistent (derived 2026-10-02)", status: interpretation}
  noise: {sens_dbfs_at_94spl: -26, snr_dba: 64.3, noise_dbfs_a: -90.3, ein_dbspl_a: 29.7, ultrasonic_floor: "NOT SPECIFIED (E3)", src: "datasheet p.3 ultrasonic table; derived: noise = -26 - 64.3"}
  floor_model: {white_extrapolation: "A-weighted ENBW 12467 Hz (computed from the A curve, budget.py a_weight_enbw) -> -131.26 dBFS/rtHz; per 781.25 Hz bin -102.33 dBFS; over 20-85 kHz -83.13 dBFS", scenarios_db: {optimistic: -6, white: 0, pessimistic: 8}, status: "assumption: the audio-band density continues flat to 85 kHz"}
  psrr_scenarios: {nominal: "flat -55 dBFS/V to 1 MHz", pessimistic: "20 dB worse above 20 kHz (35 dB)", worst: "e2e rolloff: PSRR 55-20log10(f/1 kHz) dB, floor 5 dB (21 dB @50 kHz, 16 @85 kHz, 5 above 178 kHz)", src: "docs/sim/shared-params.yaml#psrr (one table for both sims, 2026-10-02)", gate: "pass/fail on pessimistic; worst is reported (LN-M01.value_db_worst) and must stay >= 0"}
  pins: {VDD: U2.5, GND: "U2.3 (+ U2.2 SELECT tied to GND)", CLOCK: U2.4, DATA: U2.1, supply_range_v: [1.62, 3.6], clock_edge_ns_max: 3, cload_pf_max: 140, src: "datasheet p.2, p.4, p.9"}
thresholds:   # budget.py --check-doc compares these with its own derivation
  tone_limit_dbfs: {value: -112.33, derive: "bin floor (white) -102.33 minus margin 10 dB: injected tone adds <= 0.41 dB to its FFT bin", applies: "each line that lands in 20-96 kHz after the chain, per 781.25 Hz bin (spec s5.2: 256-pt FFT)"}
  band_limit_dbfs: {value: -93.13, derive: "20-85 kHz floor (white) -83.13 minus 10 dB", applies: "noise-like aggressors (A04) integrated over 20-85 kHz"}
  margin_signoff_db: {pessimistic_psrr: 10, why: "model error on L/C ~ +-10 dB (section limits); LN-M01 >= 0 is pass, >= 10 is sign-off"}
  digital_pickup_v_pk: {value: 0.1, derive: "VOL <= 0.45 V and VIL = 0.3 VDD (datasheet p.4): 100 mV pk (sum of harmonics) = 4.5x margin", margin_db_min: 12}
  kelvin_pct_max: {value: 2.0, derive: "I_SENSE gain error budget: R21 0.1 ohm; 2 % = 2 mohm. Design choice: the error is systematic and can be calibrated out at E1/F4", owner: "decides whether to enforce or to calibrate"}
  adc_ref_mv_pk_max: {value: 0.37, derive: "0.5 LSB of 12 bit at 3.0 V = 0.366 mV, lines <= 16 kHz (R22/C22 pole), PA6 self-test band"}
  bridge_rail_uv_rms_max: {value: 50, derive: "shaper noise -93 dB re FS 0.2-8 kHz (spec D6 L153) x 3.0 V = ~50 uV rms; ripple x 10 % leg asymmetry (assumed) must stay under it", band_hz: [1500, 8000]}
  e2e_ripple_mv_rms_max: {status: "RETIRED 2026-10-02 (integrator): a white-ripple rms limit over 1-100 kHz is ill-posed for a line spectrum whose dominant line (1.56 kHz) sits below the band; the e2e requirement is now tone_limit_dbfs / band_limit_dbfs after PSRR in 20-96 kHz (LN-M01 form), docs/sim/e2e-chain.yaml IF-MIC-VDD-NOISE"}
metrics:
  LN-M01: {name: "mic supply spur margin, worst line or band, pessimistic PSRR", pass: ">= 0 dB, sign-off >= 10 dB; also reported: nominal and worst (e2e rolloff) PSRR, worst must be >= 0", covers: "A01-A08 conduction + F02 magnetic/electric into MIC_VDD"}
  LN-M02: {name: "PDM line pickup margin (sum of harmonics vs 100 mV)", pass: ">= 12 dB", review: "< 22 dB (inside the +-10 dB L2 model error) = REVIEW at the next re-route", covers: "F01-F03 into MIC_DATA, MIC_CLK"}
  LN-M03: {name: "I_SENSE Kelvin error, % of R21 at 5 kHz", pass: "<= 2 %"}
  LN-M04: {name: "ADC reference ripple, lines <= 16 kHz, mV pk", pass: "<= 0.37"}
  LN-M05: {name: "bridge rail ripple 1.5-8 kHz x 10 % leg asymmetry, uV rms", pass: "<= 50"}
  LN-M06: {name: "INFORMATIONAL: ripple at mic VDD 1-100 kHz, background lines + noise, mV rms (excludes the bridge's own audio-band supply current)", pass: "none (retired as a gate 2026-10-02; LN-M01 is the gate)", why: "dominated by the 1.5625 kHz hop-rate fundamental, which the band-floor high-pass removes; the 20-100 kHz part is the one that is translated"}

# ------------------------------------------------------------------------------------------------ method and limits
layers:
  L1:
    what: "pcbgeom -> per-net R (rho l/(w t)) + loop L (Hammerstad microstrip Z0air/c over In1) per segment, via barrels, In1 as resistive mesh (0.1 mm pitch, Kron-reduced to the GND vias), component models, MNA solve; SPICE emitted from the same element list"
    cost: "~1.5 s extract, ~2 s per 700 frequencies x 9 aggressors x 6 probes, 0.3 GB; ngspice 45 cross-check <1 s"
    enough_when: "every LN-M01 line has >= 20 dB nominal and >= 10 dB pessimistic margin and no assumption flagged below can move a term by more than that margin (see sweep)"
    code: [sim/noise/lumped.py, sim/noise/plane.py, sim/noise/budget.py]
  L2:
    what: "filament pieces (<= 0.25 mm) at layer heights over In1; M by Neumann sum, Cm by charge model; M(f) = M_img + T(f)(M_free - M_img); Cm always with plane image; uniform current along an aggressor net (upper bound on branches)"
    cost: "~1.5 s, 0.3 GB"
    enough_when: "digital-line pickup >= 12 dB under 100 mV and mic-VDD pickup >= 20 dB above the conduction rows"
    validated_against: "Grover free-space M 0.03 %, image-line M' 2.7 %, image-wire Cm 8 % (couple.selftest, 2026-10-02)"
    code: [sim/noise/couple.py]
  L3:
    what: "field or PEEC solve on a cropped region only"
    cost: "see heavy_runs; <= 4 GB, one job at a time, owner-triggered after the research swarm"
    gate: "run L3 only if ANY: (a) LN-M01 pessimistic margin < 12 dB for a line whose path is a copper feature; (b) a layout feature the filament/mesh model cannot represent sits within 3 mm of U2 or on a victim path (In1 slot/neck, plane cut by the port keep-out, antipad cluster, In2 pour); (c) bring-up spur exceeds the L1/L2 prediction by > 10 dB (model failed, LN-R12); (d) stackup change (In2 as plane, 1.6 mm board)"
limits:   # quasi-static approximation on a 34 x 13 mm board, 15.2 um In1, 35 um outer copper; src: derived 2026-10-02 (rho 1.72e-8 ohm m)
  electrical_size: "lambda/10 = 340 mm needs f < ~500 MHz in FR4: size is not the limit up to 100 MHz (board = lambda/50 there); component ESL/SRF and via models are: lines above 30 MHz are not scored (params model.f_max_net_hz), digital pickup scored to 100 MHz"
  skin_depth_um: {"200 kHz": 148, "1 MHz": 66, "4 MHz": 33, "30 MHz": 12.1, "100 MHz": 6.6}
  skin_effect: "35 um traces: R_ac/R_dc ~1.0 at 200 kHz, ~1.1-1.3 at 4 MHz (estimate; not modelled, within model error); In1 15.2 um: delta > t up to ~40 MHz, sheet R stays 1.13 mohm/sq"
  plane_crossover: {f_c_hz: 955000, formula: "R_s/(pi mu0 d), R_s 1.132 mohm/sq, d 0.3 mm", T: {"200 kHz": 0.98, "1 MHz": 0.69, "4 MHz": 0.23, "30 MHz": 0.03}}
  at_200_khz: "BELOW f_c: In1 is a resistive spreader, return current does not hug the trace; shared-ground noise = I x mesh R (L1 mesh is right); loop L from the image model over-states L (irrelevant: wL = 6 mohm on a 10 mm trace vs R 50 mohm); magnetic flux passes the sheet (T 0.98), so 'free' M applies and cross-side pairs are NOT screened"
  at_4_mhz: "ABOVE f_c: return hugs the trace, image L' applies (0.37 nH/mm F.Cu, 0.69 nH/mm B.Cu, 0.1 mm wide); the sheet screens only 12.7 dB, so cross-side magnetic coupling is T = 0.23 of the free value, not zero"
  crossover_decade: "0.3-3 MHz holds PWM harmonics 2-15: neither pure model holds, expect x2-3 on L; harmless for sync lines (they fold to 0 Hz), matters for A01/A02 (3 MHz)"
  not_captured: ["pad joins use the pad's axis-aligned bounding box: custom-shape pads over-join (U2 pad 3 GND ring, bbox 1.6 x 1.6 mm)", "plane current detours around slots/necks at HF (mesh is resistive only)", "mutual L between series segments of one net and between GND stubs", "trace-to-plane C (only mutual C between nets, in L2)", "via pad C, antipad leakage of E field through the plane", "pad/solder and component body parasitics beyond ESL", "exciter wires (80 mm pair up the arm) and the shell"]
  regime_error_budget: "judgement, unverified: R +-15 % (mesh pitch 0.2 -> 0.1 mm moved plane R 2.575 -> 2.290 mohm, 11 %), loop L x2, mutual L x2-3 near f_c, Cm +-30 %; hence the 10 dB sign-off margin"

