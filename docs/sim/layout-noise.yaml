  - {id: UN-7, what: "MLCC DC-bias derating (no manufacturer curves on file)", effect: "sweep: 1.5 dB", retire: "Samsung curves for C59461 / C19702 / C12530"}
  - {id: UN-8, what: "aggressor amplitudes: hop dI 2.5 mA, SMPS edge 5 ns, FET C_sw 60 pF, clock pin C 8 pF", effect: "each scales a row linearly (20 dB per decade of amplitude)", retire: "IF-AGGRESSOR-I from the sims, then bring-up"}
