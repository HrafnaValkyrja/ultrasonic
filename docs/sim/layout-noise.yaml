  LF-8: {id: LF-8, sev: model, text: "board file has no stackup block and says 1.6 mm; extractor uses the 0.8 mm JLC numbers of the earlier draft and says so (inputs.stackup)", src: "reg-board.md open issue 2"}
  LF-11: {id: LF-11, sev: model, text: "under the worst (e2e rolloff, 5 dB at MHz) PSRR the limiting row is F02 SMPS switch-node magnetic coupling into MIC_VDD at 7.98 MHz aliasing to 23.0 kHz: 9.6 dB, 0.4 dB short of sign-off. Retired by the S2 PSRR(f) sweep (LN-R12); layout lever: keep the VLXSMPS/L1 loop away from MIC_VDD", src: "budget.json rows margin_worst, 2026-10-02"}
  LF-10: {id: LF-10, sev: layout, text: "mic GND pad U2.3 (the custom GND ring round the port) has no via of its own: it reaches In1 through 0.3 + 0.75 + 1.38 mm of 0.1 mm B.Cu via pad U2.2 to a via at (4.675, 7.847): 18.3 mohm (~3 nH) to MCU VSS U1.24, and C13's ground returns 17.7 mohm away at (6.6, 3.985). A via on the ring edge conflicts with the 'no vias inside r1.6 of the port' rule (sub-audio-in issue 2): layout trade-off; also shorten the U1.24 F.Cu stub (3.2 mohm)", src: "budget.json dc_rail_paths_mohm + contributions(), 2026-10-02"}
  LF-9: {id: LF-9, sev: info, text: "bridge legs: OUT_A 20.9 mm, OUT_B 21.6 mm of copper with 2 vs 3 vias: route asymmetry ~3 % in length; Rds(on) P vs N (0.88 vs 0.34 ohm) dominates leg mismatch, not the copper", src: "geometry.json; sub-output.md key numbers"}

# ------------------------------------------------------------------------------------------------ requirements
requirements:
  - {id: LN-R01, text: "Read any 4-layer .kicad_pcb with a filled In1 GND zone plus bom_jlc.csv; never write inputs; stackup from the file, else a declared default that is named in every report", traces_to: [O14, O19, O20, "reg-board issue 2"], verification: "sim/noise/smoke.sh on draft_r1 routed, baseline, placed; sha256 of inputs unchanged"}
  - {id: LN-R02, text: "Compare the board's pad->net map with hw/pod/pod.net; any mismatch makes the run INVALID (valid=false, exit 1, --check-doc INVALID)", traces_to: [O19, R22], verification: "Rev F routed 193/193, 0 mismatches; Rev E fanout 30 mismatches -> exit 1 (2026-10-02)"}
  - {id: LN-R03, text: "Flag unrouted nets: pads on extracted nets without copper path make results INVALID and print the pads", traces_to: [R22], verification: "budget.py on pod_r1_placed.kicad_pcb prints WARNING (49 pads) and valid=false"}
  - {id: LN-R04, text: "Emit SPICE (MIC_VDD_PATH, GND_RETURN, flat deck) from the same element list as the internal solver; ngspice 45 must agree to < 1 %", traces_to: [O18], verification: "extract.py --selfcheck (max rel err 8e-7)"}
  - {id: LN-R05, text: "All aggressor waveforms live in aggressors.yaml with status (datasheet|derived|assumption); replace analytic ones with sim/spice exports when available", traces_to: [D6, D11, D14], verification: "diff of aggressors.yaml statuses; IF-AGGRESSOR-I delivered by the bridge/SMPS sims"}
  - {id: LN-R06, text: "Score every line through mic PSRR (nominal and pessimistic) and alias.chain; sync lines that fold to 0 Hz are dropped only when flagged sync; async lines are scanned over their frequency tolerance", traces_to: [T6, R9, R21, D14], verification: "budget.json rows; alias.selftest"}
  - {id: LN-R07, text: "LN-M01 >= 0 dB under pessimistic PSRR, >= 10 dB for sign-off, and >= 0 dB under the worst (e2e rolloff) PSRR, per thresholds.* and docs/sim/shared-params.yaml#psrr", traces_to: [T6, D11], verification: "budget.py --check-doc; LN-M01.value_db_worst"}
  - {id: LN-R08, text: "Rank paths worst first with the responsible geometry feature (segment xy+layer, via xy, plane link, component) and layout_share_pct", traces_to: [O14], verification: "rows[].features sum equals the direct transimpedance (check_vs_direct)"}
  - {id: LN-R09, text: "Field coupling (L2) into MIC_VDD, MIC_DATA, MIC_CLK with both bounding models and the T(f) interpolation; PDM-line pickup >= 12 dB under 100 mV", traces_to: [D13, R14], verification: "l2_pairs, couple.selftest"}
  - {id: LN-R10, text: "I_SENSE Kelvin error <= 2 % of R21, or the owner accepts firmware calibration at E1/F4", traces_to: [O15, O18], verification: "LN-M03; open/short and known-resistor calibration at bring-up"}
  - {id: LN-R11, text: "Firmware frequency plan: LED PWM f = n*fs_out or outside 20-96 kHz; no async source harmonic inside a window without a measured margin; mic divider chosen with fs_pdm_scan", traces_to: [T6, R21, D14], verification: "alias.fs_pdm_scan / window_scan; spectrum capture at bring-up"}
  - {id: LN-R12, text: "Rev 1 provides measurement access for the unknowns that set the thresholds: a MIC_VDD injection/probe point and the raw PDM stream over USB, to measure PSRR(f) 1 kHz-1 MHz and the 20-96 kHz floor (E3, S2); after measurement re-fit params.yaml and re-run; > 10 dB disagreement trips the L3 gate", traces_to: [O18, O20, R22], verification: "bring-up step; size cost of one 0.7 mm pad (O20: test access must not cost size)"}
  - {id: LN-R13, text: "Every run fenced (MemoryMax 3 GB, no swap); heavy runs one at a time <= 4 GB, only on the owner's go-ahead after the research swarm", traces_to: ["CLAUDE.md memory discipline", "incident 2026-09-30"], verification: "smoke.sh uses systemd-run; heavy_runs below"}
  - {id: LN-R14, text: "Provide IF-MIC-VDD-NOISE (z_rail, bridge-current-to-mic-VDD transfer, background lines/PSD) to the e2e sim; the e2e loads it (stages.SupplyInject, param mic_vdd_json)", traces_to: [T6], verification: "sim/noise/out/IF-MIC-VDD-NOISE.json; chain.py --scenario T6 --set mic_vdd_json=... loopback=True"}
  - {id: LN-R15, text: "doc and code stay in sync: budget.py --check-doc compares thresholds and, for the same board sha, results", traces_to: ["README rule 5 staleness"], verification: "check-doc output in the smoke run"}

# ------------------------------------------------------------------------------------------------ heavy runs (NOT run now)
heavy_runs:
  - {id: H1, what: "own PEEC of In1 + F/B/In2 traces on a crop (x 0-14 mm: mic, U1 west half), 0.25 mm plane cells, 100 kHz-30 MHz, 40 frequencies", memory_gb: "1-3 (N~8k filaments, dense complex Z 1 GB + LU copy)", time: "10-20 min with OMP_NUM_THREADS=8 (estimate, unverified)", fence: "MemoryMax=4G MemorySwapMax=0", blocked_on: ["layout freeze (simplification study)", "owner go-ahead after the research swarm", "PEEC code (~300 lines on couple.py; not written)", "L3 gate (section layers)"]}
  - {id: H2, what: "Elmer magnetodynamics (A-V, harmonic) on an 8 x 8 x 3 mm crop around the mic with thin-sheet In1, 200 kHz / 1 / 4 / 12 MHz", memory_gb: "3-4 at <= 400k tets (estimate)", time: "30-90 min per frequency (estimate)", fence: "MemoryMax=4G", blocked_on: ["install permission: Elmer (source build) + Gmsh (apt)", "kicad-cli pcb export step of the frozen board", "layout freeze", "L3 gate"]}
  - {id: H3, what: "openEMS full wave of board + arm wire pair + shell, >= 100 MHz", memory_gb: "4-12 (20-60 M cells; exceeds the fence, shrink or skip)", time: "hours", blocked_on: ["not recommended; only if an HF problem is measured"]}
  - {id: H4, what: "ngspice transient of l1_full.cir with PWL aggressors from sim/checks/bridge_spice.py and an SMPS source, 100-200 us at <= 1 ns step, to check the spectral assumptions (shaper noise vs rail, edge spikes)", memory_gb: "< 1 (use TMPDIR on disk, never -r to tmpfs)", time: "5-20 min (estimate)", fence: "MemoryMax=3G", blocked_on: ["aggressor waveform export (IF-AGGRESSOR-I)", "owner go-ahead (> 60 s)"]}
  - {id: H5, what: "Monte Carlo over the unmeasured parameters (PSRR scenario, floor scenario, LDO Zout, PA5 R, die C, SMPS tolerance, MLCC derating): 500 runs x 3.5 s", memory_gb: "0.3", time: "~30 min", blocked_on: ["parameter ranges agreed (owner or E-measurements)", "owner go-ahead (> 60 s)"]}

interfaces:
  IF-MIC-VDD-NOISE: {to: "sim/e2e (docs/sim/e2e-chain.yaml)", status: "delivered + consumed (e2e stages.SupplyInject param mic_vdd_json, 2026-10-02)", file: sim/noise/out/IF-MIC-VDD-NOISE.json, board_sha256: e159bccb65b756d9, content: "f_hz 1-196 kHz (323 pts); z_rail_ohm {re,im} = Q1.4-R21.2 volts per ampere of bridge supply current (A03 pair: the BRIDGE rail, NOT the mic); h_ibridge_to_micvdd_ohm {re,im} = volts at U2.5-U2.3 per ampere of the same current (what the e2e multiplies i_sup by); background_lines_1k_100k [{f_hz, v_rms, source, sync}]; background_noise [{source, f_hz[], psd_v2_per_hz[]}]", numbers_2026-10-02: {background_mv_rms_1k_100k: 0.1666, background_mv_rms_20k_100k: 0.0279, z_rail_mohm: {"1 kHz": 236, "98 kHz": 139, "196 kHz": 80}, h_to_mic_mohm: {"1 kHz": 151, "98 kHz": 31, "196 kHz": 8.1}}, requirement_check: "gate = LN-M01 form (per line/band after PSRR, 20-96 kHz); the old 1-100 kHz mV-rms limits are retired"}
  IF-AGGRESSOR-I: {from: "sim/checks/bridge_spice.py, deadtime_switching.py, a core-SMPS model (not existing), firmware emulation (hop timing, LED PWM f)", format: "CSV (time s, current A), >= 1 whole period at the stated f0, one file per aggressor id; consumed by aggressors.yaml wave kind csv_period", replaces: "analytic waveforms in aggressors.yaml", status: "hook implemented and self-tested; no producer yet"}
  IF-ALIAS-PLAN: {to: "firmware / clock plan (sub-processing)", content: "alias.fs_pdm_scan table, LED PWM rule LN-R11, SMPS range policy (never Range 4 on SMPS, D11 L210)", status: proposal}
  IF-RAIL-IR: {to: "docs/system/rail-budget.yaml + sub-power (ECR-0005) today; planned SIM-RAIL transient (docs/sim/index.yaml gaps) later", content: "results.rail_paths_dc_mohm: copper resistance LDO -> bridge (Rev F 203/198 mohm), MCU, mic; LDO Zout assumption 0.05 ohm + 100 nH", status: "delivered; no sim consumes it yet (consumer = the planned rail-transient sim)"}
  IF-LAYOUT-FEATURES: {to: "layout session / simplification study (O14)", content: "LF-1..LF-4 with xy/layer; budget.json rows[].features after every re-route", status: delivered}
  IF-MECH-NOISE: {to: "mechanical/acoustics sims", content: "C14, C7-C9 (MLCC piezo) and L1 (magnetostriction) locations and the PWM/SMPS spectra that excite them; not computed here", status: "out of scope, pointer only"}

uncertainties:
  - {id: UN-1, what: "mic PSRR above 1 kHz and the meaning of 'dBV/FS'", effect: "sets the whole mic-supply margin: +-20 dB scenario", retire: "S2 injection sweep on rev 1 (LN-R12); Syntiant SiSonic design guide (not fetched)"}
  - {id: UN-2, what: "mic ultrasonic noise floor (E3)", effect: "-6..+8 dB on both limits", retire: "E3 capture on rev 1"}
  - {id: UN-3, what: "ADF1 RSFLT response (R18)", effect: "chain attenuation of lines 100-400 kHz in the 800 kS/s domain", retire: "S1 swept tone"}
  - {id: UN-4, what: "core SMPS clock: free-running or locked, tolerance, spread (DS gives 3 MHz typ only)", effect: "LF-5 whine risk", retire: "spectrum capture of the PDM stream at bring-up (E11)"}
  - {id: UN-5, what: "MCU die capacitance and bond inductance, PA5 output impedance (<= 100 ohm), LDO Zout", effect: "sweep: <= 9 dB on LN-M01", retire: "bring-up impedance measurement; TPS7A20 data if TI publishes Zout"}
