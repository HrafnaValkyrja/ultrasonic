owner_inputs:
  - {id: OI-1, ask: "Margin policy: 10 dB below the mic floor for injected tones, 12 dB on PDM-line pickup, Kelvin <= 2 % (or calibrate)", default: "as in thresholds"}
  - {id: OI-2, ask: "One 0.7 mm probe pad on MIC_VDD (and access to the raw PDM stream) on rev 1 for the PSRR sweep (LN-R12): O18 diagnosability vs O20 size", recommend: yes}
  - {id: OI-3, ask: "LED PWM frequency and mic clock divider (LN-R11): /20 (today) or /18", recommend: "decide with the firmware plan; sim says /18 has no SMPS coincidence"}
  - {id: OI-4, ask: "Permission to install Gmsh (apt) and build Elmer ONLY if the L3 gate trips", recommend: "no install now"}
  - {id: OI-5, ask: "Confirm the JLC 0.8 mm 4-layer stackup (or give the real one) and the In2 policy", recommend: "set a stackup block in the board before the layout session"}
  - {id: OI-6, ask: "Go-ahead for heavy runs after the research swarm finishes (H4 first, H5 if ranges agreed)", recommend: "H4 only"}
  - {id: OI-7, ask: "Does the owner have a function generator or sound-card output for a supply-injection sweep at bring-up?", why: "no bench rig (O18)"}

