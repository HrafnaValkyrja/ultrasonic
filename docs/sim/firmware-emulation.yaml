# FWSIM: firmware + emulation requirements for stage C (owner O18, spec L644). Audience: other Claude instances.
# Format rules (owner 2026-10-02): current state only; every fact carries src (file:symbol | spec Lnn | URL) + date; pointers not copies;
# invariants are checkable thresholds; one 'why:' per non-obvious item. Dates ISO. Lnn = line in docs/spec.md as of 2026-10-02 (header says v0.14, content v0.15).
# Sibling format reference: docs/sim/e2e-chain.yaml. This file is REQUIREMENTS ONLY: no firmware, harness or emulator code exists; nothing was installed or run.
# External facts were fetched 2026-10-02 with curl from GitHub API/raw, ti.com and renode.readthedocs.io (web-search budget was exhausted, so no search-engine coverage;
# anything not opened is labelled 'unverified'). Rerun this check when any item in `watch` changes.
meta:
  id: FWSIM
  date: 2026-10-02
  scope: "ladder step C (spec O18 L644): firmware written and tested before the board exists, so rev-1 day one debugs firmware that already ran; catches the hardware-only classes firmware can touch: pinouts, AF/clock/DMA misconfiguration, rail-capacity use, noise-coupling schedule, thermal (charger) policy, ESD-path pin states, bring-up ordering"
  layout_agnostic: true   # reads no .kicad_*; board facts enter ONLY through docs/system/pin-contract.yaml, docs/system/rail-budget.yaml and the generated docs/system/integration-map.md
  shared: "docs/sim/shared-params.yaml (clocks, ceiling definition, exciter, thresholds): one source with sim/e2e, sim/acoustics, sim/noise"
  catalogue: docs/sim/index.yaml
  rev_f_refresh: "2026-10-02 integrator: design_binding re-read from pin-contract.yaml + integration-map.md s4 (Rev F, leg B on TIM1_CH3/CH3N PA10/PB15, ECR-0003); see change_log"
  status: "2026-10-07: architecture foundation in fw/ (group a: FWSIM-R1, R2, R5, R11 done; R3, R4, R6, R9, R10, R64 partial) + DSP chain host behaviour (group b: R8, R15 done; R7, R13, R14, R47 partial); gate `python3 fw/tools/fwsim.py all` -> fw/out/summary.json (23 rows); L2 on demand `python3 sim/fw/l2.py`; no emulator, port_u575 HAL stubs. sim/dsp + sim/e2e provide the numeric reference and the FWIL ABI (IF-FW-DSP)"
  planned_code: ["fw/{core,hal,port_u575,port_host,boot,gen,spec,third_party,test,tools}", "sim/fw/{models,renode,rules.yaml,vectors}"]
  planned_outputs: "sim/out/fw/{summary.json,<scenario>.json,pwm_records/,pin_audit/,selftest/}"
  honesty: "Renode has NO STM32U5 platform and no model of ADF1, U5 RCC/PWR/FLASH, OTG_FS, and only a partial TIM (src: tool_survey). Every effort number in this file is my estimate from SVD field counts and existing Renode model sizes, not a measurement. The emulator proves register-level and sequencing behaviour; it never proves analogue behaviour, timing jitter or current."
abbr:
  ADF1: "STM32U575 Audio Digital Filter (PDM to PCM block; autonomous in Stop 2; no ST LL driver exists, only HAL_MDF)"
  GPDMA1/LPDMA1: "general-purpose DMA (16 ch; autonomous only in Sleep/Stop 0/Stop 1, RM0456 Rev 7 Table 136) / low-power DMA (4 ch; SRAM4 in Stop 2)"
  TIM1: "advanced-control timer: complementary PWM + dead time; drives the H-bridge"
  UEV/RCR/UDE: "update event / repetition counter / update DMA request enable"
  CCR/ARR/DTG/DTGF/DTAE: "TIM1 compare value / auto-reload / dead-time generator rising / falling / asymmetric-dead-time enable (TIM1_DTR2)"
  MOE/OSSI/OIS: "TIM1 main output enable / off-state idle selection / output idle state bits (BDTR, CR2)"
  HAL: "hardware-abstraction layer in THIS repo (fw/hal/*.h), not ST's HAL"
  LL: "ST low-level drivers (stm32u5xx-hal-driver/Inc/stm32u5xx_ll_*.h)"
  SVD: "CMSIS System View Description XML (register map of the chip)"
  DWT/CYCCNT: "Cortex-M33 data watchpoint unit / its free-running cycle counter"
  FTZ/DAZ/FZ: "flush-to-zero / denormals-are-zero (x86 MXCSR) / FPSCR.FZ (Cortex-M33 FPU)"
  IWDG: "independent watchdog (LSI clock; once started only a reset stops it, RM0456 Rev 7 Stop 2 section)"
  BOR/PVD: "brown-out reset / programmable voltage detector"
  CDC/DFU: "USB virtual serial port class / device firmware upgrade (ST ROM bootloader at 0x0BF90000)"
  JEITA/TS/ILIM/VINDPM/SYS: "battery-industry temperature charge rules / BQ25180 NTC pin / input current limit / input voltage DPM / BQ25180 system output"
  FSM: "finite state machine (D12 mode machine)"
  tier H/E/T/S/B: "H host-native test; E instruction-set emulation of the real ELF; T trace-rule check on register traces; S static analysis; B board-level export to sibling sims"
  L0/L1/L2: "comparison levels: L0 host-C vs ARM binary (bit-exact); L1 firmware stage taps vs sim/dsp float64 (tolerance); L2 sim/e2e metrics with the firmware in the loop"
  RESD: "Renode Sensor Data Format: timestamped sample files (Voltage uV, Custom types) for injecting sampled inputs"
  E1..E3: "static cycle bound / emulator instruction counts / DWT counts on hardware (cycle_budget)"
  Rn: "inside this file FWSIM-Rn (requirement ids are always written in full in cross-references); spec risks are written spec Rn; board part refs (R1, R21, R3-R6) follow the schematic"
  P0/P1/P2: "must exist before the board order / before rev-1 day one / when its trigger decision lands"

