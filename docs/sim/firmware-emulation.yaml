# ------------------------------------------------------------------------------------------------ binding (values enter from sources, never retyped into firmware)
design_binding:
  hop: {val: "128 input samples = 0.640 ms; hop_cycles = 128 * HCLK / fs_pcm = 51,200 at P80 (102,400 P160, 40,960 P64, 30,720 P48); independent of ARR and of the PWM rate", src: "A3-u575-plan.md s2 (PCM = HCLK/400); spec D14 L246; docs/sim/shared-params.yaml clocks.hop_cycles_at_hclk", why: "the old '256 * ARR' only held at ARR 200 and broke for the 400/800 kHz A/B (FWSIM-R61), skeptic 2026-10-02"}
  clock_plans: {val: "P80 default; P160 / P64 / P48 as in A3 s2 table", src: "docs/research/A3-u575-plan.md s2 (2026-09-30); sub-processing.md Modes"}
  adf_chain: {val: "CIC5 /5 + RSFLT /4 -> 200.02 kS/s, DR 24-bit left-aligned (DR[31:8]); D2 fallback /10 + CPU half-band", src: "A3 s1.2; sim/e2e IF-FW-DSP abi"}
  tim1: {val: "ARR 200 (201 levels), centre-aligned, one duty update per PWM period over DMA, dead time 1 tick = 12.5 ns, AD modulation, leg B = complement of leg A; leg A = CH1/CH1N, leg B = CH3/CH3N (Rev F); per update GPDMA writes a 3-word DMAR burst DBA = CCR1, DBL = 2 -> CCR1, CCR2 (unused, CC2E = 0), CCR3; CCR3 = ARR - CCR1 with both channels in PWM mode 1 (or CCR3 = CCR1 with CH3 in PWM mode 2: pick one, fw/spec/knobs.yaml); hop buffer = 3 x 128 half-words at ARR 200 (x2 / x4 at ARR 100 / 50)", src: "spec D6 L155-L170; sub-output.md Interfaces; ECR-0003 L12; sub-processing.md FW-10 (2026-10-02)"}
  tim1_update_cadence: {val: "centre-aligned UEV fires at BOTH overflow and underflow; RCR = 1 gives one update per PWM period, RCR = 0 gives two", src: "RM0456 Rev 7 TIM chapter 'Repetition counter' (local text ultrasonic-scratch/st_new/rm7.txt L225289-L225305; TIMx_RCR REP description L232173)", why: "a wrong RCR doubles the DMA rate and the output pitch; invisible to any host build because it lives in the LL register code"}
  gpdma_requests: {val: "REQSEL adc1_dma 0, adc4_dma 1, i2c2_rx_dma 15, i2c2_tx_dma 16, tim1_upd_dma 46, adf1_flt0_dma 98", src: "RM0456 Rev 7 Table 137 (rm7.txt L75996-L76221, number precedes name); matches A3 s1.1"}
  flash: {val: "8 KB page, up to 256 pages, 128-bit quad-word + 9-bit ECC, 512 B OTP; wait states at 80 MHz Range 2 = 2 WS, at 160 MHz Range 1 = 4 WS; ICACHE 0 WS on hit", src: "RM0456 Rev 7 L29674-L29700, Table 54 L29941, ICACHE L38160 (local text)"}
  option_bytes: {val: "FLASH_OPTR: RDP, BOR_LEV[2:0], IWDG_SW, IWDG_STOP, IWDG_STDBY, nSWBOOT0, nBOOT0, PA15_PUPEN, TZEN; FLASH_WRP1AR (write-protect first pages); NSBOOTADD0", src: "STM32U575.svd (Open-CMSIS-Pack/STM32U5xx_DFP @dced5faff40a, 2026-07-15; sha256 0569f4eaae52e8e6...) FLASH_OPTR, FLASH_WRP1AR"}
  stop2_io: {val: "in Stop 2 every I/O keeps its Run state; IWDG, once started, cannot be stopped except by reset", src: "RM0456 Rev 7 'I/O states in Stop 2 mode' (rm7.txt L44854-L44870); sub-ui.md issue 6"}
  charger_i2c: {val: "BQ25180 7-bit address 0x6A; register plan in the bq25180_model section", src: "TI SLUSE99C Rev C s8.3.14 (fetched 2026-10-02; SHA-256 prefix c2008f613723fec3 = sub-power.md copy)"}
  pins_and_channels: {val: "POINTER: docs/system/integration-map.md s4 (generated from hw/pod/gen.py) + docs/system/pin-contract.yaml signals. Facts this file relies on (Rev F, 2026-10-02): leg A PA8/PA7 TIM1_CH1/CH1N, leg B PA10/PB15 TIM1_CH3/CH3N (AF1; was PA9/PB0 CH2/CH2N before Rev F, ECR-0003); PB3 (via R2) / PB4 ADF1_CCK0/SDI0 (AF3); PB13/PB14 I2C2 (AF4); PA11/PA12 USB (AF10); PA6 I_SENSE ADC1; PA4 VBAT_SENSE ADC4; PA1 VBUS_SENSE; PA2 TS; PA0 BTN WKUP1; PA5 MIC_VDD GPIO; PA15 CHG_INT EXTI; PB7 LED_K TIM4_CH2 (AF2); PB6 DBG_TX USART1_TX (AF7, TP7); PB8/PB1 MDF1 fallback dots TP8/TP9; PB5 strapped to GND; free PC13 PH0 PH1 PA3 PA9 PB0", src: "integration-map.md s4 + pin-contract.yaml (read 2026-10-02 23:30)", check: "fwsim lint (FWSIM-R5) fails when a pin named anywhere in this file differs from integration-map.md s4"}
  ceiling_dbfs: {val: -12, status: "assumed; no spec number", definition: "docs/sim/shared-params.yaml#ceiling: true peak of the PRE-QUANTISER x16-interpolated stream (tap FWSIM-R10) <= 10^(dbfs/20); the shaped CCR stream adds the noise-shaper excursion (bound in FWSIM-R15)", src: "docs/sim/e2e-chain.yaml findings F1; shared-params#ceiling"}
  squelch_dbfs: {val: -68, status: "assumed knob; e2e F3 says set per unit at boot or production test", src: "docs/sim/e2e-chain.yaml design_binding"}
  charger_plan: {val: "ICHG code 44 (170 mA) at 20-45 C, code 32 (50 mA) below 20 C; TS_HOT 0b11 (45 C); EN_PUSH 0; PB_LPRESS_ACTION 00; ILIM 100 mA until enumeration; VINDPM 4.2 V; VBATREG knob (4.20 V default code 0x46; 4.10-4.15 V recommended by tws-power-size.md)", src: "sub-power.md Charger register plan; ECR-0013 F1-F3; docs/research/tws-power-size.md s3 (2026-10-02)"}

# ------------------------------------------------------------------------------------------------ architecture
architecture:
  layers:
    core: "fw/core: portable C11 only (dsp/, modes/, safety/, charger/, selftest/, telemetry/, knobs/). Includes only fw/hal/*.h, stdint/stddef/string, <math.h> {sqrtf, fabsf, fmaf}, CMSIS-DSP."
    hal: "fw/hal/*.h: interface headers only. Surface: clock, power, gpio, adf (hop source), pwm (TIM1 sink + safe-state sequencer), adc, i2c, usb (cdc, vbus, dfu handoff), flash (knob store + image check), wdt, time (us + cycles), irq."
    port_u575: "fw/port_u575: ST LL + CMSIS device header + direct ADF1 register code (no LL driver for ADF/MDF exists); startup, linker script. This is the ONLY code that touches registers and is never executed by the host tier."
    port_host: "fw/port_host: stateful fakes (not mocks) of every hal call: scripted inputs, call log, fault-injection hooks, simulated time."
    boot: "fw/boot: separate image, write-protected first page(s): image check, DFU request logic, charger-watchdog disarm, pin parking, handoff to ROM."
    gen: "fw/gen (generated, committed with a hash): board_config.h from pin-contract.yaml + ST AF tables; tables.h (float32 hex literals); fsm.c/events.h/knobs.h from fw/spec/*.yaml."
  entry_points: "fw_init(); fw_hop(const int32_t in[128], uint16_t* ccr, fw_taps_t* taps); fw_poll(now_us); fw_event(id, arg); fw_cdc_rx(buf, len). Each a pure function of (fw_state_t, args, injected time). ISRs only move data and set flags."
  build_matrix:
    host: "gcc 15 and clang-18, x86-64: -O2 -msse2 -mfpmath=sse -mno-fma -ffp-contract=off -fexcess-precision=standard (no -march=native); shared library for ctypes/cffi + Unity test executables; ASan+UBSan and clang MSan variants"
    mcu: "arm-none-eabi-gcc 14.2: -mcpu=cortex-m33 -mthumb -mfloat-abi=hard -mfpu=fpv5-sp-d16 -ffp-contract=off; identical core sources and identical CMSIS-DSP config except arch intrinsics"
    variants: "fw/variants.yaml: BRIDGE_LEG_B fixed CH3 since Rev F (ECR-0003 implemented in gen.py; the CH2 variant is dropped); HAS_LSE {1,0} (PER-05); HAS_CC_SENSE fixed 0 since Rev F (R19 removed, PA3 free; PER-01); I2C_PULLUPS {EXT, INT<=50 kHz} (PER-04); LED_SITE {PAD, LID, NONE} (PER-07/08); SELFTEST_EXEMPTION {a, b} (ECR-0009); GESTURES {A, B, C} (sub-ui issue 5); IDLE_PLAN {1, 2} (sub-processing issue 4); USB_STACK {tinyusb, own}. Every listed combination builds and passes tier H; tier E runs the default plus the combinations an open ECR proposes."
    src_decisions: "docs/research/simplify/periphery.md s0-s3 (2026-10-02) for PER-xx; sub-* docs for the issues"
  comparison_levels:
    L0: "host C build vs ARM ELF in the emulator, same golden input vectors: output CCR streams, taps and state hashes bit-exact. Also host gcc vs host clang, and ARM -O0 vs -O2 (catches UB reliance)."
    L1: "host C stage taps vs sim/dsp pipeline taps (band_energy, floor, envelopes, 12.5 kS/s output, duty): tolerance, because the reference is float64 and the firmware float32/fixed. Thresholds are set at the first comparison from measured error, then frozen in fw/test/l1_thresholds.yaml (proposed starting values: band energy <= 0.1 dB steady state; 12.5 kS/s output error <= -60 dB re signal rms; squelch decisions equal on >= 99.9 % of hops)."
    L2: "sim/e2e scenarios T1, T2, T3, T6, D17, lat with FirmwareDspShaperStage: every metric that passes with the Python DSP today must pass with the firmware (metric ids in e2e-chain.yaml); no WARN-would-pass may become FAIL."
    why: "bit-exact against float64 numpy is neither possible nor meaningful; the C code is the executable spec, numpy bounds its error, the emulator proves the ARM build equals the host build"
  determinism_rules: "no malloc; no libm transcendentals in core (nm check on both link maps: sinf cosf expf logf powf atan2f tanhf absent); tables generated offline; explicit fmaf only; FTZ on in both builds (FPSCR.FZ=1 on MCU, MXCSR FTZ|DAZ in the host test main); dither PRNG xorshift32 with fixed seed (sim PwmShaper must mirror it for bit-exact runs, else dither off for L0); no wall clock; CMSIS-DSP kernel conformance suite on the emulator (ARM DSP-extension path vs host C path, 10^4 random vectors per kernel linked); mismatches listed in fw/emu/dsp_exceptions.yaml with a ULP tolerance and a reason"
  device_models_once: "each non-MCU device model (BQ25180, cell, mic PDM source, bridge+exciter plant, rail/VDDA sag, USB host) is written once in Python (sim/fw/models/*.py). Host fakes call it directly; Renode reaches it through a thin C# proxy over a local pipe. Why: one implementation, no drift between tiers; I2C and per-hop plant traffic is small (a few kB/s, 1,562 hops/s)."

# ------------------------------------------------------------------------------------------------ knobs (O18: every uncertain value is a firmware setting)
knobs_required:   # ids only; defaults and ranges come from the cited source; fw/spec/knobs.yaml (planned) is the single source and generates the C struct, the CDC get/set table and the vcrm 'knob register'
  output_path: "pwm_khz {200,400,800} (spec D6 L165); arr (derived); dead_time_rise_ticks, dead_time_fall_ticks (D6 L170; TIM1_DTR2); shaper order and zeros (D6 L176); dither_on (D6 L178); interp_filter (image rejection >= 67 dB into 8-16 kHz, e2e F5); dead_time_comp (e2e F13); ceiling_dbfs (D17; e2e F1; shared-params#ceiling); squelch_dbfs, squelch_hold_ms (e2e F3); gate_hold_hops, gate_band_margin_db (e2e F12, F14); power_on_hold_ms = 300 (e2e F4); volume_step_db ~4 and volume_steps (D3 L123-L124; sub-ui.md); tick_pattern (D3)"
  input_path: "mic_clk_hz 3.072-4.8 MHz (D13 L226); adf_front {D1, D2} (A3 s1.2); adf_scale and hpf_corner (A3 s1.2 SCALE/HPFC); mic_dead_ms (FWSIM-R24)"
  dsp: "algo {A, B} (D12 L222); lo_hz = 38000 for A; band_lo_hz = 20000 (D10: set from the owner's hearing test), band_hi_hz = 85000; out_lo_hz = 1500, out_hi_hz = 4000 (D9); n_bands = 28 (pipeline.BConfig; spec says 28-32); eq_table (C8; must hold a notch, e.g. -19 dB Q ~16 at ~84.7 kHz if the sealed D1.0 duct is chosen: acoustics FA5); gate_db = 6; floor_up_s = 3.0, floor_down_s = 0.3; env_attack_ms = 1.5, env_release_ms = 15 (sim/dsp/pipeline.py BConfig)"
  clocks_power_timing: "clock_plan {P80, P160, P64, P48} (A3 s2); idle_plan {1, 2}; pvd_level; iwdg_ms; hop_ring_depth; ccr_buffers; adc_trigger_phase; adc_rate; telemetry_period_ms"
  charger: "ichg_code_warm = 44; ichg_code_cool = 32; vbatreg_code = 0x46 (0x3C-0x41 option, tws-power-size.md); ts_hot_code = 0b11; ts_cold_code; ilim_pre_enum = 100 mA; vindpm = 4.2 V; wd_policy {A, B, C}; safety_timer; tmr_2x; keepalive_s (sub-power.md Charger register plan)"
  ui: "gesture timings (short, double window, hold); stuck_button_s; led_target_ma (sub-ui.md issues 5, 7)"
  selftest: "selftest_cap_dbfs = -12; selftest_max_s = 60; zsweep_points; pwmab_dwell_s = 10; charger_log_period_s = 1; isc_offset_present; i2c_khz"
  hard_clamps: "compile-time maxima no knob can exceed: ceiling_dbfs, vbatreg <= 4.20 V (cell limit, sub-power.md), ichg <= 170 mA (cell 1C 175 mA, U3 10 mA steps), ts_hot code <= 0b11 (45 C), dead time >= 1 tick, ARR >= 50, selftest_cap_dbfs <= -12, docked output = 0 unless exemption variant (a)"

# ------------------------------------------------------------------------------------------------ requirements
requirements:
  # ---- (a) test architecture
  - {id: FWSIM-R1, pri: P0, grp: arch, text: "fw/core is portable C11 behind fw/hal/*.h; the same source list builds with host gcc/clang and arm-none-eabi-gcc; include-lint fails on any core file that includes a CMSIS/ST header or uses an absolute address constant", src: "spec D15 L272; ECR-0010 item 2", verify: "S: include-lint + both builds in `fwsim all`", status: "done 2026-10-07: fw/core C11 behind fw/hal/hal_*.h (37 functions); ONE source list (fwsim.py CORE) built by gcc 15.2, clang-18 and arm-none-eabi-gcc 14.2 (cortex-m33, fpv5-sp-d16 hard) with -Werror; include + absolute-address lint with planted-violation self-test. test: fwsim rows lint, host_gcc.tests, host_clang.tests, arm.build"}
