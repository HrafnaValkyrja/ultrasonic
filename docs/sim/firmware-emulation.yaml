il the MDF1 OLD + ADC1 stream is written, so the app keeps the bridge off on target (never runs unarmed). 2026-10-07 (round 8): full break chain in the U575 register layer (fw/port_u575/hal_u575_io.c): ADC1 continuous on IN11 with DMNGT = 10 (MDF), MDF1 CKGDEN, OLD0 per the RM0456 activation sequence (OLDEN 0 -> wait OLDACTIVE 0 -> DATSRC ADCITF1, window +-code both signs, BKOLD = mdf_break0, ACIC FastSinc decimation 1, THINB 0 -> OLDEN) then TIM1 BKE + BKCMP7E; threshold 300 mA x R21 0.1 ohm = 30 mV = 164 codes (14 bit, VREF+ 3.0 V); ADC1 reads return HAL_BUSY while armed; disarm reverses. Recorded-register test (fwsim port_u575.regs). Open: BKP polarity vs mdf_break0 [T], MDF kernel clock source, bench trip test (E4)."}
