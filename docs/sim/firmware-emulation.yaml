uncertainties:
  - "U-FW1: Renode U5 fidelity is unproven: L5/WBA models (RCC, ADC, EXTI, GPDMA) may or may not adapt cheaply; the first model written (ADF1 or TIM1) re-prices every effort number here"
  - "U-FW2: all effort and throughput numbers are my estimates from SVD field counts and existing model sizes; none measured; Renode install size and RSS unmeasured"
  - "U-FW3: Renode tlib vs real Cortex-M33: DSP-extension (SMLAD, QADD16, saturation) and FPU denormal/FZ behaviour must be checked with the CMSIS-DSP conformance suite; tlib shares lineage with QEMU so a second emulator is not an independent check"
  - "U-FW4: BQ25180 model is the datasheet only: register auto-increment, the s8.3.9 50 s vs Table 8-4 160/40 s watchdog inconsistency, thermal-regulation details and OTP defaults of the orderable part stay unverified until bring-up step 7"
  - "U-FW5: USB: OTG_FS model size (XL) and whether the usbip path (needs sudo + vhci_hcd; attaches an emulated device to the owner's real USB stack) is acceptable on a shared desktop; TinyUSB choice is an owner decision against D15"
  - "U-FW6: ROM bootloader cannot be run off-hardware; handoff tests prove only our side of AN2606 Table 199 and only as quoted in sub-debug-test.md (AN2606 itself not re-read this session)"
  - "U-FW7: cycle estimates inherit C2's +-50 % M4 counts; M33 timing table (Arm TRM) not opened; flash/ICACHE stall model unproven; the M33 FPU instruction timings (VFMA, VDIV) are unverified"
  - "U-FW8: L1/L2 numeric thresholds, coverage thresholds, USB bulk 1.216 MB/s, mic-dead 100 ms, selftest cap duration 60 s, |Z| recovery tolerances, ISR cap 200 cycles, boot stub fitting one 8 KB page are proposals, not sourced"
  - "U-FW9: RM0456 behaviours to read when writing models: IWDG_STOP semantics, TIM1 DMAR/DCR burst exact cadence, ADF1 SATF/SCALE behaviour, PWR Stop 2 entry conditions beyond ES0499 s2.2.5, EXTI wake flags"
  - "U-FW10: web search budget was exhausted: no search-engine survey of third-party U5 emulation; findings rest on GitHub tree/API listings of Renode, QEMU and one community repo"
