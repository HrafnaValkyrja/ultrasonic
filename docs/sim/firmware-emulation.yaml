  ceiling_D17:             {H: "property test", E: "1e4-hop subset on the ELF", HW: "scope/ear (E7)", req: [FWSIM-R15]}
  pop_free_start_stop:     {H: "call-log order", E: "TIM1 records + pin timeline", T: "rule: OSSI/OIS before MOE", HW: "ear + scope (E7)", req: [FWSIM-R16, FWSIM-R17]}
  mode_fsm_D12:            {H: "table coverage + random walks", E: "smoke through button/VBUS plant", req: [FWSIM-R18]}
  docked_interlock_ECR0009: {H: "variants a/b", E: "VBUS plant glitches", req: [FWSIM-R19]}
  charger_jeita_plan:      {H: "Python BQ25180 model", E: "I2C2 through the proxy, watchdog/ship/HW-reset paths", HW: "real U3 defaults, OTP, thermal (R23)", req: [FWSIM-R20, FWSIM-R38]}
  self_test_protocol:      {H: "codec + fuzz + host tool replay", E: "CDC enumeration + stream on OTG_FS model", HW: "USB electrical, throughput", req: [FWSIM-R57, FWSIM-R58, FWSIM-R63, FWSIM-R39]}
  boot_dfu_handoff:        {H: "stub logic on fakes", E: "stub + ROM stub, IWDG model, pin audit", T: "handoff rules", HW: "real ROM bootloader, PA2/PA3/PB4 effects (bring-up step 6)", req: [FWSIM-R21]}
  low_power_sequence:      {H: "call-log order", E: "Stop 2 entry/exit, wake, pin audit", T: "rules 2,4", HW: "current (PPK2, bring-up step 10), SMPS async behaviour", req: [FWSIM-R23, FWSIM-R42]}
  clock_tree_and_errata:   {H: "table + ordering", E: "RCC/PWR model enforces ordering, ready flags", T: "rules 1,3,4,5,6,7,8", HW: "LSE start-up, MSI-PLL lock, PLL jitter, HSI48+CRS", req: [FWSIM-R25, FWSIM-R37]}
  mic_sequence_and_fail:   {H: "mic model state machine", E: "ADF1 model rules + dropouts", HW: "clock duty (E6), RSFLT response, back-feed", req: [FWSIM-R24, FWSIM-R34]}
