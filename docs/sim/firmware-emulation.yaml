    unicorn_qiling_others: "not evaluated (no peripheral framework; licence files not opened)"
  recommendation:
    stack: "Tier H: Unity + CTest + stdlib unittest/ctypes on installed toolchains (no new installs). Tier E: Renode 1.17.0 portable archive with our own u575.repl and new models. QEMU stays uninstalled (plan B)."
    why: "the port layer (LL register code: RCR, DMAR, clock/PWR ordering, ADF1 config, AF numbers) is never executed by the host tier; Renode is the only open emulator with an extensible peripheral framework and a Cortex-M33 core, and the only one with a path to USB, I2C slaves and profiling"
    cost_of_adoption: "install approval (A-INSTALL-PERMS); 6 new Renode models (rcc, pwr, flash, tim1, adf1, otg_fs) and 5 adaptations (gpio, gpdma, adc, exti, i2c timing) (sum of loc estimates in emulator.peripherals ~ 6,450 C# lines, 54 % of it OTG_FS/RCC/TIM1) plus ~1,500 lines of Python harness and models: my estimate 3-5 agent-weeks, P0 subset (everything except OTG_FS, LPDMA1, CRS/RTC) about 2-3 weeks; each estimate unverified"
    gaps_we_must_model_ourselves: [adf1, tim1_complete, rcc_u5, pwr_u5, flash_u5_with_option_bytes, gpdma1_request_map, exti_adapt, adc_injection, i2c_timing_check, otg_fs_device, bq25180_proxy, rom_stub, pin_audit, rule_checker]
    if_declined: "host tier only: L0 loses its meaning (host vs host), the LL/port code stays unexecuted until rev 1, and FWSIM-R35-class faults (RCR, DMA map, clock order) are found on hardware; tier H, trace rules over the HAL call log and the cycle estimate E1 remain"
  order_of_work:
    - {step: 0, what: "owner decisions that gate scope (owner_inputs 1-3, 6)", permission: true}
    - {step: 1, what: "contract and ABI freeze: hal headers, fw/spec/{fsm,events,knobs}.yaml, board_config generator, IF-FW-DSP taps, variants.yaml, comparison thresholds file", permission: false}
    - {step: 2, what: "core DSP + shaper + ceiling/pop/interlock/FSM/charger/boot-stub logic with host fakes; L1 and L2 green; Python BQ25180 + cell + mic models", permission: false}
    - {step: 3, what: "vendor CMSIS-DSP/CMSIS_6/device-u5/LL/Unity (+TinyUSB if chosen) with SOURCE.md like tools/data/stm32_open_pin_data; MCU build of the same core + port_u575 skeleton", permission: true}
    - {step: 4, what: "install Renode portable + Robot; u575.repl; P0 models in the order adf1, tim1, rcc/pwr/flash/gpio/exti, gpdma1, adc, i2c2 + BQ25180 proxy, iwdg; first ELF smoke (clock tree, init, hop loop); L0 bit-exact", permission: true}
    - {step: 5, what: "trace-rule checker + pin audit + PWM records exported to sim/e2e and sim/noise; fault-injection suite", permission: false}
    - {step: 6, what: "E1/E2 cycle estimates and the spec R3 gate decision before the board order", permission: false}
    - {step: 7, what: "OTG_FS model + CDC + host tool in the loop; self-test commands closed-loop (|Z|, stream, charger log, PWM A/B)", permission: false}
    - {step: 8, what: "variants from the simplification outcome (LSE, pull-ups, LED site; CC and leg B settled in Rev F); idle plan 2 models only if chosen", permission: false}
    - {step: 9, what: "freeze: the emulated ELF becomes the rev-1 day-one image; bring-up plan references the self-test commands", permission: false}

# ------------------------------------------------------------------------------------------------ interfaces to sibling sims
interfaces:
  IF-FW-DSP: {with: "sim/e2e", dir: "fw <-> e2e", state: "ABI exists (stages.py); this item adds taps (FWSIM-R10), harness and golden vectors", doc: "docs/sim/e2e-chain.yaml IF-FW-DSP"}
  IF-FW-PWM: {with: "sim/e2e Bridge stage, sim/checks/bridge_spice.py short windows, noise sim", dir: "emulator -> sims", format: "per-period records {ccr1, ccr3, ...} + 3-state pin timeline (FWSIM-R43), json lines in sim/out/fw/pwm_records/; clock constants from docs/sim/shared-params.yaml#clocks (fs_pwm 200,022.5 Hz) so the noise sim's sync-line folding uses the same numbers", use: "dead-time and shoot-through checks, gate-pull analysis, aggressor A03/A03b waveforms"}
  IF-FW-AGGRESSORS: {with: "sim/noise (aggressors.yaml A05_CPU_HOP, A07_USB_FS and others)", dir: "emulator -> noise", format: "measured hop busy fraction and shape, DMA burst timeline, ADC conversion times vs PWM edges, SMPS/Range state, USB activity", use: "replace the assumed A05 duty 0.68 and edge times"}
  IF-FW-PINSTATE: {with: "power/noise/board analyses", dir: "emulator -> sims", format: "pin audit json per event (FWSIM-R42)", use: "back-feed paths (PB4/PA5 Off-mode and DFU), leakage, ECR-0013 hazards"}
  IF-ADC-PLANT: {with: "sim/e2e (i_sup tap), layout-noise sim (VDDA/MIC_VDD), power/thermal sim", dir: "sims -> emulator", format: "RESD Voltage/Custom files or python plant callbacks (FWSIM-R44)", use: "I_SENSE, VBAT/VSYS/VBUS/TS, VDDA sag"}
  IF-MIC-PCM: {with: "sim/e2e", dir: "e2e -> emulator", format: "taps['adf'] converted by pcm_to_adf_words into RESD Custom (FWSIM-R34)", use: "scene to ADF1"}
  IF-EXCITER-Z: {with: "sim/e2e, acoustics", dir: "host tool -> e2e", format: "json {r_dc, l_mh, zsweep} as in e2e-chain.yaml", use: "replaces Exciter placeholders after E1/E2"}
  IF-CYCLES: {with: "sim/checks/power.py", dir: "fw -> power", format: "busy fraction per mode from E1/E2/E3", use: "MCU current = busy * run + idle * sleep (power.py 'MCU, alg. B duty-cycled')"}
  IF-CHARGE-PROFILE: {with: "power/thermal", dir: "bidirectional", format: "charger log CSV; U3 dissipation and TS vs cell temperature", use: "ECR-0009 item 3, sub-power issues 4,12"}
  IF-PIN-CONTRACT: {with: "tools/checks/interfaces.py, docs/system/pin-contract.yaml", dir: "contract -> fw/gen", format: "board_config.h generator (FWSIM-R5)"}
  IF-KNOBS: {with: "docs/system/vcrm.yaml O18-firmware-fixable", dir: "fw -> vcrm", format: "knob register generated from fw/spec/knobs.yaml: closes the vcrm 'planned: a knob register'"}
  IF-TELEMETRY: {with: "docs/system/sub-debug-test.md bring-up plan", dir: "fw -> bring-up", format: "rev1_telemetry list and self-test command table"}

# ------------------------------------------------------------------------------------------------ owner inputs, heavy runs, uncertainties
owner_inputs:   # each: options + recommendation; the owner decides (spec s0 rule 4)
  - {n: 1, ask: "approve installing Renode 1.17.0 (portable archive, MIT + LGPL tlib) and Robot Framework in the venv; approve vendoring CMSIS-DSP, CMSIS_6, cmsis-device-u5, ST LL headers, Unity (and TinyUSB if input 2 says so) under fw/third_party with SOURCE.md", options: "A install + vendor (rec); B vendor only, host tier only", rec: A, blocks: "tier E"}
  - {n: 2, ask: "USB device stack for CDC self-test: D15 says bare C + LL", options: "A TinyUSB (MIT, has stm32u575nucleo BSP and a DWC2 device driver; rec); B own minimal CDC on the OTG_FS core (~1,000 lines: my estimate; all risk ours); C ST USBX (not evaluated)", rec: A, blocks: "FWSIM-R28, R39, selftest"}
  - {n: 3, ask: "ECR-0009 docked self-test exemption", options: "a capped self-test-only exemption (rec per sub-output issue 12) / b no output while docked, sweep on battery and read back", rec: a, blocks: "FWSIM-R19, R58-R62"}
  - {n: 4, ask: "charger watchdog option (sub-power issue 3)", options: "A disable / B HW-reset after 160 s with keep-alive (rec) / C default 00 (reverts TS_HOT to 60 C: no)", rec: B, blocks: "FWSIM-R20, R21, Off-mode wake cadence"}
  - {n: 5, ask: "ceiling number and definition: true-peak on the interpolated duty stream (e2e F1)", options: "-12 dBFS true peak (assumed today) or another value", rec: "-12 dBFS true peak", blocks: "FWSIM-R14, R15"}
  - {n: 6, ask: "gesture set A/B/C (sub-ui issue 5) and the DFU gesture", options: "A spec + timings / B short=mode, double=volume, hold>=2 s=Off (rec) / C three holds", rec: B, blocks: "FWSIM-R18"}
  - {n: 7, ask: "idle plan 1 (16 MHz run) or 2 (Stop 2 + ADF + LPDMA)", options: "1 / 2; plan 2 also needs the LED answer (TIM4 stops in Stop 2) and LPDMA1 models", rec: "decide with E4 data; start with 1", blocks: "FWSIM-R40"}
  - {n: 8, ask: "simplification outcomes that change firmware variants: drop LSE (PER-05), drop pull-ups (PER-04), LED site (PER-07/08); ECR-0003 leg B is already implemented in Rev F (no longer a variant)", options: "per periphery.md", rec: "per the study", blocks: "variants.yaml, hw_constraints"}
  - {n: 9, ask: "SWD probe vs DFU-first for the first flash (sub-debug-test issue 1)", options: "A buy a probe / B BOOT0 tack to +3V0 (DFU-first) / C both (rec)", rec: C, blocks: "step 9 of order_of_work, HWC-2"}
heavy_runs:   # none executed now (owner rule); each fenced <= 4 GB, one heavy job at a time; all estimates are mine (unverified)
