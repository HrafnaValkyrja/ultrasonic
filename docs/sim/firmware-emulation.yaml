  watchdog_reset_policy:   {H: "health-bit logic", E: "IWDG model + hang injection + HardFault", HW: "real LSI, option bytes", req: [FWSIM-R55]}
  knob_store_flash:        {H: "fake flash power-fail", E: "FLASH model", HW: "real ECC behaviour", req: [FWSIM-R6, FWSIM-R30]}

# ------------------------------------------------------------------------------------------------ emulator
emulator:
  recommended: "Renode (MIT; CPU core tlib LGPL) with an own u575.repl and new C# models; Python device models behind a pipe proxy"
  platform_inputs: "CMSIS-device-u5 Include/stm32u575xx.h (Apache-2.0, 1,992,290 B) for addresses; STM32U575.svd (Apache-2.0) for registers; ST open pin data (BSD-3-Clause) for AF; RM0456 Rev 7 local text for behaviour"
  peripherals:   # regs/fields from STM32U575.svd (2026-10-02). renode_today from renode-infrastructure master 4be93f688811 (2026-10-01). size = my estimate (S <0.5 day, M 1-2, L 3-5, XL >5 agent-days); loc = C# lines, my estimate.
    - {id: cortex_nvic_systick_dwt, svd: "-", renode_today: "CortexM cortex-m33 (TrustZone optional, default off), NVIC, SysTick, DWT (CYCCNT = LimitTimer on machine clock: instruction-count time, not cycles)", gap: "none for function; no cycle accuracy", pri: P0, size: "S (platform wiring)"}
    - {id: memory, svd: "-", renode_today: "MappedMemory", gap: "flash 2 MB @0x08000000, SRAM1-4 (SRAM4 @0x28000000), BKPSRAM, system memory @0x0BF90000 (ROM stub); option-byte backing", pri: P0, size: S}
