bq25180_model:
  src: "TI SLUSE99C Rev C (Jan 2023), https://www.ti.com/lit/ds/symlink/bq25180.pdf fetched 2026-10-02, 58 pages, SHA-256 prefix c2008f613723fec3; section numbers are the datasheet's"
  i2c: {addr_7bit: "0x6A (8-bit 0xD4), s8.3.14", speeds: "100 and 400 kbps", register_pointer_autoincrement: "not stated in the text read: model single and sequential access behind a flag (unverified)"}
  registers:   # offset name reset (s8.5.1.x)
    - {offset: 0x0, name: STAT0, rst: X, rw: R, note: "TS_OPEN, CHG_STAT[1:0] (00 not charging, 01 CC/precharge, 10 CV, 11 done/disabled), ILIM_ACTIVE, VDPPM, VINDPM, THERMREG, VIN_PGOOD"}
    - {offset: 0x1, name: STAT1, rst: "X", rw: "R, RC bits", note: "VIN_OVP, BUVLO, TS_STAT[1:0], SAFETY_TMR_FAULT_FLAG (RC, cleared only after CE toggled), WAKE1, WAKE2 flags"}
    - {offset: 0x2, name: FLAG0, rst: X, rw: RC, note: "TS_FAULT, ILIM, VDPPM, VINDPM, THERMREG, VIN_OVP, BUVLO, BAT_OCP flags"}
    - {offset: 0x3, name: VBAT_CTRL, rst: 0x46, rw: RW, note: "VBATREG = 3.5 V + code*10 mV, max 4.65 V; 0x46 = 4.20 V; 4.10 V = 0x3C, 4.15 V = 0x41"}
    - {offset: 0x4, name: ICHG_CTRL, rst: 0x05, rw: RW, note: "CHG_DIS bit7; ICHG <= 35 mA: code+5 mA; > 35 mA: 40+(code-31)*10 mA; code 44 = 170 mA, code 32 = 50 mA; max 1000 mA"}
    - {offset: 0x5, name: CHARGECTRL0, rst: 0x2C, rw: RW, note: "IPRECHG, ITERM 10 % of ICHG, VINDPM 0b11 = disabled, THERM_REG 100 C"}
    - {offset: 0x6, name: CHARGECTRL1, rst: 0x56, rw: RW, note: "IBAT_OCP 1000 mA, BUVLO 3.0 V, CHG_STATUS_INT_MASK 1, ILIM_INT_MASK 1, VDPM_INT_MASK 0"}
    - {offset: 0x7, name: IC_CTRL, rst: 0x84, rw: RW, note: "TS_EN 1, VLOWV 3 V, VRCH 100 mV, 2XTMR_EN 0, SAFETY_TIMER 6 h (01), WATCHDOG_SEL 00"}
    - {offset: 0x8, name: TMR_ILIM, rst: 0x4D, rw: RW, note: "MR_LPRESS 10 s, MR_RESET_VIN 0, AUTOWAKE 1 s, ILIM 500 mA (101); ILIM codes 50/100/200/300/400/500/700/1100 mA"}
    - {offset: 0x9, name: SHIP_RST, rst: 0x11, rw: RW, note: "REG_RST, EN_RST_SHIP[1:0] (01 shutdown, 10 ship, 11 HW reset), PB_LPRESS_ACTION[1:0] reset 10 = ship, WAKE1 300 ms, WAKE2 2 s, EN_PUSH 1"}
    - {offset: 0xA, name: SYS_REG, rst: 0x40, rw: RW, note: "SYS_REG_CTRL 010 = 4.5 V, SYS_MODE 00, WATCHDOG_15S_ENABLE 0, VDPPM_DIS 0"}
    - {offset: 0xB, name: TS_CONTROL, rst: 0x00, rw: RW, note: "TS_HOT 00 = 60 C (11 = 45 C), TS_COLD 0 C, TS_WARM 45 C, TS_COOL 10 C, TS_ICHG 0.5x, TS_VRCG -100 mV"}
    - {offset: 0xC, name: MASK_ID, rst: 0xC0, rw: "RW + R id", note: "TS_INT_MASK 1, TREG_INT_MASK 1, BAT_INT_MASK 0, PG_INT_MASK 0, Device_ID 0000"}
  behaviours:
    watchdog: "s8.3.7.6 + Table 8-4 + tWDOG 40/160 s/disabled (s7.6): enabled by default but starts only after the first I2C transaction; any transaction restarts it; WATCHDOG_SEL 00 = all charger parameter registers reset to defaults after 160 s (software reset); 01 = HW reset after 160 s; 10 = HW reset after 40 s; 11 = disabled. A revert also restores TS_HOT = 60 C (sub-power.md issue 3). WATCHDOG_15S_ENABLE (s8.3.9): HW reset if the host does not talk within 15 s after VIN_PGOOD. Datasheet inconsistency: s8.3.9 text says the normal watchdog is 50 s; Table 8-4 and s7.6 say 160/40 s: model Table 8-4. tI2CRESET 500 ms: the charger resets its I2C state machine after 500 ms of bus inactivity (s7.6)."
    hw_reset: "s8.3.10: input FET off, BATFET off, SYS pulled down, autowake timer (0.5/1/2/4 s), release, registers to defaults, FETs on. Model exports sys_power=0 for that time: the platform performs a full MCU power-on reset (VBAT pin is tied to +3V0, so RAM and backup domain are lost)."
    sw_reset: "s8.3.11: REG_RST or watchdog action 00 resets all registers; a pending ship request is cancelled."
    ship_and_pushbutton: "s8.3.8 + Figures 8-4/8-5 (read 2026-10-02): TS/MR held low (VTSMR 90 mV) for tLPRESS (MR_LPRESS 00/01/10/11 = 5/10/15/20 s, +-10 %) then PB_LPRESS_ACTION: 01 = HW reset at tLPRESS (128 us /INT warning first), 10 = ship armed at tLPRESS and ENABLED WHEN TS/MR GOES HIGH again (Figure 8-5 caption), which confirms ECR-0013 F2; wake from ship needs TS/MR low for tSHIPWAKE 2 s or VIN; on battery the TS current source pulses (ITSMR 60 uA, 4 ms on / 196 ms off) only while EN_PUSH=1; docked it is always on (38 uA nominal, 36.5-39.5)."
    interrupt: "s8.3.12: /INT is an open-drain 128 us low pulse per event, per-source masks (Table 8-5); a condition present while masked gives no pulse on unmask; valid only after start-up. Model drives PA15 (CHG_INT) with R17 pull-up; ECR-0013 S1 stuck-low case (dead-battery pull-down) is an injectable fault."
    safety_timer: "s8.3.7.6: 3/6/12 h or off; precharge 25 %; 2XTMR_EN halves timer speed in loops other than CC/CV; expiry sets SAFETY_TMR_FAULT_FLAG, pulses /INT, charging stops until CHG_DIS or input toggled."
    ts_and_jeita: "s8.3.13.1: four thresholds (hot/warm/cool/cold) adjustable by TS_CONTROL; charge and safety timers suspend when VTS < VHOT or > VCOLD; cool = ICHG x TS_ICHG, warm = VBATREG minus TS_VRCG (register VBAT_CTRL itself unchanged); TS_EN=0 disables only the charge action, faults still reported; a button press (TS/MR low) during charge suspends charging until released; clamp VTS_CLAMP 2.2-3.3 V sets TS_OPEN_STAT on a floating pin; bias currents as in ship_and_pushbutton."
    charge_profile: "CC to VBATREG then CV, termination at ITERM x ICHG, recharge at VRCH; thermal regulation at THERM_REG 100 C with P = (VSYS-VBAT)*ICHG at 107 C/W JEDEC or 65 C/W EVM (sub-power.md Key numbers)."
    power_path: "SYS = 4.5 V when VIN valid (SYS_REG), else BAT through the 55 mohm BATFET; SYS_MODE 01 forces battery; undervoltage lockout at BUVLO 3.0 V."
  fault_hooks: [ts_override_open_short_temp, vin_ovp, buvlo, bat_ocp, safety_timer_expiry, i2c_nack, i2c_sda_stuck_low, int_stuck_low, spurious_int, watchdog_fast_forward, ship_trigger, hw_reset_trigger, cell_voltage_profile]
  fidelity_limits: "datasheet-level model: no OTP variants of the orderable part, nominal analogue thresholds, approximate /INT timing; the real U3 defaults are confirmed only at bring-up step 7 (sub-debug-test.md)"

rom_stub:
  what: "ST ROM bootloader (system memory 0x0BF90000) is not available off-hardware. The emulator maps a hand-written stub ELF there that records a handoff snapshot and applies the documented pin effects as DATA, so board-level consequences are visible."
  models: "pin effects from AN2606 Rev 69 Table 199 as tabulated in sub-debug-test.md (PA2 USART2_TX drives TS high; PA3 USART2_RX; PA4-PA7 SPI1 slave states; PB4 NJTRST pull-up back-feed; PA10 = GB_P USART1_RX input pull-up + R5 -> leg-B P off; PB15 = GB_N SPI2_MOSI input pull-down + R6 -> leg-B N off; PA9 free; PB7 I2C1 open-drain; PB13/PB14 SPI2; Rev F rows sub-debug-test.md L85-L100) with the BQ25180 model seeing TS high (charging pauses) and the pin audit flagging the PB4 back-feed"
  not_modelled: "DFU protocol, flash programming by the ROM, USB enumeration by the ROM, its timing, its VDDUSB 3.3 V expectation"
  checks: [FWSIM-R21, FWSIM-R42]

pin_state_expect:   # expected resolved state per pin net; src = sources named here; the audit compares and fails on mismatch
  off_stop2:
    PA5_MIC_VDD: "output low (mic unpowered), spec D12 L221"
    PB3_MIC_CLK: "analog, no pull (ECR-0013 F5; sub-audio-in.md issue 11)"
    PB4_MIC_DATA: "analog, no pull (same)"
    PB7_LED_K: "released: not driving low (sub-ui.md issue 6; RM0456 Rev 7: pins keep Run state in Stop 2)"
    bridge_gates_PA8_PA7_PA10_PB15: "analog (Z) or driven to FET-off levels; never an on level; gate pulls R3-R6 hold off (spec D6 L182); PB15 also carries the UCPD dead-battery 5.1k pull-down until PWR_UCPDR.UCPD_DBDIS (pin-contract hazards, ECR-0013 S2)"
    PA0_BTN: "input, EXTI + WKUP1 armed, no internal pull (R10 2k2 external)"
    PA15_CHG_INT: "input, EXTI falling armed, UCPD_DBDIS set (ECR-0013 S1)"
    PA11_PA12_USB: "analog, USB core off, no pull-up (sub-dock-usb.md Big picture 6)"
    spare_pins: "PC13 PH0 PH1 PA3 PA9 PB0 analog (PC13 static: ES0499 s2.2.1; list = integration-map.md s4 free pins, Rev F)"
  rom_dfu_given_not_controllable: "PA2 high (TS 'cold'), PB4 pull-up into unpowered mic, PB7 dark: tabulated in sub-debug-test.md; the audit reports them, it does not expect to fix them"

# ------------------------------------------------------------------------------------------------ cycle budget (c)
cycle_budget:
  budget: "hop_cycles = 128 * HCLK / fs_pcm: 51,200 at P80 (derived from A3 s2; independent of ARR). Published M4F counts, +-50 %: real FFT f32 256-pt 14,285-16,534 cycles; whole algorithm B 44-65 Mcycle/s = 55-81 % of 80 MHz = 28,160-41,472 cycles per hop (docs/research/C2-cpu-budget.md, 2026-09-30; M4 numbers, not M33; 3rd-order shaper and 28-32 bands not costed there; 800 kHz PWM not costed anywhere: sub-processing.md issue 5)"
  lever_is_firmware_only: "P160 (Range 1, 4 WS) gives 27-41 % busy at +1.1 mA (sub-processing.md Key numbers; periphery.md PER-05). spec R3 is therefore a power/thermal risk, not a schematic risk, provided the SMPS/LDO/inductor support Range 1; check against rail-budget.yaml."
  e1_static: "arm-none-eabi-objdump -d -l of each hot function (arm_rfft_fast_f32, cmplx_mag_squared, band grouping, oscillator bank, x16 interpolation, shaper, ISRs) x an M33 instruction timing table (Arm Cortex-M33 TRM, not opened this session: unverified) with loop bounds from FW_LOOP_BOUND annotations; flash stalls added per RM0456 Table 54 (2 WS at P80); outputs [lo, hi] per function"
  e2_dynamic: "emulator instruction counts per hop with the Renode profiler (flame graph, Cortex-M supported) at PerformanceInMips = HCLK/1e6 (1 instr/cycle); CPI_hi from E1; input classes silence, steady tone, dense burst, adversarial (all bands active, squelch off)"
  e3_hardware: "DWT CYCCNT per hop (FWSIM-R49), ST-CYC micro-benchmarks (FWSIM-R50)"
  gate: "FWSIM-R48 margin rule"

# ------------------------------------------------------------------------------------------------ CI (d)
ci:
  command: "source tools/env.sh && systemd-run --user --scope --quiet -p MemoryMax=3G -p MemorySwapMax=0 python3 fw/tools/fwsim.py all"
  stages: [lint_static, host_build_gcc_clang, unit_tests_unity, l1_taps_vs_sim_dsp, l2_e2e_metrics, variants, mcu_build, emu_smoke, emu_l0_bitexact, rules_and_pin_audit, fault_injection, cycles_E1_E2, selftest_host_replay, summary]
  never: "FreeRouting, hw/pod/place*.py or any autorouter; network at test time; more than one heavy job at a time"
  outputs: "sim/out/fw/summary.json (metric rows), per-scenario json, dark plots via tools/plotstyle.py"
  watch_registration: "register as PLM watches (tools/plm.py) so a change re-flags this item: see watch"

# ------------------------------------------------------------------------------------------------ fault injection (e)
fault_injection:   # id: injected fault -> expected behaviour (detect_within / safe state / event / recovery). Thresholds are proposals except where a source is cited.
  FI-01: {fault: "VDD ramp 3.0 -> 2.0 V mid-hop (brown-out)", expect: "BOR reset (BOR_LEV audited); outputs Z; on boot cause=BOR, output held >= 0.3 s (F4), pop-free start, event logged; PVD soft stop first if the PVD knob is set", src: "FWSIM-R56, e2e F4"}
  FI-02: {fault: "VBAT below BUVLO 3.0 V (charger cuts BATFET)", expect: "SYS and +3V0 collapse: power-on reset path; POWER_LOSS classified; no output until docked or recovered", src: "SLUSE99C s8.3.7.2; spec R22"}
  FI-03: {fault: "charger: TS cold/hot/open/short; safety-timer expiry; VIN OVP; BAT OCP; watchdog expiry (TS_HOT reverts to 60 C); HW reset; ship-mode entry; I2C NACK; SDA stuck low; INT stuck low; spurious INT", expect: "within <= 1 poll period (knob, <= 30 s): plan re-asserted or CHG_DIS set; bus recovered (9 SCL clocks); INT storm rate-limited; ship/HW-reset consequences logged on next boot; never spins in an ISR", src: "bq25180_model; sub-power.md issues 2,3; ECR-0013 F2,F3 + S1"}
  FI-04: {fault: "mic: DATA stuck 0 / stuck 1 / DC offset / no clock edges (CKABF) / overrun / saturation / power-up timing violation / PA5 sag", expect: "mic-dead within <= 100 ms: output muted (no noise burst), event, PA5 power-cycle x3, then SAFE; sequence violations logged by the ADF1 model", src: "FWSIM-R24"}
  FI-05: {fault: "USB disconnect mid-DFU or mid-CDC: truncated image at every cut point; power fail during flash program; VBUS removal during stream", expect: "boot stub detects invalid image (CRC) and re-enters DFU; charger watchdog already disabled by the stub; stream stops within 1 hop; no TX deadlock; knob store keeps the last good slot", src: "FWSIM-R21, R28, R30; sub-dock-usb.md DFU path"}
  FI-06: {fault: "watchdog/reset: infinite loop in ISR; DMA stall; hop overrun; stack overflow (MPU guard or canary); HardFault with bad pointer; reset loop", expect: "IWDG reset within the knob timeout; frame saved to .noinit; output safe before reset; >= 3 resets in 60 s gives SAFE; cause in the event ring", src: "FWSIM-R55"}
  FI-07: {fault: "clock: LSE start failure (if fitted); MSI-PLL unlock interrupt; PLL lock timeout; HSI48/CRS not locked", expect: "unlock handler re-arms PLL mode; timeout falls back to P48 and logs; USB reports 'no clock' instead of hanging", src: "FWSIM-R25; ES0499 Rev 12 s2.2"}
  FI-08: {fault: "button: stuck pressed; bounce bursts; ghost wake", expect: "stuck flag after the knob time and event; debounce yields one gesture; no wake-loop that defeats Stop 2", src: "FWSIM-R29; sub-ui.md issue 1"}
  FI-09: {fault: "flash: power loss during knob-store write; ECC double-bit error in knob page", expect: "previous slot used; defaults + event if both bad", src: "FWSIM-R6, R30"}
  FI-10: {fault: "CPU stall 1 ms in the hop ISR path; ADF overrun; output underrun", expect: "overrun counter, mute for the affected hop, resync without a click (e2e D17 pop metric), centre CCR repeated", src: "FWSIM-R46"}
  FI-11: {fault: "VBUS present but never enumerates; CC level ambiguous; PA1 stuck", expect: "ILIM stays 100 mA until enumeration or known cable; no output (interlock); event", src: "sub-power.md issue 13; FWSIM-R19"}
  FI-12: {fault: "TS open (J9 NTC missing) or shorted", expect: "TS_OPEN_STAT or TS fault seen: charging disabled by firmware too, event", src: "SLUSE99C s8.5.1.1; sub-power.md"}
  FI-13: {fault: "TIM1 update cadence wrong (RCR=0) or DMA channel mis-mapped (emulator-only faults of the firmware itself)", expect: "caught as trace-rule/model violations, not as a field failure", src: "FWSIM-R35, R41"}
  FI-14: {fault: "CPU lockup or hang (fault inside a fault handler, NMI loop, stuck ISR) while GPDMA keeps feeding TIM1", hazard: "a circular hop ring replays the last hop as a ~1.56 kHz buzz at up to the ceiling until IWDG fires; a stopped DMA freezes the last CCR (DC across the exciter: up to 3.0 V / 9.52 ohm = 315 mA at full scale, above U4's 300 mA, into a coil at the skin); no TIM1 break source exists (HWC-10)", expect: "the GPDMA linked list ends every hop in a PARK node that writes CCR1 = CCR3 = ARR/2 (zero differential); the CPU must re-link each next hop, so a dead CPU leaves centre output within <= 1 hop (0.64 ms); IWDG reset within its knob timeout; event logged on next boot", src: "skeptic 2026-10-02 missing class; FWSIM-R36, R46, R55; integration-map.md s4 (no BKIN pin)", unverified: "whether a U575 lockup asserts a system reset by itself (RM0456 not read for this)"}

# ------------------------------------------------------------------------------------------------ self-test (f)
selftest:
  transport: "USB FS CDC on PA11/PA12 via the dock (O12a); SWD memory read as backup for build id and event ring; optional UART line on a spare pin (hw_constraints HWC-3)"
  commands: [ST-HELLO, ST-RAILS, ST-CLK, ST-MIC, ST-PWMAB, ST-CHG, ST-ZSWEEP, ST-BTN, ST-EVT, ST-KNOB, ST-CYC, ST-USB, ST-PINS]
  zsweep_math: "PA6 sees i*(2d-1): amplitude mI/2 at 2f with phase phi, DC (mI/2)cos(phi); |Z| = 3.0*m/I; R22/C22 passes 2f <= 8 kHz at -1.0 dB / -27 deg (calibrate out); negative half needs the ~100 kohm offset (sub-output issue 1 option B)"
  src: "sub-output.md issue 1 (derived 2026-10-01); sub-debug-test.md"
  host_outputs: "WAV + spectrogram PNG (dark), IF-EXCITER-Z json {r_dc, l_mh, zsweep{f_hz,|Z|,phase_deg}} (format in e2e-chain.yaml), charger CSV + plot, pwmab.json, pins.json, events.json, manifest.json"

# ------------------------------------------------------------------------------------------------ what cannot be validated off-hardware, and what rev 1 must capture
cannot_validate:   # item: reason -> rev-1 substitute (O18)
  - {id: CV-1, item: "real current in Stop 2, Run, idle-with-mic, docked", why: "no analogue model; emulator gives states and pin audit only", substitute: "PPK2 (spec L575) + telemetry mode/time log; bring-up step 10"}
  - {id: CV-2, item: "cycle-accurate timing, ISR jitter, bus contention (GPDMA/AHB), flash/ICACHE stalls", why: "Renode counts instructions at a fixed MIPS, not cycles (docs time_framework); QEMU has no timing", substitute: "DWT per-hop statistics, ST-CYC"}
  - {id: CV-3, item: "analogue behaviour: ADC accuracy and VDDA reference, rail sag, SMPS ripple, mic noise, RSFLT response, PB4 back-feed amplitude, PWM leakage into the mic", why: "inputs are injected, not measured", substitute: "ST-RAILS (VREFINT-derived VDDA), ST-MIC noise floor, ST-PWMAB, E3/E6"}
  - {id: CV-4, item: "clock start-up: LSE start margin (gm 1.25x), MSI-PLL lock, PLL jitter, HSI48+CRS lock", why: "model reports ready after a configured delay", substitute: "ST-CLK with DWT-timestamped ready times; scope at bring-up step 4"}
  - {id: CV-5, item: "USB electrical and enumeration reality: VDDUSB 3.0 V margin, ESD parts, host driver acceptance, throughput", why: "OTG_FS model is functional only", substitute: "ST-USB throughput, bring-up step 6 incl. 2.95 V on TP4"}
  - {id: CV-6, item: "ST ROM bootloader behaviour (pin effects, enumeration, timing)", why: "ROM binary unavailable; only the AN2606 table is modelled as data", substitute: "bring-up step 6; meter MIC_VDD in DFU"}
  - {id: CV-7, item: "real BQ25180 (OTP defaults of the orderable part, analogue thresholds, thermal regulation, TS bias)", why: "model is the datasheet", substitute: "ST-CHG log, register dump at first power-up, bring-up step 7, ECR-0009 thermal log"}
  - {id: CV-8, item: "flash ECC, option-byte defaults, real erase/program timing", why: "model nominal", substitute: "option-byte dump in ST-HELLO"}
  - {id: CV-9, item: "M33 FPU edge cases (denormals, NaN payloads) and DSP-extension corner cases", why: "tlib is derived from QEMU (LGPL libqemu code): shares lineage with QEMU, so a second emulator would not be an independent check", substitute: "FZ on in both builds; kernel conformance suite; first hardware run of the golden vectors (ST-CYC variant)"}
  - {id: CV-10, item: "mic-clock duty 48-52 % (spec R13)", why: "no model of ST's CCK divider duty; no pad on MIC_CLK", substitute: "scope at R2 (E6); optional IDR beat-sampling estimate in ST-CLK (feasibility unverified)"}
rev1_telemetry:   # what ST-HELLO/ST-EVT/ST-CYC must report so any failure is diagnosable (O18)
  - "build id: git sha + dirty flag + CRC32 of the image + knob-schema version + board-profile hash, at a fixed flash address (readable over SWD and ROM DFU upload; RDP stays level 0 on rev 1), in HELLO, in every crash record and in the knob-store header"
  - "reset cause from RCC_CSR and the previous-boot event tail; boot-loop counter; crash frame (HardFault registers + stacked frame)"
  - "option bytes (RDP, BOR_LEV, IWDG_*, nSWBOOT0/nBOOT0, TZEN, WRP) and flash 'last good slot' state"
  - "clock status with DWT-timestamped ready times (LSE, MSI-PLL, PLL1, HSI48/CRS, ADF kernel), active clock plan, VOS range, SMPS/LDO state"
  - "per-hop cycle stats, ISR latency, overrun/underrun counters, ADF flags (SATF CKABF DOVRF RFOVRF), TIM1 break, DMA errors, stack high-water mark"
  - "rails: VDDA from VREFINT, VBAT, VBUS, TS, die temperature, VCORE, I_SENSE stats; charger register dump + every /INT with timestamp; I2C error counters"
  - "mode transitions with reason, button raw edges, stuck-button flag, output-ceiling hit counter, squelch state, idle duty, selftest-exemption use"
  - "pin read-back table and plausibility results (ST-PINS)"

# ------------------------------------------------------------------------------------------------ constraints this imposes on rev-1 hardware NOW (feed to the simplification study)
hw_constraints:
  - {id: HWC-1, text: "USB CDC is the main telemetry path: keep J10/J11 D+/D- straight to PA12/PA11 (no series parts) and keep R12/R13 + PA1 VBUS_SENSE: the OTG_FS core has no VBUS pin on this package, so firmware needs PA1 or I2C to assert B-session valid", src: "periphery.md s4 'Drop R12/R13' rejected (2026-10-02); sub-dock-usb.md"}
  - {id: HWC-2, text: "keep R1's PH3 (BOOT0) pad on the F face, reachable in the test build: a tack to +3V0 at reset starts ROM DFU, the only first-flash path without an SWD probe; the boot stub then makes the update path self-recovering", src: "periphery.md s2.8; sub-debug-test.md issue 1; RM0456 Table 25"}
  - {id: HWC-3, text: "keep at least PB6 (USART1_TX AF7) as a pad or unmasked dot: a printf/telemetry line that works when USB is dead; PB8 (MDF1_CCK0) and PB1 (MDF1_SDI0) stay unused if the MDF fallback is wanted (sub-audio-in.md issue 5); Rev F status: PB6 DBG_TX on TP7, PB8/PB1 on TP8/TP9 implemented, leg B on PA10/PB15 (ECR-0003)", src: "ST open pin data (tools/data, retrieved 2026-10-02): PB6 USART1_TX, PB8 MDF1_CCK0, PB1 MDF1_SDI0; pin-contract.yaml alternates (ECR-0003); periphery.md s2.8, s3"}
  - {id: HWC-4, text: "minimum test pads firmware needs: SWDIO, SWCLK, NRST, GND, +3V0 (+ BOOT0 via R1); VSYS can be probed at C21; every other pad is optional and removal must be stated (O18)", src: "periphery.md s2.8; sub-debug-test.md"}
  - {id: HWC-5, text: "I_SENSE: firmware's |Z| lock-in assumes PA6 is an ADC1 channel (ADC1_IN11) with R22/C22 as built and, if the lock-in is kept, a DC offset path (~100 kohm to +3V0 = ~+30 mV); a schematic change here changes only calibration constants (knob isc_offset_present)", src: "sub-output.md issue 1"}
  - {id: HWC-6, text: "PA15 CHG_INT: tie PB5 to GND (ECR-0013 S1) and set PWR_UCPDR.UCPD_DBDIS before enabling the EXTI; before deleting R17 (PER-03) read FLASH_OPTR.PA15_PUPEN behaviour and model it", src: "ECR-0013 S1; pin-contract.yaml hazards; STM32U575.svd FLASH_OPTR"}
  - {id: HWC-7, text: "if R15/R16 are deleted (PER-04) the firmware runs I2C2 at <= 50 kHz and tier E must run the I2C timing check for that variant", src: "periphery.md PER-04"}
  - {id: HWC-8, text: "if Y1/C11/C12 are dropped (PER-05) algorithm A loses crystal-grade pitch matching and USB-SOF trim needs the OTG_FS SOF to TIM2 trigger (RM0456 s16.3.11 per periphery.md): firmware supports both variants (HAS_LSE), the emulator needs SOF modelling for the trim variant", src: "periphery.md s2.3"}
  - {id: HWC-9, text: "PA3 (free since Rev F, PER-01) is ADC1_IN8: the natural home for a VSYS or MIC_VDD sense through a high-value divider, giving the board a way to read the two rails it cannot read today (O18 'board measures itself')", src: "sub-debug-test.md 'Not readable'; ST open pin data PA3 ADC1_IN8; periphery.md s3"}
  - {id: HWC-10, text: "keep gate pulls R3-R6 (firmware safety assumes a reset or a hang leaves all four FETs off and cannot detect a failed-on FET) and keep R21/R22/C22; there is no TIM1_BKIN source, so the last line of defence is IWDG reset + gate pulls", src: "spec D6 L182; sub-processing.md issue 6"}
  - {id: HWC-11, text: "keep R2 (only MIC_CLK probe/isolation point) and R20 (lift link); firmware adds no new hardware dependence on them", src: "periphery.md s2.8"}
  - {id: HWC-12, text: "RDP level 0 on rev 1 and a write-protected boot page: SWD recovery and DFU upload of the build id (fixed flash address, rev1_telemetry) stay possible; first-flash procedure sets FLASH_WRP1AR only after the stub is verified", src: "STM32U575.svd FLASH_OPTR/WRP1AR; sub-dock-usb.md issue 4A"}
  - {id: HWC-13, text: "no firmware assumption requires a part to sit at a specific board position; all placement-dependent values (noise coupling, rail impedance) enter via sibling sims and knobs", src: "meta.layout_agnostic"}

