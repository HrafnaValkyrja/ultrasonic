  # ---- diodes / ESD ----
  C84374: {part: Nexperia PESD5V0S1BL DFN1006-2 (SOD882) ESD diode, max_mm: 0.50, source: "Nexperia PESD5V0S1BL datasheet, SOD882 outline table (issue 2019-10-21), A max 0.50 incl. plating"}
  C87910: {part: onsemi ESD9X5.0ST5G SOD-923 ESD diode, max_mm: 0.43, source: "onsemi ESD9X datasheet, features 'Low body height 0.017 in (0.43 mm) max'; case 514AA outline table, A max 0.43"}
