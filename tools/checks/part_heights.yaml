by_footprint:
  # copper-only pads: TP probe pads have no body
  # J wire pads: the hand-soldered litz on top IS the part. An allowance, not a datasheet value: solder blob <= 0.5 mm + one 0.21 mm
  # litz conductor + 0.09 margin. Replace it with a measurement from the first hand-soldered pod.
  TestPoint_Pad_D1.0mm: {max_mm: 0.8, kind: allowance, source: "design allowance for a hand-soldered 0.21 mm litz wire on a D1.0 pad (blob 0.5 + wire 0.21 + 0.09); wire count: docs/system/reg-board.md issue 5"}
  TestPoint_Pad_D0.7mm: {max_mm: 0.0, source: "copper pad with no body (hw/lib/pod.pretty)"}
