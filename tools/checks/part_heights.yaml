  # ---- discrete semiconductors and ICs ----
  C19654206:
    part: Nexperia PMCXB290UE(Z) complementary MOSFET pair, DFN1010B-6 (SOT1216)
    max_mm: 0.40
    source: Nexperia PMCXB290UE v.1 (30 May 2023), Fig. 31 package outline SOT1216, A max 0.40 (nom 0.37, min 0.34)
  C5271013:
    part: ST STM32U575CIU6Q, UFQFPN48 7 x 7 mm
    max_mm: 0.60
    source: ST DS13737 Rev 8 (Aug 2023) section 6.1 Table 154 'UFQFPN48 mechanical data', A max 0.600
  C2879853:
    part: Knowles/Syntiant SPH0641LU4H-1 ultrasonic PDM mic, 3.50 x 2.65 mm, bottom port
    max_mm: 1.08
    source: Syntiant SPH0641LU4H-1 datasheet Rev B-1 (2 Dec 2024), section 8 Mechanical specifications, Height 0.98 +-0.10
    # `port`: where the acoustic port (AP) sits, derived from the datasheet's land pattern so the checker can compare the footprint's
    # drilled hole with it. Datasheet page 9 (section 8, bottom view) and page 10 (section 9 Example Land Pattern), read 2026-10-02 as
    # the page images: pads 1/5 form one row and 2/4 the next (row pitch 0.822, pad 0.725 x 0.522, 0.300 between rows); the two pad
    # columns are 1.675 apart and the AP is on their centre line, 1.513 beyond the near edge of the pad-2/4 row:
    # along = 0.822 + (1.513 - 0.522 / 2) = 2.074 mm from the pad-1/5 row centre, away from the pad-2/4 row, across = 0.
    # The AP is Ø0.325 +-0.05 (section 8 table). The drawing's AP-to-edge dimension (1.040) is a reference value with no tolerance,
    # and the general tolerance is +-0.15 mm, more than the 0.1125 mm radial slack a Ø0.6 hole leaves: confirm on the first article.
    port:
      d_mm: 0.325
      d_tol_mm: 0.05
      rows: [[1, 5], [2, 4]]
      along_mm: 2.074
      across_mm: 0.0
      note: "land pattern, sections 8 and 9, Rev B-1 2 Dec 2024"
      source: "Syntiant SPH0641LU4H-1 datasheet pp.9-10"
  C3682423:
    part: TI BQ25180YBGR charger, DSBGA-8 (YBG)
    max_mm: 0.65
    source: TI BQ25180 Rev C (Nov 2025), tape-and-reel table K0 = 0.65 mm (pocket depth made to fit the part's thickness); upper bound, the outline drawing is not in the PDF text
    variant_note: a bound, not the part's own A-max; confirm on TI's YBG0008 drawing when the footprint is next reviewed
  C5220164:
    part: TI TPS7A2030PDQNR LDO, X2SON-4 (DQN) 1 x 1 mm
    max_mm: 0.40
    source: TI TPS7A20 SBVS338H, package drawing DQN0004A 'X2SON - 0.4 mm max height'
  C1972959:
    part: TI TPD2E2U06DRLR 2-channel ESD protection, SOT-5X3 (DRL)
    max_mm: 0.60
    source: TI TPD2E2U06 Rev C (Jul 2021), package drawing DRL0005A 'SOT - 0.6 mm max height'
  # ---- switch ----
  C221707:
    part: C&K KMT022NGJLHS, IP68 tactile switch, 3.0 x 2.6 mm
