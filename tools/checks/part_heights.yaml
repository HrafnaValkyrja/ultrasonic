# Part facts from manufacturer datasheets: the maximum height of every part on the pod board, and where the mic's acoustic port is.
# Read by tools/checks/interfaces.py [heights] [mic-port] [clamp-bands]: every part must stay inside the height band of its face.
# The band comes from the CURRENT design's shell (hw/current.yaml), not from this file: Phase 2 (hw/mech/dims_r2.py, 2026-10-07)
# B 1.4 (board B face to cell), F 0.30 (VHB gap to the lid), SW1 0.90 in its lid pocket; revg (hw/mech/shell_r1.py PARTS) 1.2 / 1.2.
# Rows cover both package sets (Rev G and MZ-2 'Balanced').
#
# max_mm  height above the board surface, MAXIMUM (nominal + the datasheet's upper tolerance), solder fillet not included.
# Lookup order for a board footprint: its schematic LCSC number (by_lcsc) -> its footprint item name (by_footprint) -> unknown.
# An unknown part is a WARN in the checker, never a PASS. Add a row here with its source when it appears.
#
# Provenance: each datasheet was read on 2026-10-02 (LCSC copies are the PDFs linked from jlcpcb.com's parts search, which
# tools/jlc.py returns as "datasheet"; the quote is the line the number came from). Where a catalogue lists a close variant
# (not the exact orderable code) the row says so and takes the larger value.
# solder_margin_mm: how far the hand-soldered blob of a J wire pad reaches past the copper pad's edge (an allowance, not a datasheet
# number: a 0.21 mm litz conductor on a D1.0 pad). [clamp-bands] and [inside] grow every J pad by it; the wires themselves leave
# rearward into the 2.1 mm gap behind the board (tolerances.md), not toward the long edges the lid ribs press.
version: 1
read: 2026-10-02
solder_margin_mm: 0.25

