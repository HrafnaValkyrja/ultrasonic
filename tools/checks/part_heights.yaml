  C25744: {part: Uni-Royal 0402WGF1002TCE 10k 0402, max_mm: 0.40, source: "Uni-Royal chip series sheet, dimensions table, 0402 H = 0.35 +-0.05"}
  C25105: {part: Uni-Royal 0402WGF330JTCE 33R 0402, max_mm: 0.40, source: "Uni-Royal chip series sheet, 0402 H = 0.35 +-0.05"}
  C25741: {part: Uni-Royal 0402WGF1003TCE 100k 0402, max_mm: 0.40, source: "Uni-Royal chip series sheet, 0402 H = 0.35 +-0.05"}
  C26083: {part: Uni-Royal 0402WGF1004TCE 1M 0402, max_mm: 0.40, source: "Uni-Royal chip series sheet, 0402 H = 0.35 +-0.05"}
  C25879: {part: Uni-Royal 0402WGF2201TCE 2k2 0402, max_mm: 0.40, source: "Uni-Royal chip series sheet, 0402 H = 0.35 +-0.05"}
