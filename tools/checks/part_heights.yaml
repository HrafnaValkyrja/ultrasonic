    # `port`: where the acoustic port (AP) sits, derived from the datasheet's land pattern so the checker can compare the footprint's
    # drilled hole with it. Datasheet page 9 (section 8, bottom view) and page 10 (section 9 Example Land Pattern), read 2026-10-02 as
    # the page images: pads 1/5 form one row and 2/4 the next (row pitch 0.822, pad 0.725 x 0.522, 0.300 between rows); the two pad
    # columns are 1.675 apart and the AP is on their centre line, 1.513 beyond the near edge of the pad-2/4 row:
    # along = 0.822 + (1.513 - 0.522 / 2) = 2.074 mm from the pad-1/5 row centre, away from the pad-2/4 row, across = 0.
    # The AP is Ø0.325 +-0.05 (section 8 table). The drawing's AP-to-edge dimension (1.040) is a reference value with no tolerance,
    # and the general tolerance is +-0.15 mm, more than the 0.1125 mm radial slack a Ø0.6 hole leaves: confirm on the first article.
    port:
      d_mm: 0.325
      d_tol_mm: 0.05
      rows: [[1, 5], [2, 4]]
      along_mm: 2.074
      across_mm: 0.0
      note: "land pattern, sections 8 and 9, Rev B-1 2 Dec 2024"
      source: "Syntiant SPH0641LU4H-1 datasheet pp.9-10"
