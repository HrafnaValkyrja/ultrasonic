k4:                                             # NON-DEFAULT (owner O33, ECR-0020/0021): end-to-end pod, two 6L boards P+M, 130 mAh cell, K4_DOCK=under
  id: k4
  name: "K4 end-to-end pod: two 6-layer boards (P upper, M lower) + Renata ICP401230UPR 130 mAh in line, flat 1.0 lid, dock under the cell"
  ecr: ECR-0021
  cell: K1_130                                      # fw/variants.yaml cells key (rails check, FWSIM-R64 clamp); absent = default_cell
  owner_decision: O33
  packages: mz2
  generate: "python3 hw/pod/k4/gen.py"
  board: hw/pod/k4/routed_M.kicad_pcb              # M board (tools take one board); P board in board_p
  board_p: hw/pod/k4/routed_P.kicad_pcb
  board_placed: hw/pod/k4/placement_M.yaml
  placement: hw/pod/k4/placement_M.yaml
  netlist: hw/pod/k4/pod_k4_M.net
  netlist_p: hw/pod/k4/pod_k4_P.net
  bom: hw/pod/k4/bom_jlc_M.csv
  bom_p: hw/pod/k4/bom_jlc_P.csv
